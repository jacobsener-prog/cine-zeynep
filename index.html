rlüğe dair ikonik bir yol filmi."},{"t":"A Tale of Winter","y":1992,"d":"Éric Rohmer","r":114,"g":["Drama","Romance"],"c":[],"s":"Bir yaz aşkı yaşadığı adamın adresini yanlış yazdığı için onu kaybeden genç bir kadın, yıllar sonra iki farklı adam arasında kalır ama ilk aşkına olan inancından vazgeçmez. Éric Rohmer'in zarif ve konuşkan anlatımıyla aşk, inanç ve tesadüf üzerine sıcacık bir film."},{"t":"Aileen Wuornos: The Selling of a Serial Killer","y":1992,"d":"Nick Broomfield","r":87,"g":["Crime","Documentary"],"c":[],"s":"Nick Broomfield, Florida'da idama mahkûm edilen Aileen Wuornos'un hikâyesinin çevresindekiler tarafından nasıl paraya çevrildiğini araştırır. Kendine özgü, ilk ağızdan belgesel üslubuyla medya ve sömürü üzerine rahatsız edici ama önemli bir film."},{"t":"Bram Stoker's Dracula","y":1992,"d":"Francis Ford Coppola","r":128,"g":["Fantasy","Horror","Romance"],"c":[],"s":"Genç bir avukat Transilvanya'da Kont Drakula'nın şatosuna gider ve kont, Londra'da yaşayan nişanlısı Mina'ya takıntılı bir aşk besler. Coppola'nın kostümleri, eski usul görsel efektleri ve gotik ihtişamıyla bu klasik vampir hikâyesinin en tutkulu ve görkemli uyarlamalarından biri."},{"t":"Candyman","y":1992,"d":"Bernard Rose","r":99,"g":["Horror","Thriller"],"c":[],"s":"Chicago'da şehir efsaneleri üzerine araştırma yapan bir akademisyen, adı aynaya beş kez söylenince ortaya çıkan kancalı elli bir figürün izini sürer. Tony Todd'un karizmatik varlığı ve Philip Glass'ın müziğiyle, korkuyu sınıf ve ırk meseleleriyle birleştiren zeki bir klasik."},{"t":"Center Stage","y":1992,"d":"Stanley Kwan","r":126,"g":["Biography","Drama","Romance"],"c":[],"s":"Otuzlu yıllarda Şanghay sinemasının en parlak yıldızı olan Ruan Lingyu'nun kısa ve trajik hayatı, belgesel görüntüler ve canlandırmalarla iç içe anlatılır. Maggie Cheung'un unutulmaz performansıyla sinemanın, şöhretin ve hafızanın ince bir portresi."},{"t":"Glengarry Glen Ross","y":1992,"d":"James Foley","r":100,"g":["Crime","Drama","Mystery"],"c":[],"s":"Chicago'da bir emlak ofisinin satıcılarına, sadece en iyi iki kişinin işini koruyacağı bir yarışma dayatılır ve bir gecede herkes kendini sonuna kadar zorlar. David Mamet'in keskin diyalogları ve Al Pacino, Jack Lemmon gibi dev oyuncularla nefes kesen bir oyuncu gösterisi."},{"t":"Man Bites Dog","y":1992,"d":"Benoît Poelvoorde","r":95,"g":["Comedy","Crime","Drama"],"c":[],"s":"Bir belgesel ekibi, sohbet sever ve karizmatik bir seri katili takip ederken giderek onun işlerine ortak olur. Belçikalı yapımcıların siyah beyaz ve kara mizah dolu bu provokatif filmi, medya ve şiddetin izlenmesi üzerine rahatsız edici ama zekice bir sorgulama."},{"t":"Reservoir Dogs","y":1992,"d":"Quentin Tarantino","r":99,"g":["Crime","Thriller"],"c":["Harvey Keitel","Tim Roth"],"s":"Başarısız bir mücevher soygununun ardından hayatta kalan suçlular, bir depoda toplanır ve aralarındaki hainin kim olduğunu bulmaya çalışır. Tarantino'nun ilk filmi, keskin diyalogları, parçalı anlatımı ve harika müzikleriyle doksanların bağımsız sinemasını yeniden şekillendirdi."},{"t":"Romper Stomper","y":1992,"d":"Geoffrey Wright","r":94,"g":["Crime","Drama","Thriller"],"c":[],"s":"Melbourne'de şiddet yanlısı bir neo Nazi dazlak çetesi, mahallelerindeki göçmenlere karşı saldırılarını tırmandırır ve kendi iç çatışmalarıyla parçalanır. Genç Russell Crowe'un ürkütücü performansıyla nefreti çıplak bir gerçekçilikle gösteren sarsıcı bir film."},{"t":"Strictly Ballroom","y":1992,"d":"Baz Luhrmann","r":94,"g":["Comedy","Drama","Music"],"c":[],"s":"Avustralya'da yetenekli bir dansçı, katı yarışma kurallarına uymayı reddedip çekingen bir kızla kendi adımlarını denemeye başlar. Baz Luhrmann'ın renkli, coşkulu ve abartılı ilk filmi, cesarete ve kendin olmaya dair kalbi ısıtan bir masal."},{"t":"The Crying Game","y":1992,"d":"Neil Jordan","r":112,"g":["Crime","Drama","Romance"],"c":[],"s":"IRA militanı Fergus, kaçırdıkları bir İngiliz askerle beklenmedik bir bağ kurar ve sonra onun Londra'daki sevgilisini bulmaya karar verir. Neil Jordan'ın aşk, kimlik ve sadakat üzerine sürprizlerle dolu bu dramı, kendini herkese farklı bir yerden açan bir film."},{"t":"The Player","y":1992,"d":"Robert Altman","r":124,"g":["Comedy","Crime","Drama"],"c":[],"s":"Hollywood'da bir stüdyo yöneticisi, reddettiği bir senaristten tehdit kartpostalları almaya başlar ve işler çığırından çıkar. Robert Altman'ın ünlü açılış planı ve düzinelerce yıldızın kendini oynadığı kameolarıyla sinema dünyasına keskin ve eğlenceli bir hiciv."},{"t":"Unforgiven","y":1992,"d":"Clint Eastwood","r":130,"g":["Drama","Western"],"c":["Clint Eastwood","Gene Hackman"],"s":"Yıllar önce silahını bırakmış eski bir kanun kaçağı, bir ödül uğruna son bir kez yola çıkmayı kabul eder. Clint Eastwood'un kovboy efsanesini sorgulayan, şiddetin bedelini gösteren bu olgun ve hüzünlü western, türün tartışmasız başyapıtlarından biri."},{"t":"Caro Diario","y":1993,"d":"Nanni Moretti","r":100,"g":["Biography","Comedy","Drama"],"c":[],"s":"Nanni Moretti, üç bölümde Vespa'sıyla Roma'yı dolaşır, Aeolian adalarını gezer ve kendi sağlık serüvenini anlatır. Kendi kendini alaya alan esprileri, sıcak bakışı ve özgür yapısıyla İtalyan sinemasının en sevimli ve kişisel günlüklerinden biri."},{"t":"Farewell My Concubine","y":1993,"d":"Chen Kaige","r":171,"g":["Drama","Music","Romance"],"c":[],"s":"Pekin Operası'nda birlikte yetişen iki erkek oyuncunun elli yıla yayılan dostlukları, Çin'in çalkantılı tarihi içinde sınanır. Chen Kaige'nin görkemli ve duygusal destanı, Leslie Cheung'un unutulmaz performansıyla Çin sinemasının zirvelerinden biri."},{"t":"Groundhog Day","y":1993,"d":"Harold Ramis","r":101,"g":["Comedy","Drama","Fantasy"],"c":["Bill Murray","Andie MacDowell"],"s":"Kendini beğenmiş bir hava durumu sunucusu, küçük bir kasabada aynı günü tekrar tekrar yaşamaya mahkûm kalır. Bill Murray'nin harika zamanlamasıyla hem çok komik hem de insanın değişebileceğine dair şaşırtıcı derecede derin ve felsefi bir film."},{"t":"Jurassic Park","y":1993,"d":"Steven Spielberg","r":127,"g":["Adventure","Sci-Fi"],"c":["Sam Neill","Laura Dern"],"s":"Zengin bir iş adamı, genetik mühendisliğiyle dinozorları yeniden yaratarak bir adada tema parkı kurar ve açılış öncesi bir grup uzmanı davet eder. Spielberg'in çığır açan efektleri ve John Williams'ın müziğiyle, her izleyişte büyüleyen bir macera klasiği."},{"t":"Philadelphia","y":1993,"d":"Jonathan Demme","r":125,"g":["Drama"],"c":["Tom Hanks","Denzel Washington"],"s":"AIDS olduğu anlaşılınca prestijli hukuk firmasından kovulan bir avukat, önyargılı bir meslektaşının yardımıyla işvereni dava eder. Tom Hanks ve Denzel Washington'ın güçlü oyunlarıyla, önyargıyla yüzleşen Hollywood'un en önemli ve dokunaklı filmlerinden biri."},{"t":"Schindler's List","y":1993,"d":"Steven Spielberg","r":196,"g":["Biography","Drama","History"],"c":["Liam Neeson","Ralph Fiennes"],"s":"Fırsatçı bir Alman iş adamı, İkinci Dünya Savaşı sırasında fabrikasında çalıştırdığı Yahudileri korumak için giderek her şeyini ortaya koyar. Spielberg'in siyah beyaz, sarsıcı ve derin insani bakışıyla Holokost'u anlatan sinemanın en önemli eserlerinden biri."},{"t":"Short Cuts","y":1993,"d":"Robert Altman","r":188,"g":["Comedy","Drama"],"c":[],"s":"Los Angeles'ta birbirinden habersiz düzinelerce insanın hayatı birkaç gün içinde küçük ve büyük olaylarla kesişir. Raymond Carver öykülerinden uyarlanan bu Altman filmi, geniş oyuncu kadrosu ve ustaca örülmüş yapısıyla modern hayatın zengin bir mozaiği."},{"t":"The Age of Innocence","y":1993,"d":"Martin Scorsese","r":139,"g":["Drama","Romance"],"c":[],"s":"1870'lerin New York sosyetesinde genç bir avukat, nişanlısının kuzeni olan özgür ruhlu bir kontese tutkuyla bağlanır. Scorsese'nin bu zarif ve bastırılmış tutku dolu Edith Wharton uyarlaması, gösterişli dekorların ardında kırık bir kalbin hikâyesini anlatıyor."},{"t":"The Piano","y":1993,"d":"Jane Campion","r":121,"g":["Drama","Music","Romance"],"c":["Holly Hunter","Anna Paquin"],"s":"Konuşmayan İskoç bir kadın, kızı ve piyanosuyla birlikte görücü usulü evlendiği adamın yanına Yeni Zelanda'ya gelir. Jane Campion'ın vahşi doğanın ortasında geçen tutkulu ve şiirsel hikâyesi, Holly Hunter'ın sözsüz oyunu ve Michael Nyman'ın müziğiyle unutulmaz."},{"t":"The Puppetmaster","y":1993,"d":"Hou Hsiao-hsien","r":142,"g":["Biography","Drama","War"],"c":[],"s":"Tayvan'ın en ünlü kukla ustalarından Li Tien-lu, Japon yönetimi altında geçen gençlik yıllarını kendi sesiyle anlatır. Hou Hsiao-hsien'in belgesel ile kurguyu harmanlayan, tablo gibi uzun planlarla örülmüş sakin ve derin bir tarih şiiri."},{"t":"The Wedding Banquet","y":1993,"d":"Ang Lee","r":106,"g":["Comedy","Drama","Romance"],"c":[],"s":"New York'ta erkek sevgilisiyle yaşayan Tayvanlı bir genç, ailesini memnun etmek için göstermelik bir evlilik ayarlar, ama anne ve babası düğüne gelince işler karışır. Ang Lee'nin sıcak, esprili ve anlayışlı komedisi, kültürler arası aile ilişkilerine dair gerçek bir mücevher."},{"t":"Thirty Two Short Films About Glenn Gould","y":1993,"d":"François Girard","r":98,"g":["Biography","Drama","Music"],"c":[],"s":"Efsanevi Kanadalı piyanist Glenn Gould'un hayatı, müziği ve tuhaflıkları otuz iki kısa bölümle, tıpkı Goldberg Varyasyonları gibi anlatılır. Canlandırmalar, röportajlar ve animasyonu buluşturan özgün yapısıyla bir dâhinin portresini zarifçe çizen bir film."},{"t":"Three Colors: Blue","y":1993,"d":"Krzysztof Kieślowski","r":98,"g":["Drama","Music","Mystery"],"c":[],"s":"Bir kazada ailesini kaybeden kadın, geçmişini ve anılarını tamamen silip yalnız ve özgür bir hayat kurmaya çalışır. Kieślowski'nin üçlemesinin ilk filmi, Juliette Binoche'un derin oyunu ve mavi tonlarıyla yas ve özgürlük üzerine büyüleyici bir meditasyon."},{"t":"Chungking Express","y":1994,"d":"Wong Kar-wai","r":102,"g":["Comedy","Crime","Drama"],"c":[],"s":"Hong Kong'da iki yalnız polis, biri gizemli sarışın bir uyuşturucu kaçakçısıyla, diğeri bir büfede çalışan hayalperest bir kızla yolları kesişince aşka düşer. Wong Kar-wai'nin enerjik kamerası, neon ışıkları ve California Dreamin' şarkısıyla sonsuz tazelikte bir film."},{"t":"Clerks","y":1994,"d":"Kevin Smith","r":92,"g":["Comedy"],"c":[],"s":"New Jersey'de bir markette çalışan Dante, izin gününde işe çağrılır ve komşu video dükkanındaki arkadaşı Randal'la birlikte absürt bir gün geçirir. Kevin Smith'in küçük bir bütçeyle çektiği siyah beyaz bu film, keskin diyaloglarıyla bağımsız komedinin kült klasiği oldu."},{"t":"Crumb","y":1994,"d":"Terry Zwigoff","r":119,"g":["Biography","Comedy","Documentary"],"c":[],"s":"Yeraltı çizgi romanının efsanesi Robert Crumb'ın hayatı, sanatı ve derin sorunlarla dolu ailesi yakın bir bakışla anlatılır. Terry Zwigoff'un samimi ve cesur belgeseli, sanat ile rahatsız edici gerçekler arasındaki ilişkiye dair unutulmaz bir portre."},{"t":"Forrest Gump","y":1994,"d":"Robert Zemeckis","r":142,"g":["Drama","Romance"],"c":["Tom Hanks","Robin Wright"],"s":"İyi kalpli ve saf Forrest Gump, farkında olmadan yirminci yüzyıl Amerika'sının en önemli olaylarına tanıklık ederken çocukluk aşkını unutmaz. Tom Hanks'in sıcak performansı ve sevilen replikleriyle, tüm aileyle izlenebilecek duygusal bir klasik."},{"t":"Four Weddings and a Funeral","y":1994,"d":"Mike Newell","r":117,"g":["Comedy","Drama","Romance"],"c":[],"s":"Evlenmeye bir türlü cesaret edemeyen bir İngiliz bekâr, beş farklı törende karşılaştığı çekici bir Amerikalı kadına tutulur. Hugh Grant'in sevimli sakarlığı ve Richard Curtis'in esprili senaryosuyla İngiliz romantik komedisinin en sevilen örneklerinden biri."},{"t":"Heavenly Creatures","y":1994,"d":"Peter Jackson","r":99,"g":["Biography","Crime","Drama"],"c":[],"s":"Elliler Yeni Zelanda'sında iki genç kız arasında gelişen yoğun dostluk, birlikte kurdukları hayal dünyasıyla giderek takıntılı bir hal alır. Peter Jackson'ın gerçek bir olaydan esinlenen bu filmi, genç Kate Winslet'ın parladığı hem büyüleyici hem ürkütücü bir yapıt."},{"t":"Hoop Dreams","y":1994,"d":"Steve James","r":170,"g":["Documentary","Drama","Sport"],"c":[],"s":"Chicago'nun yoksul mahallelerinden iki genç basketbolcu, NBA hayaliyle beş yıl boyunca kamera tarafından izlenir. Steve James'in sabırla çektiği bu belgesel, spor, aile ve Amerikan rüyası üzerine sinemanın en etkileyici ve içten gerçek hikâyelerinden biri."},{"t":"Muriel's Wedding","y":1994,"d":"P.J. Hogan","r":106,"g":["Comedy","Drama"],"c":[],"s":"Küçük bir Avustralya kasabasında dışlanmış ve ABBA hayranı bir genç kadın, hayallerindeki düğünü yapmak için büyük bir yalanla evden kaçar. Toni Collette'in harika oyunu, hem çok komik hem de dostluk ve özgüvene dair beklenmedik derecede dokunaklı."},{"t":"Natural Born Killers","y":1994,"d":"Oliver Stone","r":119,"g":["Crime","Romance"],"c":[],"s":"Travmatik çocukluklara sahip iki sevgili, Amerika yollarında bir cinayet serisine çıkar ve medya onları birer yıldıza dönüştürür. Oliver Stone'un çılgın kurgusu ve karışık görsel dili, medya ve şiddet üzerine provokatif ve tartışmalı bir hiciv sunuyor."},{"t":"Pulp Fiction","y":1994,"d":"Quentin Tarantino","r":154,"g":["Crime","Drama"],"c":["John Travolta","Uma Thurman"],"s":"Los Angeles'ta iki tetikçi, bir boksör, gangster karısı ve bir çift soyguncunun hikâyeleri, sıra dışı bir zaman örgüsü içinde birbirine bağlanır. Tarantino'nun unutulmaz diyalogları, harika müzikleri ve cesur yapısıyla doksanların en etkili filmlerinden biri."},{"t":"Satantango","y":1994,"d":"Béla Tarr","r":439,"g":["Drama"],"c":[],"s":"Komünizmin çöküşünden sonra çamura gömülmüş bir Macar köyünde, ölü sanılan karizmatik bir adamın geri döndüğü haberi köylüleri heyecanlandırır. Béla Tarr'ın yedi saati aşan, uzun planlarla örülmüş bu siyah beyaz başyapıtı, sabır isteyen ama unutulmaz bir deneyim."},{"t":"The Adventures of Priscilla, Queen of the Desert","y":1994,"d":"Stephan Elliott","r":104,"g":["Comedy","Music"],"c":[],"s":"İki drag queen ile bir trans kadın, Avustralya çölünün ortasındaki bir otelde gösteri yapmak için pembe bir otobüsle yola çıkar. Göz kamaştıran kostümleri, disko şarkıları ve sıcak mizahıyla hem kahkaha hem de kabul üzerine kalpleri ısıtan bir yol filmi."},{"t":"The Blue Kite","y":1994,"d":"Tian Zhuangzhuang","r":140,"g":["Drama","History"],"c":[],"s":"Pekin'in dar bir sokağında büyüyen küçük bir çocuğun gözünden, ellili ve altmışlı yıllardaki siyasi kampanyaların ailesini nasıl etkilediği anlatılır. Tian Zhuangzhuang'ın uzun yıllar Çin'de yasaklı kalan bu sade ama sarsıcı filmi, dönemin en dürüst tanıklıklarından biri."},{"t":"The Kingdom (Riget)","y":1994,"d":"Lars von Trier","r":110,"g":["Action","Drama","Thriller"],"c":[],"s":"Kopenhag'daki büyük bir hastanede doktorlar ve hastalar, bina içindeki doğaüstü olaylar ve hayaletlerle karşılaşmaya başlar. Lars von Trier'in sarı tonlu, el kamerasıyla çekilmiş bu mini dizisi, korku ve absürt mizahı birleştiren benzersiz ve tuhaf bir eğlence."},{"t":"The Last Seduction","y":1994,"d":"John Dahl","r":110,"g":["Crime","Drama","Romance"],"c":[],"s":"Kocasının uyuşturucu parasıyla kaçan zeki ve acımasız bir kadın, küçük bir kasabada saklanırken saf bir yerel adamı planlarına alet eder. Linda Fiorentino'nun büyüleyici kötülüğüyle, kara filmin modern ve keskin bir yorumu."},{"t":"The Lion King","y":1994,"d":"Roger Allers","r":88,"g":["Adventure","Animation","Drama"],"c":["Matthew Broderick","Jeremy Irons"],"s":"Genç aslan Simba, babasının ölümünden sonra kötü amcası tarafından sürgüne gönderilir ve kaderiyle yüzleşmek zorunda kalır. Unutulmaz şarkıları, görkemli animasyonu ve evrensel hikâyesiyle Disney'in tüm zamanların en sevilen klasiklerinden biri."},{"t":"The Shawshank Redemption","y":1994,"d":"Frank Darabont","r":142,"g":["Drama"],"c":["Tim Robbins","Morgan Freeman"],"s":"Karısını öldürmekle suçlanan bir bankacı, Shawshank hapishanesinde uzun yıllar geçirirken bir mahkûmla derin bir dostluk kurar. Umut ve özgürlüğe dair sade ama güçlü anlatımıyla, dünyanın dört bir yanında en çok sevilen filmlerin başında geliyor."},{"t":"Three Colors: Red","y":1994,"d":"Krzysztof Kieślowski","r":99,"g":["Drama","Mystery","Romance"],"c":[],"s":"Cenevre'de genç bir model, kazayla bir köpeğe çarptıktan sonra komşularının telefonlarını dinleyen emekli ve huysuz bir yargıçla tanışır. Kieślowski'nin üçlemesini kapattığı bu sıcak kırmızı tonlu film, tesadüf ve kardeşlik üzerine şiirsel bir başyapıt."},{"t":"Three Colors: White","y":1994,"d":"Krzysztof Kieślowski","r":92,"g":["Comedy","Drama","Romance"],"c":[],"s":"Fransız karısı tarafından boşanan ve her şeyini kaybeden Polonyalı bir berber, memleketine dönerek hayatını yeniden kurmaya ve intikam almaya karar verir. Kieślowski'nin üçlemesinin en esprili halkası, eşitlik ve aşk üzerine kara mizahla dolu bir hikâye."},{"t":"Through the Olive Trees","y":1994,"d":"Abbas Kiarostami","r":103,"g":["Drama"],"c":[],"s":"İran'da depremden sonra bir film çekimi sırasında, genç bir oyuncu karşısında oynayan kıza evlenme teklif eder ama kız ona cevap vermez. Kiarostami'nin gerçek ile kurguyu iç içe geçiren sakin ve zarif filmi, unutulmaz bir son planla taçlanıyor."},{"t":"Wild Reeds","y":1994,"d":"André Téchiné","r":110,"g":["Drama","Romance"],"c":[],"s":"Cezayir Savaşı'nın son günlerinde Fransa'nın güneyindeki bir yatılı okulda dört genç, arkadaşlık, arzu ve siyasetin karışık dünyasında büyümeye çalışır. André Téchiné'nin hassas ve güneşli anlatımıyla gençliğin kırılganlığına dair zarif bir film."},{"t":"Babe","y":1995,"d":"Chris Noonan","r":91,"g":["Comedy","Drama","Family"],"c":[],"s":"Bir çiftlikte büyüyen sevimli domuz yavrusu Babe, köpeklerden öğrendikleriyle bir koyun güdücüsü olmaya karar verir. Konuşan hayvanları, sıcak mizahı ve iyilik dolu mesajıyla her yaştan izleyiciyi gülümseten gerçek bir aile klasiği."},{"t":"Braveheart","y":1995,"d":"Mel Gibson","r":178,"g":["Drama","War"],"c":["Mel Gibson","Sophie Marceau"],"s":"On üçüncü yüzyıl İskoçya'sında William Wallace, İngiliz baskısına karşı halkını ayaklandırarak bağımsızlık mücadelesini başlatır. Mel Gibson'ın destansı savaş sahneleri ve coşkulu müziğiyle büyük ekran için yapılmış görkemli bir tarihi epik."},{"t":"Casino","y":1995,"d":"Martin Scorsese","r":178,"g":["Crime","Drama"],"c":["Robert De Niro","Sharon Stone"],"s":"Yetmişli yıllarda Las Vegas'ta mafya adına bir kumarhane işleten usta bir bahisçi, çılgın arkadaşı ve güzel eşiyle birlikte zirveye tırmanır. Scorsese'nin şatafatlı ve hızlı anlatımıyla, De Niro, Pesci ve Sharon Stone'un parladığı bir suç destanı."},{"t":"Clueless","y":1995,"d":"Amy Heckerling","r":97,"g":["Comedy","Romance"],"c":["Alicia Silverstone","Stacey Dash"],"s":"Beverly Hills'in en popüler lise kızı Cher, arkadaşlarının aşk hayatlarını düzeltmeye çalışırken kendi kalbini keşfeder. Jane Austen'ın Emma'sını doksanların modasıyla yeniden yorumlayan bu zeki ve renkli komedi, bugün hâlâ taptaze."},{"t":"Cyclo","y":1995,"d":"Tran Anh Hung","r":123,"g":["Crime","Drama"],"c":[],"s":"Ho Chi Minh Kenti'nde bisiklet taksisi çalınan genç bir sürücü, borcunu ödemek için bir suç çetesine katılır ve kız kardeşi de karanlık bir dünyaya çekilir. Tran Anh Hung'un şiirsel ve sarsıcı görüntüleri, yoksulluk ve şiddeti göz alıcı bir güzellikle anlatıyor."},{"t":"Dead Man","y":1995,"d":"Jim Jarmusch","r":121,"g":["Adventure","Drama","Western"],"c":[],"s":"Batı'nın uzak bir kasabasına iş için gelen genç bir muhasebeci, kendini kanun kaçağı olarak bulur ve bir Kızılderili rehberle ruhani bir yolculuğa çıkar. Jarmusch'un siyah beyaz, şiirsel westerni, Neil Young'ın gitar müziğiyle hipnotik bir deneyim."},{"t":"Deseret","y":1995,"d":"James Benning","r":null,"g":["Documentary"],"c":[],"s":"Utah'ın yüz elli yıllık tarihi, New York Times'ta yayımlanmış haberlerin sesli okunuşu ile eyaletin manzaralarından oluşan sabit planlar eşliğinde anlatılır. James Benning'in deneysel belgeseli, tarih ile manzara arasındaki ilişkiyi sessizce düşündüren meditatif bir yapıt."},{"t":"Dilwale Dulhania Le Jayenge","y":1995,"d":"Aditya Chopra","r":181,"g":["Drama","Romance"],"c":[],"s":"Avrupa'da tanışan iki genç Hintli âşık olur, ancak kızın babası onu Hindistan'da çoktan bir başkasıyla nişanlamıştır. Shah Rukh Khan ve Kajol'un büyüleyici uyumuyla Bollywood'un en uzun süre gösterimde kalan, şarkılarla dolu romantik klasiği."},{"t":"Heat","y":1995,"d":"Michael Mann","r":170,"g":["Action","Crime","Drama"],"c":["Al Pacino","Robert De Niro"],"s":"Los Angeles'ta usta bir soyguncu ile saplantılı bir dedektif, birbirlerinin kararlılığına hayranlık duyarak kedi fare oyununa girişir. Michael Mann'ın şık görüntüleri ve Pacino ile De Niro'nun efsanevi karşılaşmasıyla suç sinemasının doruk noktalarından biri."},{"t":"Safe","y":1995,"d":"Todd Haynes","r":119,"g":["Drama","Mystery"],"c":[],"s":"Los Angeles'ın varlıklı bir banliyösünde yaşayan bir ev hanımı, çevresindeki kimyasallara karşı gizemli bir hastalık geliştirmeye başlar. Todd Haynes'in soğuk ve rahatsız edici anlatımı, Julianne Moore'un incelikli oyunuyla modern hayatın boşluğunu gözler önüne seriyor."},{"t":"Se7en","y":1995,"d":"David Fincher","r":127,"g":["Crime","Drama","Mystery"],"c":["Morgan Freeman","Brad Pitt"],"s":"Emekliliğe günler kalmış bir dedektif ile genç ve hırslı ortağı, yedi ölümcül günahı temel alan bir seri katilin izini sürer. David Fincher'ın karanlık, yağmurlu atmosferi ve sürükleyici gerilimiyle türün en etkili ve unutulmaz filmlerinden biri."},{"t":"Smoke","y":1995,"d":"Wayne Wang","r":112,"g":["Comedy","Drama"],"c":[],"s":"Brooklyn'de bir tütün dükkanının etrafında dolanan yazarlar, gençler ve komşuların hayatları, küçük hikâyeler ve tesadüflerle birbirine bağlanır. Paul Auster'ın senaryosu ve Harvey Keitel'in sıcak performansıyla, insanlığa ve anlatıcılığa yazılmış hoş bir film."},{"t":"Strange Days","y":1995,"d":"Kathryn Bigelow","r":145,"g":["Crime","Drama","Sci-Fi"],"c":[],"s":"Milenyumun son günlerinde Los Angeles'ta başkalarının anılarını kaydeden yasadışı diskler satan eski bir polis, bir cinayeti gösteren bir kayıtla karşılaşır. Kathryn Bigelow'un enerjik ve cesur bilimkurgu gerilimi, zamanının çok ötesinde fikirler taşıyor."},{"t":"The Usual Suspects","y":1995,"d":"Bryan Singer","r":106,"g":["Crime","Drama","Mystery"],"c":["Kevin Spacey","Gabriel Byrne"],"s":"Bir limanda gerçekleşen kanlı bir olaydan sağ kurtulan topal bir dolandırıcı, polislere efsanevi bir suç lordunun hikâyesini anlatır. Zekice kurulmuş senaryosu ve güçlü oyuncu kadrosuyla izleyiciyi sonuna kadar oyalayan klasik bir gerilim."},{"t":"The White Balloon","y":1995,"d":"Jafar Panahi","r":85,"g":["Drama","Family"],"c":[],"s":"Tahran'da yeni yıl arifesinde küçük bir kız, annesinden aldığı parayla bir japon balığı almak için yola çıkar ve şehrin sokaklarında küçük maceralar yaşar. Jafar Panahi'nin sade ve sıcak ilk filmi, bir çocuğun gözünden dünyaya bakan gerçek bir mücevher."},{"t":"Toy Story","y":1995,"d":"John Lasseter","r":81,"g":["Adventure","Animation","Comedy"],"c":["Tom Hanks","Tim Allen"],"s":"Andy'nin oyuncakları, yeni gelen havalı uzay kahramanı Buzz Lightyear yüzünden kovboy Woody'nin yerini kaybetme korkusuyla karışık bir maceraya sürüklenir. Tamamen bilgisayarla yapılan ilk uzun metraj animasyon olan film, hem çocukları hem büyükleri kalpten güldürüyor."},{"t":"Underground","y":1995,"d":"Emir Kusturica","r":167,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"İkinci Dünya Savaşı'ndan Yugoslavya'nın dağılmasına uzanan yıllarda, bir kurnaz adam arkadaşlarını savaşın hâlâ sürdüğüne inandırarak bir yeraltı mahzeninde tutar. Kusturica'nın çılgın, coşkulu ve bando müzikleriyle dolu destanı, hem komik hem çok hüzünlü bir başyapıt."},{"t":"Zero Kelvin","y":1995,"d":"Hans Petter Moland","r":113,"g":["Drama"],"c":[],"s":"Yirmili yıllarda şair olmayı hayal eden genç bir Norveçli, Grönland'da bir yıl boyunca kaba bir avcı ve bir bilim insanıyla küçük bir kulübede kışı geçirir. Buz gibi manzaraların ortasında yükselen erkek gerilimini ustaca anlatan, gergin ve atmosferik bir film."},{"t":"Breaking the Waves","y":1996,"d":"Lars von Trier","r":153,"g":["Drama"],"c":[],"s":"İskoçya'nın muhafazakâr bir köyünde, saf ve derin inançlı bir kadın, petrol platformunda çalışan eşi felç olunca ona olan sevgisini hiç beklenmedik bir biçimde kanıtlamaya çalışır. Emily Watson'ın yürek parçalayan performansıyla Lars von Trier'in en duygusal ve cesur filmi."},{"t":"Fargo","y":1996,"d":"Joel Coen","r":98,"g":["Crime","Drama","Thriller"],"c":["William H. Macy","Frances McDormand"],"s":"Borç batağındaki bir Minnesota'lı araba satıcısı, karısını kaçırtmak için iki beceriksiz suçluyla anlaşır ama plan hızla felakete dönüşür. Frances McDormand'ın hamile polis şefi rolüyle, Coen kardeşlerin kara mizah ile gerilimi kusursuz dengelediği bir başyapıt."},{"t":"Gabbeh","y":1996,"d":"Mohsen Makhmalbaf","r":75,"g":["Drama","Mystery","Romance"],"c":[],"s":"İran'da göçebe bir kabilenin dokuduğu halının motiflerinden canlanan genç bir kız, sevdiği adamla evlenmek için ailesinin iznini bekleyişini anlatır. Mohsen Makhmalbaf'ın göz kamaştıran renkleriyle, şiirsel ve masalsı bir aşk hikâyesi."},{"t":"Independence Day","y":1996,"d":"Roland Emmerich","r":145,"g":["Action","Adventure","Sci-Fi"],"c":["Will Smith","Bill Pullman"],"s":"Dev uzaylı gemileri dünyanın büyük şehirlerinin üzerinde belirir ve bir grup insan, Dört Temmuz'da insanlığı kurtarmak için son bir karşı saldırı düzenler. Will Smith'in esprili kahramanlığı ve büyük ölçekli yıkım sahneleriyle doksanların en eğlenceli gişe filmlerinden biri."},{"t":"Lone Star","y":1996,"d":"John Sayles","r":135,"g":["Drama","Mystery","Western"],"c":[],"s":"Teksas'ın sınırındaki bir kasabada, çölde bulunan bir iskelet, yerel şerifin efsanevi babasının geçmişine dair soruları gün yüzüne çıkarır. John Sayles'ın katmanlı hikâyesi, tarih, ırk ve aile sırları üzerine zengin ve düşündürücü bir modern western."},{"t":"Scream","y":1996,"d":"Wes Craven","r":111,"g":["Horror","Mystery"],"c":["Neve Campbell","Courteney Cox"],"s":"Küçük bir Kaliforniya kasabasında maskeli bir katil, korku filmlerinin kurallarını çok iyi bilen gençleri birer birer hedef alır. Wes Craven'in kendi türüyle dalga geçen zeki ve gerilimli filmi, korku sinemasını doksanlarda yeniden canlandırdı."},{"t":"Secrets & Lies","y":1996,"d":"Mike Leigh","r":136,"g":["Comedy","Drama"],"c":[],"s":"Evlat edinilmiş siyahi bir optometrist, biyolojik annesini aradığında onun Londra'nın işçi sınıfından beyaz bir kadın olduğunu öğrenir. Mike Leigh'in doğaçlamayla gelişen gerçekçi diyalogları ve Brenda Blethyn'in muhteşem oyunuyla, aile sırları üzerine son derece dokunaklı bir film."},{"t":"Shine","y":1996,"d":"Scott Hicks","r":105,"g":["Biography","Drama","Music"],"c":["Geoffrey Rush"],"s":"Otoriter babası tarafından zorla yetiştirilen dâhi piyanist David Helfgott, yıllar süren zorluklardan sonra müziğe ve hayata geri dönmeye çalışır. Geoffrey Rush'ın enerjik ve dokunaklı performansıyla gerçek bir hikâyeden uyarlanan ilham verici bir film."},{"t":"The English Patient","y":1996,"d":"Anthony Minghella","r":162,"g":["Drama","Romance","War"],"c":["Juliette Binoche"],"s":"İkinci Dünya Savaşı'nın sonlarında İtalya'da harap bir manastırda, ağır yanıklı gizemli bir adam genç bir hemşireye çölde yaşadığı yasak aşkı anlatır. Görkemli çöl manzaraları ve tutkulu romantizmiyle klasik Hollywood destanlarının ruhunu yaşatan bir film."},{"t":"The Pillow Book","y":1996,"d":"Peter Greenaway","r":126,"g":["Drama"],"c":[],"s":"Çocukken babası tarafından yüzüne yazı yazılan bir Japon kadın, büyüdüğünde bedenleri kâğıt gibi kullanarak aşk ve intikam dolu bir kitap yazmaya başlar. Peter Greenaway'in katmanlı ekranları ve güzel hat sanatıyla dolu, duyusal ve alışılmadık bir film."},{"t":"Three Lives and Only One Death","y":1996,"d":"Raúl Ruiz","r":123,"g":["Comedy","Crime","Fantasy"],"c":[],"s":"Paris'te birbirine bağlanan dört tuhaf hikâyede, Marcello Mastroianni her birinde farklı bir adamı canlandırır. Raúl Ruiz'in gerçeküstü mizahı ve oyunbaz anlatımıyla, büyük oyuncunun son dönemdeki en keyifli rollerinden birini sunan bir film."},{"t":"Trainspotting","y":1996,"d":"Danny Boyle","r":93,"g":["Crime","Drama"],"c":["Ewan McGregor","Ewen Bremner"],"s":"Edinburgh'da bir grup genç bağımlı, eroin, dostluk ve kaçış hayalleri arasında sallanarak hayatlarını sürdürmeye çalışır. Danny Boyle'un enerjik kurgusu, harika müzikleri ve kara mizahıyla doksanların ruhunu yakalayan bir kült klasik."},{"t":"Boogie Nights","y":1997,"d":"Paul Thomas Anderson","r":155,"g":["Drama"],"c":["Mark Wahlberg","Julianne Moore"],"s":"Yetmişlerin sonunda San Fernando Vadisi'nde genç bir adam, yetişkin film sektörünün yıldızı olur ve yeni ailesiyle birlikte seksenlerin çöküşüne sürüklenir. Paul Thomas Anderson'ın enerjik kamerası ve geniş oyuncu kadrosuyla hem eğlenceli hem hüzünlü bir dönem portresi."},{"t":"Deconstructing Harry","y":1997,"d":"Woody Allen","r":96,"g":["Comedy"],"c":[],"s":"Hayatındaki insanları romanlarına malzeme yapan başarılı bir yazar, eski okulundan bir ödül almaya giderken kendi hikâyeleriyle yüzleşmek zorunda kalır. Woody Allen'ın en cesur ve kendini acımasızca eleştiren filmlerinden biri, yaratıcı yapısıyla da çok eğlenceli."},{"t":"Fast, Cheap & Out of Control","y":1997,"d":"Errol Morris","r":80,"g":["Documentary"],"c":[],"s":"Bir vahşi hayvan eğitmeni, bir budama sanatçısı, bir robot bilimcisi ve bir köstebek uzmanının tutkuları birbirine şiirsel bir biçimde örülür. Errol Morris'in bu tuhaf ve büyüleyici belgeseli, hayatın anlamına ve saplantının güzelliğine dair düşündürücü bir deneme."},{"t":"Funny Games","y":1997,"d":"Michael Haneke","r":108,"g":["Crime","Drama","Horror"],"c":[],"s":"Tatil için göl kenarındaki evlerine gelen bir aile, beyaz eldivenli iki kibar gencin ziyaretiyle akıl almaz bir kâbusa sürüklenir. Michael Haneke'nin izleyiciyle doğrudan yüzleşen bu soğuk ve kışkırtıcı filmi, şiddetin izlenmesi üzerine rahatsız edici bir sorgulama."},{"t":"Hana-bi (Fireworks)","y":1997,"d":"Takeshi Kitano","r":100,"g":["Comedy","Romance"],"c":[],"s":"Hasta karısıyla ilgilenen ve felç olan ortağının suçluluğunu taşıyan eski bir polis, son bir yolculuk için yakuza ile riskli bir işe girişir. Takeshi Kitano'nun şiddet ve şefkati kendi resimleriyle harmanladığı, sessiz ama derinden etkileyen bir başyapıt."},{"t":"Happy Together","y":1997,"d":"Wong Kar-wai","r":96,"g":["Drama","Romance"],"c":[],"s":"Hong Kong'dan Arjantin'e gelen gey bir çift, yeni bir başlangıç yapmaya çalışırken ilişkileri kavgalar ve ayrılıklar arasında gidip gelir. Wong Kar-wai'nin tango ritimli, renkli ve melankolik aşk hikâyesi, Tony Leung ve Leslie Cheung'un büyüleyici uyumuyla eşsiz."},{"t":"Kundun","y":1997,"d":"Martin Scorsese","r":134,"g":["Biography","Drama","History"],"c":[],"s":"Küçük yaşta Dalai Lama olarak seçilen bir çocuk, Tibet'in manastırlarında yetişir ve Çin'in işgali karşısında halkının kaderiyle yüzleşir. Scorsese'nin sakin ve görkemli filmi, Philip Glass'ın müziği ve göz alıcı renkleriyle meditatif bir deneyim sunuyor."},{"t":"L.A. Confidential","y":1997,"d":"Curtis Hanson","r":138,"g":["Crime","Drama","Mystery"],"c":["Kevin Spacey","Russell Crowe","Kim Basinger"],"s":"Ellili yılların Los Angeles'ında birbirinden çok farklı üç polis, bir kafede yaşanan katliamı araştırırken yozlaşmanın en derin katmanlarıyla karşılaşır. Zekâ dolu senaryosu, güçlü kadrosu ve şık atmosferiyle modern kara filmin en iyi örneklerinden biri."},{"t":"Mother and Son","y":1997,"d":"Aleksandr Sokurov","r":73,"g":["Drama"],"c":[],"s":"Genç bir adam, ölmek üzere olan annesini kucağında taşıyarak kırların arasında son bir yürüyüşe çıkarır. Aleksandr Sokurov'un tablo gibi bozulmuş görüntüleri ve neredeyse sessiz anlatımıyla sevgi ve vedaya dair unutulmaz derecede şiirsel bir film."},{"t":"Open Your Eyes","y":1997,"d":"Alejandro Amenábar","r":119,"g":["Drama","Mystery","Sci-Fi"],"c":[],"s":"Madrid'de yakışıklı ve zengin bir genç, hayatının aşkıyla tanıştığı gece bir kaza geçirir ve bundan sonra gerçek ile rüya birbirine karışmaya başlar. Alejandro Amenábar'ın zihin bükücü gerilimi, pek çok yeniden yapıma ilham veren zekice bir yapıt."},{"t":"Princess Mononoke","y":1997,"d":"Hayao Miyazaki","r":133,"g":["Adventure","Animation","Fantasy"],"c":["Yôji Matsuda","Yuriko Ishida"],"s":"Lanetlenmiş genç bir savaşçı, orman tanrıları ile demir üreten insanlar arasındaki savaşın ortasında kalır ve kurtlarla büyümüş bir kızla karşılaşır. Miyazaki'nin doğa ve insan arasındaki dengeyi anlatan destansı eseri, olağanüstü animasyonuyla nefes kesiyor."},{"t":"Taste of Cherry","y":1997,"d":"Abbas Kiarostami","r":95,"g":["Drama"],"c":[],"s":"Tahran'ın tozlu tepelerinde arabasıyla dolaşan bir adam, kendisine önemli bir iyilik yapacak birini aramaktadır. Kiarostami'nin sade ve felsefi filmi, hayatın küçük güzelliklerini hatırlatan konuşmalarıyla Cannes'da Altın Palmiye kazanmış düşündürücü bir başyapıt."},{"t":"The Butcher Boy","y":1997,"d":"Neil Jordan","r":110,"g":["Comedy","Drama"],"c":[],"s":"Altmışların İrlanda kasabasında sorunlu bir ailede büyüyen hayalperest bir çocuk, dünyası dağıldıkça kendi karanlık fantezilerine daha çok sığınır. Neil Jordan'ın kara mizah ile trajediyi ustalıkla harmanladığı bu film, genç Eamonn Owens'ın olağanüstü performansıyla unutulmaz."},{"t":"The Ice Storm","y":1997,"d":"Ang Lee","r":112,"g":["Drama"],"c":[],"s":"Yetmişlerin başında Connecticut'ta iki komşu aile, Şükran Günü haftasonunda hem evliliklerinde hem çocuklarında biriken gerilimle yüzleşir. Ang Lee'nin soğuk ve zarif anlatımı, geniş oyuncu kadrosuyla bir dönemin ahlaki çözülmesinin incelikli bir portresi."},{"t":"The Sweet Hereafter","y":1997,"d":"Atom Egoyan","r":112,"g":["Drama"],"c":[],"s":"Kanada'da küçük bir kasaba, çocukları taşıyan okul otobüsünün kazasıyla yasa boğulur ve bir avukat aileleri dava açmaya ikna etmeye çalışır. Atom Egoyan'ın zamanda gezinen anlatımı ve derin hüznüyle kayıp ve suçluluk üzerine etkileyici bir başyapıt."},{"t":"Titanic","y":1997,"d":"James Cameron","r":194,"g":["Drama","Romance"],"c":["Leonardo DiCaprio","Kate Winslet"],"s":"Yüzyıl başında Titanik'in ilk seferinde, yoksul bir ressam ile nişanlı zengin bir genç kadın arasında tutkulu bir aşk başlar. James Cameron'ın görkemli prodüksiyonu, Leonardo DiCaprio ve Kate Winslet'ın uyumuyla sinema tarihinin en büyük romantik destanlarından biri."},{"t":"Buffalo '66","y":1998,"d":"Vincent Gallo","r":110,"g":["Comedy","Drama","Romance"],"c":[],"s":"Hapisten yeni çıkan huysuz bir adam, ailesine evli olduğunu ispatlamak için genç bir dansçıyı kaçırıp karısı rolünü oynamaya zorlar. Vincent Gallo'nun özgün görüntüleri ve Christina Ricci'nin tatlı performansıyla tuhaf ama şaşırtıcı derecede duygusal bir bağımsız film."},{"t":"Happiness","y":1998,"d":"Todd Solondz","r":140,"g":["Comedy","Drama"],"c":[],"s":"New Jersey'de üç kız kardeş ve çevrelerindeki insanlar, mutluluğu farklı ve çoğu zaman rahatsız edici yollarla aramaya devam eder. Todd Solondz'un kara mizahı ve cesur konularıyla izleyiciyi hem güldüren hem sarsan provokatif bir film."},{"t":"Lock, Stock and Two Smoking Barrels","y":1998,"d":"Guy Ritchie","r":107,"g":["Comedy","Crime"],"c":["Jason Flemyng","Dexter Fletcher"],"s":"Londra'da dört arkadaş, bir kart oyununda büyük bir borca girince parayı bulmak için tehlikeli suçluların dünyasına karışır. Guy Ritchie'nin hızlı kurgusu, esprili diyalogları ve renkli karakterleriyle İngiliz suç komedisinin en keyifli örneklerinden biri."},{"t":"Pi","y":1998,"d":"Darren Aronofsky","r":84,"g":["Drama","Horror","Mystery"],"c":[],"s":"Takıntılı bir matematik dehası, borsayı ve evreni açıklayabilecek bir sayısal örüntüyü ararken hem Wall Street hem de bir dini grubun hedefi olur. Darren Aronofsky'nin siyah beyaz, gergin ve baş döndürücü ilk filmi, düşük bütçeyle yaratılmış bir kült klasik."},{"t":"Ringu","y":1998,"d":"Hideo Nakata","r":96,"g":["Horror","Mystery"],"c":[],"s":"Lanetli bir video kaseti izleyenlerin yedi gün içinde öldüğü söylentisinin peşine düşen bir gazeteci, kendini zamana karşı bir yarışın içinde bulur. Japon korkusunu dünyaya tanıtan bu film, kan yerine sessizlik ve tedirginlikle ürperten, unutulmaz bir kâbus."},{"t":"Run Lola Run","y":1998,"d":"Tom Tykwer","r":80,"g":["Action","Crime","Thriller"],"c":[],"s":"Lola'nın, başı derde giren sevgilisini kurtarmak için yirmi dakikada yüz bin mark bulması gerekir ve aynı koşu küçük farklarla yeniden başlar. Tekno ritmi, animasyon araları ve oyunbaz yapısıyla adrenalin dolu, taptaze bir sinema deneyimi."},{"t":"Rushmore","y":1998,"d":"Wes Anderson","r":93,"g":["Comedy","Drama","Romance"],"c":[],"s":"Okul kulüplerine gömülen hırslı ama derslerde başarısız Max Fischer, hem bir öğretmene âşık olur hem de yalnız bir iş adamıyla tuhaf bir dostluk kurar. Wes Anderson'ın imza üslubunun doğduğu, hüzünle mizahı zarafetle harmanlayan tatlı bir film."},{"t":"Saving Private Ryan","y":1998,"d":"Steven Spielberg","r":169,"g":["Drama","War"],"c":["Tom Hanks","Matt Damon"],"s":"Normandiya çıkarmasının ardından bir grup asker, üç kardeşini savaşta kaybetmiş Er Ryan'ı bulup eve göndermek için düşman hatlarına dalar. Açılış sahnesiyle savaş sinemasını baştan tanımlayan, insanlık ve fedakârlık üzerine sarsıcı bir başyapıt."},{"t":"Sombre","y":1998,"d":"Philippe Grandrieux","r":112,"g":["Drama","Horror"],"c":[],"s":"Fransa'nın taşra yollarında dolaşan karanlık bir adam, arabası bozulan saf bir kadınla beklenmedik bir bağ kurar. Philippe Grandrieux'nün bulanık, neredeyse soyut görüntülerle örülü bu cesur filmi, alışılmış anlatının ötesinde duyusal bir deneyim arayanlara."},{"t":"The Big Lebowski","y":1998,"d":"Joel Coen","r":117,"g":["Comedy","Crime"],"c":["Jeff Bridges","John Goodman"],"s":"Tembel ve rahat Dude, adaşı bir milyonerle karıştırılınca kendini kaçırılma, fidye ve bowling dolu absürt bir karmaşanın ortasında bulur. Coen Kardeşler'in unutulmaz replikleri ve karakterleriyle kült mertebesine ulaşmış, her izleyişte daha çok keyif veren bir komedi."},{"t":"The Celebration","y":1998,"d":"Thomas Vinterberg","r":101,"g":["Drama"],"c":[],"s":"Varlıklı bir ailenin babasının altmışıncı yaş günü yemeğinde, büyük oğulun kaldırdığı kadeh ailenin gizli kalmış yaralarını açığa çıkarır. Dogma 95 akımının ilk filmi olan bu el kamerası dramı, çiğ gerçekçiliğiyle nefes kesiyor."},{"t":"The Idiots","y":1998,"d":"Lars von Trier","r":117,"g":["Comedy","Drama"],"c":[],"s":"Bir grup genç, toplumun kurallarını sorgulamak için halka açık yerlerde zihinsel engelliymiş gibi davranan bir komün kurar. Lars von Trier'in Dogma kurallarıyla çektiği bu kışkırtıcı film, rahatsız ettiği kadar düşündüren cesur bir deney."},{"t":"The Thin Red Line","y":1998,"d":"Terrence Malick","r":170,"g":["Drama","History","War"],"c":[],"s":"İkinci Dünya Savaşı'nda Guadalcanal'a çıkan Amerikan askerleri, bir tepeyi ele geçirmeye çalışırken doğa, ölüm ve ruh üzerine düşüncelere dalar. Terrence Malick'in şiirsel anlatımıyla savaş filminden çok bir meditasyon, görsel olarak büyüleyici."},{"t":"There's Something About Mary","y":1998,"d":"Bobby Farrelly","r":119,"g":["Comedy","Romance"],"c":["Cameron Diaz","Matt Dillon"],"s":"Lise balosunda utanç verici bir kazayla gecesi mahvolan Ted, yıllar sonra eski aşkı Mary'yi bulmak için bir dedektif tutar ama işler hiç beklediği gibi gitmez. Farrelly Kardeşler'in sınır tanımayan, tatlı kalpli ve kahkaha garantili komedisi."},{"t":"All About My Mother","y":1999,"d":"Pedro Almodóvar","r":101,"g":["Comedy","Drama","Romance"],"c":[],"s":"Oğlunu trajik bir kazada kaybeden Manuela, oğlunun hiç tanımadığı babasını bulmak için Barselona'ya döner ve yolda unutulmaz kadınlarla karşılaşır. Almodóvar'ın renkli, şefkatli ve derinden dokunaklı bu filmi, kadın dayanışmasına yazılmış bir aşk mektubu."},{"t":"American Beauty","y":1999,"d":"Sam Mendes","r":122,"g":["Drama"],"c":["Kevin Spacey","Annette Bening"],"s":"Banliyö hayatından bunalan orta yaşlı Lester, bir gün hayatını kökten değiştirmeye karar verir ve bu karar tüm ailesini sarsar. Keskin kara mizahı ve görsel zarafetiyle Amerikan rüyasının ardındaki boşluğu sorgulayan, çok konuşulmuş bir film."},{"t":"Attack the Gas Station!","y":1999,"d":"Kim Sang-jin","r":113,"g":["Comedy","Crime"],"c":[],"s":"Canı sıkılan dört serseri bir Seul benzin istasyonunu basar ve bir gece boyunca orayı kendi kurallarıyla yönetmeye başlar. Çılgın enerjisi ve toplumsal hicviyle Kore sinemasının yükselişini müjdeleyen, kahkaha dolu bir kaos komedisi."},{"t":"Audition","y":1999,"d":"Takashi Miike","r":115,"g":["Drama","Horror","Mystery"],"c":[],"s":"Eşini yıllar önce kaybetmiş bir dul, yeni bir eş bulmak için sahte bir oyuncu seçmesi düzenler ve sessiz, gizemli Asami'ye vurulur. Romantik bir dram gibi başlayıp yavaş yavaş kâbusa dönüşen Takashi Miike klasiği, midesi sağlam olanlara."},{"t":"Being John Malkovich","y":1999,"d":"Spike Jonze","r":113,"g":["Comedy","Drama","Fantasy"],"c":["John Cusack","Cameron Diaz"],"s":"Geçimini zor sağlayan bir kuklacı, iş yerindeki gizli bir kapıdan aktör John Malkovich'in zihnine girilebildiğini keşfeder. Charlie Kaufman'ın sınırsız hayal gücüyle yazılmış, kimlik ve arzu üzerine hem çılgın hem zekice bir komedi."},{"t":"Eyes Wide Shut","y":1999,"d":"Stanley Kubrick","r":159,"g":["Drama","Mystery","Thriller"],"c":["Tom Cruise","Nicole Kidman"],"s":"Karısının itirafıyla sarsılan New Yorklu bir doktor, bir gece boyunca şehrin gizli ve tehlikeli arzu dünyasına sürüklenir. Stanley Kubrick'in son filmi, rüya gibi atmosferi ve evlilik üzerine esrarengiz sorularıyla uzun süre akıldan çıkmıyor."},{"t":"Fight Club","y":1999,"d":"David Fincher","r":139,"g":["Crime","Drama","Thriller"],"c":["Brad Pitt","Edward Norton"],"s":"Uykusuzluk çeken sıradan bir memur, karizmatik sabun satıcısı Tyler Durden'la tanışınca yeraltı dövüş kulübü kurar ve hayatı kontrolden çıkar. Tüketim toplumuna attığı yumrukla bir kuşağın kült filmi olan, David Fincher imzalı çarpıcı bir yapım."},{"t":"Magnolia","y":1999,"d":"Paul Thomas Anderson","r":188,"g":["Drama"],"c":["Tom Cruise","Jason Robards"],"s":"Los Angeles'ta tek bir gün boyunca birbirine görünmez bağlarla bağlı insanların hayatları, pişmanlık, bağışlanma ve tesadüf etrafında kesişir. Paul Thomas Anderson'ın muazzam oyuncu kadrosuyla kurduğu cesur, duygusal ve unutulmaz bir mozaik."},{"t":"Rosetta","y":1999,"d":"Luc Dardenne","r":95,"g":["Drama"],"c":[],"s":"Alkolik annesiyle bir karavanda yaşayan genç Rosetta, düzgün bir iş bulup sıradan bir hayat kurmak için her şeyi göze alır. Dardenne Kardeşler'in el kamerasıyla nefes nefese izlettiği, Cannes'da Altın Palmiye kazanmış yalın ve güçlü bir dram."},{"t":"Taboo","y":1999,"d":"Nagisa Ōshima","r":100,"g":["Drama","History","Thriller"],"c":[],"s":"Şogunluk döneminde bir samuray okuluna katılan güzel yüzlü genç Kano, diğer savaşçılar arasında kıskançlık ve tutku dalgaları yaratır. Nagisa Ōshima'nın zarif görüntüleri ve gizemli anlatımıyla samuray geleneğine bambaşka bir bakış."},{"t":"The Blair Witch Project","y":1999,"d":"Daniel Myrick","r":81,"g":["Horror","Mystery"],"c":["Heather Donahue","Michael C. Williams"],"s":"Üç film öğrencisi, efsanevi bir cadının izini sürmek için Maryland ormanlarına belgesel çekmeye gider ve bir daha geri dönmez. Bulunmuş görüntü türünü dünyaya yayan, az şeyle çok korkutmanın ustalık dersi olan bir bağımsız sinema olayı."},{"t":"The Matrix","y":1999,"d":"Lilly Wachowski","r":136,"g":["Action","Sci-Fi"],"c":["Keanu Reeves","Laurence Fishburne"],"s":"Gündüzleri programcı, geceleri hacker olan Neo, yaşadığı dünyanın aslında bir simülasyon olabileceğini öğrenir ve gerçeğin peşine düşer. Ağır çekim aksiyonu ve felsefi merakıyla bilimkurgu sinemasının kurallarını yeniden yazmış bir klasik."},{"t":"The Sixth Sense","y":1999,"d":"M. Night Shyamalan","r":107,"g":["Drama","Mystery","Thriller"],"c":["Bruce Willis","Haley Joel Osment"],"s":"Ölüleri gördüğünü söyleyen korkmuş küçük bir çocuk, ona yardım etmeye çalışan çocuk psikoloğuyla güçlü bir bağ kurar. Ürkütücü atmosferi ve duygusal derinliğiyle, sonunu bilseniz bile yeniden izlemeye değen modern bir gerilim klasiği."},{"t":"The Wind Will Carry Us","y":1999,"d":"Abbas Kiarostami","r":118,"g":["Drama"],"c":[],"s":"Tahranlı bir grup, gizemli bir amaçla Kürt bir dağ köyüne gelir ve günlerce yaşlı bir kadının ölmesini bekler. Abbas Kiarostami'nin buğday tarlaları ve şiirle dolu bu filmi, sabırlı izleyiciyi hayatın sade güzelliğiyle ödüllendiriyor."},{"t":"Three Kings","y":1999,"d":"David O. Russell","r":114,"g":["Action","Adventure","Comedy"],"c":[],"s":"Körfez Savaşı'nın bitiminde dört Amerikan askeri, Saddam'ın sakladığı altınları çalmak için bir maceraya atılır ama savaşın gerçek yüzüyle karşılaşır. Aksiyon, kara mizah ve politik hicvi ustaca birleştiren, enerjik ve cesur bir film."},{"t":"Time Regained","y":1999,"d":"Raúl Ruiz","r":null,"g":["Drama"],"c":[],"s":"Ölüm döşeğindeki bir yazar, eski fotoğraflara bakarken hayatını şekillendiren insanları ve Paris salonlarının dünyasını hatırlar. Raúl Ruiz'in Proust'u beyazperdeye taşıdığı bu zarif film, belleğin akışkan büyüsünü görselleştiren nadir uyarlamalardan."},{"t":"Ali Zaoua: Prince of the Streets","y":2000,"d":"Nabil Ayouch","r":90,"g":["Crime","Drama"],"c":[],"s":"Kazablanka sokaklarında yaşayan kimsesiz çocuklar, arkadaşları Ali'ye hak ettiği bir veda sunmak için şehirde bir yolculuğa çıkar. Gerçek sokak çocuklarıyla çekilmiş, sertliğin içinde şiir ve umut bulan dokunaklı bir Fas filmi."},{"t":"Amores Perros","y":2000,"d":"Alejandro González Iñárritu","r":154,"g":["Drama","Thriller"],"c":["Emilio Echevarría","Gael García Bernal"],"s":"Mexico City'deki bir trafik kazası, birbirini hiç tanımayan üç farklı insanın hayatını ve köpekleriyle olan bağlarını kesiştirir. Iñárritu'nun ilk filmi, ham enerjisi ve iç içe geçen hikâyeleriyle yeni Meksika sinemasının habercisi oldu."},{"t":"Beau Travail","y":2000,"d":"Claire Denis","r":92,"g":["Drama","War"],"c":[],"s":"Cibuti'de görev yapan Fransız Yabancı Lejyonu'nda bir çavuş, genç ve parlak bir askere duyduğu kıskançlıkla sarsılır. Claire Denis'in dans gibi koreografiye edilmiş görüntüleri ve unutulmaz finaliyle, bedenin şiirini anlatan hipnotik bir film."},{"t":"Crouching Tiger, Hidden Dragon","y":2000,"d":"Ang Lee","r":120,"g":["Action","Adventure","Drama"],"c":["Chow Yun-Fat","Michelle Yeoh"],"s":"Efsanevi bir kılıcın çalınmasıyla usta bir savaşçı, sadık yol arkadaşı ve asi bir soylu kız arasında tutku ve onur dolu bir hikâye başlar. Ağaç tepelerinde süzülen dövüş sahneleri ve romantizmiyle wuxia türünü dünyaya sevdiren büyüleyici bir masal."},{"t":"Dancer in the Dark","y":2000,"d":"Lars von Trier","r":135,"g":["Crime","Drama","Musical"],"c":[],"s":"Görme yetisini yavaş yavaş kaybeden göçmen fabrika işçisi Selma, oğlunun geleceği için para biriktirirken zorluklara müzikal hayallerle direnir. Björk'ün yürek parçalayan performansıyla Lars von Trier'in en duygusal ve cesur filmi."},{"t":"Gladiator","y":2000,"d":"Ridley Scott","r":155,"g":["Action","Adventure","Drama"],"c":["Russell Crowe","Joaquin Phoenix"],"s":"İmparatorun güvendiği Romalı general Maximus, ihanete uğrayıp köleliğe düşer ve arenada gladyatör olarak intikam yolunu açar. Görkemli sahneleri, Russell Crowe'un karizması ve unutulmaz müziğiyle tarih destanlarını yeniden canlandıran bir film."},{"t":"In the Mood for Love","y":2000,"d":"Wong Kar-wai","r":98,"g":["Drama","Romance"],"c":[],"s":"1962 Hong Kong'unda yan yana dairelerde yaşayan bir adam ve bir kadın, eşlerinin kendilerini aldattığını fark edince birbirlerine yakınlaşır. Wong Kar-wai'nin kadife gibi görüntüleri ve hüzünlü melodisiyle sinemanın en zarif aşk filmlerinden biri."},{"t":"Kippur","y":2000,"d":"Amos Gitai","r":117,"g":["Drama","War"],"c":[],"s":"1973 Yom Kippur Savaşı'nda iki genç yedek asker, yaralıları kurtarmakla görevli bir tahliye ekibine katılır ve cehennemi yakından görür. Amos Gitai'nin kendi deneyiminden beslenen bu film, savaşı kahramanlıktan arındırıp çıplak gerçekliğiyle gösteriyor."},{"t":"Meet the Parents","y":2000,"d":"Jay Roach","r":108,"g":["Comedy","Romance"],"c":["Ben Stiller","Robert De Niro"],"s":"Hemşire Greg, sevgilisine evlenme teklif etmeden önce onun şüpheci, eski CIA ajanı babasının onayını almak zorundadır. Ben Stiller ile Robert De Niro'nun müthiş uyumuyla, her felaketin bir öncekini aştığı keyifli bir aile komedisi."},{"t":"Memento","y":2000,"d":"Christopher Nolan","r":113,"g":["Mystery","Thriller"],"c":["Guy Pearce","Carrie-Anne Moss"],"s":"Kısa süreli belleğini kaybetmiş Leonard, notlar, fotoğraflar ve dövmeler yardımıyla karısının katilini aramaktadır. Hikâyeyi tersten anlatan cüretkâr yapısıyla Christopher Nolan'ın adını duyuran, izleyiciyi sonuna dek düşündüren zekice bir gerilim."},{"t":"Nine Queens","y":2000,"d":"Fabián Bielinsky","r":114,"g":["Crime","Drama","Thriller"],"c":[],"s":"Buenos Aires'te iki dolandırıcı, bir koleksiyonere sahte bir nadir pul serisi satmak için tek günlük büyük bir vurgun planlar. Kimin kimi kandırdığını sürekli sorgulatan akıllı senaryosuyla Arjantin sinemasının en keyifli sürprizlerinden biri."},{"t":"O Brother, Where Art Thou?","y":2000,"d":"Joel Coen","r":107,"g":["Adventure","Comedy","Crime"],"c":["George Clooney","John Turturro"],"s":"1930'ların Mississippi'sinde zincirli bir mahkûm ekibinden kaçan üç firari, saklı bir hazineye ulaşmak için tuhaf bir yolculuğa çıkar. Homeros'un Odysseia'sından esinlenen, country müzikleri ve Coen mizahıyla dolu neşeli bir güney masalı."},{"t":"Requiem for a Dream","y":2000,"d":"Darren Aronofsky","r":102,"g":["Drama"],"c":["Ellen Burstyn","Jared Leto"],"s":"Brooklyn'de dört insan, her biri kendi hayalinin peşinde koşarken bağımlılığın girdabına yavaş yavaş kapılır. Aronofsky'nin baş döndürücü kurgusu ve unutulmaz müziğiyle izlemesi zor ama etkisi silinmeyen bir sinema deneyimi."},{"t":"The Captive","y":2000,"d":"Chantal Akerman","r":118,"g":["Drama","Music","Romance"],"c":[],"s":"Paris'te zengin bir genç adam, birlikte yaşadığı sevgilisini takıntılı bir kıskançlıkla izler, sorgular ve onu tamamen anlamaya çalışır. Chantal Akerman'ın Proust'tan uyarladığı bu soğuk ve büyüleyici film, sahiplenme arzusunun karanlık yüzünü inceliyor."},{"t":"The Decalogue","y":2000,"d":"Krzysztof Kieślowski","r":null,"g":["Drama"],"c":[],"s":"Varşova'da aynı site binasında yaşayan insanların hayatlarını, her biri On Emir'den birinden esinlenen on ayrı hikâyede izleriz. Kieślowski'nin ahlak, inanç ve vicdan üzerine yarattığı bu başyapıt, sinema tarihinin en derin ve insancıl eserlerinden biri."},{"t":"The Gleaners & I","y":2000,"d":"Agnès Varda","r":82,"g":["Documentary"],"c":[],"s":"Agnès Varda, tarlalarda artakalan ürünleri toplayan köylülerden şehirde çöpten yiyecek bulanlara kadar Fransa'nın başakçılarını küçük bir dijital kamerayla izler. Merakı, mizahı ve şefkatiyle belgeseli kişisel bir denemeye dönüştüren sıcacık bir film."},{"t":"Traffic","y":2000,"d":"Steven Soderbergh","r":147,"g":["Crime","Drama","Thriller"],"c":["Benicio Del Toro"],"s":"Uyuşturucuyla mücadele eden bir yargıç, Meksikalı bir polis ve bir kaçakçının karısı üzerinden Amerika'daki uyuşturucu savaşının farklı yüzleri anlatılır. Soderbergh'in renk kodlu görüntüleri ve iç içe geçen hikâyeleriyle zekice kurgulanmış bir dram."},{"t":"Yi Yi","y":2000,"d":"Edward Yang","r":173,"g":["Drama"],"c":[],"s":"Taipei'de orta sınıf bir ailenin her bireyi, bir düğünle başlayıp bir cenazeyle biten bir yıl içinde kendi sorularıyla yüzleşir. Edward Yang'ın hayatın tamamını sığdırdığı bu sıcak ve bilge film, zamanla değeri daha da artan gerçek bir başyapıt."},{"t":"Amelie","y":2001,"d":"Jean-Pierre Jeunet","r":122,"g":["Comedy","Romance"],"c":["Audrey Tautou","Mathieu Kassovitz"],"s":"Montmartre'da garsonluk yapan utangaç Amélie, çevresindekilerin hayatına gizlice küçük mutluluklar serpmeye karar verir ama kendi aşkına cesaret edemez. Masalsı renkleri, sevimli detayları ve Yann Tiersen müziğiyle insanın içini ısıtan bir Paris rüyası."},{"t":"Fat Girl","y":2001,"d":"Catherine Breillat","r":86,"g":["Drama"],"c":[],"s":"Tatildeki iki kız kardeşten güzel olanı ilk aşkını yaşarken, kilolu küçük kardeş her şeye sessiz ve keskin bir gözle tanıklık eder. Catherine Breillat'nın kız kardeşlik ve genç kadınlık üzerine yaptığı bu dürüst, rahatsız edici ve cesur film unutulmuyor."},{"t":"Kandahar","y":2001,"d":"Mohsen Makhmalbaf","r":81,"g":["Drama"],"c":[],"s":"Kanada'da yaşayan Afgan bir gazeteci, intihar etmek üzere olan kız kardeşini kurtarmak için Taliban yönetimindeki Afganistan'da Kandahar'a doğru yola çıkar. Makhmalbaf'ın gerçeküstü güzellikteki görüntüleriyle hem şiirsel hem acı bir tanıklık."},{"t":"Lantana","y":2001,"d":"Ray Lawrence","r":121,"g":["Drama","Mystery","Romance"],"c":[],"s":"Sidney'de bir kadının kaybolmasıyla başlayan soruşturma, birbirine bağlı dört çiftin evlilikleri, sadakatsizlikleri ve güvensizlikleri üzerine bir ağ örer. Gizem kılığında derin bir ilişki dramı olan, olgun ve incelikli bir Avustralya filmi."},{"t":"Monsoon Wedding","y":2001,"d":"Mira Nair","r":114,"g":["Comedy","Drama","Romance"],"c":[],"s":"Delhi'de muson yağmurları başlarken kalabalık bir Pencap ailesi, kızlarının görücü usulü düğününe hazırlanır ve aile sırları gün yüzüne çıkar. Renkli, müzikli ve sıcacık, Mira Nair'in hayat dolu bu filmi insanı bir düğüne davet edilmiş gibi hissettiriyor."},{"t":"Moulin Rouge!","y":2001,"d":"Baz Luhrmann","r":127,"g":["Drama","Musical","Romance"],"c":["Nicole Kidman","Ewan McGregor"],"s":"1899 Paris'inde parasız bir İngiliz şair, Moulin Rouge'un yıldız dansçısı Satine'e âşık olur ama kulübün zengin hamisi de onu istemektedir. Baz Luhrmann'ın pop şarkılarını müzikale dönüştürdüğü, gözleri kamaştıran coşkulu bir aşk hikâyesi."},{"t":"Mulholland Drive","y":2001,"d":"David Lynch","r":147,"g":["Drama","Mystery","Thriller"],"c":["Naomi Watts","Laura Harring"],"s":"Bir trafik kazasından sonra hafızasını kaybeden gizemli bir kadın ile Hollywood'da şansını denemeye gelen umut dolu bir oyuncu, kadının kimliğinin izini sürer. David Lynch'in rüya ile kâbus arasında gidip gelen bu labirenti, yüzyılın en çok tartışılan filmlerinden."},{"t":"No Man's Land","y":2001,"d":"Danis Tanović","r":98,"g":["Comedy","Drama","War"],"c":[],"s":"Bosna Savaşı sırasında bir Boşnak ve bir Sırp asker, iki cephe arasındaki bir siperde birlikte mahsur kalır. Kara mizahla savaşın saçmalığını ve uluslararası kayıtsızlığı hicveden, Oscar ödüllü, keskin ve insancıl bir film."},{"t":"Signs & Wonders","y":2001,"d":"Jonathan Nossiter","r":null,"g":["Drama"],"c":[],"s":"Atina'da yaşayan Amerikalı bir adam, hayatındaki işaretlere ve tesadüflere takıntılı biçimde bağlanırken ailesi ile sevgilisi arasında savrulur. Stellan Skarsgård ve Charlotte Rampling'in güçlü oyunlarıyla, aşk ve takıntı üzerine tedirgin edici bir dram."},{"t":"Spirited Away","y":2001,"d":"Hayao Miyazaki","r":124,"g":["Adventure","Animation","Family"],"c":["Miyu Irino","Rumi Hiiragi"],"s":"Ailesiyle taşınırken gizemli bir ruhlar dünyasına düşen küçük Chihiro, domuza dönüşen anne babasını kurtarmak için bir hamamda çalışmak zorunda kalır. Miyazaki'nin sınırsız hayal gücüyle çizdiği, her yaşa hitap eden animasyonun zirve eserlerinden biri."},{"t":"The Lord of the Rings: The Fellowship of the Ring","y":2001,"d":"Peter Jackson","r":178,"g":["Adventure","Drama","Fantasy"],"c":["Elijah Wood","Ian McKellen"],"s":"Sakin Shire'da yaşayan hobbit Frodo, dünyayı karanlığa gömebilecek Tek Yüzük'ü yok etmek için dokuz kişilik bir kardeşlikle tehlikeli bir yolculuğa çıkar. Tolkien'in dünyasını büyüleyici bir gerçeklikle canlandıran, fantastik sinemanın yeni ölçüsü olan bir destan."},{"t":"The Piano Teacher","y":2001,"d":"Michael Haneke","r":131,"g":["Drama","Music","Romance"],"c":[],"s":"Viyana'da katı disiplinli bir piyano öğretmeni, annesiyle boğucu bir hayat sürerken genç bir öğrencisinin ilgisiyle karanlık arzularıyla yüzleşir. Isabelle Huppert'in sarsıcı performansıyla Haneke'nin soğuk, cesur ve unutulmaz bir psikolojik portresi."},{"t":"The Royal Tenenbaums","y":2001,"d":"Wes Anderson","r":110,"g":["Comedy","Drama"],"c":["Gene Hackman","Gwyneth Paltrow"],"s":"Dağılmış bir dahiler ailesinin çapkın babası, ölümcül hasta olduğunu söyleyerek yıllar sonra evine geri döner ve yetişkin çocuklarıyla barışmaya çalışır. Wes Anderson'ın simetrik kareleri ve hüzünlü mizahıyla hem komik hem şefkatli bir aile portresi."},{"t":"The Son's Room","y":2001,"d":"Nanni Moretti","r":99,"g":["Drama"],"c":[],"s":"İtalya'nın küçük bir liman kasabasında huzurlu bir hayat süren psikanalist Giovanni ve ailesi, beklenmedik bir kayıpla sarsılır. Nanni Moretti'nin yas üzerine yaptığı bu yalın ve derinden dokunaklı film, Cannes'da Altın Palmiye kazandı."},{"t":"What Time Is It There?","y":2001,"d":"Tsai Ming-liang","r":116,"g":["Drama","Romance"],"c":[],"s":"Taipei'de saat satan yalnız bir genç, Paris'e giden bir kadına saatini sattıktan sonra şehirdeki tüm saatleri Paris saatine ayarlamaya başlar. Tsai Ming-liang'ın durağan kareleri ve incelikli mizahıyla yalnızlık ve özlem üzerine büyüleyici bir film."},{"t":"Y Tu Mamá También","y":2001,"d":"Alfonso Cuarón","r":106,"g":["Drama"],"c":[],"s":"İki genç arkadaş, evliliği sarsılan çekici bir kadınla birlikte Meksika'nın içlerinde efsanevi bir plaja doğru yola çıkar. Cuarón'un eğlenceli, erotik ve hüzünlü yol filmi, gençliğin geçiciliğini ve ülkenin gerçeklerini ustalıkla harmanlıyor."},{"t":"Adaptation.","y":2002,"d":"Spike Jonze","r":115,"g":["Comedy","Drama"],"c":["Chris Cooper"],"s":"Senarist Charlie Kaufman, orkideler üzerine bir kitabı uyarlamaya çalışırken yazar tıkanıklığına düşer ve ikiz kardeşi işleri karıştırır. Kendi yapımını anlatan zekice bir oyunla yaratıcılığın sancısını hem komik hem dokunaklı biçimde anlatan özgün bir film."},{"t":"Bowling for Columbine","y":2002,"d":"Michael Moore","r":120,"g":["Crime","Documentary","Drama"],"c":[],"s":"Michael Moore, Columbine lisesi katliamından yola çıkarak Amerika'nın silahlarla ve korkuyla olan ilişkisinin kökenlerini araştırır. Mizah ve öfkeyi harmanlayan bu Oscar ödüllü belgesel, tartışma yaratan cesur ve etkileyici bir sorgulama."},{"t":"Bus 174","y":2002,"d":"José Padilha","r":122,"g":["Crime","Documentary"],"c":[],"s":"2000 yılında Rio de Janeiro'da canlı yayında izlenen bir otobüs rehine krizini ve rehineciyi o güne getiren hayatın izlerini sürer. Sokak çocukluğundan şiddete uzanan yolu anlatan bu belgesel, Brezilya'nın toplumsal yaralarına sarsıcı bir ayna tutuyor."},{"t":"Chicago","y":2002,"d":"Rob Marshall","r":113,"g":["Comedy","Crime","Musical"],"c":["Catherine Zeta-Jones"],"s":"1920'lerin Chicago'sunda sahne yıldızı olmayı hayal eden Roxie Hart, sevgilisini öldürünce cezaevinde ünlü bir dansçı ve kurnaz bir avukatla tanışır. Şöhret ve medya üzerine hicivli, göz alıcı dans numaralarıyla müzikalleri yeniden popüler kılan bir film."},{"t":"City of God","y":2002,"d":"Fernando Meirelles","r":130,"g":["Crime","Drama"],"c":["Alexandre Rodrigues","Leandro Firmino"],"s":"Rio'nun Tanrı Kenti gecekondu mahallesinde büyüyen fotoğraf meraklısı Buscapé, çevresindeki çocukların yıllar içinde çete savaşlarına sürüklenişine tanıklık eder. Baş döndürücü kurgusu ve enerjisiyle modern sinemanın en güçlü filmlerinden biri."},{"t":"Gangs of New York","y":2002,"d":"Martin Scorsese","r":167,"g":["Crime","Drama"],"c":["Leonardo DiCaprio","Cameron Diaz"],"s":"1860'ların New York'unda genç Amsterdam, babasını öldüren acımasız çete lideri Kasap Bill'in çevresine sızarak intikam fırsatı kollar. Daniel Day-Lewis'in muhteşem performansıyla Scorsese'nin Amerika'nın kanlı doğuşunu anlatan görkemli tablosu."},{"t":"Hero","y":2002,"d":"Zhang Yimou","r":94,"g":["Action","Adventure","Drama"],"c":[],"s":"Antik Çin'de isimsiz bir savaşçı, krala suikast düzenlemek isteyen üç efsanevi kiralık katili nasıl yendiğini anlatır ama her anlatımda hikâye değişir. Zhang Yimou'nun renklerle anlatan büyüleyici görselliğiyle dövüş sanatları sinemasının en estetik örneklerinden biri."},{"t":"Irreversible","y":2002,"d":"Gaspar Noé","r":97,"g":["Crime","Drama","Mystery"],"c":[],"s":"Paris'te tek bir gecede yaşanan korkunç bir olay, tersten anlatılan hikâyede iki adamın öfkeli intikam arayışı ve bir çiftin mutlu anlarıyla örülür. Gaspar Noé'nin son derece sert ama zamanın geri alınamazlığı üzerine düşündüren tartışmalı filmi, yalnızca güçlü midelere."},{"t":"Rabbit-Proof Fence","y":2002,"d":"Phillip Noyce","r":94,"g":["Adventure","Biography","Drama"],"c":[],"s":"1931'de ailelerinden koparılıp bir kampa gönderilen üç Aborjin kız, anneleriyle buluşmak için tavşan çitini izleyerek binlerce kilometre yürür. Avustralya'nın çalınmış kuşaklarını anlatan, gerçek bir hikâyeye dayanan dokunaklı ve umut verici bir film."},{"t":"Russian Ark","y":2002,"d":"Aleksandr Sokurov","r":99,"g":["Drama","Fantasy","History"],"c":[],"s":"Görünmez bir anlatıcı, Hermitage Müzesi'nin salonlarında dolaşarak üç yüz yıllık Rus tarihinin hayaletleriyle karşılaşır. Tek bir kesintisiz planla çekilmiş bu görkemli film, sinema tarihinin en cüretkâr teknik ve estetik başarılarından biri."},{"t":"Talk to Her","y":2002,"d":"Pedro Almodóvar","r":112,"g":["Drama","Mystery","Romance"],"c":[],"s":"Komada yatan iki kadına bakan iki adam, bir hastanede tanışır ve beklenmedik bir dostluk kurar. Almodóvar'ın yalnızlık, iletişim ve aşk üzerine yaptığı bu hüzünlü, şaşırtıcı ve dokunaklı filmi, en olgun eserlerinden biri sayılıyor."},{"t":"The Lord of the Rings: The Two Towers","y":2002,"d":"Peter Jackson","r":179,"g":["Adventure","Drama","Fantasy"],"c":["Elijah Wood","Ian McKellen"],"s":"Kardeşlik dağılınca Frodo ile Sam, Gollum'un rehberliğinde Mordor'a ilerlerken dostları da Rohan'ı kuşatan karanlığa karşı savaşa hazırlanır. Miğfer Dibi Savaşı ve Gollum'un hayat bulmasıyla serinin en heyecanlı bölümlerinden biri."},{"t":"The Pianist","y":2002,"d":"Roman Polanski","r":150,"g":["Biography","Drama","Music"],"c":["Adrien Brody","Thomas Kretschmann"],"s":"Varşovalı Yahudi piyanist Władysław Szpilman, Nazi işgali altında ailesini kaybettikten sonra şehrin yıkıntıları arasında hayatta kalmaya çalışır. Adrien Brody'nin unutulmaz performansıyla Polanski'nin yalın, insancıl ve derinden sarsıcı başyapıtı."},{"t":"Uzak (Distant)","y":2002,"d":"Nuri Bilge Ceylan","r":110,"g":["Comedy","Drama"],"c":[],"s":"İstanbul'da yalnız yaşayan fotoğrafçı Mahmut'un evine, taşradan iş aramaya gelen akrabası Yusuf yerleşir ve iki adam arasındaki mesafe giderek büyür. Nuri Bilge Ceylan'ın karlı İstanbul görüntüleri ve sessiz mizahıyla Cannes'da ödüllendirilen incelikli bir başyapıt."},{"t":"Aileen: Life and Death of a Serial Killer","y":2003,"d":"Nick Broomfield","r":93,"g":["Crime","Documentary"],"c":[],"s":"Belgeselci Nick Broomfield, Amerika'da yedi cinayetten idama mahkûm edilen Aileen Wuornos'un son yıllarını ve çalkantılı hayatını izler. Adalet sistemi ve bir insanın kırılmış hayatı üzerine rahatsız edici ama çok güçlü bir belgesel."},{"t":"Elephant","y":2003,"d":"Gus Van Sant","r":81,"g":["Crime","Drama","Thriller"],"c":[],"s":"Portland'daki bir lisede sıradan bir gün, öğrencilerin koridorlarda gezinen hayatları, yaklaşan bir trajedinin gölgesinde izlenir. Gus Van Sant'ın uzun, sakin planlarıyla gerilimi zirveye taşıyan, Altın Palmiye ödüllü ürpertici bir film."},{"t":"Good Bye, Lenin!","y":2003,"d":"Wolfgang Becker","r":121,"g":["Comedy","Drama","Romance"],"c":[],"s":"Doğu Berlin'de komaya giren sadık sosyalist bir anne, Duvar yıkıldıktan sonra uyanır ve oğlu onu korumak için DDR'nin hâlâ var olduğu yanılsamasını yaratır. Tarihi, mizahı ve evlat sevgisini harmanlayan, hem güldüren hem duygulandıran bir film."},{"t":"Kill Bill: Vol. 1","y":2003,"d":"Quentin Tarantino","r":111,"g":["Action","Crime","Thriller"],"c":["Uma Thurman","David Carradine"],"s":"Düğün gününde eski çetesi tarafından ölüme terk edilen Gelin, dört yıllık komadan uyanır ve intikam listesindeki isimleri tek tek bulmaya koyulur. Tarantino'nun samuray filmleri, anime ve spagetti westernlere yaptığı stil dolu, coşkulu bir saygı duruşu."},{"t":"Lost in Translation","y":2003,"d":"Sofia Coppola","r":102,"g":["Comedy","Drama"],"c":["Bill Murray","Scarlett Johansson"],"s":"Tokyo'da bir reklam çekimi için bulunan yorgun bir Amerikan aktör ile yalnız bir genç kadın, otel barında tanışır ve beklenmedik bir yakınlık kurar. Sofia Coppola'nın ışıltılı şehir görüntüleri ve incelikli duygularıyla yalnızlığa yazılmış zarif bir şiir."},{"t":"Oldboy","y":2003,"d":"Park Chan-wook","r":120,"g":["Action","Drama","Mystery"],"c":["Choi Min-sik","Yoo Ji-tae"],"s":"Nedenini bilmediği biçimde on beş yıl bir odaya kapatılan Oh Dae-su, bir gün aniden serbest bırakılır ve kendisini hapsedeni bulmak için beş gün süresi vardır. Park Chan-wook'un koridor dövüşüyle efsaneleşen, çarpıcı ve unutulmaz intikam gerilimi."},{"t":"Osama","y":2003,"d":"Siddiq Barmak","r":83,"g":["Drama"],"c":[],"s":"Taliban yönetimindeki Afganistan'da kadınların çalışması yasaklanınca, genç bir kız ailesini geçindirmek için saçını kesip erkek kılığına girer. Taliban sonrası çekilen ilk Afgan filmi olan bu yalın ve cesur eser, yürek burkan bir tanıklık sunuyor."},{"t":"The Barbarian Invasions","y":2003,"d":"Denys Arcand","r":99,"g":["Comedy","Crime","Drama"],"c":[],"s":"Montreal'de ağır hasta olan eski bir tarih profesörü, uzun zamandır görüşmediği oğlu ve eski dostlarıyla son günlerinde yeniden bir araya gelir. Zekâ dolu diyalogları ve sıcaklığıyla dostluk, hayat ve veda üzerine Oscar ödüllü bir film."},{"t":"The Best of Youth","y":2003,"d":"Marco Tullio Giordana","r":374,"g":["Drama","Romance"],"c":[],"s":"İki İtalyan kardeşin 1960'lardan 2000'lere uzanan hayatları, ülkenin çalkantılı tarihiyle iç içe akar. Altı saati aşan bu destansı aile hikâyesi, karakterleriyle yıllarca yaşamış gibi hissettiren, sıcak ve etkileyici bir sinema romanı."},{"t":"The Lord of the Rings: The Return of the King","y":2003,"d":"Peter Jackson","r":201,"g":["Adventure","Drama","Fantasy"],"c":["Elijah Wood","Viggo Mortensen"],"s":"Orta Dünya'nın kaderi belirlenirken Frodo ile Sam Hüküm Dağı'na yaklaşır, Aragorn ise halkların son savaşı için ordusunu toplar. On bir Oscar'la taçlanan bu görkemli final, sinema tarihinin en büyük destanlarından birini yakışır biçimde tamamlıyor."},{"t":"3-Iron","y":2004,"d":"Kim Ki-duk","r":88,"g":["Crime","Drama","Romance"],"c":[],"s":"Sahiplerinin tatilde olduğu evlere gizlice girip orada birkaç gün yaşayan sessiz bir genç, şiddet gören bir kadınla karşılaşır ve ikisi arasında sözsüz bir bağ kurulur. Kim Ki-duk'un neredeyse diyalogsuz, masalsı ve zarif bir aşk hikâyesi."},{"t":"A Very Long Engagement","y":2004,"d":"Jean-Pierre Jeunet","r":133,"g":["Drama","Mystery","Romance"],"c":[],"s":"Birinci Dünya Savaşı'nda nişanlısının öldüğü söylenen genç Mathilde, onun hâlâ yaşadığına inanır ve gerçeği bulmak için inatçı bir araştırmaya girişir. Jeunet'nin altın tonlu görüntüleriyle romantizm, gizem ve savaşı bir araya getiren güzel bir film."},{"t":"Collateral","y":2004,"d":"Michael Mann","r":120,"g":["Action","Crime","Drama"],"c":["Tom Cruise","Jamie Foxx"],"s":"Los Angeles'ta sakin bir taksi şoförü, bir gece boyunca şehirde birkaç durak yapmak isteyen soğukkanlı bir müşterinin aslında kiralık katil olduğunu anlar. Michael Mann'in dijital gece görüntüleri ve Tom Cruise'un farklı rolüyle şık, gergin bir gerilim."},{"t":"Downfall","y":2004,"d":"Oliver Hirschbiegel","r":156,"g":["Biography","Drama","History"],"c":["Bruno Ganz","Alexandra Maria Lara"],"s":"1945 Nisan'ında Berlin kuşatılırken, Hitler ve yakın çevresinin sığınaktaki son günleri genç sekreteri Traudl Junge'nin gözünden anlatılır. Bruno Ganz'ın çarpıcı performansıyla Nazi rejiminin çöküşünü sarsıcı bir gerçekçilikle gösteren bir film."},{"t":"Fahrenheit 9/11","y":2004,"d":"Michael Moore","r":122,"g":["Documentary","Drama","War"],"c":[],"s":"Michael Moore, 11 Eylül saldırılarından sonra Bush yönetiminin politikalarını ve Irak Savaşı'na giden yolu sorgular. Altın Palmiye kazanan ve tarihin en çok izlenen belgesellerinden olan bu film, tartışmalı ama son derece etkileyici bir siyasi hiciv."},{"t":"Head-On","y":2004,"d":"Fatih Akin","r":121,"g":["Drama","Romance"],"c":[],"s":"Hamburg'da yaşayan kendini bırakmış Cahit, tutucu ailesinden kaçmak isteyen genç Sibel'le göstermelik bir evlilik yapar ve bu anlaşma beklenmedik bir tutkuya dönüşür. Fatih Akın'ın Almanya'dan İstanbul'a uzanan, enerjik ve yürek yakan Altın Ayı ödüllü başyapıtı."},{"t":"Million Dollar Baby","y":2004,"d":"Clint Eastwood","r":132,"g":["Drama","Sport"],"c":["Hilary Swank","Clint Eastwood","Morgan Freeman"],"s":"Kendini kanıtlamaya kararlı otuzlu yaşlarındaki Maggie, yaşlı ve huysuz bir boks antrenörünü onu çalıştırmaya ikna eder. Clint Eastwood'un sade ve güçlü anlatımıyla boks filminden çok daha fazlası olan, dört Oscar'lı derinden dokunaklı bir dram."},{"t":"Moolaadé","y":2004,"d":"Ousmane Sembène","r":124,"g":["Drama"],"c":[],"s":"Burkina Faso'daki bir köyde bir kadın, sünnetten kaçan kız çocuklarına geleneksel koruma hakkı olan moolaadé'yi tanıyarak köyün düzenine meydan okur. Ousmane Sembène'in renkli, sıcak ve cesur son filmi, direnişi umutla anlatan önemli bir Afrika eseri."},{"t":"Sideways","y":2004,"d":"Alexander Payne","r":127,"g":["Comedy","Drama","Romance"],"c":[],"s":"Boşanmanın acısını atlatamamış şarap tutkunu Miles, evlenmek üzere olan çapkın arkadaşıyla California'nın bağ bölgesinde bir haftalık yolculuğa çıkar. Alexander Payne'in hüzünlü mizahı ve incelikli karakterleriyle orta yaş, dostluk ve şarap üzerine keyifli bir film."},{"t":"The Aviator","y":2004,"d":"Martin Scorsese","r":170,"g":["Biography","Drama"],"c":["Leonardo DiCaprio","Cate Blanchett"],"s":"Milyarder Howard Hughes'un, havacılık tutkusu ve Hollywood yapımcılığıyla şekillenen parlak ama giderek karanlığa dönen hayatı anlatılır. Scorsese'nin görkemli yönetimi ve Leonardo DiCaprio'nun güçlü oyunuyla eski Hollywood'un ışıltısını yakalayan bir biyografi."},{"t":"The Consequences of Love","y":2004,"d":"Paolo Sorrentino","r":100,"g":["Crime","Drama","Romance"],"c":[],"s":"İsviçre'de bir otelde yıllardır sessizce yaşayan gizemli bir adam, esrarengiz bir düzen içinde günlerini geçirirken genç bir garsona ilgi duymaya başlar. Paolo Sorrentino'nun şık, stilize görüntüleri ve Toni Servillo'nun büyüleyici oyunuyla zarif bir gerilim."},{"t":"The Passion of the Christ","y":2004,"d":"Mel Gibson","r":127,"g":["Drama"],"c":["Jim Caviezel","Monica Bellucci"],"s":"İsa'nın hayatının son on iki saati, Getsemani bahçesindeki tutuklanmasından çarmıha gerilişine kadar Aramice ve Latince diyaloglarla anlatılır. Son derece sert şiddet sahneleriyle tartışma yaratan, ama güçlü görselliğiyle iz bırakan bir film."},{"t":"Brokeback Mountain","y":2005,"d":"Ang Lee","r":134,"g":["Drama","Romance"],"c":["Jake Gyllenhaal","Heath Ledger"],"s":"1963 yazında Wyoming dağlarında koyun güden iki kovboy, yirmi yıl boyunca sürecek gizli ve tutkulu bir aşk yaşar. Ang Lee'nin sessiz manzaraları ve Heath Ledger'ın unutulmaz performansıyla, bastırılmış duygular üzerine yürek sızlatan bir aşk hikâyesi."},{"t":"Caché (Hidden)","y":2005,"d":"Michael Haneke","r":84,"g":["Horror","Sci-Fi","Thriller"],"c":[],"s":"Parisli rahat bir çiftin kapısına, evlerini gizlice gözetleyen uzun video kasetleri ve tedirgin edici çizimler bırakılmaya başlanır. Michael Haneke'nin suçluluk ve bastırılmış geçmiş üzerine kurduğu bu soğuk, zekice gerilim, bitince bile düşündürmeye devam ediyor."},{"t":"Crash","y":2005,"d":"Paul Haggis","r":112,"g":["Crime","Drama","Thriller"],"c":["Don Cheadle","Sandra Bullock"],"s":"Los Angeles'ta iki gün içinde farklı ırk ve sınıflardan insanların hayatları, önyargı ve öfke dolu karşılaşmalarla birbirine çarpar. İç içe geçen hikâyeleriyle ırkçılık üzerine tartışma başlatan, en iyi film Oscar'ını kazanmış duygusal bir dram."},{"t":"Live and Become","y":2005,"d":"Radu Mihăileanu","r":140,"g":["Drama"],"c":[],"s":"1984'te Etiyopyalı Yahudilerin İsrail'e taşındığı gizli operasyonda, Hristiyan bir anne oğlunu kurtarmak için onu Yahudi kimliğiyle yola çıkarır. Kimlik, aidiyet ve annelik üzerine yazılmış bu geniş soluklu film, derin bir sıcaklıkla anlatılıyor."},{"t":"Paradise Now","y":2005,"d":"Hany Abu-Assad","r":91,"g":["Crime","Drama","Thriller"],"c":[],"s":"Nablus'ta çocukluk arkadaşı iki Filistinli genç, Tel Aviv'de bir eylem için seçildiklerinde son iki günlerini şüphe ve kararsızlık içinde geçirir. Hany Abu-Assad'ın insan yüzünü ön plana çıkaran bu gerilimli ve düşündürücü filmi, zor bir konuya cesurca yaklaşıyor."},{"t":"The Constant Gardener","y":2005,"d":"Fernando Meirelles","r":129,"g":["Drama","Mystery","Romance"],"c":["Rachel Weisz"],"s":"Kenya'da görev yapan sakin bir İngiliz diplomat, eşinin şüpheli ölümünün ardından onun ilaç şirketleri hakkında yürüttüğü araştırmanın izini sürer. John le Carré uyarlaması bu gerilim, Meirelles'in canlı görüntüleriyle hem aşk hem vicdan hikâyesi."},{"t":"Tsotsi","y":2005,"d":"Gavin Hood","r":94,"g":["Crime","Drama"],"c":[],"s":"Johannesburg'un kenar mahallelerinde yaşayan genç bir çete lideri, çaldığı bir arabanın arka koltuğunda bir bebek bulur ve hayatı değişmeye başlar. Oscar ödüllü bu Güney Afrika filmi, şiddetin ortasında insanlığın uyanışını dokunaklı biçimde anlatıyor."},{"t":"Apocalypto","y":2006,"d":"Mel Gibson","r":139,"g":["Action","Adventure","Drama"],"c":["Gerardo Taracena","Raoul Max Trujillo"],"s":"Maya uygarlığının çöküş döneminde köyü basılan genç avcı Pençe Jaguar, tutsak düştüğü büyük şehirden kaçıp ailesine dönmek için ormanda nefes kesen bir kaçışa başlar. Mel Gibson'ın yerli dilde çektiği, soluksuz ve görsel olarak çarpıcı bir macera."},{"t":"Borat: Cultural Learnings of America for Make Benefit Glorious Nation of Kazakhstan","y":2006,"d":"Larry Charles","r":84,"g":["Comedy"],"c":["Sacha Baron Cohen","Ken Davitian"],"s":"Kazakistanlı saf gazeteci Borat, Amerika'yı keşfetmek için belgesel çekmeye gelir ve gerçek insanlarla yaşadığı karşılaşmalarda ülkenin önyargılarını ortaya döker. Sacha Baron Cohen'in cüretkâr, utandırıcı ve kahkahalarla güldüren sınır tanımaz hicvi."},{"t":"Children of Men","y":2006,"d":"Alfonso Cuarón","r":109,"g":["Drama","Sci-Fi","Thriller"],"c":["Julianne Moore","Clive Owen"],"s":"İnsanlığın yıllardır hiç bebek doğurmadığı 2027 İngiltere'sinde, bıkkın bir memur mucizevi biçimde hamile kalan genç bir kadını korumayı üstlenir. Cuarón'un nefes kesen tek planlık sahneleriyle distopya sinemasının en etkileyici örneklerinden biri."},{"t":"Little Miss Sunshine","y":2006,"d":"Jonathan Dayton","r":101,"g":["Comedy","Drama"],"c":["Steve Carell","Toni Collette","Alan Arkin"],"s":"Birbirinden tuhaf bir ailenin üyeleri, küçük Olive'i bir çocuk güzellik yarışmasına yetiştirmek için eski bir minibüsle Kaliforniya'ya doğru yola çıkar. Kaybetmenin güzelliğini kutlayan, sıcacık ve bol kahkahalı bir bağımsız yol komedisi."},{"t":"Pan's Labyrinth","y":2006,"d":"Guillermo del Toro","r":118,"g":["Drama","Fantasy","War"],"c":["Ivana Baquero","Ariadna Gil"],"s":"1944 İspanya'sında zalim bir yüzbaşıyla evlenen annesiyle ormanda bir kampa taşınan küçük Ofelia, bir labirentte gizemli bir faunla karşılaşır. Guillermo del Toro'nun karanlık masalı ile savaşın gerçekliğini birleştiren büyüleyici ve unutulmaz başyapıtı."},{"t":"The Departed","y":2006,"d":"Martin Scorsese","r":151,"g":["Crime","Drama","Thriller"],"c":["Leonardo DiCaprio","Matt Damon"],"s":"Boston'da polis içine sızmış bir mafya köstebeği ile mafyaya sızmış bir gizli polis, birbirlerinin kimliğini ortaya çıkarmak için ölümcül bir yarışa girer. Scorsese'ye nihayet Oscar'ı getiren, yıldız kadrosu ve gerilimiyle soluk kesen bir suç filmi."},{"t":"The Host","y":2006,"d":"Bong Joon-ho","r":120,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Seul'deki Han Nehri'nden çıkan dev bir yaratık küçük Hyun-seo'yu kaçırınca, beceriksiz ama sevgi dolu ailesi onu kurtarmak için harekete geçer. Bong Joon-ho'nun canavar filmini aile draması ve siyasi hicivle harmanlayan, eğlenceli ve dokunaklı bir yapım."},{"t":"The Last King of Scotland","y":2006,"d":"Kevin Macdonald","r":123,"g":["Biography","Drama","History"],"c":["Forest Whitaker"],"s":"Uganda'ya macera arayışıyla gelen genç İskoç doktor, Idi Amin'in kişisel doktoru olur ve diktatörün cazibesiyle korkunç yüzü arasında kalır. Forest Whitaker'ın Oscar'lı, büyüleyici ve ürkütücü performansıyla gerilimli bir siyasi dram."},{"t":"The Lives of Others","y":2006,"d":"Florian Henckel von Donnersmarck","r":137,"g":["Drama","Mystery","Thriller"],"c":["Ulrich Mühe","Martina Gedeck"],"s":"1984 Doğu Berlin'inde titiz bir Stasi ajanı, bir yazar ile oyuncu sevgilisini dinlemekle görevlendirilir ve dinledikleri onu yavaş yavaş değiştirir. Gözetim, sanat ve vicdan üzerine incelikli, derinden etkileyici ve Oscar ödüllü bir film."},{"t":"The Prestige","y":2006,"d":"Christopher Nolan","r":130,"g":["Drama","Mystery","Sci-Fi"],"c":["Christian Bale","Hugh Jackman"],"s":"Viktorya dönemi Londra'sında iki rakip sihirbaz, en büyük illüzyonu gerçekleştirmek için takıntılı ve tehlikeli bir rekabete girişir. Christopher Nolan'ın kendisi de bir sihir numarası gibi kurulan, zekice ve sürükleyici bir gizem filmi."},{"t":"The Queen","y":2006,"d":"Stephen Frears","r":103,"g":["Biography","Drama"],"c":["Helen Mirren"],"s":"Prenses Diana'nın 1997'deki ölümünden sonra Kraliçe II. Elizabeth, halkın yas beklentisi ile saray geleneği arasında sıkışır. Helen Mirren'ın ustalıklı performansıyla monarşi ve modern medya üzerine zarif, zekice ve insancıl bir dram."},{"t":"United 93","y":2006,"d":"Paul Greengrass","r":111,"g":["Action","Drama","History"],"c":[],"s":"11 Eylül 2001 sabahı kaçırılan United 93 uçağındaki yolcuların ve yerdeki hava trafik kontrolörlerinin o saatleri neredeyse gerçek zamanlı anlatılır. Paul Greengrass'ın belgesel gibi gerçekçi üslubuyla saygılı, sarsıcı ve unutulmaz bir film."},{"t":"Volver","y":2006,"d":"Pedro Almodóvar","r":121,"g":["Comedy","Drama"],"c":[],"s":"Madrid'de yaşayan azimli Raimunda, bir aile trajedisiyle uğraşırken ölmüş olan annesinin hayaleti köyde görülmeye başlar. Almodóvar'ın renkli, sıcak ve esprili filmi, Penélope Cruz'un ışıltılı performansıyla kadın dayanışmasına bir güzelleme."},{"t":"Atonement","y":2007,"d":"Joe Wright","r":123,"g":["Drama","Mystery","Romance"],"c":["Keira Knightley","James McAvoy"],"s":"1935 İngiltere'sinde hayal gücü geniş on üç yaşındaki Briony, ablası ile hizmetçinin oğlu arasında gördüklerini yanlış yorumlar ve üç hayatı değiştirecek bir suçlama yapar. Dunkirk sahnesindeki uzun planıyla ünlü, zarif ve hüzünlü bir aşk ve pişmanlık hikâyesi."},{"t":"Into the Wild","y":2007,"d":"Sean Penn","r":148,"g":["Adventure","Biography","Drama"],"c":["Emile Hirsch","Vince Vaughn"],"s":"Parlak bir üniversite mezunu Christopher McCandless, bütün varlığını geride bırakıp Alaska'nın vahşi doğasına doğru yalnız bir yolculuğa çıkar. Sean Penn'in gerçek bir hikâyeden uyarladığı, özgürlük ve doğa üzerine Eddie Vedder şarkılarıyla süslü dokunaklı bir film."},{"t":"La Vie En Rose","y":2007,"d":"Olivier Dahan","r":140,"g":["Biography","Drama","Music"],"c":["Marion Cotillard"],"s":"Paris sokaklarında yoksulluk içinde büyüyen Édith Piaf'ın, dünyanın en ünlü şarkıcılarından biri olana dek fırtınalı hayatı anlatılır. Marion Cotillard'ın Oscar kazandıran büyüleyici dönüşümüyle, Piaf'ın şarkıları kadar tutkulu bir biyografi."},{"t":"No Country for Old Men","y":2007,"d":"Joel Coen","r":122,"g":["Crime","Drama","Thriller"],"c":["Tommy Lee Jones","Javier Bardem"],"s":"Teksas çölünde bir uyuşturucu anlaşmasından kalan parayı bulan bir avcı, peşine acımasız bir tetikçi takılınca kaçmaya başlar, yaşlı bir şerif de ikisinin izini sürer. Coen Kardeşler'in gerilim ustalığı ve Javier Bardem'in unutulmaz kötüsüyle modern bir klasik."},{"t":"Once","y":2007,"d":"John Carney","r":86,"g":["Drama","Music","Musical"],"c":[],"s":"Dublin sokaklarında şarkı söyleyen bir müzisyen ile Çek bir göçmen kadın, müzik aracılığıyla birbirine yaklaşır ve birlikte bir albüm kaydetmeye karar verir. Küçük bütçesiyle büyük bir kalbi olan, Oscar'lı şarkılarıyla sıcacık bir müzikal aşk hikâyesi."},{"t":"Paranormal Activity","y":2007,"d":"Oren Peli","r":86,"g":["Horror","Mystery"],"c":["Katie Featherston","Micah Sloat"],"s":"Genç bir çift, evlerinde geceleri yaşanan açıklanamayan olayları anlamak için yatak odalarına bir kamera kurar. Neredeyse sıfır bütçeyle çekilen ve sessizliği korkuya çeviren bu bulunmuş görüntü filmi, gişe tarihinin en
