lardan biri."},{"t":"Marnie","y":1964,"d":"Alfred Hitchcock","r":130,"g":["Crime","Drama","Mystery"],"c":[],"s":"Güzel ve soğuk bir kadın, çalıştığı yerlerden para çalıp kimlik değiştirirken, onu yakalayan zengin bir işveren sırlarını çözmeye kararlıdır. Hitchcock'un en karmaşık ve tartışmalı filmlerinden biri, travma ve kontrol üzerine renkli, rahatsız edici bir psikolojik dram."},{"t":"Mary Poppins","y":1964,"d":"Robert Stevenson","r":139,"g":["Comedy","Family","Fantasy"],"c":["Julie Andrews"],"s":"Londra'da katı bir bankacının ailesine gelen sihirli dadı Mary Poppins, çocukların ve babalarının hayatına neşe ve renk katar. Julie Andrews'un sıcaklığı, akılda kalan şarkıları ve canlı animasyon sahneleriyle, her yaştan izleyiciyi mutlu eden bir aile klasiği."},{"t":"My Fair Lady","y":1964,"d":"George Cukor","r":170,"g":["Drama","Musical","Romance"],"c":["Rex Harrison"],"s":"Kibirli bir dil bilimci, sokakta çiçek satan Eliza'yı bir iddia uğruna kusursuz bir aristokrat hanımefendiye dönüştürmeye girişir. Audrey Hepburn'ün zarafeti ve Cecil Beaton'ın kostümleriyle, Shaw'un Pygmalion'undan uyarlanan bu müzikal gösterişli ve esprili bir şölen."},{"t":"Onibaba","y":1964,"d":"Kaneto Shindō","r":103,"g":["Drama","Horror","Thriller"],"c":[],"s":"Savaş yıllarında sazlıklarda yaşayan bir kadın ile gelini, yaralı samurayları öldürüp eşyalarını satarak hayatta kalır, ta ki bir adam aralarına girene kadar. Kaneto Shindō'nun siyah beyaz, erotik ve ürkütücü bu masalı, Japon korku sinemasının en çarpıcı eserlerinden."},{"t":"Red Desert","y":1964,"d":"Michelangelo Antonioni","r":117,"g":["Drama"],"c":[],"s":"Endüstriyel bir İtalyan kentinde yaşayan, ruhsal olarak sarsılmış bir kadın, çevresindeki dünyaya ve insanlara tutunmakta zorlanır. Antonioni'nin ilk renkli filmi, fabrika dumanları ve boyanmış mekânlarla modern yaşamın kaygısını resim gibi karelere döker."},{"t":"Scorpio Rising","y":1964,"d":"Kenneth Anger","r":null,"g":["Music"],"c":[],"s":"Bir grup motorcunun bakım, giyinme ve toplanma ritüellerini dönemin pop şarkılarıyla ironik biçimde birleştiren kısa bir film. Kenneth Anger'ın bu kışkırtıcı eseri, pop müzik kullanımıyla sonraki pek çok yönetmene ve müzik videolarına ilham vermiştir."},{"t":"The Gospel According to Matthew","y":1964,"d":"Pier Paolo Pasolini","r":258,"g":["Adventure","Biography","Drama"],"c":[],"s":"İsa'nın hayatı, Matta İncili'ne sadık kalınarak, amatör oyuncular ve güney İtalya'nın taşlık manzaralarıyla anlatılır. Marksist ve ateist Pasolini'nin çektiği bu sade ve güçlü film, sinemadaki en inandırıcı dini anlatılardan biri kabul edilir."},{"t":"The Masque of the Red Death","y":1964,"d":"Roger Corman","r":89,"g":["Drama","Horror"],"c":[],"s":"Veba köyleri kırıp geçirirken, zalim Prens Prospero soylu konuklarıyla şatosuna kapanır ve şeytani eğlenceler düzenler. Roger Corman'ın Poe uyarlamalarının en şık halkası, Vincent Price'ın ürpertici performansı ve canlı renkleriyle gotik bir şölen."},{"t":"The Umbrellas of Cherbourg","y":1964,"d":"Jacques Demy","r":91,"g":["Drama","Musical","Romance"],"c":[],"s":"Şemsiye dükkânında çalışan genç Geneviève ile tamirci Guy'ın aşkı, askerlik ve beklenmedik bir haberle sınanır. Tüm diyalogların şarkıyla söylendiği bu rengârenk Jacques Demy müzikali, Catherine Deneuve ve Michel Legrand'ın müziğiyle yürek burkan bir klasik."},{"t":"Woman in the Dunes","y":1964,"d":"Hiroshi Teshigahara","r":147,"g":["Drama","Thriller"],"c":[],"s":"Böcek toplamak için kumullara gelen bir öğretmen, bir kum çukurunun dibindeki evde yalnız yaşayan bir kadının yanında mahsur kalır. Teshigahara'nın hipnotik görüntüleriyle, özgürlük ve varoluş üzerine hem gizemli hem duyusal, unutulmaz bir alegori."},{"t":"Alphaville","y":1965,"d":"Jean-Luc Godard","r":99,"g":["Comedy","Drama","Mystery"],"c":[],"s":"Gizli ajan Lemmy Caution, duyguların ve şiirin yasaklandığı, bir bilgisayarın yönettiği fütüristik bir kente gelir. Godard, 1960'ların Paris'ini hiç dekor kullanmadan bir distopyaya dönüştürür, sonuç kara film ile bilimkurguyu harmanlayan tuhaf ve büyüleyici bir yapım."},{"t":"Chimes at Midnight","y":1965,"d":"Orson Welles","r":115,"g":["Comedy","Drama","History"],"c":[],"s":"Şişman, şakacı ve yaşlı şövalye Falstaff, genç Prens Hal'in eğlence dostudur, ama taht yaklaştıkça dostlukları sınanır. Orson Welles'in Shakespeare'in birkaç oyununu birleştirdiği bu film, hem hüzünlü hem neşeli, muhteşem bir savaş sahnesiyle öne çıkan gizli bir başyapıttır."},{"t":"Doctor Zhivago","y":1965,"d":"David Lean","r":197,"g":["Drama","Romance","War"],"c":[],"s":"Şair ve doktor Yuri Jivago, Rus Devrimi ve iç savaşın kargaşası boyunca evliliği ile büyük aşkı Lara arasında savrulur. David Lean'in karlı manzaraları ve Maurice Jarre'ın unutulmaz müziğiyle, romantik epik sinemanın en görkemli örneklerinden biri."},{"t":"Faster, Pussycat! Kill! Kill!","y":1965,"d":"Russ Meyer","r":83,"g":["Action","Comedy"],"c":[],"s":"Üç asi go-go dansçısı, çölde hızlı arabalarla yarışırken bir çifte saldırır ve yaşlı bir adamın çiftliğinde saklı bir servetin peşine düşer. Russ Meyer'ın bu çılgın, esprili ve cüretkâr filmi, sömürü sinemasının ötesine geçmiş, gerçek bir kült klasiğidir."},{"t":"Juliet of the Spirits","y":1965,"d":"Federico Fellini","r":137,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"Kocasının kendisini aldattığından şüphelenen orta yaşlı bir kadın, ruhlar, anılar ve rengârenk fantezilerle dolu bir iç yolculuğa çıkar. Fellini'nin ilk uzun renkli filmi, Giulietta Masina'nın incelikli performansıyla görsel bir şölen."},{"t":"Pierrot Le Fou","y":1965,"d":"Jean-Luc Godard","r":110,"g":["Crime","Drama","Romance"],"c":[],"s":"Burjuva hayatından bunalan Ferdinand, eski sevgilisi Marianne ile Paris'ten kaçar ve Fransa'nın güneyine doğru suçla dolu bir yolculuğa çıkar. Godard'ın renk, şiir ve pop kültürüyle dolu bu filmi, Belmondo ve Karina ile Yeni Dalga'nın en coşkulu eserlerinden."},{"t":"Repulsion","y":1965,"d":"Roman Polanski","r":105,"g":["Drama","Horror","Thriller"],"c":[],"s":"Londra'da ablasıyla yaşayan içine kapanık genç Carol, yalnız kaldığında ev ve zihni aynı anda yavaş yavaş çözülmeye başlar. Polanski'nin Catherine Deneuve'lü bu psikolojik gerilimi, çatlayan duvarları ve boğucu atmosferiyle hâlâ çok etkileyici."},{"t":"Shadows of Forgotten Ancestors","y":1965,"d":"Sergei Parajanov","r":97,"g":["Drama","Romance"],"c":[],"s":"Karpat dağlarında yaşayan bir Hutsul genci, düşman bir ailenin kızına âşık olur ve bu aşk hayatının bütün seyrini belirler. Parajanov'un halk kültürü, renkler ve baş döndürücü kamera hareketleriyle dolu bu filmi, sinemanın en şiirsel masallarından biridir."},{"t":"Subarnarekha","y":1965,"d":"Ritwik Kumar Ghatak","r":143,"g":["Drama"],"c":[],"s":"Doğu Bengal'den gelen mültecilerle yaşayan dürüst Ishwar, iyi bir iş teklifi alınca kız kardeşi ve evlat edindiği bir çocukla yeni bir hayat kurmaya çalışır. Ritwik Ghatak'ın bölünmenin yarattığı yersizliği anlatan bu filmi, melodram ile derin bir hüznü güçlü biçimde birleştirir."},{"t":"The Saragossa Manuscript","y":1965,"d":"Wojciech Jerzy Has","r":182,"g":["Adventure","Drama","Fantasy"],"c":[],"s":"Napolyon savaşları sırasında bir subay, eski bir kitapta dedesinin iç içe geçmiş, tuhaf ve büyülü maceralarını okumaya başlar. Wojciech Has'ın hikâye içinde hikâye anlatan bu Polonya filmi, labirent gibi yapısıyla sayısız sinemacının hayranlık duyduğu bir kült eser."},{"t":"The Shop on Main Street","y":1965,"d":"Elmar Klos","r":128,"g":["Drama","War"],"c":[],"s":"İkinci Dünya Savaşı sırasında Slovakya'da sıradan bir marangoz, yaşlı ve sağır bir Yahudi kadının düğme dükkânına 'Aryan yönetici' olarak atanır. Sıcak bir komedi gibi başlayıp derin bir vicdan hikâyesine dönüşen bu film, Oscar kazanmış unutulmaz bir Çekoslovak klasiğidir."},{"t":"The Sound of Music","y":1965,"d":"Robert Wise","r":174,"g":["Biography","Drama","Family"],"c":["Julie Andrews","Christopher Plummer"],"s":"Avusturya'da manastırdan gelen neşeli Maria, katı bir yüzbaşının yedi çocuğuna mürebbiye olur ve evi müzikle doldurur. Julie Andrews'un sesi ve Alp manzaralarıyla bu müzikal, nesiller boyu sevilen, sıcacık bir aile klasiği."},{"t":"The War Game","y":1965,"d":"Peter Watkins","r":45,"g":["Drama","War"],"c":[],"s":"İngiltere'ye nükleer saldırı düzenlendiğini varsayan bu yapım, felaketin öncesini ve sonrasını belgesel üslubuyla canlandırır. Peter Watkins'in yıllarca televizyonda yayınlanmayan sarsıcı filmi, nükleer savaşın gerçekliğini gösteren en etkili yapımlardan biri olarak Oscar da kazanmıştır."},{"t":"Tokyo Olympiad","y":1965,"d":"Kon Ichikawa","r":170,"g":["Documentary","Sport"],"c":[],"s":"1964 Tokyo Olimpiyatları'nı yalnızca madalyalar üzerinden değil, sporcuların yüzleri, emekleri ve seyircilerin heyecanı üzerinden anlatan bir belgesel. Kon Ichikawa'nın şiirsel bakışı, spor belgeselini bir sanat eserine dönüştürür."},{"t":"Vinyl","y":1965,"d":"Andy Warhol","r":70,"g":["Sci-Fi"],"c":[],"s":"Asi bir genç, şiddet dolu davranışları nedeniyle yakalanıp tuhaf bir 'ıslah' sürecinden geçirilir. Andy Warhol'un Otomatik Portakal'ı tek bir mekânda, doğaçlama ve kışkırtıcı biçimde yorumladığı bu deneysel film, Factory döneminin ilginç bir belgesidir."},{"t":"Andrei Rublev","y":1966,"d":"Andrei Tarkovsky","r":205,"g":["Biography","Drama","History"],"c":[],"s":"Ünlü ikona ressamı Andrey Rublev'in, Tatar akınları ve iç savaşlarla sarsılan 15. yüzyıl Rusya'sında geçen hayatı, bölümler halinde anlatılır. Tarkovski'nin sanat, inanç ve şiddet üzerine kurduğu bu destansı eser, sinema tarihinin en büyük filmleri arasında sayılır."},{"t":"Au Hasard Balthazar","y":1966,"d":"Robert Bresson","r":95,"g":["Drama"],"c":[],"s":"Balthazar adlı bir eşek, bir köy kızının yanında başlayan hayatı boyunca farklı sahiplerin elinden geçer ve insanlığın hem iyiliğine hem zalimliğine tanık olur. Bresson'un sade ve derin üslubuyla, izleyeni sessizce sarsan en dokunaklı filmlerden biri."},{"t":"Blow-Up","y":1966,"d":"Michelangelo Antonioni","r":111,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Swinging London'ın moda fotoğrafçısı, bir parkta çektiği fotoğrafları büyüttükçe bir cinayete tanık olmuş olabileceğini düşünür. Antonioni'nin gerçeklik ve algı üzerine kurduğu bu şık gizem filmi, 1960'ların ruhunu en iyi yakalayan eserlerden."},{"t":"Closely Watched Trains","y":1966,"d":"Jiří Menzel","r":92,"g":["Comedy","Drama","Romance"],"c":[],"s":"İkinci Dünya Savaşı sırasında küçük bir Çek tren istasyonunda çalışan genç Miloš, yetişkinliğe ve aşka adım atmaya çalışır. Jiří Menzel'in hem esprili hem hüzünlü bu filmi, Çekoslovak Yeni Dalgası'nın en sevimli ve Oscar ödüllü eserlerinden biri."},{"t":"Come Drink With Me","y":1966,"d":"King Hu","r":95,"g":["Action","Crime"],"c":[],"s":"Kaçırılan kardeşini kurtarmak için yola çıkan ustalık sahibi kadın savaşçı Altın Kırlangıç, bir haydut çetesiyle karşı karşıya gelir. King Hu'nun zarif dövüş koreografisi ve güçlü kadın kahramanıyla, modern wuxia sinemasının temelini atan bir klasik."},{"t":"Daisies","y":1966,"d":"Věra Chytilová","r":75,"g":["Comedy"],"c":[],"s":"Dünyanın bozulduğuna karar veren iki genç kız, kendileri de 'bozulmaya' ve toplumsal kuralları çılgınca şakalarla yıkmaya başlar. Věra Chytilová'nın renk, kolaj ve anarşik enerjiyle dolu bu filmi, Çek Yeni Dalgası'nın en cesur ve eğlenceli eserlerinden."},{"t":"Hold Me While I'm Naked","y":1966,"d":"George Kuchar","r":null,"g":["Comedy"],"c":[],"s":"Bağımsız bir yönetmen, sanatsal iddialı bir film çekmeye çalışırken her adımda aksilikler ve yalnızlıkla boğuşur. George Kuchar'ın düşük bütçeli, kendiyle dalga geçen bu kısa filmi, yeraltı sinemasının en komik ve en samimi örneklerinden."},{"t":"Masculin Féminin","y":1966,"d":"Jean-Luc Godard","r":103,"g":["Drama","Romance"],"c":[],"s":"Genç bir idealist, yükselen bir pop şarkıcısına âşık olur ve Paris'in kafelerinde siyaset, aşk ve tüketim toplumu üzerine tartışmalara dalar. Godard'ın 'Marx ve Coca-Cola'nın çocukları' dediği kuşağa tuttuğu bu ayna, hem esprili hem melankolik."},{"t":"Persona","y":1966,"d":"Ingmar Bergman","r":83,"g":["Drama","Thriller"],"c":[],"s":"Konuşmayı birden bırakan ünlü bir oyuncu, onunla ilgilenen genç bir hemşireyle birlikte bir yazlığa gönderilir ve iki kadının kimlikleri birbirine karışmaya başlar. Bergman'ın en gizemli ve en cesur filmi, modern sinemanın yapısını sorgulayan bir başyapıt."},{"t":"Seconds","y":1966,"d":"John Frankenheimer","r":106,"g":["Sci-Fi","Thriller"],"c":[],"s":"Sıradan hayatından bıkmış orta yaşlı bir bankacı, gizemli bir şirket aracılığıyla yepyeni bir yüz ve kimlikle ikinci bir şans satın alır. John Frankenheimer'ın kâbus gibi görüntüleri ve Rock Hudson'ın beklenmedik performansıyla, ürpertici bir paranoya klasiği."},{"t":"The Battle of Algiers","y":1966,"d":"Gillo Pontecorvo","r":121,"g":["Drama","War"],"c":[],"s":"1950'lerde Cezayir'in Fransız yönetimine karşı bağımsızlık mücadelesi, hem direnişçilerin hem de sömürge ordusunun bakış açısından anlatılır. Belgesel gerçekliğindeki siyah beyaz görüntüleriyle Pontecorvo'nun filmi, siyasi sinemanın en etkili ve en çok incelenen örneklerinden."},{"t":"The Good, the Bad and the Ugly","y":1966,"d":"Sergio Leone","r":178,"g":["Adventure","Drama","Western"],"c":["Clint Eastwood","Eli Wallach"],"s":"Amerikan İç Savaşı sırasında üç silahşor, gömülü bir altın hazinesinin peşinde birbirine yem olmak için kıyasıya bir yarışa girer. Sergio Leone'nin görkemli çerçeveleri ve Ennio Morricone'nin efsanevi müzikleriyle spagetti westernin zirvesi."},{"t":"The Man Who Had His Hair Cut Short","y":1966,"d":"André Delvaux","r":94,"g":["Drama"],"c":[],"s":"Küçük bir Flaman kasabasında yaşayan evli bir avukat, eski bir öğrencisine duyduğu gizli aşkla ve bir otopsinin yarattığı sarsıntıyla yavaş yavaş dengesini kaybeder. André Delvaux'nun bu filmi, gerçek ile hayal arasında dolaşan, Belçika sinemasının zarif bir büyülü gerçekçilik örneği."},{"t":"Who's Afraid of Virginia Woolf?","y":1966,"d":"Mike Nichols","r":131,"g":["Drama"],"c":["Elizabeth Taylor","Sandy Dennis"],"s":"Orta yaşlı bir profesör ile karısı, genç bir çifti gece yarısı içkiye davet eder ve akşam acımasız bir psikolojik savaşa dönüşür. Elizabeth Taylor ve Richard Burton'ın ateşli performanslarıyla, evliliğin karanlık yüzüne bakan unutulmaz bir oyun uyarlaması."},{"t":"2 or 3 Things I Know About Her","y":1967,"d":"Jean-Luc Godard","r":87,"g":["Comedy","Drama"],"c":[],"s":"Paris'in yeni yapılan banliyölerinde yaşayan bir ev kadını, ailesinin geçimine katkı için gündüzleri gizlice fahişelik yapar. Godard, bu filmde hem bir kadını hem de modernleşen bir şehri inceleyerek tüketim toplumuna düşünceli ve renkli bir deneme yazar."},{"t":"Belle De Jour","y":1967,"d":"Luis Buñuel","r":100,"g":["Drama","Romance"],"c":[],"s":"Kocasını seven ama ona yakınlaşamayan zengin ve güzel bir ev kadını, gündüzleri gizlice lüks bir genelevde çalışmaya başlar. Buñuel, Catherine Deneuve'ün soğuk zarafetiyle arzu ve fantezi arasındaki sınırı bulanıklaştıran ince ve kışkırtıcı bir film çıkarır."},{"t":"Bonnie and Clyde","y":1967,"d":"Arthur Penn","r":111,"g":["Action","Biography","Crime"],"c":["Estelle Parsons"],"s":"Buhran yıllarında sıkılmış bir garson kız ile karizmatik bir soyguncu, Amerika'nın güneyinde banka soyarak efsaneleşen bir ikili olur. Warren Beatty ve Faye Dunaway'in parladığı bu film, şiddet ve üslup cesaretiyle Yeni Hollywood dönemini başlatmıştır."},{"t":"Cool Hand Luke","y":1967,"d":"Stuart Rosenberg","r":127,"g":["Crime","Drama"],"c":["George Kennedy"],"s":"Sarhoşken parkmetre kırdığı için hapse düşen Luke, zincirli mahkûm ekibinde otoriteye boyun eğmeyen tavrıyla herkesin kahramanı olur. Paul Newman'ın karizmatik performansı ve unutulmaz replikleriyle, asi ruhu anlatan en sevilen Amerikan filmlerinden."},{"t":"David Holzman's Diary","y":1967,"d":"Jim McBride","r":74,"g":["Comedy","Drama"],"c":[],"s":"Genç bir film meraklısı, hayatındaki gerçeği yakalayabilmek için kendi gündelik yaşamını kamerayla kaydetmeye karar verir. Belgesel gibi görünen bu kurmaca, sahte belgesel türünün öncülerinden olup kamera ile gerçeklik ilişkisini zekice sorgular."},{"t":"Entranced Earth","y":1967,"d":"Glauber Rocha","r":108,"g":["Drama"],"c":[],"s":"Hayali bir Latin Amerika ülkesinde bir şair ve gazeteci, iktidar kavgası veren politikacılar arasında idealleri ile çıkarları arasında bocalar. Glauber Rocha'nın operatik ve öfkeli bu filmi, siyasi sinemanın en cesur ve en coşkulu örneklerinden biridir."},{"t":"Hombre","y":1967,"d":"Martin Ritt","r":111,"g":["Drama","Western"],"c":[],"s":"Apaçiler arasında büyümüş bir beyaz adam, bir posta arabası yolculuğunda kendisini dışlayan yolcularla birlikte haydutlara karşı hayatta kalmak zorunda kalır. Paul Newman'ın ağırbaşlı performansıyla, önyargı ve ahlak üzerine düşündüren, olgun bir western."},{"t":"In the Heat of the Night","y":1967,"d":"Norman Jewison","r":110,"g":["Drama","Mystery","Thriller"],"c":["Rod Steiger"],"s":"Mississippi'de küçük bir kasabada işlenen cinayete, oradan geçmekte olan siyahi bir Philadelphia dedektifi dahil olur ve ırkçı bir şerifle birlikte çalışmak zorunda kalır. Sidney Poitier ve Rod Steiger'ın güçlü düellosuyla, hem gerilimli hem anlamlı bir Oscar'lı klasik."},{"t":"Le Samourai","y":1967,"d":"Jean-Pierre Melville","r":101,"g":["Crime","Drama","Thriller"],"c":[],"s":"Soğukkanlı ve yalnız bir kiralık katil, bir işin ardından hem polisin hem de işverenlerinin hedefi haline gelir. Melville'in minimalist üslubu ve Alain Delon'un buz gibi karizmasıyla, sayısız suç filmine ilham vermiş zarif bir başyapıt."},{"t":"Marketa Lazarová","y":1967,"d":"František Vláčil","r":162,"g":["Drama","History","Romance"],"c":[],"s":"Ortaçağ Bohemya'sında iki düşman klan arasındaki kanlı çatışmada, manastıra adanmış genç Marketa kaçırılır ve kaderi değişir. František Vláčil'in şiirsel ve vahşi bu destanı, sık sık Çek sinemasının en büyük filmi olarak anılır."},{"t":"Playtime","y":1967,"d":"Jacques Tati","r":155,"g":["Comedy"],"c":[],"s":"Beceriksiz ve tatlı Monsieur Hulot, camdan ve çelikten modern bir Paris'te bir grup Amerikalı turistle yollarını kesiştirerek bir gün geçirir. Jacques Tati'nin dev bir set üzerinde kurduğu bu görsel komedi, her karesinde yeni bir ayrıntı saklayan bir şaheser."},{"t":"Point Blank","y":1967,"d":"John Boorman","r":92,"g":["Crime","Drama","Thriller"],"c":[],"s":"Bir soygunun ardından ihanete uğrayıp ölüme terk edilen Walker, payına düşen parayı almak için bir suç örgütüne karşı yalnız savaşır. John Boorman'ın parçalı kurgusu ve Lee Marvin'in sert duruşuyla, modern neo-noir'ın en şık örneklerinden."},{"t":"Report","y":1967,"d":"Bruce Conner","r":null,"g":["Documentary"],"c":[],"s":"Kennedy suikastına dair televizyon ve radyo kayıtlarını tekrar eden, kesip biçen ve reklam görüntüleriyle harmanlayan kısa bir kolaj film. Bruce Conner'ın bu eseri, medyanın trajediyi nasıl tüketime dönüştürdüğüne dair hem çarpıcı hem düşündürücü bir yorum."},{"t":"The Firemen's Ball","y":1967,"d":"Miloš Forman","r":73,"g":["Comedy","Drama"],"c":[],"s":"Küçük bir Çek kasabasında itfaiyeciler, emekli başkanları için bir balo düzenler ama güzellik yarışmasından piyangoya kadar her şey ters gider. Miloš Forman'ın sistem eleştirisini ustaca saklayan bu kısa komedi, hem çok komik hem keskin bir hiciv."},{"t":"The Graduate","y":1967,"d":"Mike Nichols","r":106,"g":["Comedy","Drama","Romance"],"c":["Dustin Hoffman","Anne Bancroft"],"s":"Üniversiteden yeni mezun olmuş kararsız Benjamin, ailesinin arkadaşı Bayan Robinson'la bir ilişkiye girer, ardından onun kızına âşık olur. Dustin Hoffman'ın ilk büyük rolü ve Simon & Garfunkel şarkılarıyla, bir kuşağın huzursuzluğunu yakalayan bir klasik."},{"t":"The Jungle Book","y":1967,"d":"Wolfgang Reitherman","r":78,"g":["Adventure","Animation","Comedy"],"c":[],"s":"Ormanda kurtlar tarafından büyütülen Mowgli, kaplan Şir Han'dan kaçarken ayı Baloo ve panter Bagira'nın yardımıyla insan köyüne doğru yola çıkar. Walt Disney'in son dokunuşunu taşıyan bu animasyon, caz tadındaki şarkıları ve sevimli karakterleriyle her yaşa hitap eder."},{"t":"The Producers","y":1967,"d":"Mel Brooks","r":88,"g":["Comedy","Music"],"c":[],"s":"Batık bir Broadway yapımcısı ile ürkek muhasebecisi, kesinlikle çuvallayacak bir oyun sahneleyerek zengin olmayı planlar. Mel Brooks'un ilk filmi, cüretkâr espriler ve Zero Mostel ile Gene Wilder'ın müthiş uyumuyla komedi tarihinin kült eserlerinden."},{"t":"The Red and the White","y":1967,"d":"Miklós Jancsó","r":90,"g":["Drama","War"],"c":[],"s":"Rus İç Savaşı sırasında Kızıllar ile Beyazlar arasında el değiştiren bir bölgede, esirler ve askerler savaşın anlamsız döngüsüne sürüklenir. Miklós Jancsó'nun uzun ve koreografik planlarla çektiği bu film, savaşa dair en soğuk ve en etkileyici bakışlardan biri."},{"t":"The Young Girls of Rochefort","y":1967,"d":"Jacques Demy","r":125,"g":["Comedy","Drama","Musical"],"c":[],"s":"Sahil kasabası Rochefort'ta yaşayan ikiz kız kardeşler, büyük aşkı ve Paris'teki sanat hayatını hayal ederken kasabaya bir panayır gelir. Jacques Demy'nin pastel renkleri, Michel Legrand'ın müzikleri ve Deneuve ile Dorléac ikilisiyle neşe saçan bir müzikal."},{"t":"Viy","y":1967,"d":"Georgi Kropachyov","r":77,"g":["Drama","Fantasy","Horror"],"c":[],"s":"Genç bir ilahiyat öğrencisi, uzak bir köyde bir cadının cesedinin başında üç gece dua etmekle görevlendirilir ve yalnızca inancıyla korunur. Gogol'ün öyküsünden uyarlanan bu Sovyet korku filmi, el yapımı büyüleyici efektleri ve masalsı havasıyla bir kült klasik."},{"t":"Wavelength","y":1967,"d":"Michael Snow","r":45,"g":["Drama"],"c":[],"s":"Kamera, bir loft dairesinin karşı duvarına doğru kırk beş dakika boyunca yavaşça yakınlaşır, bu arada odada küçük olaylar yaşanır. Michael Snow'un yapısal sinemanın simgesi olan bu filmi, bakma ve zaman algısını yeniden düşündüren radikal bir deneyim."},{"t":"Weekend","y":1967,"d":"Jean-Luc Godard","r":105,"g":["Adventure","Comedy","Drama"],"c":[],"s":"Burjuva bir çift, miras almak için kırsala giderken kendilerini bitmeyen trafik kazaları ve giderek çıldıran bir toplumun ortasında bulur. Godard'ın ünlü uzun trafik sıkışıklığı planıyla açılan bu apokaliptik hiciv, tüketim toplumuna öfkeli bir veda niteliğinde."},{"t":"2001: A Space Odyssey","y":1968,"d":"Stanley Kubrick","r":149,"g":["Adventure","Sci-Fi"],"c":["Keir Dullea","Gary Lockwood"],"s":"İnsanlığın şafağından uzay çağına uzanan bu yolculukta, gizemli bir siyah monolit ve Jüpiter'e giden bir uzay gemisinin zeki bilgisayarı HAL merkezde durur. Kubrick'in görsel devrim niteliğindeki bu filmi, bilimkurgunun gelmiş geçmiş en etkileyici ve en tartışılan eseri."},{"t":"Faces","y":1968,"d":"John Cassavetes","r":130,"g":["Drama"],"c":[],"s":"Evliliği çözülmek üzere olan orta yaşlı bir çift, bir gece boyunca ayrı ayrı başka insanlarla teselli ve heyecan arar. John Cassavetes'in el kamerası ve doğaçlamaya yakın oyunculuklarla çektiği bu film, Amerikan bağımsız sinemasının kurucu eserlerinden."},{"t":"High School","y":1968,"d":"Frederick Wiseman","r":75,"g":["Documentary"],"c":[],"s":"Philadelphia'daki bir lisede öğretmenler, öğrenciler ve disiplin kuralları, hiçbir anlatıcı ya da yorum olmadan gözlemlenir. Frederick Wiseman'ın bu belgeseli, kurumların insanları nasıl biçimlendirdiğini gösteren sade ama çok güçlü bir portre."},{"t":"Hour of the Wolf","y":1968,"d":"Ingmar Bergman","r":88,"g":["Drama","Horror","Mystery"],"c":[],"s":"Uzak bir adada karısıyla yaşayan bir ressam, uykusuz gecelerde onu rahatsız eden tuhaf figürler ve karanlık anılarla boğuşur. Bergman'ın korku sinemasına en çok yaklaştığı bu film, sanatçının iç şeytanlarına dair ürpertici ve büyüleyici bir yolculuk."},{"t":"If....","y":1968,"d":"Lindsay Anderson","r":111,"g":["Crime","Drama"],"c":[],"s":"Katı kurallarla yönetilen bir İngiliz yatılı okulunda, asi öğrenci Mick Travis ve arkadaşları otoriteye karşı giderek büyüyen bir başkaldırı başlatır. Lindsay Anderson'ın Malcolm McDowell'lı bu filmi, gerçekçilik ile fantazi arasında gidip gelen cesur bir hiciv."},{"t":"Lucia","y":1968,"d":"Humberto Solás","r":160,"g":["Drama"],"c":[],"s":"Lucía adlı üç kadının hikâyesi, Küba tarihinin üç farklı döneminde, 1895, 1932 ve 1960'larda geçer. Humberto Solás'ın her bölüme farklı bir görsel üslup verdiği bu destansı film, Latin Amerika sinemasının en tutkulu eserlerinden biridir."},{"t":"Memories of Underdevelopment","y":1968,"d":"Tomás Gutiérrez Alea","r":97,"g":["Drama"],"c":[],"s":"Devrim sonrası Havana'da, ailesi ve karısı Miami'ye göç eden varlıklı bir adam, geride kalıp çevresini ve kendini mesafeli bir gözle izler. Tomás Gutiérrez Alea'nın belgesel ile kurmacayı harmanlayan bu filmi, Küba sinemasının en zekice ve en çok övülen eseri."},{"t":"Night of the Living Dead","y":1968,"d":"George A. Romero","r":96,"g":["Horror","Thriller"],"c":[],"s":"Ölülerin dirilip insanlara saldırdığı bir gece, bir grup yabancı Pennsylvania'da ıssız bir çiftlik evine sığınır. George A. Romero'nun düşük bütçeli bu filmi, modern zombi türünü yaratmış ve toplumsal göndermeleriyle bir korku klasiği olmuştur."},{"t":"Once Upon a Time in the West","y":1968,"d":"Sergio Leone","r":145,"g":["Drama","Western"],"c":["Henry Fonda","Charles Bronson"],"s":"Vahşi Batı'da demiryolunun yükselişi sürerken, bir dul kadın, gizemli bir mızıka çalan silahşor ve acımasız bir kiralık katil kaderlerini paylaşır. Sergio Leone'nin operatik temposu ve Morricone'nin müziğiyle, westernlerin belki de en görkemlisi."},{"t":"Planet of the Apes","y":1968,"d":"Franklin J. Schaffner","r":112,"g":["Adventure","Sci-Fi"],"c":[],"s":"Uzun bir uzay yolculuğundan sonra bilinmeyen bir gezegene inen astronotlar, konuşan ve toplumu yöneten maymunlarla karşılaşır. Charlton Heston'lı bu bilimkurgu klasiği, akıllı toplumsal alegorisi ve efsanevi finaliyle bugün hâlâ etkileyici."},{"t":"Rosemary's Baby","y":1968,"d":"Roman Polanski","r":137,"g":["Drama","Horror"],"c":["Ruth Gordon"],"s":"New York'ta eski bir apartmana taşınan genç bir çift, bebek beklerken meraklı ve fazla yardımsever komşularından şüphelenmeye başlar. Polanski'nin Mia Farrow'lu bu filmi, gündelik paranoyayı ustaca besleyen ve türe yön veren bir psikolojik korku klasiği."},{"t":"Shame (Skammen)","y":1968,"d":"Ingmar Bergman","r":103,"g":["Drama"],"c":[],"s":"Bir adada sakin bir hayat süren iki müzisyen, ülkelerini saran iç savaşın içine istemeden çekilir ve savaş ilişkilerini de aşındırır. Bergman'ın Liv Ullmann ve Max von Sydow'lu bu filmi, savaşın insan onurunu nasıl kemirdiğini sarsıcı bir sadelikle gösterir."},{"t":"Targets","y":1968,"d":"Peter Bogdanovich","r":90,"g":["Crime","Drama","Thriller"],"c":[],"s":"Emekliye ayrılmak isteyen yaşlı bir korku filmi yıldızının hikâyesi, sıradan görünen genç bir adamın beklenmedik şiddetiyle kesişir. Peter Bogdanovich'in ilk filmi, eski Hollywood korkusu ile modern dünyanın gerçek dehşetini zekice karşılaştırır."},{"t":"Butch Cassidy and the Sundance Kid","y":1969,"d":"George Roy Hill","r":110,"g":["Adventure","Biography","Crime"],"c":[],"s":"Karizmatik iki eşkıya, peşlerine düşen amansız bir takip ekibinden kaçmak için Bolivya'ya kadar uzanan bir maceraya atılır. Paul Newman ve Robert Redford'un unutulmaz ikilisiyle, esprili, romantik ve hüzünlü bir western klasiği."},{"t":"Easy Rider","y":1969,"d":"Dennis Hopper","r":95,"g":["Adventure","Drama"],"c":[],"s":"İki motorcu, bir uyuşturucu satışından kazandıkları parayla Amerika'yı batıdan güneye kat eden bir yolculuğa çıkar. Dennis Hopper'ın rock müziği ve özgürlük özlemiyle dolu bu filmi, karşı kültürün ve Yeni Hollywood'un simgelerinden biri oldu."},{"t":"Fellini Satyricon","y":1969,"d":"Federico Fellini","r":129,"g":["Drama","Fantasy"],"c":[],"s":"Antik Roma'da iki genç adam, aşk, şölenler ve tuhaf karakterlerle dolu, rüya gibi bir dizi maceraya sürüklenir. Fellini'nin Petronius'tan serbestçe uyarladığı bu film, görkemli ve tuhaf görselleriyle başka hiçbir şeye benzemeyen bir deneyim."},{"t":"In the Year of the Pig","y":1969,"d":"Emile de Antonio","r":103,"g":["Documentary","History","War"],"c":[],"s":"Vietnam Savaşı'nın kökenleri, arşiv görüntüleri ve tanıklıklar aracılığıyla, Fransız sömürgeciliğinden Amerikan müdahalesine kadar incelenir. Emile de Antonio'nun kolaj tarzı belgeseli, savaş devam ederken çekilmiş cesur ve keskin bir siyasi analizdir."},{"t":"Kes","y":1969,"d":"Ken Loach","r":111,"g":["Drama","Family"],"c":[],"s":"Kuzey İngiltere'de yoksul bir madenci kasabasında büyüyen içine kapanık Billy, bir yavru kerkenezi evcilleştirerek kendine küçük bir dünya kurar. Ken Loach'un sade ve şefkatli bu filmi, İngiliz toplumsal gerçekçiliğinin en dokunaklı örneklerinden."},{"t":"Midnight Cowboy","y":1969,"d":"John Schlesinger","r":113,"g":["Drama"],"c":[],"s":"Kadınları etkileyip zengin olmayı hayal eden saf bir Teksaslı genç New York'a gelir ve hastalıklı bir dolandırıcıyla beklenmedik bir dostluk kurar. Dustin Hoffman ve Jon Voight'un güçlü performanslarıyla, büyük şehrin yalnızlığına dair unutulmaz bir film."},{"t":"My Night at Maud's","y":1969,"d":"Éric Rohmer","r":105,"g":["Comedy","Drama","Romance"],"c":[],"s":"Katolik ve ilkeli bir mühendis, karlı bir kış gecesini zeki ve özgür ruhlu boşanmış bir kadın olan Maud'un evinde, felsefe ve aşk üzerine konuşarak geçirir. Rohmer'in sohbetle örülü bu filmi, arzu ile inanç arasındaki gerilimi incelikle işler."},{"t":"The Color of Pomegranates","y":1969,"d":"Sergei Parajanov","r":79,"g":["Biography","Drama","History"],"c":[],"s":"18. yüzyıl Ermeni ozanı Sayat Nova'nın hayatı, klasik bir anlatı yerine tablo gibi kurulmuş sembolik sahnelerle aktarılır. Parajanov'un bu eşsiz filmi, sinemadan çok hareketli bir minyatür gibi, görsel şiirin en saf örneklerinden biri."},{"t":"The Cow (Gaav)","y":1969,"d":"Dariush Mehrjui","r":104,"g":["Drama"],"c":[],"s":"Küçük bir İran köyünde, sahip olduğu tek ineğe derin bir sevgiyle bağlı olan Hasan, ineğin ölümünün ardından akıl almaz bir değişim geçirir. Dariush Mehrjui'nin bu sade ve güçlü filmi, İran Yeni Dalgası'nı başlatan eser olarak kabul edilir."},{"t":"The Sorrow and the Pity","y":1969,"d":"Marcel Ophüls","r":251,"g":["Documentary","History","War"],"c":[],"s":"Alman işgali altındaki Fransa'da Clermont-Ferrand halkının yaşadıkları, direnişçilerden işbirlikçilere kadar pek çok tanıklıkla anlatılır. Marcel Ophüls'ün uzun ama sürükleyici belgeseli, Fransa'nın savaş dönemine dair rahat mitlerini cesurca sorgular."},{"t":"The Wild Bunch","y":1969,"d":"Sam Peckinpah","r":135,"g":["Action","Adventure","Drama"],"c":[],"s":"Yaşlanan bir haydut çetesi, değişen dünyada son bir büyük vurgun için Meksika sınırına yönelir ve kendilerini zorlu bir sadakat sınavında bulur. Sam Peckinpah'ın ağır çekim şiddetiyle westernin kurallarını yeniden yazan bu film, türün en etkili eserlerinden."},{"t":"Z","y":1969,"d":"Costa-Gavras","r":127,"g":["Crime","Drama","Thriller"],"c":[],"s":"Barışçıl bir muhalefet liderinin şüpheli ölümünün ardından, kararlı bir sorgu yargıcı devletin en üst kademelerine uzanan bir komployu ortaya çıkarır. Costa-Gavras'ın Yunanistan'daki gerçek olaylardan esinlenen bu filmi, nefes kesen bir siyasi gerilim."},{"t":"Deep End","y":1970,"d":"Jerzy Skolimowski","r":88,"g":["Comedy","Drama","Romance"],"c":[],"s":"Londra'da bir hamamda işe başlayan on beş yaşındaki Mike, kendisinden büyük, çekici iş arkadaşı Susan'a saplantılı bir tutkuyla bağlanır. Jerzy Skolimowski'nin canlı renkleri ve tuhaf mizahıyla, yeniden keşfedilen parlak bir büyüme hikâyesi."},{"t":"El Topo","y":1970,"d":"Alejandro Jodorowsky","r":125,"g":["Drama","Mystery","Western"],"c":[],"s":"Siyahlar içindeki gizemli bir silahşor, çölde efsanevi ustaları yenmek için ruhani ve şiddet dolu bir yolculuğa çıkar. Jodorowsky'nin mistik semboller ve gerçeküstü imgelerle dolu bu westerni, gece yarısı gösterimleri geleneğini başlatan bir kült film."},{"t":"Five Easy Pieces","y":1970,"d":"Bob Rafelson","r":98,"g":["Drama"],"c":[],"s":"Klasik piyano eğitimi almış ama ailesinden kaçıp petrol sahalarında çalışan Bobby, hasta babasını görmek için eve dönmek zorunda kalır. Jack Nicholson'ın unutulmaz performansıyla, köksüzlük ve huzursuzluk üzerine Yeni Hollywood'un en incelikli filmlerinden."},{"t":"Gimme Shelter","y":1970,"d":"Albert Maysles","r":91,"g":["Documentary","Music","Thriller"],"c":[],"s":"Rolling Stones'un 1969 Amerika turnesi ve kaosa sürüklenen Altamont konseri, grubun kendisinin de izlediği görüntülerle anlatılır. Maysles kardeşlerin bu belgeseli, altmışların iyimserliğinin sonunu belgeleyen en sarsıcı müzik filmlerinden biridir."},{"t":"Little Big Man","y":1970,"d":"Arthur Penn","r":139,"g":["Adventure","Comedy","Drama"],"c":[],"s":"Yüz yaşını aşmış Jack Crabb, Çeyenler tarafından büyütülüşünden General Custer'la yollarının kesişmesine kadar uzanan inanılmaz hayatını anlatır. Dustin Hoffman'lı bu film, Vahşi Batı mitlerini mizah ve hüzünle altüst eden, revizyonist bir western."},{"t":"M*A*S*H","y":1970,"d":"Robert Altman","r":116,"g":["Comedy","Drama","War"],"c":[],"s":"Kore Savaşı'nda bir sahra hastanesinde çalışan asi cerrahlar, savaşın saçmalığına şakalar, içki ve kural tanımazlıkla karşı koyar. Robert Altman'ın üst üste binen diyalogları ve anarşik mizahıyla, savaş karşıtı komedinin en etkili örneklerinden biri."},{"t":"Patton","y":1970,"d":"Franklin J. Schaffner","r":172,"g":["Biography","Drama","War"],"c":["George C. Scott"],"s":"İkinci Dünya Savaşı'nda Kuzey Afrika'dan Avrupa'ya uzanan seferlerde, dahi ama bir o kadar tartışmalı General George S. Patton'ın hikâyesi anlatılır. George C. Scott'ın o ünlü bayrak önündeki konuşmayla açılan, Oscar'lı ve etkileyici bir biyografi."},{"t":"Performance","y":1970,"d":"Nicolas Roeg","r":105,"g":["Crime","Drama"],"c":[],"s":"Polisten kaçan bir gangster, Londra'da münzevi bir rock yıldızının evine sığınır ve iki adamın kimlikleri tuhaf biçimde birbirine karışır. Mick Jagger'lı bu psikedelik suç filmi, Nicolas Roeg'un parçalı kurgusuyla hâlâ büyüleyici bir kült eser."},{"t":"The Bird With the Crystal Plumage","y":1970,"d":"Dario Argento","r":96,"g":["Drama","Horror","Mystery"],"c":[],"s":"Roma'da yaşayan Amerikalı bir yazar, bir sanat galerisinde bir kadına yapılan saldırıya tanık olur ve seri katilin peşine düşer. Dario Argento'nun ilk filmi, şık kamera çalışması ve gerilimiyle İtalyan giallo türünü popüler kılan eser oldu."},{"t":"The Butcher","y":1970,"d":"Claude Chabrol","r":93,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Fransa'nın sakin bir köyünde, savaştan dönmüş bir kasap ile zarif okul müdiresi arasında dostluk filizlenir, bu sırada çevrede gizemli cinayetler işlenmeye başlar. Claude Chabrol'ün Hitchcock'a en yakın durduğu bu film, gerilimi insan ilişkilerinin inceliğiyle harmanlar."},{"t":"The Conformist","y":1970,"d":"Bernardo Bertolucci","r":113,"g":["Drama"],"c":[],"s":"Faşist İtalya'da 'normal' görünmeye takıntılı bir adam, eski hocası olan sürgündeki bir profesöre suikast görevi alır. Bertolucci ve görüntü yönetmeni Vittorio Storaro'nun göz kamaştırıcı çerçeveleri, bu filmi sinemanın en güzel görünen eserlerinden biri yapar."},{"t":"The Ear (Ucho)","y":1970,"d":"Karel Kachyňa","r":94,"g":["Drama","Thriller"],"c":[],"s":"Prag'da yüksek rütbeli bir bürokrat ile karısı, bir parti gecesinden döndüklerinde evlerinin dinlendiğinden şüphelenmeye başlar ve gece paranoyaya dönüşür. Karel Kachyňa'nın yıllarca yasaklı kalan bu filmi, totaliter korkuyu bir evlilik dramının içinde ustalıkla anlatır."},{"t":"The Garden of the Finzi-Continis","y":1970,"d":"Vittorio De Sica","r":94,"g":["Drama","History","War"],"c":[],"s":"Faşist İtalya'nın Ferrara kentinde, varlıklı bir Yahudi ailenin bahçesinde tenis oynayan gençler, yaklaşan felaketin gölgesinde büyür. Vittorio De Sica'nın Oscar'lı bu filmi, kayıp ve nostaljiyle dolu, zarif ve hüzünlü bir anı."},{"t":"The Spider's Stratagem","y":1970,"d":"Bernardo Bertolucci","r":100,"g":["Drama","Mystery"],"c":[],"s":"Genç bir adam, anti-faşist bir kahraman olarak hatırlanan babasının ölümünü araştırmak için küçük bir İtalyan kasabasına gelir. Bertolucci'nin Borges'ten uyarladığı bu gizemli ve rüya gibi film, tarih ve efsane arasındaki sınırı ustaca sorgular."},{"t":"Tristana","y":1970,"d":"Luis Buñuel","r":99,"g":["Drama"],"c":[],"s":"Yetim kalan genç Tristana, kendisini himayesine alan yaşlı bir soylunun hem korumasında hem de baskısı altında büyür. Buñuel'in Catherine Deneuve'lü bu filmi, arzu, güç ve intikam üzerine sessizce keskinleşen ince bir dram."},{"t":"Wanda","y":1970,"d":"Barbara Loden","r":102,"g":["Crime","Drama"],"c":[],"s":"Pennsylvania'nın kömür bölgesinde ailesini ve evini geride bırakan edilgen bir kadın, küçük çaplı bir soyguncuyla amaçsız bir yolculuğa sürüklenir. Barbara Loden'in yazıp yönettiği ve oynadığı bu sade film, bağımsız sinemanın yeniden keşfedilen, derinden etkileyici bir hazinesi."},{"t":"Woodstock","y":1970,"d":"Michael Wadleigh","r":184,"g":["Documentary","History","Music"],"c":[],"s":"1969 yazında yarım milyon insanın bir çiftlikte buluştuğu efsanevi müzik festivali, sahnedeki performanslar ve kalabalığın ruhuyla birlikte belgelenir. Bölünmüş ekran kurgusu ve Hendrix'ten The Who'ya uzanan konserleriyle, bir kuşağın en canlı zaman kapsülü."},{"t":"Zabriskie Point","y":1970,"d":"Michelangelo Antonioni","r":113,"g":["Drama"],"c":[],"s":"Kaliforniya'da öğrenci eylemlerinden kaçan bir genç ile çölde yolculuk eden bir sekreter, Ölüm Vadisi'nde yolları kesişince özgür bir yakınlık kurar. Antonioni'nin Amerika'ya bakışı olan bu film, Pink Floyd müziği ve çarpıcı görüntüleriyle dönemin ruhunu yakalar."},{"t":"A Clockwork Orange","y":1971,"d":"Stanley Kubrick","r":136,"g":["Crime","Sci-Fi"],"c":["Malcolm McDowell","Patrick Magee"],"s":"Yakın geleceğin İngiltere'sinde şiddet düşkünü genç Alex, yakalandıktan sonra deneysel bir 'ıslah' tedavisinin kobayı olur. Kubrick'in Anthony Burgess uyarlaması, çarpıcı görselliği ve özgür irade üzerine rahatsız edici sorularıyla hâlâ tartışılan bir kült klasik."},{"t":"A Touch of Zen","y":1971,"d":"King Hu","r":200,"g":["Action","Adventure","Drama"],"c":[],"s":"Mütevazı bir ressam, terk edilmiş bir kaleye sığınan gizemli bir kadının siyasi entrikalar ve kılıç ustalarıyla dolu hikâyesine karışır. King Hu'nun bambu ormanındaki efsanevi dövüşüyle bilinen bu destansı wuxia, aksiyon ile Zen felsefesini eşsiz biçimde birleştirir."},{"t":"Dirty Harry","y":1971,"d":"Don Siegel","r":102,"g":["Action","Crime","Thriller"],"c":[],"s":"San Francisco'da şehri dehşete düşüren bir seri katilin peşindeki sert polis Harry Callahan, kuralları hiçe sayarak adalet arar. Clint Eastwood'un ikonik rolü ve Don Siegel'in gergin yönetimiyle, polisiye türünü yeniden şekillendiren bir klasik."},{"t":"Get Carter","y":1971,"d":"Mike Hodges","r":112,"g":["Crime","Thriller"],"c":[],"s":"Londralı bir gangster, kardeşinin şüpheli ölümünü araştırmak için doğduğu kuzey İngiltere kentine döner ve karanlık bir dünyanın kapılarını aralar. Michael Caine'in soğuk ve tehditkâr performansıyla, İngiliz suç sinemasının en sert ve en etkili örneklerinden."},{"t":"Harold and Maude","y":1971,"d":"Hal Ashby","r":91,"g":["Comedy","Drama","Romance"],"c":[],"s":"Ölüm takıntılı, zengin ve genç Harold, cenazelerde tanıştığı hayat dolu, neredeyse seksen yaşındaki Maude ile sıra dışı bir dostluk kurar. Hal Ashby'nin Cat Stevens şarkılarıyla süslenen bu kara komedisi, yaşamı kutlayan en sıcak kült filmlerden biri."},{"t":"Klute","y":1971,"d":"Alan J. Pakula","r":114,"g":["Crime","Mystery","Thriller"],"c":["Jane Fonda"],"s":"Kaybolan bir iş adamını arayan taşralı bir dedektif, adamın ipucu olarak bıraktığı New York'lu telekız Bree ile yakınlaşır ve tehlikeli bir takibe dahil olur. Jane Fonda'nın Oscar'lı performansı ve Pakula'nın paranoya dolu atmosferiyle şık bir gerilim."},{"t":"McCabe & Mrs. Miller","y":1971,"d":"Robert Altman","r":120,"g":["Drama","Western"],"c":[],"s":"Kuzeybatı Amerika'daki bir maden kasabasına gelen kumarbaz McCabe, hırslı ve zeki Bayan Miller ile ortak olup bir genelev açar. Altman'ın karlı, puslu görüntüleri ve Leonard Cohen şarkılarıyla, western türünü şiirsel biçimde tersyüz eden bir başyapıt."},{"t":"Murmur of the Heart","y":1971,"d":"Louis Malle","r":118,"g":["Comedy","Drama"],"c":[],"s":"1950'lerde Fransa'da burjuva bir ailenin zeki ve meraklı en küçük oğlu, caz, kitaplar ve büyüme sancıları arasında annesiyle çok yakın bir bağ kurar. Louis Malle'ın cesur, sıcak ve esprili bu filmi, ergenliğe dair en özgün Fransız portrelerinden."},{"t":"Shaft","y":1971,"d":"Gordon Parks","r":100,"g":["Action","Crime","Thriller"],"c":[],"s":"Harlem'in karizmatik özel dedektifi John Shaft, bir gangster liderinin kaçırılan kızını bulmak için hem mafyayla hem de polisle çekişir. Isaac Hayes'in Oscar'lı müziği ve Richard Roundtree'nin havasıyla, blaxploitation dönemini başlatan havalı bir klasik."},{"t":"Straw Dogs","y":1971,"d":"Sam Peckinpah","r":113,"g":["Crime","Drama","Thriller"],"c":[],"s":"Barışçıl bir Amerikalı matematikçi, karısıyla birlikte onun doğduğu İngiliz köyüne yerleşir, ancak yerel erkeklerle gerginlik giderek tırmanır. Sam Peckinpah'ın şiddet ve erkeklik üzerine kurduğu bu rahatsız edici gerilim, hâlâ tartışma yaratan güçlü bir film."},{"t":"Sweet Sweetback's Baadasssss Song","y":1971,"d":"Melvin Van Peebles","r":97,"g":["Crime","Drama","Thriller"],"c":[],"s":"Bir genelevde büyümüş siyahi bir adam, genç bir aktivisti döven polislere karşı koyduktan sonra Los Angeles'tan Meksika'ya doğru kaçmaya başlar. Melvin Van Peebles'ın bağımsız olarak çektiği bu öfkeli ve deneysel film, siyahi Amerikan sinemasının dönüm noktalarından biri."},{"t":"The Devils","y":1971,"d":"Ken Russell","r":111,"g":["Biography","Drama","History"],"c":[],"s":"17. yüzyıl Fransa'sında karizmatik bir rahip, bir manastırın saplantılı başrahibesi ve kenti ele geçirmek isteyen siyasi güçler arasında korkunç bir cadı avına kurban gider. Ken Russell'ın Derek Jarman dekorlarıyla çektiği bu gözü kara film, sansürle yıllarca savaşmış bir kült eser."},{"t":"The French Connection","y":1971,"d":"William Friedkin","r":104,"g":["Action","Crime","Drama"],"c":["Gene Hackman"],"s":"New York'ta iki narkotik polisi, Fransa'dan gelen büyük bir eroin sevkiyatının izini sürerken kurnaz bir kaçakçıyla kedi fare oyununa girer. William Friedkin'in belgesel gerçekliği ve efsanevi araba takibiyle, polisiye sinemanın zirve noktalarından biri."},{"t":"The Hired Hand","y":1971,"d":"Peter Fonda","r":90,"g":["Drama","Western"],"c":[],"s":"Yıllarca arkadaşıyla başıboş dolaşan bir kovboy, terk ettiği karısının çiftliğine döner ve ona yeniden bir yer açmasını umar. Peter Fonda'nın rüya gibi görüntüleri ve melankolik müziğiyle, sadakat ve pişmanlık üzerine yeniden keşfedilmiş şiirsel bir western."},{"t":"The Last Picture Show","y":1971,"d":"Peter Bogdanovich","r":118,"g":["Drama","Romance"],"c":["Ben Johnson","Cloris Leachman"],"s":"1950'lerin başında Teksas'ta ölmekte olan küçük bir kasabada, iki lise arkadaşı aşk, arzu ve büyümenin hayal kırıklıklarıyla yüzleşir. Peter Bogdanovich'in siyah beyaz, nostaljik ve hüzünlü bu filmi, Amerikan taşrasına dair en güzel portrelerden biri."},{"t":"Two-Lane Blacktop","y":1971,"d":"Monte Hellman","r":102,"g":["Drama"],"c":[],"s":"Az konuşan bir sürücü ve tamirci arkadaşı, modifiyeli arabalarıyla Amerika'yı kat ederken gösterişli bir yabancıyla ülke çapında bir yarışa girer. Monte Hellman'ın minimalist ve varoluşçu yol filmi, karşı kültürün en sessiz ama en etkileyici kült eserlerinden."},{"t":"W.R. - Mysteries of the Organism","y":1971,"d":"Dušan Makavejev","r":84,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"Psikanalist Wilhelm Reich üzerine bir belgesel ile Yugoslavya'da geçen, cinsel özgürlük ve devrim üzerine kurmaca bir hikâye iç içe geçer. Dušan Makavejev'in kolaj tarzındaki bu kışkırtıcı ve esprili filmi, anavatanında yıllarca yasaklı kalmıştır."},{"t":"Wake in Fright","y":1971,"d":"Ted Kotcheff","r":109,"g":["Drama","Thriller"],"c":[],"s":"Tatile çıkmak isteyen genç bir öğretmen, Avustralya'nın ücra bir madencilik kasabasında mahsur kalır ve içki, kumar ve vahşetle dolu bir kâbusa sürüklenir. Ted Kotcheff'in uzun süre kayıp sanılan bu filmi, Avustralya sinemasının en rahatsız edici ve etkileyici eserlerinden."},{"t":"Walkabout","y":1971,"d":"Nicolas Roeg","r":100,"g":["Adventure","Drama"],"c":[],"s":"Avustralya çölünde kaybolan iki şehirli kardeş, 'walkabout' adı verilen erginlenme yolculuğundaki genç bir Aborjin'le karşılaşır ve onun rehberliğinde hayatta kalmaya çalışır. Nicolas Roeg'un nefes kesen görüntüleriyle, doğa ve uygarlık üzerine hem güzel hem hüzünlü bir film."},{"t":"Willy Wonka & the Chocolate Factory","y":1971,"d":"Mel Stuart","r":100,"g":["Adventure","Comedy","Family"],"c":[],"s":"Yoksul ama iyi kalpli Charlie, altın bilet kazanarak gizemli Willy Wonka'nın büyülü çikolata fabrikasını gezen beş şanslı çocuktan biri olur. Gene Wilder'ın hem tatlı hem tuhaf Wonka'sı ve akılda kalan şarkılarıyla, nesiller boyu sevilen bir aile klasiği."},{"t":"Aguirre: The Wrath of God","y":1972,"d":"Werner Herzog","r":95,"g":["Action","Adventure","Biography"],"c":[],"s":"16. yüzyılda El Dorado'yu arayan İspanyol fatihler, Amazon nehrinde sallarla ilerlerken hırslı Aguirre'nin giderek büyüyen deliliğine teslim olur. Werner Herzog ile Klaus Kinski'nin gerçek ormanda çektiği bu film, sarsıcı ve hipnotik bir başyapıt."},{"t":"Cabaret","y":1972,"d":"Bob Fosse","r":124,"g":["Drama","Music","Musical"],"c":["Joel Grey","Liza Minnelli"],"s":"1931 Berlin'inde, Kit Kat Club'da şarkı söyleyen özgür ruhlu Sally Bowles, İngiliz bir yazarla yakınlaşırken çevrelerinde Nazizm yükselmektedir. Bob Fosse'nin keskin koreografisi ve Liza Minnelli'nin parlak performansıyla, müzikali siyasi bir aynaya çeviren bir klasik."},{"t":"Cries and Whispers","y":1972,"d":"Ingmar Bergman","r":null,"g":["Drama"],"c":[],"s":"19. yüzyıl sonunda bir malikânede, ölümcül hasta bir kadının başında iki kız kardeşi ve sadık hizmetçisi bekler, eski yaralar yeniden açılır. Bergman'ın kırmızı tonlarla boyanmış bu filmi, acı, sevgi ve yakınlık üzerine en yoğun ve en etkileyici eserlerinden biri."},{"t":"Deliverance","y":1972,"d":"John Boorman","r":109,"g":["Adventure","Drama","Thriller"],"c":[],"s":"Dört şehirli arkadaş, barajla sular altında kalacak vahşi bir nehirde kano gezisine çıkar ve yerel halkla yaşanan bir karşılaşma geziyi kâbusa çevirir. John Boorman'ın gergin ve sert bu filmi, ünlü banjo düellosuyla da hafızalara kazınmıştır."},{"t":"Fat City","y":1972,"d":"John Huston","r":96,"g":["Drama","Sport"],"c":[],"s":"Kaliforniya'nın küçük bir kasabasında, parlak günleri geride kalmış bir boksör ile yeni başlayan genç bir yetenek hayallerinin peşinde koşar. John Huston'ın bu mütevazı ve dürüst filmi, yenilgi ve umut üzerine en gerçekçi boks hikâyelerinden biri."},{"t":"Frenzy","y":1972,"d":"Alfred Hitchcock","r":116,"g":["Drama","Thriller"],"c":[],"s":"Londra'da kravatla kadınları öldüren bir seri katil ortalığı kasıp kavururken, şanssız bir adam yanlışlıkla baş şüpheli haline gelir. Hitchcock'un memleketine döndüğü bu film, kara mizahı ve ustaca kurulan gerilimiyle son dönemin en güçlü eserlerinden."},{"t":"Last Tango in Paris","y":1972,"d":"Bernardo Bertolucci","r":129,"g":["Drama","Romance"],"c":[],"s":"Karısını yeni kaybetmiş orta yaşlı bir Amerikalı ile genç bir Parisli kadın, boş bir dairede isimlerini bile bilmeden yoğun bir ilişkiye başlar. Bertolucci'nin Marlon Brando'lu bu filmi, yas ve yalnızlık üzerine hem güçlü hem tartışmalı bir eser."},{"t":"Pink Flamingos","y":1972,"d":"John Waters","r":93,"g":["Comedy","Crime"],"c":[],"s":"Yaşayan 'dünyanın en iğrenç insanı' unvanına sahip Divine, bu ünvanı elinden almak isteyen kıskanç bir çiftle akıl almaz bir rekabete girer. John Waters'ın sınır tanımayan bu kara komedisi, kötü zevki sanata dönüştüren efsanevi bir gece yarısı kült filmi."},{"t":"Red Psalm","y":1972,"d":"Miklós Jancsó","r":87,"g":["Drama","Musical","War"],"c":[],"s":"19. yüzyıl sonunda Macaristan'da haklarını talep eden tarım işçilerinin başkaldırısı, şarkılar, danslar ve ritüellerle anlatılır. Miklós Jancsó'nun az sayıda uzun planla koreografi gibi kurduğu bu film, siyasi sinemanın en şiirsel örneklerinden biri."},{"t":"Sleuth","y":1972,"d":"Joseph L. Mankiewicz","r":138,"g":["Mystery","Thriller"],"c":[],"s":"Oyun tutkunu ünlü bir polisiye yazarı, karısının genç sevgilisini malikânesine davet eder ve aralarında giderek tehlikeli bir zekâ oyunu başlar. Laurence Olivier ile Michael Caine'in keyifli düellosuyla, bol sürprizli ve son derece eğlenceli bir gerilim."},{"t":"Solaris","y":1972,"d":"Andrei Tarkovsky","r":167,"g":["Adventure","Drama","Mystery"],"c":[],"s":"Bir psikolog, gizemli bir okyanus gezegeninin yörüngesindeki uzay istasyonuna gönderilir ve orada yıllar önce kaybettiği karısıyla karşılaşır. Tarkovski'nin bilimkurguyu hafıza, pişmanlık ve sevgi üzerine felsefi bir meditasyona dönüştürdüğü bu film, derin ve unutulmaz."},{"t":"Super Fly","y":1972,"d":"Gordon Parks Jr.","r":91,"g":["Action","Crime","Drama"],"c":[],"s":"Harlem'de başarılı bir uyuşturucu satıcısı, son büyük bir vurgun yapıp bu hayattan tamamen çıkmayı planlar. Curtis Mayfield'ın efsanevi soul müzikleriyle öne çıkan bu film, blaxploitation döneminin en stil sahibi ve en tartışılan eserlerinden."},{"t":"The Bitter Tears of Petra Von Kant","y":1972,"d":"Rainer Werner Fassbinder","r":124,"g":["Drama","Romance"],"c":[],"s":"Başarılı ve kibirli bir moda tasarımcısı, genç ve güzel bir kadına tutkuyla bağlanır, ama bu ilişki bir güç oyununa dönüşür. Fassbinder'in tek bir dairede geçen, tiyatro tadındaki bu şık melodramı, aşk ve tahakküm üzerine keskin bir incelemedir."},{"t":"The Discreet Charm of the Bourgeoisie","y":1972,"d":"Luis Buñuel","r":102,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"Bir grup varlıklı arkadaş bir türlü birlikte yemek yiyemez, çünkü her buluşma giderek tuhaflaşan olaylar ve rüyalarla kesintiye uğrar. Buñuel'in burjuvazinin nezaket ritüellerini tatlı bir sertlikle alaya aldığı bu gerçeküstü komedi, Oscar ödüllü bir şaheser."},{"t":"The Godfather","y":1972,"d":"Francis Ford Coppola","r":175,"g":["Crime","Drama"],"c":["Marlon Brando","Al Pacino"],"s":"Yaşlanan mafya babası Vito Corleone'nin ailesi, rakip örgütlerle savaşa sürüklenirken, aile işine uzak duran küçük oğlu Michael yavaş yavaş merkeze çekilir. Coppola'nın Brando ve Pacino'lu bu filmi, aile, güç ve Amerika üzerine sinemanın en büyük destanlarından biri."},{"t":"The Harder They Come","y":1972,"d":"Perry Henzell","r":120,"g":["Crime","Drama","Music"],"c":[],"s":"Kırsaldan Kingston'a gelen genç Ivan, reggae yıldızı olmayı hayal eder ama müzik endüstrisinin acımasızlığı onu suç dünyasına sürükler. Jimmy Cliff'in karizması ve unutulmaz müzikleriyle, reggae'yi dünyaya tanıtan Jamaika sinemasının simge filmi."},{"t":"The Heartbreak Kid","y":1972,"d":"Elaine May","r":106,"g":["Comedy","Drama","Romance"],"c":[],"s":"Balayına çıkan genç bir koca, daha ilk günlerde Florida'da tanıştığı çekici bir sarışına kapılır ve yeni karısından kurtulmanın yollarını arar. Elaine May'in keskin mizahıyla, hem utandıran hem güldüren, zamanının ötesinde bir karakter komedisi."},{"t":"Amarcord","y":1973,"d":"Federico Fellini","r":123,"g":["Comedy","Drama"],"c":[],"s":"1930'ların faşist İtalya'sında bir kıyı kasabasında geçen bir yıl, genç Titta ve renkli komşularının gözünden anılar halinde anlatılır. Fellini'nin çocukluğuna yazdığı bu nostaljik ve neşeli aşk mektubu, Oscar kazanmış sıcacık bir başyapıt."},{"t":"American Graffiti","y":1973,"d":"George Lucas","r":110,"g":["Comedy","Drama"],"c":[],"s":"1962'de Kaliforniya'da küçük bir kasabada, liseden mezun olmuş bir grup genç, üniversiteye gitmeden önceki son yaz gecesini arabalarla gezerek geçirir. George Lucas'ın rock and roll şarkılarıyla dolu bu nostaljik filmi, gençlik filmlerine yön veren keyifli bir klasik."},{"t":"Badlands","y":1973,"d":"Terrence Malick","r":94,"g":["Action","Crime","Drama"],"c":[],"s":"1950'lerde Güney Dakota'da, on beş yaşındaki Holly ile kendini James Dean'e benzeten Kit, kasabayı geride bırakıp geniş ovalarda bir kaçışa başlar. Terrence Malick'in ilk filmi, şiirsel dış sesi ve büyüleyici manzaralarıyla bu hikâyeye masalsı bir hava katar."},{"t":"Day for Night","y":1973,"d":"François Truffaut","r":116,"g":["Comedy","Drama","Romance"],"c":[],"s":"Nice'teki bir stüdyoda bir melodram çekilirken, yönetmen oyuncuların aşkları, krizleri ve beklenmedik aksiliklerle baş etmeye çalışır. Truffaut'nun sinemaya duyduğu sevgiyi en içten biçimde anlattığı bu Oscar'lı film, film çekmenin tatlı kaosuna bir övgü."},{"t":"Don't Look Now","y":1973,"d":"Nicolas Roeg","r":110,"g":["Drama","Horror","Mystery"],"c":[],"s":"Kızlarını trajik bir kazada kaybeden bir çift, Venedik'te bir kilise restorasyonu için bulunurken, kızlarını gördüğünü söyleyen iki gizemli kız kardeşle karşılaşır. Nicolas Roeg'un parçalı kurgusu ve kış Venedik'inin ürkütücü atmosferiyle, yas üzerine unutulmaz bir gerilim."},{"t":"Enter the Dragon","y":1973,"d":"Robert Clouse","r":99,"g":["Action","Crime","Thriller"],"c":[],"s":"Şaolin ustası Lee, bir suç lordunun özel adasında düzenlenen dövüş turnuvasına katılarak gizli bir görevi üstlenir. Bruce Lee'nin efsanevi dövüş sahneleri ve karizmasıyla, dövüş sanatları filmlerini dünya çapında popüler kılan klasik."},{"t":"F for Fake","y":1973,"d":"Orson Welles","r":89,"g":["Documentary"],"c":[],"s":"Ünlü sanat sahtekârı Elmyr de Hory ve biyografisini yazan Clifford Irving üzerinden, gerçek ile sahte, sanat ile yalan arasındaki sınır sorgulanır. Orson Welles'in oyunbaz kurgusuyla bir sihirbaz gibi sunduğu bu deneme film, zekâsı ve eğlencesiyle eşsizdir."},{"t":"Fantastic Planet","y":1973,"d":"René Laloux","r":72,"g":["Animation","Sci-Fi"],"c":[],"s":"Uzak bir gezegende dev mavi Draag'lar, insana benzeyen küçük Om'ları evcil hayvan gibi besler, ta ki bir Om kaçıp başkaldırıya önderlik edene kadar. René Laloux'nun Roland Topor çizimleriyle yaptığı bu gerçeküstü animasyon, psikedelik müziğiyle unutulmaz bir kült eser."},{"t":"High Plains Drifter","y":1973,"d":"Clint Eastwood","r":105,"g":["Drama","Western"],"c":[],"s":"İsimsiz bir yabancı, korku içindeki küçük bir çöl kasabasına gelir ve kasabalılar onu yaklaşan haydutlara karşı korumak için tutar. Clint Eastwood'un yönetmen koltuğundaki ilk westernlerinden biri, hayaletimsi atmosferi ve karanlık ahlakıyla türün en tuhaf, en unutulmaz örneklerinden."},{"t":"Mean Streets","y":1973,"d":"Martin Scorsese","r":112,"g":["Crime","Drama","Thriller"],"c":[],"s":"New York'un Küçük İtalya'sında Charlie, mafya içinde yükselme hırsıyla başı belalı arkadaşı Johnny Boy'u koruma isteği arasında sıkışıp kalır. Scorsese'nin kişisel sesini bulduğu film, rock müziği, sokak enerjisi ve genç De Niro'nun çılgın performansıyla hâlâ nefes kesiyor."},{"t":"Papillon","y":1973,"d":"Franklin J. Schaffner","r":151,"g":["Biography","Crime","Drama"],"c":[],"s":"Haksız yere mahkûm edilen bir kasa hırsızı, Fransız Guyanası'ndaki acımasız ceza kolonisinde özgürlüğe kaçmaktan asla vazgeçmez. Steve McQueen ile Dustin Hoffman'ın dokunaklı dostluğu, bu destansı hapishane dramını insan iradesine yazılmış bir övgüye dönüştürüyor."},{"t":"Pat Garrett & Billy the Kid","y":1973,"d":"Sam Peckinpah","r":122,"g":["Biography","Drama","Western"],"c":[],"s":"Yaşlanan şerif Pat Garrett, bir zamanlar dostu olan kanun kaçağı Billy the Kid'i yakalamakla görevlendirilir. Peckinpah'ın hüzünlü, ağıt gibi westerni, Bob Dylan'ın müzikleri ve Vahşi Batı'nın sonuna duyulan melankolisiyle ayrı bir yerde duruyor."},{"t":"Serpico","y":1973,"d":"Sidney Lumet","r":130,"g":["Biography","Crime","Drama"],"c":[],"s":"Dürüst bir New York polisi, teşkilatın içine işlemiş rüşvet düzenine boyun eğmeyi reddeder ve bunun bedelini yalnızlıkla öder. Gerçek bir hikâyeden uyarlanan film, Al Pacino'nun tutkulu performansı ve Lumet'nin sokak kokan gerçekçiliğiyle sarsıcı."},{"t":"Sleeper","y":1973,"d":"Woody Allen","r":89,"g":["Comedy","Sci-Fi"],"c":[],"s":"Sıradan bir sağlıklı gıda dükkânı sahibi, iki yüz yıl sonra totaliter bir gelecekte uyandırılır ve istemeden bir direniş hareketine karışır. Woody Allen'ın slapstick ile bilimkurguyu harmanladığı bu komedi, sessiz sinema esintili gagları ve zekice hicviyle hâlâ çok eğlenceli."},{"t":"The Exorcist","y":1973,"d":"William Friedkin","r":122,"g":["Horror"],"c":["Ellen Burstyn","Max von Sydow"],"s":"Genç bir kızın açıklanamayan tuhaf değişimleri karşısında çaresiz kalan annesi, sonunda inancını sorgulayan bir rahipten yardım ister. Tüm zamanların en korkutucu filmleri arasında gösterilen bu klasik, korkuyu ciddi bir inanç ve aile dramıyla ustaca birleştiriyor."},{"t":"The Long Goodbye","y":1973,"d":"Robert Altman","r":112,"g":["Comedy","Crime","Drama"],"c":[],"s":"Dedektif Philip Marlowe, eski bir dostuna iyilik yaptıktan sonra kendini 1970'lerin Los Angeles'ında karmaşık bir cinayet ve kayıp vakasının ortasında bulur. Altman, Chandler'ın klasik kahramanını ironik, dağınık ve büyüleyici bir dünyaya taşıyarak kara filme bambaşka bir ruh katıyor."},{"t":"The Mother and the Whore","y":1973,"d":"Jean Eustache","r":210,"g":["Drama","Romance"],"c":[],"s":"Paris'te işsiz ve geveze bir genç adam, sevgilisiyle yeni tanıştığı bir hemşire arasında gidip gelen bir ilişkiler üçgenine sürüklenir. Uzun, konuşkan ve çıplak dürüstlükteki bu film, 68 sonrası kuşağın hayal kırıklığını en içten anlatan eserlerden biri."},{"t":"The Spirit of the Beehive","y":1973,"d":"Víctor Erice","r":98,"g":["Drama","Fantasy"],"c":[],"s":"1940'ların Kastilya'sında küçük Ana, köyde izlediği Frankenstein filminden sonra canavarın gerçek olduğuna inanıp onu aramaya koyulur. Erice'nin şiirsel başyapıtı, çocukluğun hayal gücünü ve iç savaş sonrası İspanya'nın sessizliğini altın ışıklı karelerle anlatıyor."},{"t":"The Sting","y":1973,"d":"George Roy Hill","r":129,"g":["Comedy","Crime","Drama"],"c":["Paul Newman","Robert Redford"],"s":"1930'ların Chicago'sunda iki dolandırıcı, arkadaşlarının intikamını almak için acımasız bir gangstere karşı büyük ve ince bir oyun kurar. Paul Newman ile Robert Redford'un kusursuz uyumu ve Scott Joplin'in ragtime melodileri, filmi zamansız bir keyif haline getiriyor."},{"t":"The Wicker Man","y":1973,"d":"Robin Hardy","r":88,"g":["Horror","Mystery","Thriller"],"c":[],"s":"Dindar bir İskoç polis, kayıp bir kızı aramak için gittiği uzak bir adada pagan geleneklerine bağlı tuhaf bir toplulukla karşılaşır. Folk korkunun kurucu eserlerinden biri, şarkıları, güneşli ürkütücülüğü ve Christopher Lee'nin karizmasıyla benzersiz."},{"t":"Turkish Delight","y":1973,"d":"Paul Verhoeven","r":108,"g":["Drama","Romance"],"c":[],"s":"Asi bir heykeltıraş ile özgür ruhlu genç bir kadının tutkulu aşkı, Amsterdam'da çılgın, eğlenceli ve zamanla yürek burkan bir yolculuğa dönüşür. Verhoeven'in cüretkâr ve duygusal filmi, Hollanda'nın en sevilen yapımlarından biri olarak hâlâ taze."},{"t":"A Woman Under the Influence","y":1974,"d":"John Cassavetes","r":155,"g":["Drama","Romance"],"c":[],"s":"Los Angeles'ta bir işçi ailesinde anne Mabel'in giderek dengesizleşen hali, kocası ve çocuklarıyla ilişkisini zorlayıcı bir sınava sokar. Gena Rowlands'ın sarsıcı performansı ve Cassavetes'in çiğ, samimi üslubu, bu filmi bağımsız sinemanın mihenk taşlarından yapıyor."},{"t":"Ali: Fear Eats the Soul","y":1974,"d":"Rainer Werner Fassbinder","r":null,"g":["Romance"],"c":[],"s":"Münih'te yaşlı ve yalnız bir temizlikçi kadın, kendisinden çok daha genç Faslı bir göçmen işçiye âşık olur ve çevresinin önyargılarıyla yüzleşir. Fassbinder'in Sirk melodramlarına selam duran bu naif ve keskin aşk hikâyesi, bugün bile yüreğe dokunuyor."},{"t":"Blazing Saddles","y":1974,"d":"Mel Brooks","r":93,"g":["Comedy","Western"],"c":[],"s":"Açgözlü bir politikacı, bir kasabayı ele geçirmek için oraya siyahi bir şerif atar ama işler hiç de planladığı gibi gitmez. Mel Brooks'un western parodisi, sınır tanımayan esprileri ve ırkçılığı alaya alan cesaretiyle komedi tarihinin en cüretkâr filmlerinden."},{"t":"Bring Me the Head of Alfredo Garcia","y":1974,"d":"Sam Peckinpah","r":112,"g":["Action","Crime","Drama"],"c":[],"s":"Meksika'da bar piyanisti olarak çalışan bir Amerikalı, güçlü bir toprak ağasının ödül koyduğu adamın başını getirmek için karanlık bir yolculuğa çıkar. Peckinpah'ın en kişisel ve en kasvetli filmi, tuhaf romantizmi ve ham şiddetiyle kült bir deneyim."},{"t":"Celine and Julie Go Boating","y":1974,"d":"Jacques Rivette","r":193,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"Paris'te tesadüfen tanışan iki kadın, gizemli bir evde tekrar tekrar oynanan bir melodramın içine büyülü şekerler sayesinde girmeye başlar. Rivette'in oyunbaz ve masalsı filmi, Alice Harikalar Diyarında havasıyla sinemanın hayal gücüne yazılmış bir aşk mektubu."},{"t":"Chinatown","y":1974,"d":"Roman Polanski","r":130,"g":["Drama","Mystery","Thriller"],"c":["Jack Nicholson","Faye Dunaway"],"s":"1930'ların Los Angeles'ında özel dedektif Jake Gittes, sıradan görünen bir sadakatsizlik davasını araştırırken şehrin su kaynaklarını çevreleyen büyük bir komplonun izine düşer. Kusursuz senaryosu ve Jack Nicholson ile Faye Dunaway'in performanslarıyla kara filmin zirvelerinden."},{"t":"The Conversation","y":1974,"d":"Francis Ford Coppola","r":113,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Titiz ve içine kapanık bir dinleme uzmanı, kaydettiği bir konuşmanın bir cinayete yol açabileceğinden şüphelenmeye başlar. Coppola'nın paranoya ve vicdan üzerine kurduğu bu sessiz gerilim, ses tasarımı ve Gene Hackman'ın incelikli oyunuyla bugün daha da güncel."},{"t":"The Godfather: Part II","y":1974,"d":"Francis Ford Coppola","r":202,"g":["Crime","Drama"],"c":["Al Pacino","Robert De Niro"],"s":"Michael Corleone aile imparatorluğunu genişletirken, genç Vito'nun Sicilya'dan New York'a uzanan yükseliş hikâyesi paralel olarak anlatılır. İlk filmi bile aştığı söylenen bu devam filmi, iki kuşağı iç içe geçiren yapısıyla sinemanın en büyük destanlarından."},{"t":"The Texas Chainsaw Massacre","y":1974,"d":"Tobe Hooper","r":83,"g":["Horror"],"c":[],"s":"Teksas kırsalında yolculuk eden bir grup genç, ıssız bir çiftlik evinde yaşayan korkunç bir aileyle karşılaşır. Düşük bütçesine rağmen belgesel gibi ham görüntüleri ve boğucu gerilimiyle korku sinemasını kökten değiştiren bir klasik."},{"t":"The Towering Inferno","y":1974,"d":"John Guillermin","r":165,"g":["Action","Drama","Thriller"],"c":[],"s":"San Francisco'daki dünyanın en yüksek gökdeleninin açılış gecesinde çıkan yangın, yüzlerce misafiri üst katlarda mahsur bırakır. Paul Newman ve Steve McQueen'in başını çektiği yıldız kadrosuyla 70'lerin felaket filmi furyasının en görkemli örneği."},{"t":"Young Frankenstein","y":1974,"d":"Mel Brooks","r":106,"g":["Comedy"],"c":[],"s":"Ünlü Frankenstein'ın torunu olan bir bilim insanı, adından kaçmaya çalışırken Transilvanya'daki aile şatosunda büyükbabasının deneylerini sürdürmeye başlar. Siyah beyaz çekilmiş bu sevgi dolu parodi, Gene Wilder'ın dehası ve Mel Brooks'un en zarif mizahıyla parlıyor."},{"t":"Barry Lyndon","y":1975,"d":"Stanley Kubrick","r":185,"g":["Adventure","Drama","War"],"c":[],"s":"18. yüzyılda İrlandalı genç bir maceraperest, savaşlar, kumar masaları ve evlilik yoluyla İngiliz aristokrasisine tırmanmaya çalışır. Yalnızca mum ışığıyla çekilen sahneleriyle Kubrick, her karesi bir tabloya benzeyen, sinemanın görsel olarak en büyüleyici filmlerinden birini yarattı."},{"t":"Deewaar","y":1975,"d":"Yash Chopra","r":174,"g":["Action","Crime","Drama"],"c":[],"s":"Yoksulluk içinde büyüyen iki kardeşten biri Bombay'ın yeraltı dünyasında yükselirken diğeri polis olur ve yolları kaçınılmaz biçimde çatışır. Amitabh Bachchan'ı 'öfkeli genç adam' imgesiyle efsaneleştiren film, Hint sinemasının en etkili dramlarından biri."},{"t":"Dersu Uzala","y":1975,"d":"Akira Kurosawa","r":142,"g":["Adventure","Biography","Drama"],"c":[],"s":"20. yüzyılın başında bir Rus askerî kaşif, Sibirya ormanlarında yolunu bulmasına yardım eden yaşlı Nanay avcısı Dersu ile derin bir dostluk kurar. Kurosawa'nın doğaya ve insan bağına duyduğu saygıyı anlatan bu sakin, görkemli film, izleyeni sessizce kucaklıyor."},{"t":"Dog Day Afternoon","y":1975,"d":"Sidney Lumet","r":125,"g":["Biography","Crime","Drama"],"c":["Al Pacino","John Cazale"],"s":"Sıcak bir Brooklyn gününde basit görünen bir banka soygunu, polis kuşatması ve medya ilgisiyle beklenmedik bir gösteriye dönüşür. Gerçek olaylardan uyarlanan film, Al Pacino'nun unutulmaz performansı ve insani mizahıyla Lumet'nin en canlı eserlerinden."},{"t":"Fox and His Friends","y":1975,"d":"Rainer Werner Fassbinder","r":124,"g":["Crime","Drama","Romance"],"c":[],"s":"Piyangoda büyük ikramiye kazanan saf bir işçi sınıfı adamı, burjuva bir sevgili ve onun çevresi tarafından yavaş yavaş sömürülür. Fassbinder'in kendisinin de oynadığı bu acı ve dürüst film, sınıf ile aşkın nasıl iç içe geçtiğini keskin bir bakışla gösteriyor."},{"t":"India Song","y":1975,"d":"Marguerite Duras","r":120,"g":["Drama","Fantasy","Romance"],"c":[],"s":"1930'ların Kalküta'sında Fransız büyükelçisinin karısı, bunaltıcı sıcakta süren resepsiyonlar ve gizli ilişkiler arasında hüzünlü bir hayat sürer. Marguerite Duras'nın, seslerin görüntüden ayrıldığı büyüleyici ve rüya gibi filmi, alışılmış anlatının dışında bir deneyim sunuyor."},{"t":"Jaws","y":1975,"d":"Steven Spielberg","r":124,"g":["Adventure","Drama","Horror"],"c":["Roy Scheider","Robert Shaw"],"s":"Küçük bir sahil kasabasının polis şefi, yaz sezonunun ortasında kıyıyı dehşete düşüren dev bir köpekbalığına karşı bir biyolog ve yaşlı bir balıkçıyla birlikte avlanmaya çıkar. Spielberg'in gişe rekorları çağını başlatan gerilim şaheseri, John Williams'ın müziğiyle hâlâ ürpertiyor."},{"t":"Jeanne Dielman 23, Quai Du Commerce 1080 Bruxelles","y":1975,"d":"Chantal Akerman","r":202,"g":["Drama"],"c":[],"s":"Brüksel'de dul bir anne, ev işlerinden oğluna yemek hazırlamaya kadar titizlikle tekrarlanan bir günlük rutinle yaşar, ta ki küçük aksaklıklar düzeni sarsana dek. Chantal Akerman'ın sabırlı ve devrimci filmi, sıradanlığı nefes kesen bir gerilime dönüştürüyor."},{"t":"Manila in the Claws of Light","y":1975,"d":"Lino Brocka","r":125,"g":["Drama","Mystery"],"c":[],"s":"Taşradan gelen genç bir balıkçı, kaybolan sevgilisini aramak için Manila'ya gelir ve şehrin acımasız yoksulluğuyla yüz yüze gelir. Lino Brocka'nın Filipin sinemasının en önemli eserlerinden sayılan bu dramı, toplumsal öfkesi ve şefkatli bakışıyla derinden etkiliyor."},{"t":"Mirror","y":1975,"d":"Andrei Tarkovsky","r":null,"g":["#Movie"],"c":[],"s":"Ölümün eşiğindeki bir adamın zihninde çocukluğu, annesi, ayrılığı ve Rusya'nın savaş yılları rüya gibi imgelerle birbirine karışır. Tarkovski'nin en kişisel filmi, doğrusal bir hikâye yerine şiir gibi akan görüntüleriyle hafızanın kendisini beyazperdeye taşıyor."},{"t":"Monty Python and the Holy Grail","y":1975,"d":"Terry Gilliam","r":91,"g":["Adventure","Comedy","Fantasy"],"c":["Graham Chapman","John Cleese"],"s":"Kral Arthur ve pek de yiğit olmayan şövalyeleri, Kutsal Kâse'yi bulmak için absürt engellerle dolu bir yolculuğa çıkar. Hindistan cevizi kabuğundan at sesleri ve unutulmaz replikleriyle Monty Python ekibinin bu parodisi, komedinin en çok alıntılanan klasiklerinden."},{"t":"Nashville","y":1975,"d":"Robert Altman","r":160,"g":["Comedy","Drama","Music"],"c":[],"s":"Country müziğin başkenti Nashville'de beş gün boyunca şarkıcılar, hayranlar ve bir siyasi kampanya etrafında yirmiden fazla karakterin hayatı kesişir. Altman'ın çok sesli, doğaçlama havasındaki bu panoraması, Amerika'nın ruh halini müzikle anlatan eşsiz bir mozaik."},{"t":"One Flew Over the Cuckoo's Nest","y":1975,"d":"Miloš Forman","r":133,"g":["Drama"],"c":["Jack Nicholson","Louise Fletcher"],"s":"Hapisten kurtulmak için deli taklidi yapan asi McMurphy, bir akıl hastanesinde katı Hemşire Ratched'in düzenine meydan okur. Jack Nicholson'ın enerjik performansıyla beş büyük Oscar'ı kazanan film, özgürlük ve otorite üzerine hem komik hem yürek sızlatan bir klasik."},{"t":"Picnic at Hanging Rock","y":1975,"d":"Peter Weir","r":115,"g":["Drama","Mystery"],"c":[],"s":"1900 yılında Avustralya'da bir kız okulunun öğrencileri, Sevgililer Günü'nde volkanik bir kayalığa pikniğe gider ve bazıları iz bırakmadan kaybolur. Peter Weir'in rüya gibi, gizemini hiç çözmeyen filmi, pan flüt melodileri ve buğulu atmosferiyle büyülüyor."},{"t":"Salo, or the 120 Days of Sodom","y":1975,"d":"Pier Paolo Pasolini","r":117,"g":["Drama"],"c":[],"s":"İkinci Dünya Savaşı'nın son günlerinde faşist İtalya'da dört güçlü adam, bir grup genci bir malikânede alıkoyarak iktidarın en karanlık yüzünü sergiler. Pasolini'nin son filmi, izlemesi son derece zor ama faşizm ve tüketim üzerine yapılmış en sarsıcı sinema eleştirilerinden biri."},{"t":"The Rocky Horror Picture Show","y":1975,"d":"Jim Sharman","r":100,"g":["Comedy","Horror","Musical"],"c":[],"s":"Arabası bozulan saf bir nişanlı çift, yağmurlu bir gecede sığındıkları şatoda çılgın bilim insanı Dr. Frank-N-Furter ve tuhaf konuklarıyla tanışır. Şarkıları, kostümleri ve katılımlı gösterimleriyle bu müzikal, sinema tarihinin en uzun ömürlü kült fenomeni."},{"t":"The Travelling Players","y":1975,"d":"Theo Angelopoulos","r":230,"g":["Drama","History","Music"],"c":[],"s":"Bir grup gezici tiyatro oyuncusu, 1939 ile 1952 arasında Yunanistan'ın savaşlar ve iç çatışmalarla çalkalanan yıllarında köy köy dolaşır. Angelopoulos'un uzun planlarla örülü destansı filmi, tarih ile mitolojiyi büyüleyici bir biçimde iç içe geçiriyor."},{"t":"1900","y":1976,"d":"Bernardo Bertolucci","r":317,"g":["Drama","History"],"c":[],"s":"Aynı gün doğan biri toprak ağasının, diğeri köylünün oğlu iki çocuğun dostluğu, İtalya'nın yarım asırlık siyasi çalkantıları boyunca sınanır. Robert De Niro ve Gérard Depardieu'nün başrolde olduğu Bertolucci destanı, görkemli görüntüleri ve tutkusuyla tarih dersinin ötesinde."},{"t":"All the President's Men","y":1976,"d":"Alan J. Pakula","r":138,"g":["Drama","History","Thriller"],"c":["Jason Robards"],"s":"Washington Post'un iki genç muhabiri, sıradan bir hırsızlık haberinin peşine düşerek Watergate skandalını ortaya çıkarır. Robert Redford ile Dustin Hoffman'ın başrolünde, gazetecilik üzerine çekilmiş en gerilimli ve en ilham verici filmlerden biri."},{"t":"Carrie","y":1976,"d":"Brian De Palma","r":98,"g":["Horror"],"c":[],"s":"Utangaç ve dindar annesinin baskısı altında büyüyen Carrie, okulda alay konusu olurken içinde gizli bir telekinezi gücü keşfeder. Stephen King uyarlaması, Sissy Spacek'in unutulmaz performansı ve De Palma'nın şık üslubuyla korku sinemasının parlak anlarından."},{"t":"Cría Cuervos","y":1976,"d":"Carlos Saura","r":105,"g":["Drama"],"c":[],"s":"Madrid'de annesini ve babasını kaybeden küçük Ana, halasının yanında kız kardeşleriyle büyürken ölüm ve hayal gücü üzerine kendi dünyasını kurar. Saura'nın Franco döneminin sonuna düşen bu hassas filmi, Ana Torrent'in bakışları ve unutulmaz şarkısıyla iz bırakıyor."},{"t":"In the Realm of the Senses","y":1976,"d":"Nagisa Ōshima","r":109,"g":["Drama","Romance"],"c":[],"s":"1930'ların Tokyo'sunda bir hizmetçi ile evin sahibi arasında başlayan ilişki, dış dünyayı tamamen dışarıda bırakan bir tutkuya dönüşür. Gerçek bir olaydan esinlenen Ōshima filmi, yetişkinlere yönelik açık sahneleriyle tartışmalı ama sanatsal cesaretiyle önemli bir eser."},{"t":"Network","y":1976,"d":"Sidney Lumet","r":121,"g":["Drama"],"c":["Peter Finch","Faye Dunaway","Beatrice Straight"],"s":"Kovulacağını öğrenen bir haber spikeri canlı yayında isyan edince, reytinglerin peşindeki televizyon kanalı onu bir fenomene dönüştürür. Paddy Chayefsky'nin kehanet gibi senaryosu, medya ve kâr hırsı üzerine yazılmış en keskin hicivlerden biri olarak bugün daha da çarpıcı."},{"t":"Rocky","y":1976,"d":"John G. Avildsen","r":120,"g":["Drama","Sport"],"c":["Sylvester Stallone","Talia Shire"],"s":"Philadelphia'da sıradan bir kulüp boksörü, dünya şampiyonuyla dövüşmek için beklenmedik bir fırsat yakalar. Sylvester Stallone'un yazıp oynadığı bu mütevazı hikâye, dokunaklı aşkı ve unutulmaz müziğiyle sinemanın en sevilen umut ve azim masallarından."},{"t":"Taxi Driver","y":1976,"d":"Martin Scorsese","r":114,"g":["Crime","Drama"],"c":["Robert De Niro","Jodie Foster"],"s":"Uykusuzluk çeken yalnız bir Vietnam gazisi, New York gecelerinde taksi şoförlüğü yaparken şehrin çürümüşlüğüne karşı giderek tehlikeli bir öfke biriktirir. Scorsese ile De Niro'nun karanlık ortaklığı, yalnızlık ve yabancılaşma üzerine yapılmış en etkileyici portrelerden."},{"t":"The Killing of a Chinese Bookie","y":1976,"d":"John Cassavetes","r":135,"g":["Crime","Drama","Thriller"],"c":[],"s":"Los Angeles'ta küçük bir striptiz kulübü işleten adam, kumar borcunu kapatmak için tehlikeli bir işe zorlanır. Cassavetes'in doğaçlama tınılı suç filmi, Ben Gazzara'nın hüzünlü performansıyla türün kurallarını bir karakter çalışmasına çeviriyor."},{"t":"The Man Who Fell to Earth","y":1976,"d":"Nicolas Roeg","r":139,"g":["Drama","Sci-Fi"],"c":[],"s":"Kuraklıkla boğuşan gezegeninden Dünya'ya gelen bir yabancı, ileri teknolojisiyle büyük bir servet kurar ama insan zaaflarına yenik düşmeye başlar. David Bowie'nin büyüleyici varlığı ve Nicolas Roeg'in parçalı kurgusu, filme benzersiz, hüzünlü bir tuhaflık katıyor."},{"t":"The Outlaw Josey Wales","y":1976,"d":"Clint Eastwood","r":135,"g":["Drama","Western"],"c":[],"s":"Ailesi Amerikan İç Savaşı sırasında öldürülen Missourili bir çiftçi, intikam peşinde bir kanun kaçağına dönüşür ve yolda kendine beklenmedik bir aile kurar. Clint Eastwood'un en insani westernlerinden biri, sert olduğu kadar sıcak ve umut dolu."},{"t":"Annie Hall","y":1977,"d":"Woody Allen","r":93,"g":["Comedy","Romance"],"c":["Woody Allen","Diane Keaton"],"s":"Nevrotik New Yorklu komedyen Alvy Singer, dağınık ve sevimli Annie ile yaşadığı ilişkinin iniş çıkışlarını geriye dönüp anlamaya çalışır. Woody Allen'ın dördüncü duvarı yıkan, zekâ dolu romantik komedisi, türün kurallarını yeniden yazan bir başyapıt."},{"t":"Ceddo","y":1977,"d":"Ousmane Sembène","r":120,"g":["Drama"],"c":[],"s":"17. yüzyıl Senegal'inde, kralın İslam'ı benimsemesine karşı çıkan geleneksel Ceddo halkı prensesi kaçırarak direnişe geçer. Afrika sinemasının öncüsü Ousmane Sembène'in cesur ve görkemli filmi, inanç, güç ve kimlik üzerine düşündüren önemli bir eser."},{"t":"Close Encounters of the Third Kind","y":1977,"d":"Steven Spielberg","r":138,"g":["Drama","Sci-Fi"],"c":[],"s":"Bir elektrik teknisyeni, gökyüzünde gördüğü ışıklardan sonra zihnine kazınan tuhaf bir şekle takıntılı hâle gelir ve başka insanlarla birlikte bir buluşmanın izini sürer. Spielberg'in merak ve hayranlık dolu bilimkurgusu, beş notalık o unutulmaz melodiyle büyülüyor."},{"t":"Eraserhead","y":1977,"d":"David Lynch","r":89,"g":["Fantasy","Horror"],"c":[],"s":"Endüstriyel ve kasvetli bir şehirde yaşayan Henry, kız arkadaşının doğurduğu tuhaf bebekle birlikte kâbusa benzer bir babalık deneyimine sürüklenir. David Lynch'in ilk uzun metrajı, rüya mantığı ve ses tasarımıyla sinemanın en eşsiz gerçeküstü deneyimlerinden."},{"t":"Last Chants for a Slow Dance","y":1977,"d":"Jon Jost","r":null,"g":["Drama"],"c":[],"s":"Aile hayatından bunalmış bir adam, haftalarca evden uzaklaşarak Amerika'nın batısında kasaba kasaba sürüklenir. Jon Jost'un az bütçeli, sert ve düşündürücü bağımsız filmi, Amerikan yalnızlığına ve öfkesine cesurca, süssüz bir bakış atıyor."},{"t":"Man of Marble","y":1977,"d":"Andrzej Wajda","r":160,"g":["Drama"],"c":[],"s":"Genç bir film öğrencisi, 1950'lerde propaganda kahramanı yapılıp sonra unutulan bir duvarcı ustasının hikâyesini araştırır. Wajda'nın sansürü zorlayan bu cesur filmi, Polonya'nın yakın tarihini sorgulayan hem gazetecilik gerilimi hem de politik bir başyapıt."},{"t":"Saturday Night Fever","y":1977,"d":"John Badham","r":119,"g":["Drama","Music"],"c":[],"s":"Brooklyn'de sıkıcı bir işte çalışan genç Tony Manero, hafta sonları diskoda dans pistinin kralı olur ve hayatından fazlasını istemeye başlar. John Travolta'nın ikonik performansı ve Bee Gees şarkılarıyla bir dönemin ruhunu yakalayan, beklenenden çok daha derin bir film."},{"t":"Sleeping Dogs","y":1977,"d":"Roger Donaldson","r":107,"g":["Action","Drama","Thriller"],"c":[],"s":"Yeni Zelanda'da ayrılığın ardından bir adaya çekilen bir adam, baskıcı hükümet ile gerillalar arasındaki çatışmanın ortasında kalır ve komploya sürüklenir. Sam Neill'in ilk başrolü olan bu gerilim, Yeni Zelanda sinemasının modern doğuşunu simgeliyor."},{"t":"Soldier of Orange","y":1977,"d":"Paul Verhoeven","r":165,"g":["Drama","Romance","Thriller"],"c":[],"s":"Leiden'de bir grup üniversite arkadaşının hayatı, Nazi işgaliyle birlikte direniş, işbirliği ve kaçış arasında farklı yollara ayrılır. Rutger Hauer'in parladığı bu Verhoeven filmi, macera ile savaşın ahlaki karmaşasını ustalıkla birleştiriyor."},{"t":"Star Wars","y":1977,"d":"George Lucas","r":121,"g":["Action","Adventure","Fantasy"],"c":["Mark Hamill","Harrison Ford"],"s":"Uzak bir gezegende yaşayan genç çiftçi Luke Skywalker, bir prensesi kurtarmak ve zalim İmparatorluğa karşı savaşmak için beklenmedik bir maceraya atılır. Sinemanın en büyük efsanelerinden birini başlatan film, masalsı saflığı ve yenilikçi efektleriyle hâlâ büyüleyici."},{"t":"Stroszek","y":1977,"d":"Werner Herzog","r":115,"g":["Comedy","Drama"],"c":[],"s":"Hapisten çıkan Berlinli sokak müzisyeni Bruno, yaşlı bir komşusu ve bir kadınla birlikte daha iyi bir hayat umuduyla Wisconsin'e göç eder. Herzog'un hem komik hem hüzünlü bu tuhaf masalı, Amerikan rüyasına unutulmaz bir melankoliyle bakıyor."},{"t":"Suspiria","y":1977,"d":"Dario Argento","r":92,"g":["Horror"],"c":[],"s":"Amerikalı genç bir balerin, Almanya'daki prestijli bir dans akademisine gelir ve okulda yaşanan gizemli ölümlerin ardındaki karanlığı sezmeye başlar. Dario Argento'nun keskin renkleri ve Goblin'in müziğiyle, korku sinemasının en çarpıcı görsel şölenlerinden biri."},{"t":"The American Friend","y":1977,"d":"Wim Wenders","r":128,"g":["Crime","Drama","Mystery"],"c":[],"s":"Ölümcül hastalığı olduğunu düşünen bir Hamburglu çerçeveci, gizemli Amerikalı Ripley aracılığıyla bir suç işine bulaşır. Wenders'in Patricia Highsmith uyarlaması, Dennis Hopper ile Bruno Ganz'ın buluşması ve melankolik atmosferiyle türün sınırlarını aşıyor."},{"t":"The Ascent","y":1977,"d":"Larisa Shepitko","r":111,"g":["Drama","War"],"c":[],"s":"İkinci Dünya Savaşı'nda karlı Belarus ormanlarında yiyecek arayan iki Sovyet partizanı, Almanların eline düşer ve inanç ile hayatta kalma arasında sınanır. Larisa Şepitko'nun manevi derinliği olan bu siyah beyaz başyapıtı, savaşı bir vicdan hikâyesine dönüştürüyor."},{"t":"The Hills Have Eyes","y":1977,"d":"Wes Craven","r":90,"g":["Horror","Thriller"],"c":[],"s":"Kaliforniya'ya giden bir aile, çölde arabası bozulunca tepelerde yaşayan vahşi bir klanın hedefi hâline gelir. Wes Craven'ın ham ve acımasız korku filmi, 'medeni' insanın ne kadar hızlı vahşileşebileceğini sorgulayan kült bir klasik."},{"t":"The Last Wave","y":1977,"d":"Peter Weir","r":106,"g":["Drama","Fantasy","Mystery"],"c":[],"s":"Sidney'de bir avukat, Aborjin bir grubun savunmasını üstlenir ve kendisini apokaliptik su vizyonları ile kadim kehanetlerin içinde bulur. Peter Weir'in gizemli ve atmosferik filmi, doğaüstü gerilimi Avustralya'nın unutulmuş hafızasıyla ustaca birleştiriyor."},{"t":"Dawn of the Dead","y":1978,"d":"George A. Romero","r":127,"g":["Horror","Thriller"],"c":[],"s":"Zombi salgını dünyayı sararken dört kişi büyük bir alışveriş merkezine sığınır ve orada kendilerine tuhaf bir cennet kurar. George A. Romero'nun tüketim kültürünü alaya alan zeki ve kanlı filmi, zombi türünün hâlâ en iyi örneklerinden sayılıyor."},{"t":"Days of Heaven","y":1978,"d":"Terrence Malick","r":94,"g":["Drama","Romance"],"c":[],"s":"1910'larda Chicago'dan kaçan bir işçi, sevgilisi ve küçük kız kardeşiyle Teksas'taki zengin bir çiftçinin buğday tarlalarında çalışmaya başlar. Terrence Malick'in altın saatlerde çekilmiş görüntüleri, bu filmi sinemanın en güzel görsel şiirlerinden biri yapıyor."},{"t":"Grease","y":1978,"d":"Randal Kleiser","r":110,"g":["Comedy","Musical","Romance"],"c":["John Travolta","Olivia Newton-John"],"s":"Tatilde yaşanan bir yaz aşkının ardından Sandy ile Danny aynı liseye düşer, ama Danny'nin havalı imajı işleri karıştırır. John Travolta ve Olivia Newton-John'lu bu enerjik müzikal, şarkılarıyla her kuşağın dilinde kalan neşeli bir klasik."},{"t
