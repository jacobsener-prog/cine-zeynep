 Bogart ile Bacall'ın keskin atışmaları başlı başına bir zevk."},{"t":"The Killers","y":1946,"d":"Robert Siodmak","r":103,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Küçük bir kasabada iki kiralık katil, kaçmaya bile yeltenmeyen sessiz bir adamı öldürür; bir sigorta müfettişi bu tuhaf teslimiyetin sırrını çözmeye koyulur. Hemingway öyküsünden doğan bu kara film, gölge dolu görüntüleri ve Burt Lancaster'ın parlak ilk rolüyle unutulmaz."},{"t":"The Postman Always Rings Twice","y":1946,"d":"Tay Garnett","r":113,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Yol kenarındaki bir lokantada iş bulan serseri bir adam, patronunun genç ve güzel karısına tutkuyla bağlanır ve ikisi karanlık bir plan kurmaya başlar. Lana Turner'ın beyazlar içindeki ilk görünüşüyle kara filmin en ikonik tutku ve suç hikâyelerinden biri."},{"t":"The Stranger","y":1946,"d":"Orson Welles","r":95,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Bir savaş suçları müfettişi, Connecticut'ta saygın bir öğretmen kimliğine bürünmüş kaçak bir Nazi'nin izini sürer. Orson Welles'in en derli toplu filmi; kasaba saat kulesinde doruğa ulaşan gerilimi ve atmosferik ışıklandırmasıyla keyifli bir kara film."},{"t":"Black Narcissus","y":1947,"d":"Emeric Pressburger","r":101,"g":["Drama","Thriller"],"c":[],"s":"Bir grup İngiliz rahibe, Himalayalarda rüzgârlı bir sarayda okul ve klinik kurmaya çalışırken bastırılmış arzular ve yalnızlıkla sınanır. Stüdyoda yaratılmış dağ manzaralarıyla Technicolor'ın belki de en büyüleyici kullanımı; görsel bir şölen."},{"t":"Monsieur Verdoux","y":1947,"d":"Charlie Chaplin","r":124,"g":["Comedy","Crime","Drama"],"c":[],"s":"Bunalım yıllarında işini kaybeden kibar bir banka memuru, ailesini geçindirmek için zengin dul kadınlarla evlenip onlardan kurtulmaya başlar. Chaplin'in en cesur ve kara mizahlı filmi; savaş ve kapitalizme dair keskin eleştirisi bugün bile şaşırtıcı."},{"t":"Odd Man Out","y":1947,"d":"Carol Reed","r":116,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Kuzey İrlanda'da bir soygunda yaralanan bir militan, polisten kaçarken şehrin karlı sokaklarında bir gece boyunca herkesin elinden ele geçer. James Mason'ın sarsıcı performansı ve şiirsel siyah beyaz görüntülerle Carol Reed'in sıkça gözden kaçan başyapıtı."},{"t":"Out of the Past","y":1947,"d":"Jacques Tourneur","r":97,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Küçük bir kasabada benzin istasyonu işleten sakin bir adam, geçmişinde bıraktığı tehlikeli bir kadın ve bir gangster yüzünden eski hayatına geri çekilir. Robert Mitchum'un soğukkanlılığı ve Jane Greer'in ölümcül cazibesiyle kara filmin mükemmel örneklerinden."},{"t":"The Ghost and Mrs. Muir","y":1947,"d":"Joseph L. Mankiewicz","r":104,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"Genç bir dul, deniz kenarındaki eski bir evi kiralar ve evin huysuz ama sevimli bir kaptanın hayaletiyle birlikte geldiğini keşfeder. Hüzünlü, romantik ve incelikli; Bernard Herrmann'ın müziği eşliğinde zamana meydan okuyan bir aşk masalı."},{"t":"The Lady From Shanghai","y":1947,"d":"Orson Welles","r":87,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"İrlandalı bir denizci, gizemli ve güzel bir kadının cazibesine kapılarak onun ünlü avukat kocasının yatında işe başlar ve bir cinayet komplosunun içine düşer. Welles'in çılgın, rüya gibi kara filmi; aynalar salonundaki final sinema tarihine geçmiştir."},{"t":"Bicycle Thieves","y":1948,"d":"Vittorio De Sica","r":89,"g":["Drama"],"c":[],"s":"Savaş sonrası Roma'da nihayet iş bulan bir baba, işi için şart olan bisikleti çalınınca küçük oğluyla birlikte şehri karış karış aramaya başlar. Yeni Gerçekçiliğin en saf ve yürek burkan eseri; sade anlatımıyla hâlâ herkesi derinden etkiliyor."},{"t":"Force of Evil","y":1948,"d":"Abraham Polonsky","r":79,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Wall Street'te çalışan hırslı bir avukat, yasadışı bahis çetelerini birleştirme planına ortak olurken ağabeyinin küçük işini de bu çarkın içine çeker. Neredeyse şiirsel diyalogları ve ahlaki derinliğiyle kara filmin en zeki ve kara talihli örneklerinden."},{"t":"Letter From an Unknown Woman","y":1948,"d":"Max Ophüls","r":87,"g":["Drama","Romance"],"c":[],"s":"Viyana'da bir piyanist, hayatı boyunca kendisini sessizce sevmiş ve onun hatırlamadığı bir kadından uzun bir mektup alır. Max Ophüls'ün akıcı kamerası ve Joan Fontaine'in kırılgan oyunuyla sinemanın en zarif ve hüzünlü aşk hikâyelerinden."},{"t":"Louisiana Story","y":1948,"d":"Robert Flaherty","r":78,"g":["Adventure","Drama"],"c":[],"s":"Louisiana bataklıklarında yaşayan küçük bir Cajun çocuğu, ailesinin arazisine gelen petrol sondajcılarıyla ve vahşi doğanın sırlarıyla tanışır. Belgesel ile kurmacayı buluşturan şiirsel görüntüleri ve Virgil Thomson'ın müziğiyle huzur veren bir film."},{"t":"Red River","y":1948,"d":"Howard Hawks","r":133,"g":["Drama","Western"],"c":[],"s":"Sert mizaçlı bir çiftlik sahibi, büyük bir sürüyü Teksas'tan Missouri'ye götürürken evlatlığıyla giderek derinleşen bir çatışmaya girer. John Wayne ile genç Montgomery Clift'in karşılaşması, Hawks'un destansı ve insani westernini benzersiz kılıyor."},{"t":"Rope","y":1948,"d":"Alfred Hitchcock","r":80,"g":["Crime","Drama","Mystery"],"c":[],"s":"İki genç arkadaş, üstün olduklarını kanıtlamak için bir cinayet işler ve aynı akşam cesedin saklandığı odada bir akşam yemeği partisi verir. Hitchcock'un tek plan yanılsamasıyla çekilmiş cesur deneyi; sahneye hapsolmuş gerilimi ustaca tırmanıyor."},{"t":"Secret Beyond the Door","y":1948,"d":"Fritz Lang","r":99,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Zengin bir kadın, kısa bir aşkın ardından evlendiği gizemli mimarın malikânesinde, kilitli odalarla dolu karanlık bir sırrın peşine düşer. Fritz Lang'ın Freudçu imgelerle örülmüş gotik gerilimi; atmosferi ve rüyamsı havasıyla ilginç bir keşif."},{"t":"Spring in a Small Town","y":1948,"d":"Mu Fei","r":98,"g":["Drama","Romance"],"c":[],"s":"Savaşın harap ettiği küçük bir kasabada, hasta kocasıyla mutsuz bir evlilik süren bir kadının hayatına eski aşkı konuk olarak döner. Çin sinemasının en narin ve şiirsel başyapıtlarından biri; söylenmeyenlerle konuşan sessiz bir melankoli."},{"t":"The Paleface","y":1948,"d":"Norman Z. McLeod","r":91,"g":["Comedy","Family","Western"],"c":[],"s":"Korkak bir diş hekimi, Vahşi Batı'da gizli görevdeki keskin nişancı Calamity Jane ile evlenince istemeden kahramana dönüşür. Bob Hope'un espri yağmuru ve Jane Russell'ın karizmasıyla western türüyle neşeyle dalga geçen, tasasız bir komedi."},{"t":"The Red Shoes","y":1948,"d":"Emeric Pressburger","r":135,"g":["Drama","Music","Romance"],"c":[],"s":"Genç bir balerin, tutkulu bir besteci ile sanatına her şeyini adamasını bekleyen otoriter bir impresaryo arasında bölünür. Powell ve Pressburger'in göz kamaştırıcı renkleri ve efsanevi bale sekansıyla sanat ile aşk üzerine en büyüleyici filmlerden."},{"t":"The Snake Pit","y":1948,"d":"Anatole Litvak","r":108,"g":["Drama","Mystery"],"c":[],"s":"Genç bir yazar, bir akıl hastanesinde nasıl oraya geldiğini hatırlamadan uyanır ve kendini yeniden bulmak için zorlu bir yolculuğa çıkar. Olivia de Havilland'ın cesur oyunuyla ruh sağlığı kurumlarını ilk kez bu kadar açık gösteren öncü ve etkileyici bir dram."},{"t":"The Treasure of the Sierra Madre","y":1948,"d":"John Huston","r":126,"g":["Adventure","Drama","Western"],"c":["Walter Huston"],"s":"Meksika'da beş parasız kalmış iki Amerikalı, yaşlı bir maden arayıcısıyla dağlarda altın aramaya çıkar, ama servet büyüdükçe güven azalır. Bogart'ın unutulmaz performansıyla açgözlülük üzerine yazılmış zamansız bir macera ve ahlak hikâyesi."},{"t":"Adam's Rib","y":1949,"d":"George Cukor","r":101,"g":["Comedy","Romance"],"c":[],"s":"Evli iki avukat, kocasını vuran bir kadının davasında karşı taraflarda yer alınca mahkeme salonundaki rekabet evlerine de taşar. Tracy ile Hepburn'ün eşsiz uyumu ve kadın erkek eşitliği üzerine zekice esprileriyle hâlâ tazeliğini koruyan bir komedi."},{"t":"Kind Hearts and Coronets","y":1949,"d":"Robert Hamer","r":106,"g":["Comedy","Crime"],"c":[],"s":"Aristokrat ailesinden dışlanmış kibar bir genç, dükalık unvanına ulaşmak için arada kalan akrabalarını tek tek ortadan kaldırmaya karar verir. Alec Guinness'in sekiz ayrı rolü ve incelikli kara mizahıyla Ealing komedilerinin taçtaki mücevheri."},{"t":"On the Town","y":1949,"d":"Stanley Donen","r":98,"g":["Comedy","Musical","Romance"],"c":[],"s":"Üç denizci New York'ta yalnızca yirmi dört saatlik izinlerini aşk ve eğlence peşinde koşarak geçirir. Gene Kelly ve Frank Sinatra'nın enerjisiyle, gerçek şehir sokaklarında çekilen neşeli şarkı ve dans sahneleriyle müzikallere taze bir soluk getiren film."},{"t":"The Heiress","y":1949,"d":"William Wyler","r":115,"g":["Drama","Romance"],"c":["Olivia de Havilland"],"s":"Utangaç ve varlıklı bir genç kadın, yakışıklı ama beş parasız bir talip ile ona karşı çıkan soğuk babası arasında kalır. Henry James uyarlaması bu dram, Olivia de Havilland'ın muhteşem dönüşümüyle incelikli ve derinden sarsıcı."},{"t":"The Reckless Moment","y":1949,"d":"Max Ophüls","r":82,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Kızını korumak isteyen bir anne, bir cesedi gizlemeye çalışırken kendisine şantaj yapan gizemli bir adamla karmaşık bir ilişkiye girer. Ophüls'ün banliyö evini gerilim sahnesine çeviren zarif kara filmi; James Mason'ın beklenmedik sıcaklığı etkileyici."},{"t":"The Third Man","y":1949,"d":"Carol Reed","r":104,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Savaş sonrası Viyana'ya arkadaşının davetiyle gelen bir Amerikalı yazar, onun gizemli ölümünü araştırırken şehrin karanlık karaborsa dünyasına dalar. Eğik kadrajları, çiter müziği ve Orson Welles'in efsanevi girişiyle sinemanın en kusursuz filmlerinden."},{"t":"Whisky Galore!","y":1949,"d":"Alexander Mackendrick","r":82,"g":["Comedy","Crime"],"c":[],"s":"Savaş yıllarında viskisi tükenmiş küçük bir İskoç adasının sakinleri, kıyıya oturan bir gemide binlerce kasa içki olduğunu öğrenir. Sıcak, muzip ve bol kahkahalı bir Ealing komedisi; topluluk dayanışmasının tatlı bir kutlaması."},{"t":"White Heat","y":1949,"d":"Raoul Walsh","r":114,"g":["Action","Crime","Drama"],"c":[],"s":"Annesine takıntılı, dengesiz bir gangster, çetesiyle büyük bir soygun planlarken aralarına sızan bir polis ajanından habersizdir. James Cagney'nin patlayıcı performansıyla gangster filmlerinin en yoğun ve unutulmaz örneklerinden."},{"t":"All About Eve","y":1950,"d":"Joseph L. Mankiewicz","r":138,"g":["Drama"],"c":["George Sanders"],"s":"Parlak ama yaşlanmakta olan bir Broadway yıldızı, hayranı olduğunu söyleyen genç bir kadını yanına alır ve kısa sürede onun gerçek niyetlerini sorgulamaya başlar. Bette Davis'in ışıltısı ve keskin diyaloglarıyla tiyatro dünyasına yazılmış en zekice hiciv."},{"t":"Gun Crazy","y":1950,"d":"Joseph H. Lewis","r":87,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Silahlara tutkun bir genç, bir panayırda tanıştığı keskin nişancı kadına aşık olur ve ikisi soygunlarla dolu bir kaçışa sürüklenir. Düşük bütçesine rağmen cesur kamera çalışması ve tutkulu enerjisiyle, sonradan gelen pek çok suç filmine ilham vermiş bir kült klasik."},{"t":"In a Lonely Place","y":1950,"d":"Nicholas Ray","r":94,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Öfke nöbetleriyle bilinen bir Hollywood senaristi cinayetle suçlanır ve ona alibi sağlayan komşusuyla aralarında kırılgan bir aşk başlar. Bogart'ın en karanlık ve en derin rollerinden biri; aşk ve güvensizlik üzerine acı bir kara film."},{"t":"Los Olvidados","y":1950,"d":"Manuel León Caballero","r":80,"g":["Crime","Drama"],"c":[],"s":"Mexico City'nin yoksul mahallelerinde, çete lideri bir gencin gölgesinde büyüyen çocukların sert ve kaotik hayatları anlatılır. Buñuel'in acımasız dürüstlüğü ve rüya sekanslarıyla, yoksulluğu romantize etmeyen sarsıcı bir başyapıt."},{"t":"Orpheus","y":1950,"d":"Jean Cocteau","r":112,"g":["Drama","Fantasy","Romance"],"c":[],"s":"Ünlü bir şair, gizemli bir prensesin ve onun ölüm diyarına açılan aynalarının büyüsüne kapılır. Jean Cocteau, Orpheus efsanesini modern Paris'e taşıyarak şiir, büyü ve sinema hilelerini birleştiren eşsiz bir rüya yaratıyor."},{"t":"Rashomon","y":1950,"d":"Akira Kurosawa","r":88,"g":["Crime","Drama","Mystery"],"c":[],"s":"Ormanda işlenen bir suç, bir haydut, bir kadın, ölen samuray ve bir tanık tarafından birbirinden farklı biçimlerde anlatılır. Kurosawa'nın gerçeğin göreceliği üzerine kurduğu bu film, dünyaya Japon sinemasını tanıtan ve anlatıyı kökten değiştiren bir mihenk taşı."},{"t":"Rio Grande","y":1950,"d":"John Ford","r":105,"g":["Drama","Romance","Western"],"c":[],"s":"Sınır karakolunda görevli sert bir süvari subayı, yıllardır görmediği oğlunun birliğine asker olarak katılmasıyla geçmişiyle yüzleşir. John Ford'un süvari üçlemesini kapatan bu film, John Wayne ile Maureen O'Hara'nın sıcak uyumuyla keyifli bir western."},{"t":"Sunset Boulevard","y":1950,"d":"Billy Wilder","r":110,"g":["Drama","Film-Noir"],"c":[],"s":"Beş parasız bir senarist, eski ihtişamının hayaliyle yaşayan unutulmuş bir sessiz film yıldızının malikânesine sığınır. Billy Wilder'ın Hollywood'a tuttuğu karanlık ve ironik ayna; Gloria Swanson'ın efsanevi performansıyla kült statüsünü hak ediyor."},{"t":"The Asphalt Jungle","y":1950,"d":"John Huston","r":112,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Hapisten yeni çıkan bir usta suçlu, büyük bir mücevher soygunu için bir ekip toplar, ama her üyenin kendi zaafları vardır. Soygun filmleri türünün temelini atan bu kara film, karakterlerine gösterdiği insani ilgiyle öne çıkıyor."},{"t":"Winchester '73","y":1950,"d":"Anthony Mann","r":92,"g":["Action","Drama","Western"],"c":[],"s":"Bir kovboy, atıcılık yarışmasında kazandığı ama çalınan eşsiz bir tüfeğin ve intikam almak istediği adamın peşine düşer. James Stewart'ın karanlık yüzünü keşfeden Anthony Mann westernlerinin ilki; tüfeğin elden ele dolaştığı yapısı çok keyifli."},{"t":"A Place in the Sun","y":1951,"d":"George Stevens","r":122,"g":["Drama","Romance"],"c":[],"s":"Yoksul bir genç, zengin amcasının fabrikasında çalışırken hem işçi bir kızla hem de sosyeteden büyüleyici bir güzelle ilişkiye girer. Montgomery Clift ile Elizabeth Taylor'ın yakın çekimleriyle hırs ve arzu üzerine sinemanın en romantik trajedilerinden."},{"t":"A Streetcar Named Desire","y":1951,"d":"Elia Kazan","r":122,"g":["Drama"],"c":["Karl Malden","Vivien Leigh","Kim Hunter"],"s":"Kırılgan ve geçmişinden kaçan Blanche, New Orleans'taki kız kardeşinin yanına sığınır ve kaba eniştesi Stanley ile şiddetli bir çatışmaya girer. Marlon Brando ve Vivien Leigh'in efsanevi performanslarıyla oyunculuk sanatını değiştiren bir film."},{"t":"Ace in the Hole","y":1951,"d":"Billy Wilder","r":111,"g":["Drama","Film-Noir"],"c":[],"s":"Gözden düşmüş bir gazeteci, bir mağarada mahsur kalan adamın haberini büyük bir medya gösterisine dönüştürmek için kurtarma işini bile geciktirir. Wilder'ın en acımasız ve öngörülü filmi; medya ve seyirci üzerine bugün her zamankinden güncel."},{"t":"An American in Paris","y":1951,"d":"Vincente Minnelli","r":114,"g":["Drama","Musical","Romance"],"c":[],"s":"Paris'te yaşayan Amerikalı bir ressam, varlıklı bir hamisi ile genç ve güzel bir Fransız kız arasında kalır. Gershwin şarkıları ve empresyonist tablolardan ilham alan on yedi dakikalık final balesiyle Hollywood müzikalinin renk dolu zirvesi."},{"t":"Diary of a Country Priest","y":1951,"d":"Robert Bresson","r":95,"g":["Drama"],"c":[],"s":"Fransız kırsalında sağlığı bozuk genç bir rahip, köylülerin kayıtsızlığı ve kendi inanç sınavlarıyla boğuşurken yaşadıklarını günlüğüne yazar. Bresson'un sade ve yoğun üslubuyla, ruhani hayat üzerine yapılmış en derin filmlerden biri."},{"t":"Pandora and the Flying Dutchman","y":1951,"d":"Albert Lewin","r":124,"g":["Drama","Fantasy","Mystery"],"c":[],"s":"İspanya'da bir sahil kasabasında erkekleri büyüleyen Amerikalı bir kadın, gizemli bir yatın kaptanına ve onun asırlık lanetine aşık olur. Ava Gardner'ın büyüleyici güzelliği ve Jack Cardiff'in Technicolor görüntüleriyle rüya gibi romantik bir masal."},{"t":"Strangers on a Train","y":1951,"d":"Alfred Hitchcock","r":101,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Trende tanışan bir tenisçi ve tuhaf bir yabancı, şakayla karışık cinayetlerini değiş tokuş etme fikrini konuşur, ama biri bunu ciddiye alır. Hitchcock'un en eğlenceli gerilimlerinden; atlıkarınca sahnesiyle nefes kesen bir usta işi."},{"t":"The African Queen","y":1951,"d":"John Huston","r":105,"g":["Adventure","Drama","Romance"],"c":["Humphrey Bogart"],"s":"Birinci Dünya Savaşı sırasında Afrika'da sert bir misyoner kadın ile içkici bir tekne kaptanı, küçük bir gemiyle nehirden aşağı tehlikeli bir yolculuğa çıkar. Bogart ile Hepburn'ün eğlenceli uyumuyla macera ve romantizmi bir araya getiren sevimli bir klasik."},{"t":"The Day the Earth Stood Still","y":1951,"d":"Robert Wise","r":92,"g":["Drama","Sci-Fi"],"c":[],"s":"Washington'a inen bir uzay gemisinden çıkan nazik bir yabancı, dev robotuyla birlikte insanlığa önemli bir uyarı getirir. Soğuk Savaş korkularına barışçıl bir mesajla yanıt veren, zekice ve etkileyici bir bilimkurgu klasiği."},{"t":"The Lavender Hill Mob","y":1951,"d":"Charles Crichton","r":78,"g":["Comedy","Crime"],"c":[],"s":"Sıkıcı bir banka memuru, yıllardır taşıdığı altın külçelerini çalıp onları Eyfel Kulesi biblosu olarak kaçırmak için beklenmedik bir çete kurar. Alec Guinness'in sevimli oyunuyla Ealing'in en tatlı ve eğlenceli soygun komedilerinden."},{"t":"Angel Face","y":1952,"d":"Otto Preminger","r":91,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Bir ambulans şoförü, zengin bir ailenin güzel ve gizemli kızına kapılır ve onun evinde şoför olarak çalışmaya başlar. Jean Simmons'ın masum yüzünün ardındaki karanlıkla Preminger'in en soğuk ve şaşırtıcı kara filmlerinden biri."},{"t":"Europe '51","y":1952,"d":"Roberto Rossellini","r":118,"g":["Drama"],"c":[],"s":"Oğlunu trajik biçimde kaybeden varlıklı bir kadın, yasını yoksullara yardım ederek aşmaya çalışırken çevresi onu anlamakta zorlanır. Ingrid Bergman'ın içten oyunuyla Rossellini'nin inanç, şefkat ve toplum üzerine sorgulayıcı dramı."},{"t":"Forbidden Games","y":1952,"d":"René Clément","r":86,"g":["Drama","War"],"c":[],"s":"1940'ta bombardımanda ailesini kaybeden küçük bir kız, bir köylü ailenin oğluyla ölüm üzerine kendi masum oyunlarını kurar. Savaşı bir çocuğun gözünden anlatan, hem naif hem yürek burkan bir başyapıt; gitar müziği unutulmaz."},{"t":"High Noon","y":1952,"d":"Fred Zinnemann","r":85,"g":["Drama","Thriller","Western"],"c":["Gary Cooper"],"s":"Evlenip görevi bırakmak üzere olan bir kasaba şerifi, intikam için dönen bir haydutla yüzleşmek zorunda kalır ve kimsenin ona yardım etmediğini görür. Gerçek zamanlı akan gerilimi ve Gary Cooper'ın yalnızlığıyla westernin en etkili örneklerinden."},{"t":"Ikiru","y":1952,"d":"Akira Kurosawa","r":143,"g":["Drama"],"c":[],"s":"Yıllarını bürokrasi içinde anlamsızca geçirmiş bir memur, ölümcül bir hastalığa yakalandığını öğrenince hayatına anlam katacak bir şey aramaya başlar. Kurosawa'nın en insani ve derin filmi; yaşamın değeri üzerine insanı sessizce dönüştüren bir eser."},{"t":"Singin' in the Rain","y":1952,"d":"Stanley Donen","r":103,"g":["Comedy","Musical","Romance"],"c":["Gene Kelly","Donald O'Connor"],"s":"Sesli filmlere geçişte bir sessiz sinema yıldızı, sesi korkunç partneri yüzünden zor duruma düşer ve genç bir dansçıyla çözüm arar. Neşesi hiç tükenmeyen bu müzikal, Gene Kelly'nin yağmurdaki dansıyla gelmiş geçmiş en sevilen filmlerden."},{"t":"The Bad and the Beautiful","y":1952,"d":"Vincente Minnelli","r":118,"g":["Drama","Romance"],"c":["Gloria Grahame"],"s":"Hırslı bir Hollywood yapımcısı, yükselişi sırasında kullandığı bir yönetmen, bir aktris ve bir yazarın gözünden anlatılır. Minnelli'nin şık ve iğneleyici dramı, sinema dünyasının ihtişamını ve acımasızlığını aynı anda gösteriyor."},{"t":"The Big Sky","y":1952,"d":"Howard Hawks","r":140,"g":["Adventure","Drama","Western"],"c":[],"s":"Kentucky'li iki kafadar, Missouri Nehri boyunca kürk ticareti yapmak için bir tekne kafilesine katılarak tehlikeli bir yolculuğa çıkar. Hawks'un dostluk üzerine sıcak, geniş soluklu macerası; doğa manzaraları ve samimi anlarıyla keyifli bir western."},{"t":"The Golden Coach","y":1952,"d":"Jean Renoir","r":103,"g":["Comedy","Drama","History"],"c":[],"s":"Sömürge dönemi Peru'sunda bir İtalyan tiyatro topluluğunun başrol oyuncusu, bir genel vali, bir boğa güreşçisi ve bir asker arasında gönlünü seçmeye çalışır. Anna Magnani'nin coşkusu ve Renoir'ın tiyatro ile hayat üzerine renkli oyunuyla büyüleyici bir film."},{"t":"The Quiet Man","y":1952,"d":"John Ford","r":129,"g":["Comedy","Drama","Romance"],"c":[],"s":"Geçmişinden kaçan Amerikalı eski bir boksör, doğduğu İrlanda köyüne döner ve ateşli bir kadına aşık olur, ama kadının ağabeyi engel olur. John Ford'un yeşil İrlanda manzaraları ve efsanevi kavga sahnesiyle sıcak, neşeli bir romantik komedi."},{"t":"Umberto D.","y":1952,"d":"Vittorio De Sica","r":89,"g":["Drama"],"c":[],"s":"Küçük emekli maaşıyla geçinemeyen yaşlı bir adam, tek dostu köpeğiyle birlikte kirasını ödeyip onurunu korumaya çalışır. De Sica'nın yalın ve şefkatli bakışıyla yalnızlık üzerine yapılmış en dokunaklı filmlerden biri."},{"t":"Beat the Devil","y":1953,"d":"John Huston","r":89,"g":["Action","Adventure","Comedy"],"c":[],"s":"İtalya'nın bir sahil kasabasında mahsur kalan bir grup dolandırıcı, Afrika'daki uranyum topraklarını ele geçirme planı kurar. Truman Capote'nin senaryosu ve Bogart'ın liderliğinde, kendi türüyle dalga geçen tuhaf ve eğlenceli bir kült komedi."},{"t":"From Here to Eternity","y":1953,"d":"Fred Zinnemann","r":118,"g":["Drama","Romance","War"],"c":["Frank Sinatra","Donna Reed"],"s":"Pearl Harbor saldırısı öncesinde Hawaii'deki bir orduda askerlerin aşkları, çatışmaları ve kişisel onur mücadeleleri iç içe geçer. Sahilde dalgalar arasındaki öpüşme sahnesiyle tarihe geçmiş, güçlü oyunculuklarla dolu bir dram."},{"t":"Gentlemen Prefer Blondes","y":1953,"d":"Howard Hawks","r":91,"g":["Comedy","Musical","Romance"],"c":[],"s":"Parayı seven Lorelei ve aşkı seven Dorothy adlı iki şovgirl, Paris'e giden bir transatlantik gemisinde erkeklerin kalbini çalar. Marilyn Monroe ve Jane Russell'ın parıltılı ikilisiyle neşeli, renkli ve ikonik şarkılarla dolu bir müzikal."},{"t":"Mr. Hulot's Holiday","y":1953,"d":"Jacques Tati","r":null,"g":["Comedy"],"c":[],"s":"Sakar ve iyi niyetli Mösyö Hulot, bir sahil kasabasındaki otelde tatilini geçirirken farkında olmadan her yerde küçük kaoslar yaratır. Neredeyse diyalogsuz, zarif görsel esprileriyle Jacques Tati'nin tatlı ve nostaljik başyapıtı."},{"t":"Pickup on South Street","y":1953,"d":"Samuel Fuller","r":80,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"New York metrosunda bir yankesici, bir kadının cüzdanını çalarken farkında olmadan casusların peşinde olduğu gizli bir mikrofilmi ele geçirir. Samuel Fuller'ın sert, hızlı ve enerjik kara filmi; Thelma Ritter'ın muhteşem yan rolüyle öne çıkıyor."},{"t":"Roman Holiday","y":1953,"d":"William Wyler","r":118,"g":["Comedy","Drama","Romance"],"c":["Audrey Hepburn"],"s":"Sıkıcı resmi görevlerinden bunalan bir prenses, Roma'da gizlice kaçar ve kimliğinden habersiz görünen bir Amerikalı gazeteciyle bir gün geçirir. Audrey Hepburn'ün büyüleyici ilk büyük rolüyle zamansız, zarif ve tatlı hüzünlü bir romantik komedi."},{"t":"Shane","y":1953,"d":"George Stevens","r":118,"g":["Drama","Western"],"c":[],"s":"Gizemli bir silahşor, bir çiftçi ailesinin yanında çalışmaya başlar ve topraklarını ele geçirmek isteyen sığırcılara karşı onları korur. Küçük bir çocuğun gözünden anlatılan bu western, geniş manzaraları ve efsanevi finaliyle türün en şiirsel örneklerinden."},{"t":"Sommaren Med Monika","y":1953,"d":"Ingmar Bergman","r":96,"g":["Drama","Romance"],"c":[],"s":"Stockholm'de sıkıcı işlerinden bunalan genç bir çift, bir yaz boyunca tekneyle adalara kaçıp özgürlüğü tadar. Harriet Andersson'ın cesur ve doğal performansıyla Bergman'ın gençlik ve hayal kırıklığı üzerine tazeliğini koruyan filmi."},{"t":"The Band Wagon","y":1953,"d":"Vincente Minnelli","r":112,"g":["Comedy","Musical","Romance"],"c":[],"s":"Kariyeri sönmekte olan bir film yıldızı, iddialı bir yönetmenin elinde karmaşık bir Broadway gösterisine dönüşme riski taşıyan bir müzikale katılır. Fred Astaire ile Cyd Charisse'in parktaki dansıyla Hollywood müzikalinin en zarif örneklerinden."},{"t":"The Big Heat","y":1953,"d":"Fritz Lang","r":89,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Dürüst bir polis dedektifi, bir meslektaşının ölümünü araştırırken şehri yöneten suç örgütüyle kişisel bir savaşa girer. Fritz Lang'ın sert ve acımasız kara filmi; Gloria Grahame'in unutulmaz rolüyle türün en güçlü örneklerinden."},{"t":"The Bigamist","y":1953,"d":"Ida Lupino","r":80,"g":["Drama","Film-Noir"],"c":[],"s":"Evlat edinme süreci sırasında bir adamın iki ayrı şehirde iki ayrı karısı olduğu ortaya çıkar ve hikâye onun gözünden anlatılır. Yönetmen koltuğunda da oturan Ida Lupino'nun yargılamadan yaklaştığı, şaşırtıcı derecede anlayışlı bir dram."},{"t":"The Earrings of Madame De...","y":1953,"d":"Max Ophüls","r":105,"g":["Drama","Romance"],"c":[],"s":"Varlıklı bir kadın, kocasının hediyesi olan küpeleri borç için gizlice satar ve bu küpeler elden ele dolaşarak onun hayatını değiştirir. Max Ophüls'ün akıcı kamerası ve Danielle Darrieux'nun zarafetiyle sinemanın en rafine eserlerinden."},{"t":"The Naked Spur","y":1953,"d":"Anthony Mann","r":91,"g":["Drama","Thriller","Western"],"c":[],"s":"Ödül avcısı olmaya zorlanmış bir adam, kaçak bir katili teslim etmeye çalışırken yanına katılan güvenilmez yol arkadaşlarıyla Rocky Dağları'nda zorlu bir yolculuğa çıkar. Beş kişilik yoğun kadrosuyla psikolojik derinliği yüksek bir Anthony Mann westerni."},{"t":"The Wages of Fear","y":1953,"d":"Henri-Georges Clouzot","r":156,"g":["Adventure","Drama","Thriller"],"c":[],"s":"Güney Amerika'da bir kasabada sıkışmış dört adam, yüksek bir ücret karşılığında iki kamyon dolusu nitrogliserini tehlikeli dağ yollarından taşımayı kabul eder. Sinema tarihinin en gergin filmlerinden biri; her sarsıntı sizi koltuğunuza çiviler."},{"t":"Tokyo Story","y":1953,"d":"Yasujirō Ozu","r":137,"g":["Drama"],"c":[],"s":"Yaşlı bir çift, büyük şehirde yaşayan çocuklarını ziyarete gider ama onların kendi hayatlarında fazla meşgul olduğunu görür. Ozu'nun sakin ve yalın anlatımıyla aile, zaman ve kuşaklar üzerine yapılmış en bilge ve dokunaklı filmlerden."},{"t":"Ugetsu","y":1953,"d":"Kenji Mizoguchi","r":96,"g":["Drama","Fantasy","War"],"c":[],"s":"İç savaş yıllarında Japonya'da bir çömlekçi ile kayınbiraderi, zenginlik ve şan hayalleriyle ailelerini geride bırakınca kendilerini doğaüstü bir yolculukta bulur. Mizoguchi'nin sisli göl sahneleriyle hayalet hikâyesi ile ahlak masalını birleştiren büyüleyici başyapıtı."},{"t":"A Star Is Born","y":1954,"d":"George Cukor","r":154,"g":["Drama","Musical","Romance"],"c":[],"s":"Yeteneğini keşfettiği genç bir şarkıcıyı yıldız yapan ünlü bir aktör, kendi kariyeri alkolle çökerken onunla evlenir. Judy Garland'ın hayatının performansı ve unutulmaz şarkılarıyla Hollywood'un şöhret üzerine en duygusal anlatılarından."},{"t":"Animal Farm","y":1954,"d":"John Halas","r":72,"g":["Animation","Drama"],"c":[],"s":"Zalim sahiplerine karşı ayaklanan çiftlik hayvanları kendi eşitlikçi düzenlerini kurar, ama domuzlar giderek iktidarı ele geçirir. Orwell'in ünlü alegorisinden uyarlanan bu İngiliz animasyonu, çocuk masalı görünümünün ardında sert bir siyasi hiciv sunuyor."},{"t":"Carmen Jones","y":1954,"d":"Otto Preminger","r":105,"g":["Drama","Musical","Romance"],"c":[],"s":"Bizet'nin Carmen operası, İkinci Dünya Savaşı döneminde bir paraşüt fabrikasında çalışan ateşli bir kadın ile genç bir asker arasındaki tutkuya dönüşür. Dorothy Dandridge'in göz kamaştıran oyunuyla tamamen siyahi kadrolu, cesur ve renkli bir müzikal."},{"t":"Johnny Guitar","y":1954,"d":"Nicholas Ray","r":110,"g":["Drama","Western"],"c":[],"s":"Kasaba dışında bir salon işleten güçlü bir kadın, onu yok etmek isteyen kıskanç bir rakip ve öfkeli kasabalılarla karşı karşıya gelir. Joan Crawford ile Mercedes McCambridge'in çatışmasıyla, gözalıcı renkleri ve operatik tutkusuyla eşsiz bir western."},{"t":"Journey to Italy","y":1954,"d":"Roberto Rossellini","r":97,"g":["Drama","Romance"],"c":[],"s":"Evliliklerinde soğukluk yaşayan İngiliz bir çift, miras kalan bir villayı satmak için Napoli'ye gider ve bu yolculuk ilişkilerini sınar. Rossellini'nin modern sinemanın habercisi sayılan, sessiz ve derin bir evlilik portresi."},{"t":"La Strada","y":1954,"d":"Federico Fellini","r":108,"g":["Drama"],"c":[],"s":"Saf ve iyi kalpli Gelsomina, kaba bir gezgin sanatçıya satılır ve onunla İtalya yollarında gösteri yapmaya başlar. Giulietta Masina'nın Chaplinvari oyunu ve Nino Rota'nın müziğiyle Fellini'nin en şiirsel ve yürek burkan filmi."},{"t":"On the Waterfront","y":1954,"d":"Elia Kazan","r":108,"g":["Crime","Drama","Thriller"],"c":["Marlon Brando","Eva Marie Saint"],"s":"Eski bir boksör olan liman işçisi, sendikayı yöneten yozlaşmış çeteye karşı konuşup konuşmamak arasında bir vicdan savaşı verir. Marlon Brando'nun efsanevi oyunuyla Amerikan sinemasının en güçlü ve etkileyici dramlarından."},{"t":"Rear Window","y":1954,"d":"Alfred Hitchcock","r":112,"g":["Drama","Mystery","Thriller"],"c":["James Stewart","Grace Kelly"],"s":"Bacağı alçıda evde kalan bir fotoğrafçı, penceresinden komşularını izlerken birinin cinayet işlediğinden şüphelenmeye başlar. Hitchcock'un izleme ve merak üzerine kurduğu kusursuz gerilim; Grace Kelly'nin zarafeti ise işin cabası."},{"t":"Salt of the Earth","y":1954,"d":"Herbert J. Biberman","r":94,"g":["Drama","History"],"c":[],"s":"New Mexico'da Meksika kökenli maden işçileri greve çıkar ve bir yasak yüzünden grev hattını kadınlar devralır. Kara listeye alınmış sinemacılarla gerçek işçilerin çektiği bu cesur film, dönemin koşullarında bir direniş eseri."},{"t":"Sansho the Bailiff","y":1954,"d":"Kenji Mizoguchi","r":124,"g":["Drama"],"c":[],"s":"Feodal Japonya'da sürgün edilmiş bir valinin çocukları, zalim bir kâhyanın yanında köle olarak satılır ve yıllarca annelerine kavuşmayı hayal eder. Mizoguchi'nin merhamet ve direniş üzerine yarattığı en derin ve dokunaklı eserlerden biri."},{"t":"Seven Brides for Seven Brothers","y":1954,"d":"Stanley Donen","r":102,"g":["Comedy","Musical","Romance"],"c":[],"s":"Oregon'da dağlarda yaşayan yedi kardeşten en büyüğü evlenince kardeşleri de eş bulmak için kasabaya iner. Ahır inşa etme sahnesindeki akrobatik danslarıyla enerjisi hiç düşmeyen, neşeli ve renkli bir müzikal."},{"t":"Seven Samurai","y":1954,"d":"Akira Kurosawa","r":207,"g":["Action","Drama"],"c":["Toshirō Mifune","Takashi Shimura"],"s":"Eşkıyaların tehdidi altındaki bir köy, kendilerini korumaları için yedi samuray kiralar. Kurosawa'nın destansı başyapıtı; karakter derinliği, yağmurlu savaş sahneleri ve sayısız filme ilham veren yapısıyla sinemanın zirvelerinden."},{"t":"Silver Lode","y":1954,"d":"Allan Dwan","r":81,"g":["Drama","Western"],"c":[],"s":"Düğün gününde, bir şerif ve adamları saygın bir kasabalıyı cinayetle suçlayarak tutuklamaya gelir ve kasaba ona karşı dönmeye başlar. McCarthy dönemini ima eden bu küçük ama zekice western, gerilimli temposuyla şaşırtıcı bir keşif."},{"t":"The Barefoot Contessa","y":1954,"d":"Joseph L. Mankiewicz","r":128,"g":["Crime","Drama","Mystery"],"c":["Edmond O'Brien"],"s":"İspanya'da bir dansçı Hollywood yıldızına dönüşür; onun hikâyesi hayatına dokunmuş erkeklerin gözünden anlatılır. Ava Gardner'ın büyüsü ve Humphrey Bogart'ın anlatıcılığıyla şöhret ve yalnızlık üzerine şık bir dram."},{"t":"All That Heaven Allows","y":1955,"d":"Douglas Sirk","r":89,"g":["Drama","Romance"],"c":[],"s":"Varlıklı bir dul kadın, kendinden genç bir bahçıvana aşık olunca çevresinin ve çocuklarının dedikodu ve önyargılarıyla yüzleşir. Douglas Sirk'ün göz alıcı renkleri ve ince sosyal eleştirisiyle melodramın en zarif örneği."},{"t":"Artists and Models","y":1955,"d":"Frank Tashlin","r":109,"g":["Comedy","Musical","Romance"],"c":[],"s":"Çizgi roman tutkunu saf bir adam ile karikatürist oda arkadaşı, gördüğü rüyaları çizgi romanlara dönüştürürken bir casusluk entrikasına karışır. Martin ile Lewis ikilisinin en renkli filmlerinden; çizgi film gibi esprileriyle neşeli bir komedi."},{"t":"Bad Day at Black Rock","y":1955,"d":"John Sturges","r":81,"g":["Crime","Drama","Mystery"],"c":[],"s":"Tek kollu bir yabancı, çölün ortasındaki küçük bir kasabaya gelir ve kasabalıların saklamaya çalıştığı karanlık bir sırrın izini sürer. Spencer Tracy'nin sakin gücü ve geniş ekran görüntüleriyle gerilimi ustalıkla kuran kısa ve etkili bir film."},{"t":"Diabolique","y":1955,"d":"Henri-Georges Clouzot","r":117,"g":["Crime","Drama","Horror"],"c":[],"s":"Zalim bir okul müdürünün hem karısı hem metresi olan iki kadın, ondan kurtulmak için birlikte bir plan yapar. Clouzot'nun en ürkütücü gerilimlerinden; unutulmaz finali ve yoğun atmosferiyle Hitchcock'u bile kıskandırmış bir film."},{"t":"Guys and Dolls","y":1955,"d":"Joseph L. Mankiewicz","r":150,"g":["Comedy","Crime","Musical"],"c":[],"s":"New York'lu bir kumarbaz, arkadaşının iddiası yüzünden Kurtuluş Ordusu'nda çalışan ciddi bir kadını Havana'ya götürmeye çalışır. Brando ve Sinatra'nın başrollerinde Broadway'in renkli dünyasını ekrana taşıyan eğlenceli bir müzikal."},{"t":"Hill 24 Doesn't Answer","y":1955,"d":"Thorold Dickinson","r":null,"g":["War"],"c":[],"s":"1948 Arap İsrail Savaşı sırasında Kudüs yakınlarında bir tepeyi korumakla görevlendirilen dört askerin geçmişleri geriye dönüşlerle anlatılır. İsrail sinemasının ilk büyük uluslararası filmlerinden; insan hikâyeleriyle dönemin atmosferini yansıtıyor."},{"t":"Kiss Me Deadly","y":1955,"d":"Robert Aldrich","r":106,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Acımasız dedektif Mike Hammer, gece yolunda aldığı kaçak bir kadının ölümünün ardından esrarengiz bir kutunun peşine düşer. Nükleer paranoyayı kara filme taşıyan bu cesur ve karanlık film, sonraki pek çok yönetmene ilham verdi."},{"t":"Les Maîtres Fous","y":1955,"d":"Jean Rouch","r":null,"g":["Documentary"],"c":[],"s":"Gana'da göçmen işçilerin, sömürge yöneticilerini taklit eden trans halindeki ayinlerini belgeleyen kısa ve çarpıcı bir belgesel. Jean Rouch'un etnografik sinemayı kökten etkileyen, hem rahatsız edici hem düşündürücü eseri."},{"t":"Lola Montès","y":1955,"d":"Max Ophüls","r":116,"g":["Biography","Drama","Romance"],"c":[],"s":"Ünlü bir güzel ve skandal kadını olan Lola Montès, bir sirk gösterisinde kendi hayatını seyirciye sergilerken aşklarını hatırlar. Ophüls'ün son filmi; göz kamaştırıcı renkleri ve hareketli kamerasıyla görsel bir şölen."},{"t":"Marty","y":1955,"d":"Delbert Mann","r":90,"g":["Drama","Romance"],"c":["Ernest Borgnine"],"s":"Bronx'ta annesiyle yaşayan, kendini çirkin ve yalnız hisseden bekâr bir kasap, bir dans salonunda utangaç bir öğretmenle tanışır. Sade, sıcak ve samimi bir aşk hikâyesi; sıradan insanların hayatına gösterdiği şefkatle hâlâ çok etkileyici."},{"t":"Night and Fog","y":1955,"d":"Alain Resnais","r":null,"g":["Documentary"],"c":[],"s":"Terk edilmiş toplama kamplarının renkli görüntüleri ile savaş dönemi arşivleri, Holokost'un belleğini sorgulayan bir anlatıda buluşur. Alain Resnais'nin kısa ama unutulmaz belgeseli; tarih ve hafıza üzerine sarsıcı ve gerekli bir film."},{"t":"Oklahoma!","y":1955,"d":"Fred Zinnemann","r":145,"g":["Drama","Musical","Romance"],"c":[],"s":"Oklahoma'nın kırsalında bir kovboy ile huysuz bir çiftlik işçisi, aynı genç kadının gönlünü kazanmak için yarışır. Rodgers ve Hammerstein'ın ünlü şarkılarıyla geniş ekranda neşe dolu bir Amerikan müzikali."},{"t":"Ordet","y":1955,"d":"Carl Theodor Dreyer","r":126,"g":["Drama"],"c":[],"s":"Danimarka kırsalında inanç konusunda derin görüş ayrılıkları yaşayan bir çiftçi ailesi, bir mucizenin mümkün olup olmadığıyla sınanır. Dreyer'in yavaş, sade ve derin başyapıtı; inanç ve sevgi üzerine sinemanın en etkileyici filmlerinden."},{"t":"Pather Panchali","y":1955,"d":"Satyajit Ray","r":125,"g":["Drama","History"],"c":[],"s":"Bengal'in bir köyünde yoksul bir ailenin küçük oğlu Apu ile ablası Durga, hayatın küçük mucizeleri ve zorlukları arasında büyür. Satyajit Ray'in ilk filmi ve Apu üçlemesinin başlangıcı; Ravi Shankar'ın müziğiyle şiirsel bir başyapıt."},{"t":"Rebel Without a Cause","y":1955,"d":"Nicholas Ray","r":111,"g":["Drama"],"c":[],"s":"Yeni bir kasabaya taşınan huzursuz bir genç, anlaşılmama duygusu ve aile sorunlarıyla boğuşurken iki yalnız gençle yakınlaşır. James Dean'in efsanevi rolüyle gençlik isyanını tanımlayan, renkli ve duygusal bir klasik."},{"t":"Senso","y":1955,"d":"Luchino Visconti","r":123,"g":["Drama","Romance","War"],"c":[],"s":"1866'da Avusturya işgali altındaki Venedik'te bir kontes, genç bir Avusturyalı subaya tutkuyla aşık olur ve her şeyini riske atar. Visconti'nin opera görkemindeki renkli ve tutkulu dönem draması; görsel olarak baş döndürücü."},{"t":"Smiles of a Summer Night","y":1955,"d":"Ingmar Bergman","r":109,"g":["Comedy","Romance"],"c":[],"s":"Yüzyıl dönümü İsveç'inde bir avukat, bir oyuncu ve çevresindeki çiftler, bir yaz gecesi kır evinde aşk oyunlarına dalar. Bergman'ın en hafif ve zarif filmi; esprili, romantik ve sonradan pek çok esere ilham vermiş bir komedi."},{"t":"The Ladykillers","y":1955,"d":"Alexander Mackendrick","r":91,"g":["Comedy","Crime"],"c":[],"s":"Bir grup suçlu, yaşlı ve tatlı bir dul kadının evinde oda kiralayıp müzisyen gibi davranarak bir soygun planlar. Alec Guinness'in tuhaf karakteriyle Ealing'in kara mizahlı ve sevimli komedilerinin en iyilerinden."},{"t":"The Man With the Golden Arm","y":1955,"d":"Otto Preminger","r":119,"g":["Crime","Drama","Romance"],"c":[],"s":"Hapisten çıkan bir kumar krupiyesi, davulcu olarak yeni bir hayat kurmaya çalışırken bağımlılığı ve eski çevresiyle mücadele eder. Frank Sinatra'nın güçlü oyunu ve Elmer Bernstein'ın caz müziğiyle cesur bir dram."},{"t":"The Night of the Hunter","y":1955,"d":"Charles Laughton","r":92,"g":["Crime","Drama","Thriller"],"c":[],"s":"Parmaklarında SEVGİ ve NEFRET dövmeleri olan sahte bir vaiz, saklı parayı bulmak için iki çocuğun peşine düşer. Charles Laughton'ın tek yönetmenlik denemesi; masalsı ve ürkütücü görüntüleriyle eşsiz bir başyapıt."},{"t":"The Phenix City Story","y":1955,"d":"Phil Karlson","r":100,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Alabama'da yozlaşmış bir kasabada, bir avukat ve oğlu, şehri yöneten suç örgütüne karşı mücadele etmeye başlar. Gerçek olaylara dayanan bu sert ve belgesel tadındaki suç filmi, cesur şiddeti ve tempolu anlatımıyla etkileyici."},{"t":"A Man Escaped","y":1956,"d":"Robert Bresson","r":101,"g":["Drama","Thriller","War"],"c":[],"s":"İkinci Dünya Savaşı sırasında Nazilerin elindeki bir hapishanede tutulan bir Fransız direnişçi, sabırla ve titizlikle kaçış planı kurar. Bresson'un sade ve yoğun üslubuyla, her küçük hareketi nefes kesen bir gerilime dönüşen başyapıt."},{"t":"Aparajito","y":1956,"d":"Satyajit Ray","r":110,"g":["Drama"],"c":[],"s":"Apu üçlemesinin ikinci filminde, genç Apu Benares'e taşınır ve eğitim için şehre gitmeye karar verirken annesiyle bağı değişir. Büyüme, anne sevgisi ve ayrılık üzerine Satyajit Ray'in derinden dokunaklı bir eseri."},{"t":"Bigger Than Life","y":1956,"d":"Nicholas Ray","r":95,"g":["Drama"],"c":[],"s":"Mütevazı bir öğretmen, ciddi bir hastalık için kullandığı yeni bir ilaçla değişmeye başlar ve ailesi için tehlikeli bir figüre dönüşür. Nicholas Ray'in banliyö ailesinin çatlaklarını gösteren renkli, cesur ve rahatsız edici dramı."},{"t":"Bob Le Flambeur","y":1956,"d":"Jean-Pierre Melville","r":102,"g":["Crime","Drama","Thriller"],"c":[],"s":"Montmartre'da kumara düşkün, saygın ve yaşlanan bir suçlu, Deauville'deki bir kumarhaneyi soymak için son bir büyük plan yapar. Melville'in havalı ve şık kara filmi; Fransız Yeni Dalgası'nın habercisi sayılan bir gece şiiri."},{"t":"Forbidden Planet","y":1956,"d":"Fred M. Wilcox","r":98,"g":["Adventure","Sci-Fi"],"c":[],"s":"Uzak bir gezegene giden bir uzay gemisi, orada kızıyla yalnız yaşayan bir bilim adamı ve gizemli bir güçle karşılaşır. Shakespeare'in Fırtına oyunundan ilham alan, elektronik müziği ve Robby the Robot'uyla bilimkurgunun öncü klasiklerinden."},{"t":"Giant","y":1956,"d":"George Stevens","r":201,"g":["Drama","Western"],"c":[],"s":"Teksas'ta dev bir çiftliğin sahibi olan varlıklı bir adam, Doğulu karısı ve petrol zengini olan hırslı bir işçiyle yıllara yayılan bir hayat sürer. James Dean'in son filmi; aile, toprak ve önyargı üzerine destansı bir dram."},{"t":"High Society","y":1956,"d":"Charles Walters","r":111,"g":["Comedy","Musical","Romance"],"c":[],"s":"Zengin bir sosyete kızının düğünü öncesinde eski kocası, bir gazeteci ve nişanlısı arasında karmaşık bir aşk oyunu başlar. Grace Kelly, Bing Crosby ve Frank Sinatra'nın buluştuğu, Cole Porter şarkılarıyla şık bir müzikal komedi."},{"t":"Invasion of the Body Snatchers","y":1956,"d":"Don Siegel","r":80,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Küçük bir Kaliforniya kasabasında bir doktor, insanların yerini duygusuz kopyaların aldığını fark eder. Soğuk Savaş paranoyasını mükemmel yansıtan bu bilimkurgu, gerilim dolu atmosferiyle hâlâ ürkütücü."},{"t":"The Burmese Harp","y":1956,"d":"Kon Ichikawa","r":116,"g":["Drama","Music","War"],"c":[],"s":"İkinci Dünya Savaşı'nın sonunda Burma'da bir Japon asker, arkadaşlarından ayrılıp keşiş kılığına girer ve savaşın acılarıyla yüzleşir. Kon Ichikawa'nın barış ve merhamet üzerine yaptığı, müzikle yoğrulmuş dokunaklı bir film."},{"t":"The Man Who Knew Too Much","y":1956,"d":"Alfred Hitchcock","r":120,"g":["Crime","Drama","Mystery"],"c":[],"s":"Fas'ta tatil yapan Amerikalı bir çift, bir suikast planına tanık olunca oğulları kaçırılır. Hitchcock'un Albert Hall'daki nefes kesen sahnesi ve Doris Day'in Que Sera Sera şarkısıyla keyifli bir gerilim."},{"t":"The Searchers","y":1956,"d":"John Ford","r":119,"g":["Adventure","Western"],"c":[],"s":"İç Savaş'tan dönen hırçın bir asker, Komançiler tarafından kaçırılan yeğenini bulmak için yıllar sürecek bir aramaya çıkar. John Ford'un en karmaşık ve görkemli westerni; John Wayne'in en karanlık rolüyle sinemanın zirvelerinden."},{"t":"The Ten Commandments","y":1956,"d":"Cecil B. DeMille","r":220,"g":["Adventure","Drama","Family"],"c":[],"s":"Mısır sarayında büyüyen Musa, gerçek kimliğini öğrenince halkını kölelikten kurtarmak için firavunla karşı karşıya gelir. Cecil B. DeMille'in görkemli prodüksiyonu; Kızıldeniz'in yarılması sahnesiyle efsanevi bir destan."},{"t":"The Wrong Man","y":1956,"d":"Alfred Hitchcock","r":105,"g":["Drama","Film-Noir"],"c":[],"s":"Bir caz müzisyeni, soygun yapan bir adamla karıştırılınca tutuklanır ve ailesi bu haksızlığın yükü altında dağılmaya başlar. Hitchcock'un gerçek bir olaya dayanan, belgesel sadeliğindeki en ciddi ve rahatsız edici filmlerinden."},{"t":"Written on the Wind","y":1956,"d":"Douglas Sirk","r":99,"g":["Drama"],"c":["Dorothy Malone"],"s":"Teksaslı zengin bir petrol ailesinin ele avuca sığmaz çocukları, sevgi ve kıskançlıkla dolu bir ilişkiler ağında birbirini yıkar. Douglas Sirk'ün göz alıcı renkleri ve ateşli melodramıyla türün en keyifli örneklerinden."},{"t":"12 Angry Men","y":1957,"d":"Sidney Lumet","r":96,"g":["Crime","Drama"],"c":["Henry Fonda","Lee J. Cobb"],"s":"Bir cinayet davasında jürideki on iki adamdan biri, sanığın suçluluğuna dair şüphelerini dile getirir ve tartışma giderek kızışır. Tek bir odada geçen bu film, keskin diyalogları ve Henry Fonda'nın sakin gücüyle zamansız bir başyapıt."},{"t":"An Affair to Remember","y":1957,"d":"Leo McCarey","r":115,"g":["Drama","Romance"],"c":[],"s":"Bir transatlantik yolculuğunda tanışan iki nişanlı, birbirine aşık olur ve altı ay sonra Empire State Binası'nda buluşmak üzere söz verir. Cary Grant ile Deborah Kerr'in zarif uyumuyla gelmiş geçmiş en romantik filmlerden biri."},{"t":"Gunfight at the O.K. Corral","y":1957,"d":"John Sturges","r":122,"g":["Biography","Drama","Western"],"c":[],"s":"Şerif Wyatt Earp ile hasta ve kumarbaz dostu Doc Holliday, Tombstone'da Clanton çetesiyle efsanevi hesaplaşmaya doğru ilerler. Burt Lancaster ve Kirk Douglas'ın güçlü ikilisiyle klasik western tadında, tempolu bir film."},{"t":"Mother India","y":1957,"d":"Mehboob Khan","r":172,"g":["Action","Comedy","Drama"],"c":[],"s":"Hindistan'ın bir köyünde yoksul bir kadın, kocasının gidişinin ardından çocuklarını büyütmek için tefeciye ve doğaya karşı savaşır. Nargis'in destansı rolüyle Hint sinemasının en ikonik ve duygusal filmlerinden."},{"t":"Nights of Cabiria","y":1957,"d":"Federico Fellini","r":110,"g":["Drama"],"c":[],"s":"Roma'nın kenar mahallelerinde yaşayan saf yüzlü bir hayat kadını, tekrar tekrar kırılmasına rağmen aşka ve insanlara inanmaya devam eder. Giulietta Masina'nın unutulmaz gülümsemesiyle Fellini'nin umut üzerine en şefkatli filmi."},{"t":"Paths of Glory","y":1957,"d":"Stanley Kubrick","r":88,"g":["Drama","War"],"c":[],"s":"Birinci Dünya Savaşı'nda bir Fransız albay, intihar niteliğindeki bir saldırının başarısızlığı sonrası askerlerini korumak için komutanlarına karşı çıkar. Kubrick'in savaş karşıtı başyapıtı; siper sahneleri ve ahlaki gücüyle sarsıcı."},{"t":"Sweet Smell of Success","y":1957,"d":"Alexander Mackendrick","r":96,"g":["Drama","Film-Noir"],"c":[],"s":"Güçlü bir gazete köşe yazarı, kız kardeşinin aşk ilişkisini bitirmek için hırslı bir basın ajanını kullanır. Keskin diyalogları, New York gecelerinin görüntüleri ve Burt Lancaster'ın buz gibi rolüyle nefis bir kara film."},{"t":"The Bridge on the River Kwai","y":1957,"d":"David Lean","r":161,"g":["Adventure","Drama","War"],"c":["Alec Guinness"],"s":"Bir Japon esir kampında İngiliz bir albay, askerlerinin moralini korumak için düşman adına bir köprü inşa etmeye girişir. David Lean'in epik savaş filmi; ıslıkla çalınan marşı ve ahlaki ikilemleriyle unutulmaz bir klasik."},{"t":"The Cranes Are Flying","y":1957,"d":"Mikhail Kalatozov","r":95,"g":["Drama","Romance","War"],"c":[],"s":"Moskova'da genç bir kadın, savaşa giden sevgilisini beklerken hayatı altüst olur. Sovyet sinemasının en özgür ruhlu filmlerinden; dönen kamerası ve Tatyana Samoylova'nın oyunuyla hem görsel hem duygusal bir şaheser."},{"t":"The Incredible Shrinking Man","y":1957,"d":"Jack Arnold","r":81,"g":["Adventure","Drama","Fantasy"],"c":[],"s":"Gizemli bir sise maruz kalan bir adam, her geçen gün biraz daha küçülür ve kendi evinde bir hayatta kalma mücadelesine girer. Özel efektleri ve şaşırtıcı felsefi derinliğiyle, 50'lerin bilimkurgu dalgasının en akılda kalan filmlerinden."},{"t":"The Seventh Seal","y":1957,"d":"Ingmar Bergman","r":96,"g":["Drama","Fantasy"],"c":[],"s":"Haçlı Seferi'nden dönen bir şövalye, vebanın kasıp kavurduğu İsveç'te Ölüm ile satranç oynayarak zaman kazanmaya çalışır. Bergman'ın inanç ve ölüm üzerine yaptığı, ikonik imgeleriyle sinemanın en tanınan başyapıtlarından."},{"t":"Throne of Blood","y":1957,"d":"Akira Kurosawa","r":110,"g":["Drama"],"c":[],"s":"Feodal Japonya'da bir savaşçı, ormandaki bir ruhun kehanetiyle hırslanır ve karısının kışkırtmasıyla efendisine karşı harekete geçer. Kurosawa'nın Macbeth uyarlaması; sisli atmosferi ve Nō tiyatrosu etkisiyle ürpertici bir başyapıt."},{"t":"Wild Strawberries","y":1957,"d":"Ingmar Bergman","r":92,"g":["Drama","Romance"],"c":[],"s":"Yaşlı bir profesör, onursal bir ödül almak için yaptığı araba yolculuğunda anıları, rüyaları ve pişmanlıklarıyla yüzleşir. Bergman'ın yaşlılık ve geçmiş üzerine yarattığı sıcak ve düşündürücü eser."},{"t":"Ashes and Diamonds","y":1958,"d":"Andrzej Wajda","r":103,"g":["Drama","Romance","War"],"c":[],"s":"İkinci Dünya Savaşı'nın bittiği gün, genç bir direnişçi yeni komünist yönetimin bir yetkilisini öldürmekle görevlendirilir, ama bir kadınla tanışınca tereddüde düşer. Zbigniew Cybulski'nin karizmasıyla Polonya sinemasının en güçlü ve atmosferik filmlerinden."},{"t":"Cairo Station","y":1958,"d":"Youssef Chahine","r":77,"g":["Crime","Drama"],"c":[],"s":"Kahire tren garında gazete satan topal ve yalnız bir adam, gazoz satan canlı bir kıza takıntılı bir biçimde bağlanır. Youssef Chahine'in kendisinin de oynadığı bu cesur film, Mısır sinemasının en etkileyici eserlerinden biri."},{"t":"Dracula","y":1958,"d":"Terence Fisher","r":82,"g":["Drama","Horror"],"c":[],"s":"Jonathan Harker, Kont Drakula'nın şatosuna kütüphaneci olarak gelir ve kısa süre sonra Van Helsing ile vampirin amansız mücadelesi başlar. Christopher Lee ile Peter Cushing'in efsanevi karşılaşması ve Hammer'ın canlı renkleriyle klasik bir gotik korku."},{"t":"Gigi","y":1958,"d":"Vincente Minnelli","r":115,"g":["Comedy","Musical","Romance"],"c":[],"s":"Yüzyıl dönümü Paris'inde genç ve neşeli Gigi, ailesi tarafından zengin erkeklerin gözdesi olmak üzere yetiştirilirken yakışıklı ve sıkılmış bir aristokratla dostluk kurar. Göz kamaştırıcı kostümleri ve zarif şarkılarıyla Minnelli'nin şık müzikali."},{"t":"Ivan the Terrible, Part II: The Boyars' Plot","y":1958,"d":"Sergei Eisenstein","r":88,"g":["Biography","Drama","History"],"c":[],"s":"Çar İvan, gücünü sağlamlaştırmaya çalışırken aristokrat boyarların kendisine karşı kurduğu komplolarla ve kendi paranoyasıyla yüzleşir. Eisenstein'ın dışavurumcu görselleri ve renkli ziyafet sahnesiyle siyasi iktidar üzerine güçlü bir opera gibi film."},{"t":"Man of the West","y":1958,"d":"Anthony Mann","r":100,"g":["Drama","Western"],"c":[],"s":"Eski bir haydut, trende yaşanan bir soygun sonrası çölde mahsur kalınca, yıllar önce kaçtığı suç ailesinin yanına düşer. Gary Cooper'ın ağırbaşlı oyunuyla Anthony Mann'in en karanlık ve psikolojik westernlerinden."},{"t":"Mon Oncle","y":1958,"d":"Jacques Tati","r":116,"g":["Comedy"],"c":[],"s":"Sevimli Mösyö Hulot, modern ve teknolojiyle dolu bir evde yaşayan kız kardeşinin ailesine ve yeğenine eski Paris'in keyfini göstermeye çalışır. Tati'nin modern hayatın tuhaflıklarıyla nazikçe dalga geçen, renkli ve zarif komedisi."},{"t":"Some Came Running","y":1958,"d":"Vincente Minnelli","r":137,"g":["Drama","Romance"],"c":[],"s":"Savaştan dönen hayal kırıklığına uğramış bir yazar, doğduğu küçük kasabaya geri döner ve eski çevresiyle, eğlence arkadaşlarıyla ve aşkla yüzleşir. Sinatra, Dean Martin ve Shirley MacLaine'in buluştuğu Minnelli'nin renkli ve dokunaklı dramı."},{"t":"The Defiant Ones","y":1958,"d":"Stanley Kramer","r":96,"g":["Crime","Drama"],"c":[],"s":"Birbirine zincirlenmiş iki mahkum, biri beyaz biri siyahi, cezaevi kamyonundan kaçınca hayatta kalmak için birbirine güvenmek zorunda kalır. Sidney Poitier ile Tony Curtis'in güçlü oyunlarıyla ırkçılık üzerine cesur ve etkileyici bir film."},{"t":"The Music Room","y":1958,"d":"Satyajit Ray","r":95,"g":["Drama","Music"],"c":[],"s":"Serveti tükenmekte olan bir Bengal toprak ağası, müziğe ve eski ihtişamına tutunarak sarayındaki müzik odasında son gösterilerini düzenler. Satyajit Ray'in sınıf ve zamanın geçişi üzerine melankolik ve büyüleyici başyapıtı."},{"t":"Touch of Evil","y":1958,"d":"Orson Welles","r":95,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Meksika sınırında bir patlama sonrası, dürüst bir Meksikalı narkotik ajanı ile yozlaşmış bir Amerikan polis şefi arasında amansız bir çatışma başlar. Efsanevi açılış planıyla Orson Welles'in karanlık ve baş döndürücü kara film veda şarkısı."},{"t":"Vertigo","y":1958,"d":"Alfred Hitchcock","r":128,"g":["Mystery","Romance","Thriller"],"c":["James Stewart","Kim Novak"],"s":"Yükseklik korkusu olan emekli bir dedektif, eski bir arkadaşının gizemli karısını takip ederken ona takıntılı bir biçimde bağlanır. Hitchcock'un aşk ve saplantı üzerine en derin filmi; Herrmann'ın müziğiyle sinemanın zirvelerinden sayılıyor."},{"t":"Anatomy of a Murder","y":1959,"d":"Otto Preminger","r":161,"g":["Drama","Mystery"],"c":[],"s":"Küçük bir kasabada bir avukat, karısına saldıran adamı öldürdüğü iddia edilen bir askeri savunur. Duke Ellington'ın caz müziği ve James Stewart'ın karizmasıyla mahkeme dramlarının en zeki ve gerçekçi örneklerinden."},{"t":"Ben-Hur","y":1959,"d":"William Wyler","r":212,"g":["Adventure","Drama"],"c":["Charlton Heston","Jack Hawkins","Hugh Griffith"],"s":"Roma döneminde Kudüslü soylu bir Yahudi, çocukluk arkadaşı tarafından ihanete uğrar ve köleliğe düşer, ama intikam için geri döner. Efsanevi araba yarışı sahnesiyle Hollywood'un en görkemli destanlarından biri."},{"t":"Black Orpheus","y":1959,"d":"Marcel Camus","r":100,"g":["Drama","Musical","Romance"],"c":[],"s":"Rio de Janeiro'da karnaval sırasında bir tramvay şoförü, ölümden kaçan genç bir kadına aşık olur. Orpheus efsanesini Brezilya'nın renklerine ve bossa nova müziğine taşıyan büyüleyici ve coşkulu bir film."},{"t":"Floating Weeds","y":1959,"d":"Yasujirō Ozu","r":119,"g":["Drama"],"c":[],"s":"Gezgin bir tiyatro topluluğunun yaşlı lideri, yıllar önce bir kadınla sahip olduğu oğlunun yaşadığı sahil kasabasına geri döner. Ozu'nun renkli görüntüleri ve sade anlatımıyla aile ve pişmanlık üzerine sıcak bir film."},{"t":"Hiroshima Mon Amour","y":1959,"d":"Alain Resnais","r":90,"g":["Drama","Romance"],"c":[],"s":"Hiroşima'da film çekmek için bulunan Fransız bir aktris, bir Japon mimarla kısa bir aşk yaşar ve savaş anılarıyla yüzleşir. Alain Resnais'nin bellek ve kayıp üzerine şiirsel başyapıtı; modern sinemanın kapılarını açan bir eser."},{"t":"North by Northwest","y":1959,"d":"Alfred Hitchcock","r":136,"g":["Adventure","Drama","Mystery"],"c":["Cary Grant","Eva Marie Saint"],"s":"New Yorklu bir reklamcı, bir casusla karıştırılınca ülkeyi baştan başa kaçmak zorunda kalır. Mısır tarlasındaki uçak sahnesi ve Rushmore Dağı finaliyle Hitchcock'un en eğlenceli ve zarif macerası."},{"t":"Pickpocket","y":1959,"d":"Robert Bresson","r":76,"g":["Crime","Drama"],"c":[],"s":"Paris'te yalnız bir genç, yankesiciliği bir sanat ve felsefe gibi görmeye başlar ve bu yolda kendi vicdanıyla yüzleşir. Bresson'un el hareketleriyle kurulmuş hipnotik sahneleriyle minimalist sinemanın ustalık eseri."},{"t":"Ride Lonesome","y":1959,"d":"Budd Boetticher","r":73,"g":["Western"],"c":[],"s":"Bir ödül avcısı, kaçak bir katili teslim etmek için yola çıkarken yanına katılan yol arkadaşlarıyla hem düşmana hem kendi geçmişine karşı savaşır. Randolph Scott'lı Boetticher westernlerinin en zarif örneklerinden; sade ve etkili."},{"t":"Rio Bravo","y":1959,"d":"Howard Hawks","r":141,"g":["Western"],"c":[],"s":"Bir kasaba şerifi, güçlü ağabeyinin adamları tarafından kuşatılan hapishanedeki bir katili, alkolik bir yardımcı ve yaşlı bir dostla birlikte korumaya çalışır. Hawks'un dostluk ve cesaret üzerine sıcak ve rahat westerni; şarkı sahneleri bile keyifli."},{"t":"Shadows","y":1959,"d":"John Cassavetes","r":87,"g":["Drama","Music","Romance"],"c":[],"s":"New York'ta yaşayan üç siyahi kardeş, caz dünyasında ve kişisel ilişkilerinde kimlik ve aidiyet sorularıyla boğuşur. Cassavetes'in doğaçlama ruhuyla çekilmiş bu film, bağımsız Amerikan sinemasının doğuşu sayılır."},{"t":"Some Like It Hot","y":1959,"d":"Billy Wilder","r":121,"g":["Comedy","Music","Romance"],"c":["Marilyn Monroe","Tony Curtis"],"s":"Bir katliama tanık olan iki müzisyen, gangsterlerden kaçmak için kadın kılığına girip bir kadın orkestrasına katılır. Marilyn Monroe'nun ışıltısı ve Billy Wilder'ın zekâsıyla gelmiş geçmiş en komik filmlerden biri."},{"t":"The 400 Blows","y":1959,"d":"François Truffaut","r":99,"g":["Crime","Drama"],"c":[],"s":"Paris'te ailesinden ve okulundan ilgi görmeyen genç Antoine, küçük suçlara ve kaçamaklara sürüklenir. Truffaut'nun kendi çocukluğundan ilham alan bu film, Fransız Yeni Dalgası'nın en dokunaklı ve samimi başlangıcı."},{"t":"The World of Apu","y":1959,"d":"Satyajit Ray","r":105,"g":["Drama"],"c":[],"s":"Apu üçlemesinin son filminde, yazar olmak isteyen genç Apu beklenmedik bir evlilik yapar ve hayatın getirdikleriyle yüzleşir. Satyajit Ray'in aşk, kayıp ve yeniden doğuş üzerine duygusal ve bilgece bir kapanışı."},{"t":"Black Sunday","y":1960,"d":"Mario Bava","r":87,"g":["Horror"],"c":[],"s":"İki yüzyıl önce idam edilen bir cadı, mezarından uyanarak intikam almaya ve genç bir kadının bedenini ele geçirmeye çalışır. Mario Bava'nın siyah beyaz gotik görselliğiyle İtalyan korku sinemasının en şık ve etkileyici klasiklerinden."},{"t":"Breathless","y":1960,"d":"Jean-Luc Godard","r":90,"g":["Crime","Drama"],"c":[],"s":"Bir polisi öldüren küçük bir suçlu, Paris'te Amerikalı bir kız arkadaşının yanında saklanırken kaçış planları yapar. Godard'ın atlama kesmeleri ve serbest üslubuyla sinemanın kurallarını yeniden yazan, havalı ve kışkırtıcı bir film."},{"t":"Eyes Without a Face","y":1960,"d":"Georges Franju","r":90,"g":["Drama","Horror"],"c":[],"s":"Ünlü bir cerrah, bir kazada yüzü bozulan kızına yeni bir yüz kazandırmak için korkunç deneylere girişir. Georges Franju'nun şiirsel ve ürkütücü korku filmi; maskeli kızın hüzünlü imgesi uzun süre akılda kalır."},{"t":"L'avventura","y":1960,"d":"Michelangelo Antonioni","r":143,"g":["Drama","Mystery","Romance"],"c":[],"s":"Bir yat gezisinde genç bir kadın gizemli bir şekilde kaybolur ve sevgilisi ile en yakın arkadaşı onu ararken birbirine yakınlaşır. Antonioni'nin modern yalnızlık üzerine çarpıcı görsellerle kurduğu, sinema dilini değiştiren eser."},{"t":"La Dolce Vita","y":1960,"d":"Federico Fellini","r":174,"g":["Comedy","Drama"],"c":[],"s":"Roma'da magazin muhabiri olan bir adam, bir hafta boyunca sosyetenin partileri, ünlüler ve anlam arayışı arasında dolaşır. Trevi Çeşmesi sahnesiyle efsaneleşen Fellini'nin görkemli ve melankolik başyapıtı."},{"t":"Le Trou","y":1960,"d":"Jacques Becker","r":131,"g":["Crime","Drama","Thriller"],"c":[],"s":"Paris'te bir hapishanede aynı hücreyi paylaşan dört mahkum ve yeni gelen biri, sabırla bir kaçış tüneli kazmaya başlar. Jacques Becker'in son filmi; titiz ayrıntıları ve dürüst gerilimiyle kaçış filmlerinin en iyilerinden."},{"t":"Peeping Tom","y":1960,"d":"Michael Powell","r":101,"g":["Drama","Horror","Thriller"],"c":[],"s":"Genç bir kameraman, kurbanlarını öldürürken onların korkusunu filme çeker. Çıktığı dönemde skandal yaratan, bugün ise izleme ve sinema üzerine öncü bir başyapıt olarak görülen, rahatsız edici ve zekice bir film."},{"t":"Psycho","y":1960,"d":"Alfred Hitchcock","r":109,"g":["Drama","Horror","Mystery"],"c":["Anthony Perkins","Janet Leigh"],"s":"Patronunun parasını çalıp kaçan bir sekreter, yol kenarındaki ıssız bir motelde tuhaf ve utangaç bir genç tarafından karşılanır. Hitchcock'un en ürkütücü filmi; duş sahnesi ve Herrmann'ın müziğiyle korku sinemasını sonsuza dek değiştirdi."},{"t":"Rocco and His Brothers","y":1960,"d":"Luchino Visconti","r":179,"g":["Crime","Drama","Sport"],"c":[],"s":"Güney İtalya'dan Milano'ya göç eden dul bir anne ve beş oğlu, büyük şehirde ayakta kalmaya çalışırken aile bağları sarsılır. Visconti'nin destansı ailevi trajedisi; Alain Delon'un en etkileyici rollerinden biri."},{"t":"Saturday Night and Sunday Morning","y":1960,"d":"Karel Reisz","r":89,"g":["Drama","Romance"],"c":[],"s":"İngiltere'de bir fabrika işçisi, haftayı hafta sonu eğlencelerini bekleyerek geçirir ve hayatını kendi kurallarına göre yaşamaya çalışır. Albert Finney'nin karizmatik oyunuyla İngiliz Yeni Dalgası'nın öncü eserlerinden."},{"t":"Shoot the Piano Player","y":1960,"d":"François Truffaut","r":92,"g":["Crime","Drama","Thriller"],"c":[],"s":"Bir barda piyano çalan utangaç bir adam, gangsterlerle başı dertte olan kardeşleri yüzünden geçmişiyle yüzleşmek zorunda kalır. Truffaut'nun kara film, komedi ve melankoliyi karıştırdığı oyuncu ve özgür ruhlu filmi."},{"t":"Spartacus","y":1960,"d":"Stanley Kubrick","r":184,"g":["Adventure","Biography","Drama"],"c":["Peter Ustinov"],"s":"Roma'da gladyatör olarak eğitilen bir köle, isyan ederek binlerce köleyi özgürlük uğruna büyük bir ayaklanmaya sürükler. Kirk Douglas'ın güçlü oyunu ve Kubrick'in yönetmenliğiyle epik sinemanın en onurlu örneklerinden."},{"t":"The Apartment","y":1960,"d":"Billy Wilder","r":125,"g":["Comedy","Drama","Romance"],"c":[],"s":"Yükselmek isteyen bir sigorta çalışanı, dairesini üstlerinin gizli buluşmaları için ödünç verir, ama asansör görevlisi olan kıza aşık olunca işler karışır. Billy Wilder'ın hem komik hem hüzünlü, insan sıcaklığıyla dolu başyapıtı."},{"t":"The Cloud-Capped Star","y":1960,"d":"Ritwik Kumar Ghatak","r":126,"g":["Drama"],"c":[],"s":"Kalküta'nın kenarında mülteci bir ailenin fedakâr büyük kızı, ailesini geçindirmek için kendi hayallerinden vazgeçer. Ritwik Ghatak'ın Bengal bölünmesinin acılarını yansıtan, müziği ve duygusal yoğunluğuyla güçlü bir melodramı."},{"t":"The Housemaid","y":1960,"d":"Kim Ki-young","r":109,"g":["Crime","Drama","Horror"],"c":[],"s":"Bir piyano öğretmeni, yeni evine hizmetçi olarak aldığı genç bir kadının saplantılı ilişkisiyle ailesinin çöküşüne tanık olur. Kim Ki-young'un Kore sinemasının kült klasiği; gerilimi ve tuhaf atmosferiyle hâlâ çok etkileyici."},{"t":"The Young One","y":1960,"d":"Luis Buñuel","r":96,"g":["Drama"],"c":[],"s":"Bir adada yalnız yaşayan bir av bekçisi, kaçak siyahi bir müzisyen ve genç bir kızla karşılaşır; ırkçılık ve arzu çatışır. Buñuel'in İngilizce çektiği az bilinen ve rahatsız edici ahlaki dramı."},{"t":"Breakfast at Tiffany's","y":1961,"d":"Blake Edwards","r":115,"g":["Comedy","Drama","Romance"],"c":[],"s":"New York'ta özgür ruhlu ve gizemli Holly Golightly, zengin bir koca bulma hayalleri kurarken üst kattaki genç bir yazarla dostluk kurar. Audrey Hepburn'ün zarafeti ve Moon River şarkısıyla modanın ve romantizmin ikonik filmi."},{"t":"Chronicle of a Summer","y":1961,"d":"Edgar Morin","r":85,"g":["Documentary","History"],"c":[],"s":"Paris sokaklarında insanlara mutlu olup olmadıkları sorulur ve cevaplar sosyal, siyasi ve kişisel konulara dair derin sohbetlere dönüşür. Cinéma vérité akımının doğuşu sayılan, samimi ve düşündürücü bir belgesel."},{"t":"La Notte","y":1961,"d":"Michelangelo Antonioni","r":122,"g":["Drama"],"c":[],"s":"Milano'da bir yazar ve karısı, bir gün ve gece boyunca evliliklerinin boşluğunu fark ederek bir partide başka insanlara yönelir. Antonioni'nin modern yabancılaşma üzerine şık ve derin filmi; Jeanne Moreau ve Mastroianni çok etkileyici."},{"t":"Last Year at Marienbad","y":1961,"d":"Alain Resnais","r":94,"g":["Drama","Mystery","Romance"],"c":[],"s":"Görkemli bir otelde bir adam, bir kadını geçen yıl tanıştıklarına ve onunla gitmeye söz verdiğine ikna etmeye çalışır. Resnais'nin bulmaca gibi yapılandırılmış, rüya ve belleğin sınırlarını zorlayan büyüleyici ve gizemli başyapıtı."},{"t":"Lola","y":1961,"d":"Jacques Demy","r":90,"g":["Drama","Romance"],"c":[],"s":"Nantes'ta bir kabarede şarkı söyleyen genç bir kadın, yıllar önce kaybettiği sevgilisinin dönüşünü beklerken eski bir arkadaşıyla karşılaşır. Jacques Demy'nin ilk filmi; siyah beyaz ama müzikal ruhlu, romantik ve hüzünlü bir masal."},{"t":"One-Eyed Jacks","y":1961,"d":"Marlon Brando","r":141,"g":["Drama","Western"],"c":[],"s":"Bir banka soyguncusu, kendisini ihanetle hapse düşüren eski ortağının şerif olduğu kasabaya intikam almak için gelir. Marlon Brando'nun yönettiği tek film; Kaliforniya sahilleri ve psikolojik derinliğiyle sıradışı bir western."},{"t":"Splendor in the Grass","y":1961,"d":"Elia Kazan","r":124,"g":["Drama","Romance"],"c":[],"s":"1920'lerin Kansas'ında iki genç, toplumun ve ailelerin baskısı altında tutkulu ama zorlu bir aşk yaşar. Natalie Wood ile Warren Beatty'nin duygusal performanslarıyla gençlik ve kaybedilen aşk üzerine içten bir dram."},{"t":"The Exiles","y":1961,"d":"Kent MacKenzie","r":72,"g":["Drama"],"c":[],"s":"Los Angeles'ın Bunker Hill semtinde, rezervasyonlardan kente göç etmiş genç Yerli Amerikalılar bir gece boyunca eğlence ve arayış içinde dolaşır. Uzun süre unutulmuş, sonra yeniden keşfedilmiş şiirsel ve belgesel ruhlu bir başyapıt."},{"t":"The Hustler","y":1961,"d":"Robert Rossen","r":134,"g":["Drama","Sport"],"c":[],"s":"Genç ve kendini beğenmiş bir bilardo dolandırıcısı, efsanevi Minnesota Fats'e meydan okur ve kazanmanın bedeliyle yüzleşir. Paul Newman'ın karizmatik performansı ve atmosferik siyah beyaz görüntüleriyle sert ve etkileyici bir dram."},{"t":"The Ladies Man","y":1961,"d":"Jerry Lewis","r":95,"g":["Comedy"],"c":[],"s":"Kalbi kırılan sakar bir genç, yalnızca kadınların yaşadığı bir pansiyonda hizmetçi olarak işe başlar ve kaos başlar. Jerry Lewis'in dev kesitli dekoru ve görsel esprileriyle yaratıcı ve eğlenceli bir komedi."},{"t":"Through a Glass Darkly","y":1961,"d":"Ingmar Bergman","r":90,"g":["Drama"],"c":[],"s":"Issız bir adada yaz tatili geçiren bir ailede, akıl sağlığı kırılganlaşan genç bir kadın ile ona yakın erkekler arasındaki sessiz gerilim giderek derinleşir. Bergman'ın inanç ve sevgi üzerine kurduğu üçlemenin ilk halkası, sade, yoğun ve unutulmaz bir oda dramı."},{"t":"Viridiana","y":1961,"d":"Luis Buñuel","r":91,"g":["Drama"],"c":[],"s":"Manastıra kapanmak üzere olan genç bir rahibe adayı, amcasının malikânesinde kalıp iyilik yapmaya karar verince beklenmedik bir kaosun içine düşer. Buñuel'in dine ve hayırseverliğe yönelttiği cüretkâr, kara mizahla dolu hicvi, yasaklanmasına rağmen Cannes'da Altın Palmiye kazanmıştı."},{"t":"West Side Story","y":1961,"d":"Robert Wise","r":153,"g":["Crime","Drama","Musical"],"c":["George Chakiris","Rita Moreno"],"s":"New York sokaklarında birbirine düşman iki gencin çetesi arasında sıkışan Tony ile Maria, Romeo ve Juliet'i hatırlatan bir aşka tutulur. Bernstein'ın müzikleri ve Jerome Robbins'in enerjik koreografisiyle, müzikal türünün en parlak ve en duygusal örneklerinden biri."},{"t":"An Autumn Afternoon","y":1962,"d":"Yasujirō Ozu","r":113,"g":["Drama"],"c":[],"s":"Dul bir baba, yıllardır evini çekip çeviren kızını evlendirmenin zamanının geldiğini fark eder ve bu kararla yavaş yavaş yüzleşir. Ozu'nun son filmi, aile, yalnızlık ve geçen zaman üzerine hem hüzünlü hem şefkatli, renkleriyle göz dolduran bir veda."},{"t":"Cléo From 5 to 7","y":1962,"d":"Agnès Varda","r":90,"g":["Comedy","Drama","Music"],"c":[],"s":"Genç bir şarkıcı, önemli bir sağlık sonucunu beklerken Paris sokaklarında neredeyse gerçek zamanlı iki saat geçirir. Varda, kaygıyı, kadınlığı ve bakılmayı bu zarif, ışıltılı Yeni Dalga klasiğinde ustalıkla işler."},{"t":"Jules and Jim","y":1962,"d":"François Truffaut","r":105,"g":["Drama","Romance"],"c":[],"s":"Birbirine sıkı sıkıya bağlı iki arkadaş, özgür ruhlu ve öngörülemez Catherine'e aynı anda âşık olur ve üçü yıllara yayılan tuhaf bir bağ kurar. Truffaut'nun enerjik kamerası ve Jeanne Moreau'nun büyüleyici performansıyla Fransız Yeni Dalgası'nın en sevilen filmlerinden."},{"t":"L'eclisse","y":1962,"d":"Michelangelo Antonioni","r":126,"g":["Drama","Romance"],"c":[],"s":"Bir ilişkiyi yeni bitirmiş genç bir kadın, Roma borsasında çalışan hırslı bir simsarla temkinli bir yakınlık kurar. Antonioni'nin yabancılaşma üçlemesinin son halkası, boş sokaklar ve sessizliklerle modern aşkın kırılganlığını şiirsel bir dille anlatır."},{"t":"La Jetée","y":1962,"d":"Chris Marker","r":null,"g":["Romance"],"c":[],"s":"Nükleer savaş sonrası bir dünyada, çocukluğundan kalma tek bir görüntüye takılmış bir adam zamanda yolculuk deneylerine gönderilir. Neredeyse tamamen durağan fotoğraflardan oluşan bu kısa film, bilimkurgu tarihinin en etkileyici ve en çok ilham veren eserlerinden biridir."},{"t":"Lawrence of Arabia","y":1962,"d":"David Lean","r":227,"g":["Adventure","Biography","Drama"],"c":["Peter O'Toole","Alec Guinness"],"s":"Birinci Dünya Savaşı sırasında sıra dışı bir İngiliz subayı, Arap kabilelerini Osmanlı'ya karşı birleştirmek için çölün derinliklerine yol alır. David Lean'in nefes kesen çöl görüntüleri ve Peter O'Toole'un karizmasıyla büyük perdenin en görkemli destanlarından biri."},{"t":"Lolita","y":1962,"d":"Stanley Kubrick","r":153,"g":["Crime","Drama","Romance"],"c":[],"s":"Orta yaşlı bir edebiyat profesörü, kiracı olarak yerleştiği evde ev sahibinin genç kızına saplantılı bir tutku geliştirir. Kubrick, Nabokov'un tartışmalı romanını kara mizah ve incelikli oyunculuklarla, rahatsız edici ama zekice bir filme dönüştürür."},{"t":"Mondo Cane","y":1962,"d":"Paolo Cavara","r":108,"g":["Documentary","Horror"],"c":[],"s":"Dünyanın dört bir yanından tuhaf, şaşırtıcı ve zaman zaman sarsıcı gelenekleri yan yana dizen bir belgesel derlemesi. Ardından gelen tüm 'mondo' filmlerine adını veren bu tartışmalı yapım, sansasyonel belgeselciliğin kökenini merak edenler için ilginç bir durak."},{"t":"No. 12: Heaven and Earth Magic","y":1962,"d":"Harry Smith","r":null,"g":["Animation"],"c":[],"s":"Kesme kolaj görüntülerle kurulan bu animasyonda, bir kadının diş ağrısıyla başlayan yolculuk onu cennete ve tekrar dünyaya taşır. Harry Smith'in simya ve rüya mantığıyla örülü bu deneysel başyapıtı, avangart sinemanın en büyüleyici ve gizemli eserlerinden."},{"t":"Prelude: Dog Star Man","y":1962,"d":"Stan Brakhage","r":null,"g":["Drama"],"c":[],"s":"Üst üste bindirilmiş, boyanmış ve çizilmiş görüntülerle doğum, doğa ve evren üzerine sözsüz bir şiir kuran kısa bir deneysel film. Stan Brakhage'ın bakmayı yeniden öğreten bu çalışması, Amerikan avangart sinemasının kilometre taşlarından biri sayılır."},{"t":"The Exterminating Angel","y":1962,"d":"Luis Buñuel","r":95,"g":["Drama","Fantasy"],"c":[],"s":"Şık bir akşam yemeğinin ardından seçkin konuklar, açıklanamaz bir nedenle salondan çıkamadıklarını fark eder ve nezaket kuralları yavaş yavaş çöker. Buñuel'in burjuvaziye yönelttiği bu gerçeküstü ve kara mizahlı hiciv, hem komik hem tedirgin edici."},{"t":"The Given Word","y":1962,"d":"Anselmo Duarte","r":98,"g":["Drama"],"c":[],"s":"Yoksul bir köylü, hasta eşeği iyileşirse bir haçı kiliseye kadar taşıyacağına adak adar, ancak yolun sonunda ummadığı bir dirençle karşılaşır. Cannes'da Altın Palmiye kazanan bu Brezilya filmi, inanç, gurur ve kurumlar üzerine dokunaklı bir hikâye anlatır."},{"t":"The Man Who Shot Liberty Valance","y":1962,"d":"John Ford","r":123,"g":["Drama","Western"],"c":[],"s":"Yaşlı bir senatör, gençliğinde vahşi bir kasabada azılı bir haydutla yaşadığı hesaplaşmanın gerçek hikâyesini anlatmaya başlar. John Ford'un James Stewart ve John Wayne'i buluşturduğu bu western, efsane ile gerçek arasındaki farkı hüzünle sorgular."},{"t":"The Manchurian Candidate","y":1962,"d":"John Frankenheimer","r":126,"g":["Drama","Thriller"],"c":[],"s":"Kore Savaşı'ndan dönen bir askerin rahatsız edici kâbusları, bir kahraman olarak karşılanan eski birlik arkadaşıyla ilgili karanlık bir komployu işaret eder. Soğuk Savaş paranoyasını yakalayan bu gerilim, bugün bile şaşırtıcı ölçüde cesur ve gergin."},{"t":"To Kill a Mockingbird","y":1962,"d":"Robert Mulligan","r":129,"g":["Crime","Drama"],"c":["Gregory Peck","John Megna"],"s":"Irkçılığın kol gezdiği bir Güney kasabasında, dürüst bir avukat haksız yere suçlanan siyahi bir adamı savunur ve olaylar küçük kızının gözünden aktarılır. Gregory Peck'in unutulmaz Atticus Finch'i sayesinde adalet ve vicdan üzerine sıcak, zamansız bir klasik."},{"t":"Vivre Sa Vie","y":1962,"d":"Jean-Luc Godard","r":null,"g":["Drama"],"c":[],"s":"Oyuncu olmayı hayal eden genç bir Parisli kadın, parasızlık yüzünden adım adım fahişeliğe sürüklenir. Godard'ın on iki bölüme ayırdığı bu film, Anna Karina'nın yüzüne duyduğu hayranlıkla Yeni Dalga'nın en dokunaklı ve şiirsel örneklerinden."},{"t":"What Ever Happened to Baby Jane?","y":1962,"d":"Robert Aldrich","r":134,"g":["Drama","Horror","Thriller"],"c":[],"s":"Eski çocuk yıldızı Jane, tekerlekli sandalyeye bağlı kız kardeşi Blanche ile köhne bir Hollywood konağında giderek tehlikeli bir çekişmenin içine girer. Bette Davis ile Joan Crawford'un efsanevi rekabetini perdeye taşıyan bu psikolojik gerilim, kara mizahla dolu bir kült klasiktir."},{"t":"8½","y":1963,"d":"Federico Fellini","r":138,"g":["Drama"],"c":[],"s":"Yaratıcı tıkanıklık yaşayan ünlü bir yönetmen, yeni filmi için baskı altındayken anılara, fantezilere ve hayatındaki kadınlara sığınır. Fellini'nin kendi iç dünyasını sergilediği bu büyülü başyapıt, sinema üzerine yapılmış en özgün ve en etkili filmlerden biri."},{"t":"An Actor's Revenge","y":1963,"d":"Kon Ichikawa","r":115,"g":["Action","Comedy","Drama"],"c":[],"s":"Kabuki tiyatrosunda kadın rolleri oynayan bir aktör, ailesini yıkıma sürükleyen üç adamdan intikam almak için Edo'ya gelir. Kon Ichikawa, geniş ekranı ve cesur renkleri sahne estetiğiyle harmanlayarak son derece stilize, göz alıcı bir intikam hikâyesi sunar."},{"t":"Barren Lives","y":1963,"d":"Nelson Pereira dos Santos","r":103,"g":["Drama"],"c":[],"s":"Kuraklığın kavurduğu Brezilya'nın kuzeydoğusunda yoksul bir aile, hayatta kalmak için bir yerden bir yere göç eder. Cinema Novo akımının temel taşlarından olan bu sade ve sert film, yoksulluğu duygusallığa kaçmadan, derin bir insanlıkla anlatır."},{"t":"Blonde Cobra","y":1963,"d":"Ken Jacobs","r":null,"g":["#Movie"],"c":[],"s":"Bir adam kameraya pozlar verir, eşyalarla oynar, yüz ifadeleri yapar, ses kaydında ise umutsuzluğunu, anılarını ve tuhaf hikâyelerini anlatır. Jack Smith'in çılgın enerjisini yakalayan bu deneysel kısa film, New York yeraltı sinemasının dağınık ama büyüleyici bir belgesidir."},{"t":"Contempt","y":1963,"d":"Jean-Luc Godard","r":102,"g":["Drama","Romance"],"c":[],"s":"Bir senarist, Odysseia uyarlaması için Amerikalı bir yapımcıyla çalışmaya başladığında evliliği sessizce çözülmeye başlar. Godard'ın Capri'nin ışığında çektiği, Brigitte Bardot'lu bu film, sinema ve aşk üzerine renkli ve melankolik bir meditasyon."},{"t":"Flaming Creatures","y":1963,"d":"Jack Smith","r":45,"g":["Comedy","Drama","Horror"],"c":[],"s":"Bir grup kostümlü figür, rüya gibi, kaotik ve teatral sahnelerde bir araya gelerek cinsiyet ve arzu kalıplarıyla oynar. Yayınlandığı dönemde yasaklanan Jack Smith'in bu kışkırtıcı filmi, queer ve deneysel sinemanın en efsanevi eserlerinden biridir."},{"t":"Hud","y":1963,"d":"Martin Ritt","r":112,"g":["Drama","Western"],"c":["Melvyn Douglas","Patricia Neal"],"s":"Teksas'ta bir çiftlikte, ilkeli yaşlı bir adam ile her kuralı çiğneyen karizmatik oğlu Hud arasında derin bir çatışma yaşanır. Paul Newman'ın cazibesi ve James Wong Howe'un siyah beyaz görüntüleriyle, Amerikan rüyasına soğuk bir bakış atan güçlü bir dram."},{"t":"Passenger (Pasażerka)","y":1963,"d":"Andrzej Munk","r":62,"g":["Drama","War"],"c":[],"s":"Nazi kamplarında gardiyanlık yapmış bir kadın, yıllar sonra bir gemi yolculuğunda eski bir mahkûma benzeyen birini görünce geçmişiyle yüzleşmek zorunda kalır. Andrzej Munk'un ölümüyle yarım kalan bu Polonya filmi, parçalı yapısıyla hafıza ve suçluluk üzerine sarsıcı bir eser."},{"t":"Shock Corridor","y":1963,"d":"Samuel Fuller","r":101,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Pulitzer ödülü peşindeki bir gazeteci, bir cinayeti çözmek için kendini akıl hastanesine yatırır ve orada gerçekliği yavaş yavaş kaybetmeye başlar. Samuel Fuller'ın bu sert ve cüretkâr filmi, Amerika'nın toplumsal yaralarını bir tımarhanenin koridorlarında gözler önüne serer."},{"t":"The Birds","y":1963,"d":"Alfred Hitchcock","r":119,"g":["Drama","Horror","Mystery"],"c":[],"s":"Kaliforniya'da sakin bir kıyı kasabasına gelen genç bir kadının ardından, kuşlar açıklanamaz biçimde insanlara saldırmaya başlar. Hitchcock'un müziksiz, ürkütücü ses tasarımı ve ustaca kurduğu gerilimle, doğa korkusu üzerine yapılmış en etkili filmlerden biri."},{"t":"The Cool World","y":1963,"d":"Shirley Clarke","r":null,"g":["Drama"],"c":[],"s":"Harlem'de büyüyen genç bir çocuk, saygı ve güç kazanmak için bir silah edinmeyi ve bir sokak çetesinin liderliğini hayal eder. Shirley Clarke'ın belgesel tadındaki bu filmi, gerçek sokaklarda çekilmiş, caz müziğiyle nabzı atan öncü bir bağımsız yapım."},{"t":"The Great Escape","y":1963,"d":"John Sturges","r":172,"g":["Adventure","Drama","Thriller"],"c":["Steve McQueen","James Garner"],"s":"İkinci Dünya Savaşı'nda bir Alman esir kampındaki Müttefik askerleri, yüzlerce kişiyi kaçırmayı amaçlayan cüretkâr bir tünel planı hazırlar. Steve McQueen'in motosikletiyle ve yıldızlarla dolu kadrosuyla, macera sinemasının en keyifli ve en sevilen klasiklerinden."},{"t":"The Haunting","y":1963,"d":"Robert Wise","r":112,"g":["Horror"],"c":[],"s":"Bir araştırmacı, kötü şöhretli Hill House'da doğaüstü olayları incelemek için birkaç kişiyi davet eder ve kırılgan Eleanor evin etkisine giderek kapılır. Robert Wise, tek bir hayalet göstermeden, ses ve kamera açılarıyla korkuyu ustalıkla yaratan bu klasikle türe yön vermiştir."},{"t":"The House Is Black","y":1963,"d":"Forugh Farrokhzad","r":null,"g":["Documentary"],"c":[],"s":"İran'daki bir cüzam kolonisinde yaşayanların gündelik hayatını, dualarını, oyunlarını ve acılarını izleyen kısa bir belgesel. Şair Füruğ Ferruhzad'ın tek filmi, şiirsel anlatımı ve şefkatli bakışıyla İran Yeni Dalgası'nın habercisi sayılır."},{"t":"The Leopard","y":1963,"d":"Luchino Visconti","r":186,"g":["Drama","History"],"c":[],"s":"İtalya'nın birleşme döneminde Sicilyalı bir prens, aristokrasinin çöküşünü ve yeni bir düzenin doğuşunu soylu bir kabullenişle izler. Visconti'nin göz kamaştırıcı dekorları ve Burt Lancaster'ın ağırbaşlı performansıyla, sinemanın en görkemli dönem filmlerinden biri."},{"t":"The Nutty Professor","y":1963,"d":"Jerry Lewis","r":107,"g":["Comedy","Romance","Sci-Fi"],"c":[],"s":"Utangaç ve beceriksiz bir kimya profesörü, icat ettiği bir iksirle kendinden emin ve kibirli Buddy Love'a dönüşür. Jerry Lewis'in hem yönettiği hem oynadığı bu Jekyll ve Hyde parodisi, renkli görselliği ve fiziksel komedisiyle hâlâ çok eğlenceli."},{"t":"The Servant","y":1963,"d":"Joseph Losey","r":116,"g":["Drama"],"c":[],"s":"Londra'da varlıklı bir genç adamın yanına işe giren uşak, zamanla evdeki güç dengelerini sinsice tersine çevirir. Joseph Losey ile Harold Pinter'ın iş birliği, sınıf, kontrol ve arzu üzerine keskin, tedirgin edici bir psikolojik dram ortaya koyar."},{"t":"Winter Light","y":1963,"d":"Ingmar Bergman","r":81,"g":["Drama"],"c":[],"s":"Küçük bir köy kilisesinin papazı, inancını yitirmiş olmanın ağırlığı altında, kendisinden yardım bekleyen cemaatine teselli vermekte zorlanır. Bergman'ın en sade ve en çıplak filmlerinden biri, soğuk kış ışığında Tanrı'nın sessizliği üzerine derin bir tefekkür."},{"t":"A Hard Day's Night","y":1964,"d":"Richard Lester","r":87,"g":["Comedy","Musical"],"c":[],"s":"Beatles üyeleri, bir televizyon programına yetişmeye çalışırken çığlık atan hayranlardan, menajerlerinden ve Paul'ün muzip dedesinden kaçmaya uğraşır. Richard Lester'ın enerjik kurgusu ve şarkılarıyla bu film, müzik videolarının atası sayılan neşeli bir klasik."},{"t":"Before the Revolution","y":1964,"d":"Bernardo Bertolucci","r":105,"g":["Drama","Romance"],"c":[],"s":"Parma'da burjuva bir aileden gelen genç bir adam, Marksist ideallerle teyzesine duyduğu yasak tutku arasında sıkışır. Bertolucci'nin henüz yirmili yaşlarında çektiği bu film, gençlik, siyaset ve kararsızlık üzerine lirik ve kişisel bir portre."},{"t":"Black God, White Devil","y":1964,"d":"Glauber Rocha","r":120,"g":["Adventure","Crime","Drama"],"c":[],"s":"Patronunu öldüren yoksul bir kovboy ve karısı, Brezilya'nın çorak topraklarında önce bir mesih figürüne, sonra da bir haydut çetesine katılır. Glauber Rocha'nın öfkeli ve destansı bu filmi, Cinema Novo'nun şiddetli enerjisini en iyi yansıtan eserlerden biridir."},{"t":"Dr. Strangelove Or: How I Learned to Stop Worrying and Love the Bomb","y":1964,"d":"Stanley Kubrick","r":95,"g":["Comedy","War"],"c":["Peter Sellers","George C. Scott"],"s":"Aklını kaçırmış bir Amerikalı general Sovyetler'e nükleer saldırı emri verince, Pentagon'un savaş odasında çılgın bir kriz yönetimi başlar. Kubrick'in Peter Sellers'ın üç rolüyle parladığı bu kara komedi, Soğuk Savaş'ı hicveden en zekice filmlerden biri."},{"t":"Gertrud","y":1964,"d":"Carl Theodor Dreyer","r":116,"g":["Drama","Romance"],"c":[],"s":"Evli ve orta yaşlı bir kadın, mutlak aşk arayışında kocasını, eski sevgilisini ve genç bir besteciyi birer birer geride bırakır. Dreyer'in son filmi, uzun planları ve dingin temposuyla, aşkın saflığına adanmış ağırbaşlı ve büyüleyici bir eser."},{"t":"Goldfinger","y":1964,"d":"Guy Hamilton","r":110,"g":["Action","Adventure","Thriller"],"c":[],"s":"James Bond, altın takıntılı zengin bir iş adamının Fort Knox'u hedef alan cüretkâr planını engellemeye çalışır. Sean Connery'nin karizması, Aston Martin'i ve efsanevi kötü karakterleriyle Bond serisinin formülünü belirleyen, en keyifli halka
