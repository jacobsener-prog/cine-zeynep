büyük sürprizlerinden biri."},{"t":"Surfwise","y":2007,"d":"Doug Pray","r":93,"g":["Documentary","Sport"],"c":[],"s":"Doktor Dorian Paskowitz, eşi ve dokuz çocuğuyla yıllarca küçük bir karavanda sahil sahil gezerek sörf, sağlıklı yaşam ve özgürlük üzerine kurulu bir hayat sürdü. Alışılmadık bir ailenin hem ilham veren hem sorgulatan hikâyesini anlatan sıcak bir belgesel."},{"t":"The Bourne Ultimatum","y":2007,"d":"Paul Greengrass","r":115,"g":["Action","Mystery","Thriller"],"c":["Matt Damon","Edgar Ramírez"],"s":"Hafızasını kaybetmiş ajan Jason Bourne, kimliğinin sırrını çözmek için Londra'dan Tanca'ya, oradan New York'a uzanan bir kovalamacada CIA ile yüzleşir. Paul Greengrass'ın nefes kesen kurgusuyla aksiyon sinemasının çıtasını yükselten bir gerilim."},{"t":"The Diving Bell and the Butterfly","y":2007,"d":"Julian Schnabel","r":112,"g":["Biography","Drama"],"c":[],"s":"Elle dergisinin genel yayın yönetmeni Jean-Dominique Bauby, felç geçirdikten sonra yalnızca sol gözünü kırpabilir ve bu şekilde anılarını yazdırır. Julian Schnabel'in göz alıcı görsel anlatımıyla hayata ve hayal gücüne yazılmış derinden dokunaklı bir film."},{"t":"There Will Be Blood","y":2007,"d":"Paul Thomas Anderson","r":158,"g":["Drama"],"c":["Daniel Day-Lewis","Paul Dano"],"s":"Yirminci yüzyılın başında Kaliforniya'da hırslı bir petrol arayıcısı, zenginleşme uğruna genç bir vaizle ve kendi vicdanıyla büyük bir çatışmaya girer. Daniel Day-Lewis'in efsanevi performansı ve Paul Thomas Anderson'ın destansı yönetimiyle çağdaş bir başyapıt."},{"t":"Anvil! the Story of Anvil","y":2008,"d":"Sacha Gervasi","r":80,"g":["Biography","Documentary","Drama"],"c":[],"s":"1980'lerde büyük gruplara ilham veren ama hiç ünlü olamayan Kanadalı metal grubu Anvil, elli yaşlarında son bir kez başarı şansı yakalamaya çalışır. Hem çok komik hem çok dokunaklı bu belgesel, hayallerinden vazgeçmeyen dostluğa yazılmış bir güzelleme."},{"t":"Gomorrah","y":2008,"d":"Matteo Garrone","r":137,"g":["Crime","Drama"],"c":[],"s":"Napoli'de mafya örgütü Camorra'nın gölgesinde yaşayan beş farklı insanın hikâyesi, suçun gündelik hayatı nasıl sardığını gösterir. Roberto Saviano'nun kitabından uyarlanan bu belgesel gerçekçiliğindeki film, mafya romantizmini tamamen yıkıyor."},{"t":"Let the Right One in","y":2008,"d":"Tomas Alfredson","r":114,"g":["Drama","Fantasy","Horror"],"c":[],"s":"Stockholm banliyösünde zorbalığa uğrayan on iki yaşındaki Oskar, yan daireye taşınan gizemli ve solgun Eli ile arkadaş olur. Karlı atmosferi ve hüzünlü şiirselliğiyle vampir türünü bir ilk aşk hikâyesine dönüştüren ürkütücü ve zarif bir İsveç filmi."},{"t":"Slumdog Millionaire","y":2008,"d":"Danny Boyle","r":120,"g":["Crime","Drama","Romance"],"c":["Dev Patel","Freida Pinto"],"s":"Mumbai'nin gecekondu mahallelerinde büyüyen Jamal, bir yarışmada tüm soruları doğru yanıtlayınca hilecilikle suçlanır ve hayat hikâyesini anlatmaya başlar. Danny Boyle'un coşkulu enerjisi ve müziğiyle sekiz Oscar kazanan umut dolu bir masal."},{"t":"The Class","y":2008,"d":"Laurent Cantet","r":100,"g":["Comedy"],"c":[],"s":"Paris'in çok kültürlü bir semtinde bir Fransızca öğretmeni, zorlu ergenlerden oluşan sınıfıyla bir öğretim yılı boyunca uğraşır. Gerçek öğrencilerle çekilen, belgesel tadındaki bu canlı ve düşündürücü film Cannes'da Altın Palmiye kazandı."},{"t":"The Curious Case of Benjamin Button","y":2008,"d":"David Fincher","r":166,"g":["Drama","Fantasy","Romance"],"c":["Brad Pitt","Cate Blanchett"],"s":"Yaşlı bir adam olarak doğup zamanla gençleşen Benjamin Button, New Orleans'tan dünyaya uzanan olağanüstü hayatında aşkı ve kaybı tanır. David Fincher'ın büyüleyici görsel efektleri ve hüzünlü romantizmiyle zamana dair zarif bir masal."},{"t":"The Dark Knight","y":2008,"d":"Christopher Nolan","r":152,"g":["Crime","Thriller"],"c":["Christian Bale","Heath Ledger"],"s":"Batman, Savcı Harvey Dent ve Komiser Gordon, Gotham'ı kaosa sürüklemeye kararlı Joker'e karşı güçlerini birleştirir. Heath Ledger'ın efsanevi Joker'iyle süper kahraman filmini ciddi bir suç dramına dönüştüren, türün en etkileyici örneği."},{"t":"The Good, the Bad, the Weird","y":2008,"d":"Kim Jee-woon","r":130,"g":["Action","Adventure","Comedy"],"c":[],"s":"1930'ların Mançurya çöllerinde bir kiralık katil, bir ödül avcısı ve bir hırsız, gizemli bir hazine haritasının peşinde birbirleriyle yarışır. Spagetti westernlere Kore usulü coşkulu bir saygı duruşu, aksiyon ve mizah dolu eğlenceli bir macera."},{"t":"The Hurt Locker","y":2008,"d":"Kathryn Bigelow","r":131,"g":["Drama","Thriller","War"],"c":["Jeremy Renner","Anthony Mackie"],"s":"Irak'ta bir bomba imha ekibine katılan pervasız bir çavuş, ekip arkadaşlarını tedirgin eden yöntemleriyle her gün ölümle burun buruna gelir. Kathryn Bigelow'a en iyi yönetmen Oscar'ını getiren, gerilimi bir an bile düşmeyen güçlü bir savaş filmi."},{"t":"The Wrestler","y":2008,"d":"Darren Aronofsky","r":109,"g":["Drama","Sport"],"c":["Mickey Rourke","Marisa Tomei"],"s":"1980'lerin ünlü güreşçisi Randy \"The Ram\", yıllar sonra küçük salonlarda dövüşürken sağlığı ve kopmuş ilişkileriyle yüzleşmek zorunda kalır. Mickey Rourke'un hayatının rolündeki çıplak ve yürek sızlatan performansıyla unutulmaz bir dram."},{"t":"WALL-E","y":2008,"d":"Andrew Stanton","r":98,"g":["Adventure","Animation","Family"],"c":["Ben Burtt","Elissa Knight"],"s":"İnsanların terk ettiği Dünya'da yüzyıllardır çöp toplayan yalnız robot WALL-E, gezegene gelen zarif keşif robotu EVE'e âşık olur. Neredeyse diyalogsuz ilk yarısıyla Pixar'ın en cesur ve şiirsel filmlerinden biri, her yaştan izleyicinin kalbini kazanıyor."},{"t":"An Education","y":2009,"d":"Lone Scherfig","r":100,"g":["Drama"],"c":[],"s":"1961 Londra'sında Oxford'a hazırlanan zeki bir liseli kız, kendisinden çok daha büyük, çekici bir adamla tanışınca parlak bir dünyanın kapıları açılır. Carey Mulligan'ın ışıltılı performansıyla büyüme ve seçimler üzerine şık ve zekice bir film."},{"t":"Avatar","y":2009,"d":"James Cameron","r":162,"g":["Action","Adventure","Fantasy"],"c":["Sam Worthington","Zoe Saldaña"],"s":"Felçli eski bir denizci, uzak ay Pandora'da yerli Na'vi halkı arasına bir avatar bedeniyle sızar ve zamanla onların tarafına geçer. Çığır açan 3D görselliği ve büyüleyici dünyasıyla gişe rekorları kıran, görsel bir şölen."},{"t":"District 9","y":2009,"d":"Neill Blomkamp","r":112,"g":["Action","Sci-Fi","Thriller"],"c":["Sharlto Copley","David James"],"s":"Johannesburg'da yıllardır bir kampa kapatılan uzaylı mültecileri tahliye etmekle görevli bir memur, beklenmedik bir değişim geçirmeye başlar. Belgesel üslubu ve apartheid göndermeleriyle bilimkurguyu keskin bir toplumsal hicve dönüştüren özgün bir film."},{"t":"Fish Tank","y":2009,"d":"Andrea Arnold","r":123,"g":["Drama"],"c":[],"s":"Essex'te bir sosyal konutta yaşayan öfkeli on beş yaşındaki Mia, dans ederek kaçış ararken annesinin çekici yeni sevgilisi hayatına girer. Andrea Arnold'un gerçekçi ve şefkatli bakışıyla genç bir kadının dünyasını anlatan çarpıcı bir İngiliz filmi."},{"t":"In the Loop","y":2009,"d":"Armando Iannucci","r":106,"g":["Comedy"],"c":[],"s":"Amerikan başkanı ve İngiliz başbakanı Orta Doğu'da bir savaşa hazırlanırken, iki ülkenin beceriksiz bürokratları ve danışmanları kaosu daha da büyütür. Armando Iannucci'nin hızlı ve zehirli diyaloglarla dolu siyasi hicvi, yılların en komik filmlerinden biri."},{"t":"Inglourious Basterds","y":2009,"d":"Quentin Tarantino","r":153,"g":["Drama","War"],"c":["Brad Pitt","Diane Kruger","Christoph Waltz"],"s":"İşgal altındaki Fransa'da Yahudi Amerikan askerlerinden oluşan bir birlik ile ailesi katledilmiş genç bir sinema sahibi, Nazi liderlerine karşı ayrı planlar kurar. Tarantino'nun gerilim dolu diyalogları ve Christoph Waltz'un muhteşem oyunuyla tarihi yeniden yazan bir masal."},{"t":"Precious","y":2009,"d":"Lee Daniels","r":110,"g":["Drama"],"c":[],"s":"1987 Harlem'inde okuma yazma bilmeyen, hamile ve istismarcı bir annenin gölgesinde yaşayan genç Precious, alternatif bir okulda kendine bir çıkış yolu arar. Mo'Nique'in çarpıcı performansıyla sarsıcı ama sonunda umut veren güçlü bir dram."},{"t":"The Hangover","y":2009,"d":"Todd Phillips","r":100,"g":["Comedy"],"c":["Zach Galifianakis","Bradley Cooper"],"s":"Las Vegas'taki bekârlığa veda partisinin ertesi sabahı uyanan üç arkadaş, geceyi hiç hatırlamaz ve damadı kaybettiklerini fark eder. Absürt sürprizleri ve kahkaha dolu kovalamacasıyla bir kuşağın en sevilen komedilerinden biri."},{"t":"The White Ribbon","y":2009,"d":"Michael Haneke","r":144,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Birinci Dünya Savaşı öncesinde Kuzey Almanya'da bir köyde, açıklanamayan tuhaf ve acımasız olaylar birbirini izler. Haneke'nin siyah beyaz, soğuk ve kusursuz görüntüleriyle faşizmin tohumlarını sorgulayan, Altın Palmiye kazanmış etkileyici bir film."},{"t":"Black Swan","y":2010,"d":"Darren Aronofsky","r":108,"g":["Drama","Thriller"],"c":["Natalie Portman","Mila Kunis"],"s":"New York'ta mükemmeliyetçi bir balerin, Kuğu Gölü'nde hem saf beyaz kuğuyu hem karanlık siyah kuğuyu oynama şansı yakalar ama baskı onu sınırlarına zorlar. Natalie Portman'ın Oscar'lı performansıyla Aronofsky'nin baş döndürücü psikolojik gerilimi."},{"t":"Cave of Forgotten Dreams","y":2010,"d":"Werner Herzog","r":90,"g":["Documentary","History"],"c":[],"s":"Werner Herzog, Fransa'daki Chauvet mağarasına özel izinle girerek otuz bin yılı aşkın süredir saklı kalmış insanlığın bilinen en eski resimlerini kameraya alır. Tarih öncesi sanatın büyüsünü ve insan olmanın gizemini hissettiren benzersiz bir belgesel."},{"t":"Four Lions","y":2010,"d":"Chris Morris","r":97,"g":["Comedy","Crime","Drama"],"c":[],"s":"İngiltere'nin kuzeyinde bir grup beceriksiz ve kafası karışık adam, cihat hayaliyle bir eylem planlamaya çalışır ama her adım felakete dönüşür. Chris Morris'in cesur ve absürt mizahıyla radikalleşmenin saçmalığını hicveden, kahkaha ile rahatsızlık arasında gidip gelen bir film."},{"t":"Inception","y":2010,"d":"Christopher Nolan","r":148,"g":["Adventure","Sci-Fi","Thriller"],"c":["Leonardo DiCaprio","Joseph Gordon-Levitt"],"s":"İnsanların rüyalarına girip sırları çalan bir hırsız, son bir iş için bir zihne fikir yerleştirmekle görevlendirilir. Christopher Nolan'ın katman katman rüyalar ve büklümlü şehirlerle kurduğu, hem zeki hem heyecan dolu görsel bir labirent."},{"t":"Monsters","y":2010,"d":"Gareth Edwards","r":94,"g":["Adventure","Drama","Romance"],"c":[],"s":"Uzaylı yaratıkların yayıldığı Meksika'daki karantina bölgesinde, bir fotoğrafçı patronunun kızını güvenle Amerika'ya götürmeyi üstlenir. Küçük bütçeli bu film, canavarlardan çok iki insanın yakınlaşmasına odaklanan atmosferik ve özgün bir yol hikâyesi."},{"t":"Nostalgia for the Light","y":2010,"d":"Patricio Guzmán","r":90,"g":["Documentary"],"c":[],"s":"Şili'nin Atacama Çölü'nde gökbilimciler evrenin geçmişini ararken, anneler de Pinochet döneminde kaybolan yakınlarının kemiklerini aramaktadır. Patricio Guzmán'ın yıldızlarla belleği birleştiren şiirsel belgeseli, hem büyüleyici hem derinden sarsıcı."},{"t":"Of Gods and Men","y":2010,"d":"Xavier Beauvois","r":122,"g":["Drama","History"],"c":[],"s":"1990'larda Cezayir'de bir manastırda yaşayan Fransız keşişler, iç savaş şiddeti yaklaşırken kalıp kalmama kararıyla yüzleşir. Gerçek olaylardan esinlenen bu sade, sessiz ve derin film, inanç ve dayanışma üzerine unutulmaz bir tefekkür."},{"t":"Senna","y":2010,"d":"Asif Kapadia","r":106,"g":["Biography","Documentary","Sport"],"c":[],"s":"Brezilyalı efsanevi Formula 1 pilotu Ayrton Senna'nın parlak kariyeri, Alain Prost ile rekabeti ve pistteki tutkusu yalnızca arşiv görüntüleriyle anlatılır. Yarış sevmeyenleri bile büyüleyen, heyecan dolu ve derinden duygusal bir belgesel."},{"t":"The King's Speech","y":2010,"d":"Tom Hooper","r":118,"g":["Biography","Drama","History"],"c":["Colin Firth","Geoffrey Rush"],"s":"Kekemelik sorunu yaşayan İngiltere kralı VI. George, sıra dışı yöntemleri olan Avustralyalı bir konuşma terapistiyle çalışmaya başlar. Colin Firth ile Geoffrey Rush'ın muhteşem uyumuyla dostluk ve cesaret üzerine sıcak, dört Oscar'lı bir film."},{"t":"The Social Network","y":2010,"d":"David Fincher","r":120,"g":["Biography","Drama"],"c":["Jesse Eisenberg","Andrew Garfield"],"s":"Harvard'lı öğrenci Mark Zuckerberg'in yurt odasında başlattığı Facebook, milyarlarca dolarlık bir imparatorluğa dönüşürken dostlukları da mahkeme salonlarına taşır. Aaron Sorkin'in keskin diyalogları ve Fincher'ın soğuk yönetimiyle çağımızın öyküsü."},{"t":"Toy Story 3","y":2010,"d":"Lee Unkrich","r":103,"g":["Adventure","Animation","Comedy"],"c":["Tom Hanks","Tim Allen"],"s":"Andy üniversiteye gitmeye hazırlanırken oyuncakları yanlışlıkla bir kreşe bağışlanır ve eve dönmek için büyük bir kaçış planı yaparlar. Büyümek ve vedalaşmak üzerine yetişkinleri bile gözyaşlarına boğan, Pixar'ın en duygusal filmlerinden biri."},{"t":"True Grit","y":2010,"d":"Joel Coen","r":110,"g":["Drama","Western"],"c":["Jeff Bridges","Matt Damon"],"s":"Babasının katilinin cezalandırılmasını isteyen on dört yaşındaki inatçı Mattie, huysuz ve ayyaş bir federal şerifi tutarak Kızılderili topraklarına doğru yola çıkar. Coen Kardeşler'in klasik western'e zekice ve zarif bir dokunuşu, Hailee Steinfeld'in muhteşem ilk rolüyle."},{"t":"A Separation","y":2011,"d":"Asghar Farhadi","r":123,"g":["Drama"],"c":["Payman Maadi","Leila Hatami"],"s":"Tahranlı bir çift boşanma sürecindeyken, Alzheimer hastası babaya bakmak için tutulan bakıcıyla yaşanan bir olay iki aileyi mahkemeye taşır. Asghar Farhadi'nin ahlaki ikilemleri ustaca kurduğu, gerilimli ve Oscar ödüllü bir aile dramı."},{"t":"Bridesmaids","y":2011,"d":"Paul Feig","r":125,"g":["Comedy"],"c":["Kristen Wiig","Maya Rudolph"],"s":"Hayatı yolunda gitmeyen Annie, en yakın arkadaşının nedimeliği görevini üstlenir ama mükemmeliyetçi başka bir nedimeyle rekabet işleri felakete çevirir. Kristen Wiig'in yazıp oynadığı, hem kahkahalı hem samimi, kadın dostluğuna yazılmış bir komedi."},{"t":"Drive","y":2011,"d":"Nicolas Winding Refn","r":100,"g":["Action","Drama"],"c":["Ryan Gosling","Carey Mulligan"],"s":"Gündüzleri dublörlük, geceleri kaçış şoförlüğü yapan sessiz bir adam, komşusu ve oğluyla yakınlaşınca tehlikeli bir soygunun içine çekilir. Neon ışıkları, sentezleyici müzikleri ve şiddetli patlamalarıyla Nicolas Winding Refn'in stil dolu kült filmi."},{"t":"Hugo","y":2011,"d":"Martin Scorsese","r":126,"g":["Adventure","Drama","Family"],"c":["Asa Butterfield","Chloë Grace Moretz"],"s":"1930'ların Paris'inde bir tren garının duvarları içinde yaşayan yetim Hugo, babasından kalan mekanik bir adamın sırrını çözmeye çalışır. Scorsese'nin sinemanın doğuşuna ve Georges Méliès'e yazdığı büyüleyici, sıcak bir aşk mektubu."},{"t":"Le Havre","y":2011,"d":"Aki Kaurismäki","r":93,"g":["Comedy","Drama"],"c":[],"s":"Le Havre'da ayakkabı boyacılığı yapan yaşlı bir adam, limanda saklanan Afrikalı mülteci bir çocuğu polisten korumak için tüm mahalleyi harekete geçirir. Aki Kaurismäki'nin kuru mizahı ve iyilik dolu bakışıyla insanın içini ısıtan bir masal."},{"t":"Shame","y":2011,"d":"Steve McQueen","r":101,"g":["Drama"],"c":[],"s":"New York'ta başarılı ama içten içe yalnız bir adam, bağımlılıklarıyla düzenlediği hayatı, kırılgan kız kardeşinin evine taşınmasıyla sarsılır. Michael Fassbender'ın cesur performansı ve Steve McQueen'in soğuk, zarif görüntüleriyle yalnızlık üzerine çarpıcı bir portre."},{"t":"The Artist","y":2011,"d":"Michel Hazanavicius","r":100,"g":["Comedy","Drama","Romance"],"c":["Jean Dujardin"],"s":"1927 Hollywood'unda sessiz sinemanın parlayan yıldızı George Valentin, sesli filmlerin gelişiyle gözden düşerken genç bir dansçı yükselişe geçer. Siyah beyaz ve neredeyse tamamen sessiz çekilen bu zarif film, sinemanın altın çağına sevgi dolu bir selam."},{"t":"The Descendants","y":2011,"d":"Alexander Payne","r":115,"g":["Comedy","Drama"],"c":[],"s":"Hawaii'de eşi bir kazayla komaya giren avukat Matt King, iki kızıyla yakınlaşmaya çalışırken eşinin sakladığı bir sırrı öğrenir. George Clooney'nin incelikli oyunu ve Alexander Payne'in hüzünle mizahı dengeleyen anlatımıyla sıcak bir aile hikâyesi."},{"t":"The Girl With the Dragon Tattoo","y":2011,"d":"David Fincher","r":158,"g":["Crime","Drama","Mystery"],"c":["Daniel Craig","Rooney Mara"],"s":"Gözden düşmüş bir gazeteci, kırk yıl önce kaybolan bir genç kızın sırrını çözmek için sıra dışı ve dahi bir hacker olan Lisbeth Salander'la birlikte çalışır. David Fincher'ın karanlık ve şık atmosferiyle İsveç'in karlı sessizliğinde geçen sürükleyici bir gerilim."},{"t":"The Kid With a Bike","y":2011,"d":"Luc Dardenne","r":87,"g":["Drama"],"c":[],"s":"Babası tarafından yurtta bırakılan on bir yaşındaki Cyril, bisikletini ve babasını ararken hafta sonları ona bakmayı kabul eden bir kuaförle tanışır. Dardenne Kardeşler'in sade ama sıcacık anlatımıyla sevgiye ve ikinci şanslara dair dokunaklı bir film."},{"t":"The Tree of Life","y":2011,"d":"Terrence Malick","r":139,"g":["Drama","Fantasy"],"c":[],"s":"1950'lerin Teksas'ında büyüyen bir çocuğun, sert babası ve şefkatli annesi arasındaki hatıraları, evrenin doğuşuna uzanan görüntülerle iç içe geçer. Terrence Malick'in Altın Palmiye kazanan bu iddialı filmi, sinemanın şiire en çok yaklaştığı anlardan biri."},{"t":"Tinker Tailor Soldier Spy","y":2011,"d":"Tomas Alfredson","r":127,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Soğuk Savaş'ın ortasında emekliye ayrılmış casus George Smiley, İngiliz istihbaratının zirvesine sızmış bir Sovyet köstebeği bulmak için geri çağrılır. Gary Oldman'ın sessiz ustalığı ve atmosferik görüntüleriyle le Carré uyarlaması zarif ve zeki bir gerilim."},{"t":"War Horse","y":2011,"d":"Steven Spielberg","r":146,"g":["Adventure","Drama","History"],"c":[],"s":"İngiliz bir çiftçi çocuğunun sevgiyle büyüttüğü at Joey, Birinci Dünya Savaşı'nda orduya satılır ve cepheler boyunca birçok insanın hayatına dokunur. Spielberg'in klasik Hollywood tarzındaki görkemli anlatımıyla sadakat ve umut üzerine duygusal bir destan."},{"t":"Amour","y":2012,"d":"Michael Haneke","r":127,"g":["Drama"],"c":[],"s":"Emekli müzik öğretmenleri Georges ve Anne'in uzun ve sevgi dolu evlilikleri, Anne'in geçirdiği bir felçle en zor sınavıyla yüzleşir. Haneke'nin şefkatle çektiği bu yalın ve cesur film, aşkın gerçek anlamı üzerine Altın Palmiye ödüllü bir başyapıt."},{"t":"Argo","y":2012,"d":"Ben Affleck","r":120,"g":["Biography","Drama","History"],"c":["Ben Affleck","Bryan Cranston"],"s":"1979 İran devriminde Tahran'da saklanan altı Amerikalı diplomatı kurtarmak için bir CIA ajanı, sahte bir bilimkurgu filmi çekimi bahanesi uydurur. Gerçek bir hikâyeye dayanan, gerilimi ve mizahı ustaca dengeleyen, en iyi film Oscar'lı sürükleyici bir yapım."},{"t":"Blancanieves","y":2012,"d":"Pablo Berger","r":104,"g":["Drama","Fantasy"],"c":[],"s":"1920'lerin Endülüs'ünde ünlü bir matadorun kızı, acımasız üvey annesinden kaçıp cüce boğa güreşçilerinden oluşan bir gezici toplulukla yaşamaya başlar. Pamuk Prenses masalını siyah beyaz ve sessiz bir İspanyol melodramına dönüştüren büyüleyici bir film."},{"t":"Django Unchained","y":2012,"d":"Quentin Tarantino","r":165,"g":["Drama","Western"],"c":["Jamie Foxx","Christoph Waltz"],"s":"Serbest bırakılan köle Django, Alman bir ödül avcısıyla birlikte, acımasız bir plantasyon sahibinin elindeki karısını kurtarmak için yola çıkar. Tarantino'nun spagetti western ruhunu köleliğe karşı öfkeli bir intikam hikâyesiyle birleştirdiği coşkulu film."},{"t":"Les Misérables","y":2012,"d":"Tom Hooper","r":158,"g":["Drama","Musical","Romance"],"c":[],"s":"Ekmek çaldığı için yıllarca hapis yatan Jean Valjean, yeni bir hayata başlar ama ısrarcı müfettiş Javert onu devrimci Paris'e kadar izler. Victor Hugo'nun klasiğinden uyarlanan ünlü müzikal, oyuncuların canlı söylediği şarkılarla duygusal bir şölen."},{"t":"Life of Pi","y":2012,"d":"Ang Lee","r":127,"g":["Adventure","Drama","Fantasy"],"c":["Suraj Sharma","Irrfan Khan"],"s":"Hindistanlı genç Pi, bir gemi kazasından sonra Pasifik Okyanusu'nda Richard Parker adında bir Bengal kaplanıyla aynı cankurtaran sandalında kalır. Ang Lee'nin nefes kesen görselliğiyle inanç ve hayatta kalma üzerine büyüleyici bir macera."},{"t":"Lincoln","y":2012,"d":"Steven Spielberg","r":150,"g":["Biography","Drama","History"],"c":["Daniel Day-Lewis","Sally Field"],"s":"1865'te İç Savaş son aylarına girerken Başkan Abraham Lincoln, köleliği kaldıracak anayasa değişikliğini Kongre'den geçirmek için bütün siyasi ustalığını kullanır. Daniel Day-Lewis'in büyüleyici performansıyla siyaset ve vicdan üzerine zekice bir dönem dramı."},{"t":"Skyfall","y":2012,"d":"Sam Mendes","r":143,"g":["Action","Adventure","Thriller"],"c":["Daniel Craig","Javier Bardem"],"s":"Bir görevde başarısız olup ortadan kaybolan James Bond, MI6'ya yapılan bir saldırının ardından M'yi geçmişinden gelen bir tehdide karşı korumak için geri döner. Roger Deakins'in göz alıcı görüntüleriyle serinin en şık ve duygusal filmlerinden biri."},{"t":"The Act of Killing","y":2012,"d":"Joshua Oppenheimer","r":117,"g":["Biography","Crime","Documentary"],"c":[],"s":"Endonezya'da 1965'teki katliamlara katılmış eski ölüm mangası üyeleri, geçmişte yaptıklarını kendi hayal ettikleri film sahneleriyle yeniden canlandırmaya davet edilir. Gerçeküstü ve sarsıcı bu belgesel, kötülüğün ve inkârın doğasına eşi görülmemiş bir bakış."},{"t":"The Cabin in the Woods","y":2012,"d":"Drew Goddard","r":95,"g":["Horror","Mystery","Thriller"],"c":["Kristen Connolly","Chris Hemsworth"],"s":"Beş üniversiteli arkadaş hafta sonu için ormandaki ıssız bir kulübeye gider ama başlarına gelenler göründüğünden çok daha büyük bir planın parçasıdır. Korku türünün tüm klişeleriyle zekice oynayan, eğlenceli ve sürprizlerle dolu bir yapım."},{"t":"Wadjda","y":2012,"d":"Haifaa al-Mansour","r":98,"g":["Comedy","Drama"],"c":[],"s":"Riyad'da yaşayan on yaşındaki asi Wadjda, kızlara pek uygun görülmeyen bir yeşil bisiklete sahip olmak için Kuran okuma yarışmasına katılmaya karar verir. Suudi Arabistan'da çekilen ilk uzun metrajlı filmlerden biri, sıcak, esprili ve umut dolu."},{"t":"12 Years a Slave","y":2013,"d":"Steve McQueen","r":134,"g":["Biography","Drama","History"],"c":["Chiwetel Ejiofor","Michael Kenneth Williams","Lupita Nyong'o"],"s":"1841'de New York'ta özgür yaşayan bir müzisyen olan Solomon Northup, kaçırılarak Güney'de köle olarak satılır ve on iki yıl boyunca hayatta kalmaya çalışır. Steve McQueen'in gerçek bir hikâyeden uyarladığı, sarsıcı ve unutulmaz, en iyi film Oscar'lı bir eser."},{"t":"A Touch of Sin","y":2013,"d":"Jia Zhangke","r":130,"g":["Crime","Drama"],"c":[],"s":"Çin'in farklı bölgelerinde yaşayan dört sıradan insan, yolsuzluk ve adaletsizlik karşısında birer birer şiddete sürüklenir. Jia Zhangke'nin gerçek haberlerden esinlenen bu cesur filmi, modern Çin'in hızlı dönüşümüne keskin bir ayna tutuyor."},{"t":"American Hustle","y":2013,"d":"David O. Russell","r":138,"g":["Crime","Drama"],"c":["Christian Bale","Amy Adams"],"s":"1970'lerin sonunda iki usta dolandırıcı, hırslı bir FBI ajanı tarafından politikacılara yönelik büyük bir operasyona dahil olmaya zorlanır. Göz alıcı kostümleri, gösterişli saçları ve yıldız kadrosuyla eğlenceli ve renkli bir dönem komedisi."},{"t":"Blue Is the Warmest Color","y":2013,"d":"Abdellatif Kechiche","r":null,"g":["Romance"],"c":[],"s":"Liseli Adèle, mavi saçlı sanat öğrencisi Emma ile tanışınca hayatını değiştirecek büyük bir aşka kapılır. Adèle Exarchopoulos ile Léa Seydoux'nun çıplak ve güçlü oyunlarıyla ilk aşkın coşkusunu ve acısını anlatan, Altın Palmiye ödüllü yoğun bir film."},{"t":"Gravity","y":2013,"d":"Alfonso Cuarón","r":91,"g":["Drama","Sci-Fi","Thriller"],"c":["Sandra Bullock","George Clooney"],"s":"Uzay istasyonunda onarım yapan bir mühendis ile deneyimli bir astronot, enkaz yağmuru mekiklerini parçalayınca boşlukta sürüklenir ve Dünya'ya dönmenin yolunu arar. Alfonso Cuarón'un nefes kesen görselliğiyle beyazperdede yaşanması gereken soluksuz bir deneyim."},{"t":"Inside Llewyn Davis","y":2013,"d":"Joel Coen","r":104,"g":["Drama","Music"],"c":[],"s":"1961'de Greenwich Village'ın folk sahnesinde yetenekli ama şanssız şarkıcı Llewyn Davis, bir haftalığına kanepeden kanepeye dolaşarak kariyerini kurtarmaya çalışır. Coen Kardeşler'in melankolik mizahı ve güzel şarkılarıyla kış gibi hüzünlü, çok zarif bir film."},{"t":"Nebraska","y":2013,"d":"Alexander Payne","r":115,"g":["Drama"],"c":[],"s":"Bir milyon dolar kazandığına inanan yaşlı ve huysuz Woody, ödülünü almak için Montana'dan Nebraska'ya yürümeye kararlıdır ve oğlu onu arabayla götürmeyi kabul eder. Siyah beyaz görüntüleri ve kuru mizahıyla baba oğul ilişkisine dair tatlı ve hüzünlü bir yol filmi."},{"t":"The Great Beauty","y":2013,"d":"Paolo Sorrentino","r":141,"g":["Drama"],"c":[],"s":"Altmış beşinci yaş gününü kutlayan Romalı gazeteci ve sosyete figürü Jep Gambardella, gösterişli partiler arasında hayatının anlamını ve kaybettiği güzelliği sorgular. Sorrentino'nun Roma'yı büyüleyici bir görsel şölene dönüştürdüğü, Oscar'lı ve Fellini ruhlu bir film."},{"t":"The Wolf of Wall Street","y":2013,"d":"Martin Scorsese","r":180,"g":["Biography","Comedy","Crime"],"c":["Leonardo DiCaprio","Jonah Hill"],"s":"Hırslı borsacı Jordan Belfort, 1990'larda sahtekârlıkla kurduğu şirketiyle servet, eğlence ve sınırsız aşırılıklar dolu bir hayata dalar. Scorsese'nin enerjik yönetimi ve DiCaprio'nun coşkulu performansıyla açgözlülüğü hicveden, gürültülü ve kahkahalı bir film."}];
const NOTES = {"tatli":["Merak etme, yalnız değilsin. Koltuğun yarısı benim.","Film ne olursa olsun, en sevdiğim sahne senin başın omzumdayken.","Saatlerimiz senkronize olsun diye kıtalar değiştirdik. Bu gece aynı filmde buluşalım.","Daha çok adventure var dedin. İşte bu gecenin macerası.","Paris'i seviyorsun, ben de Paris'i seven seni.","Jenerik bitene kadar elimi bırakma, anlaşma böyle.","Hangi film çıkarsa çıksın, bu gecenin başrolü sensin.","Bu kitaptaki 1001 filmi tek tek seninle izlemek istiyorum. Acelemiz yok.","Kötü bir film bile seninle iyi bir akşam oluyor.","Film uzun sürerse sorun değil. Seninle geçen zaman hep kısa geliyor.","Sen izlerken ben bazen filmi değil seni izliyorum. Kusura bakma.","Bu gece telefon yok, sadece biz ve bir ekran.","Kalbim bugün de senin frekansında.","Seninle en güzel sahneler hep plansız olanlar.","Uyuya kalırsan üstünü örterim, sonunu yarın anlatırım."],"saka":["Depresif bir Fransız filmi çıktıysa suçlu ben değilim, kitap.","Bu gece hava tam Italian drama film gibi. Sen de başrolde.","Mete onaylı. Beğenmezsen pros and cons yaparız, ölçer biçeriz.","Film sıkarsa yedek plan hazır: Hollandalıların mühendislik videoları.","Filmde ayakkabıları iki kere gösterirlerse haber ver, ben fark ederim.","Ski jumping mi, film mi? Bu gece film kazandı, olimpiyatlar bekleyebilir.","Romantik advice lazımsa film bitince Mete'ye danışabilirsiniz. Randevu ücretsiz.","Ferrari kafası yok bu gece, sadece battaniye kafası.","Film ne kadar ağır olursa olsun, rüzgar varsa yarın sabah sörf.","Bu filmin sonunda ağlarsam kimseye söylemiyorsun.","Uyarı: Mete ilk yarım saatte en az iki kere 'bu kim?' diye soracak.","Filmden sonra kritik yazmak serbest, ama puanı birlikte veriyoruz.","Bu gece kararı ben vermedim, kitap verdi. Şikayetler kitaba."],"kupon":["Bu gecenin yemeği benden. Lahmacun mu, makarna mı, sen seç.","Jenerik boyunca ayak masajı.","Bir sonraki filmi sen seçiyorsun, veto hakkım yok.","Film sırasında telefonlar kapalı. Sörfçüler gibi, sadece biz.","Bu gece battaniye tamamen senin.","Film arasında sıcak çikolata servisi, Mete'den.","Yarın sabah kahvaltı yatakta.","Bu filmi beğenmezsen tartışmayı sen kazanıyorsun.","Filmden sonra 20 dakikalık sarılma, pazarlık yok.","Bulaşıklar bu gece benden.","Bir kez 'geri sar, onu tekrar izleyelim' hakkı."],"botton":["de Botton'a göre aşk sadece bir his değil, zamanla öğrenilen bir beceri. Ben seninle her gün biraz daha öğreniyorum.","de Botton der ki uyum aşkın şartı değil, aşkın zamanla kazandığı bir şey. Biz de izlediğimiz her filmle biraz daha uyumluyuz.","de Botton'a göre herkesin tuhaflıkları var, asıl soru kimin tuhaflığıyla mutlu olabileceğin. Benim cevabım belli.","de Botton, sevdiğimiz insanda çoğu zaman kendimizde eksik olan şeylere hayran kaldığımızı söyler. Senin cesaretin ve kocaman kalbin benim en sevdiğim şey.","de Botton'a göre sevilmek, en zayıf halinde de görülüp kabul edilmek demek. Sen beni öyle gördün.","de Botton der ki sevgili zihnimizi okusun diye beklemek yerine, kendimizi nazikçe anlatmalıyız. O zaman söyleyeyim: seni çok seviyorum.","de Botton'a göre aşk, karşındakinin kötü gününü en iyi niyetle yorumlayabilmektir. Kötü günlerinde de buradayım.","de Botton'a göre ruh eşi sihirle bulunmuyor, birlikte inşa ediliyor. Biz de film film inşa ediyoruz.","de Botton der ki romantizm büyük anlarda değil, sıradan akşamlarda yaşanır. Bu akşam gibi."],"altin":["Bu filmi Paris'te, gerçek bir sinemada izliyoruz. Tarihi sen seç.","Jungle Eva'nın bahçesinde, yıldızların altında açık hava sineması. Sadece ikimiz.","Seçtiğin bir adaya, seçtiğin bir hafta sonu. Ferry biletlerini önceden alırız, söz.","Rüzgarın en iyi olduğu yere bir sörf haftası. Ben tahtayı taşırım.","Seneye Cannes'da kırmızı halı, kol kola.","Bir gün boyunca her dileğin emir. Sınır yok, pazarlık yok."],"ozel":{"Casablanca":"Bu filmdeki gibi, ne olursa olsun Paris hep bizim olacak.","The Apartment":"Bunu bana sen önermiştin, hatırlıyor musun? Sonunda birlikte izliyoruz.","Out of Africa":"Sana 'Out of Africa'yı izledin mi?' diye sormuştum. İşte kader.","One Flew Over the Cuckoo's Nest":"Bu filmi birlikte izleyelim demiştik. Kitap da bizi duydu.","Amelie":"Paris, küçük sürprizler ve utangaç bir kalp. Bana birini hatırlatıyor.","Roman Holiday":"Bir gün bir Vespa, bir Roma, bir de sen. Bu film prova.","La Dolce Vita":"La dolce vita için Roma'ya gitmeye gerek yok, yanımdasın ya.","Cinema Paradiso":"Bu filmin sonunda ağlamazsan sana bir kahve borçluyum. Ağlarsan sen bana.","An American in Paris":"Paris'te bir Kanadalı da fena olmazdı, değil mi?","The Umbrellas of Cherbourg":"Yağmurlu bir Fransız akşamı, şarkılar ve sen. Şemsiye benden.","Breathless":"Paris sokakları, siyah beyaz ve biraz aşk. Senin şehrin.","Jules and Jim":"Fransız sineması ve biraz karmaşık aşk. Neyse ki bizimki daha basit.","In the Mood for Love":"Bu kadar güzel bir aşk filmini seninle izlemek, filmin kendisinden bile güzel.","Lost in Translation":"Farklı dillerde, farklı şehirlerde bile birbirimizi hep anladık.","When Harry Met Sally...":"Arkadaş mıyız, sevgili mi? Cevap belli, sevgilim.","Annie Hall":"Woody Allen'ın dediği gibi ilişkiler zor. Bizimki keyifli.","Jaws":"Merak etme, bu gece sörf yok. Ama yarın var.","Titanic":"Kapıda ikimize de yer var. Ben öyle karar verdim.","Contempt":"Bu filmdeki çift gibi olmayacağız, söz. Ama Capri'ye gideriz.","L'avventura":"Bir adada kaybolmak mı? Sadece seninle.","8½":"Fellini bile bu kadar iyi bir akşam kuramazdı."}};
const GENRE = {"Drama":"Dram","Comedy":"Komedi","Romance":"Romantik","Crime":"Suç","Adventure":"Macera","Thriller":"Gerilim","Mystery":"Gizem","Horror":"Korku","Biography":"Biyografi","Action":"Aksiyon","War":"Savaş","History":"Tarih","Fantasy":"Fantastik","Sci-Fi":"Bilimkurgu","Documentary":"Belgesel","Music":"Müzik","Western":"Western","Film-Noir":"Kara Film","Musical":"Müzikal","Family":"Aile","Animation":"Animasyon","Sport":"Spor"};
const KIND = {tatli:"Küçük bir not",saka:"Aramızda kalsın",kupon:"Kupon",botton:"Alain de Botton'dan esinle",altin:"Altın bilet",ozel:"Bu filme özel"};
const $ = id => document.getElementById(id);

// petals on the medallion ring
(function(){const g=$('petals');let s='';for(let i=0;i<12;i++){const a=i*30;s+=`<path transform="rotate(${a} 104 104)" d="M104 10 C98 18 98 24 104 30 C110 24 110 18 104 10Z"/>`}g.innerHTML=s})();

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=new Set(store.get('cz_seen',[]));
let bag=[]; let current=null;

function refill(){bag=[];for(const k of ['tatli','saka','kupon','botton'])NOTES[k].forEach(m=>bag.push([k,m]));for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
function pickNote(f){
  if(NOTES.ozel[f.t]) return ['ozel',NOTES.ozel[f.t]];
  if(Math.random()<0.05) return ['altin',NOTES.altin[Math.floor(Math.random()*NOTES.altin.length)]];
  if(!bag.length) refill(); return bag.pop();
}
function hours(m){if(!m)return'';const h=Math.floor(m/60),r=m%60;return h?`${h} sa ${r?r+' dk':''}`.trim():`${r} dk`}
function updCount(){$('count').textContent=`${seen.size} / ${FILMS.length} izlendi`;$('reset').hidden=seen.size===0}

function show(){
  const pool=FILMS.map((f,i)=>i).filter(i=>!seen.has(i));
  const src=pool.length?pool:FILMS.map((f,i)=>i);
  let i=src[Math.floor(Math.random()*src.length)];
  if(src.length>1&&current===i) i=src[(src.indexOf(i)+1)%src.length];
  current=i; const f=FILMS[i];
  $('fNo').textContent=`No. ${String(i+1).padStart(4,'0')}`;
  $('fTitle').textContent=f.t;
  $('fMeta').innerHTML='';[f.y,f.d,hours(f.r)].filter(Boolean).forEach(t=>{const s=document.createElement('span');s.textContent=t;$('fMeta').appendChild(s)});
  $('fChips').innerHTML='';f.g.filter(g=>GENRE[g]).slice(0,3).forEach(g=>{const s=document.createElement('span');s.className='chip';s.textContent=GENRE[g];$('fChips').appendChild(s)});
  $('fDesc').textContent=f.s;
  $('fCast').textContent=f.c&&f.c.length?f.c.join(', '):'';$('fCast').hidden=!(f.c&&f.c.length);
  $('seen').classList.toggle('on',seen.has(i));$('seen').textContent=seen.has(i)?'İzlendi ✓':'İzledik ✓';
  const [k,m]=pickNote(f);
  $('nMsg').textContent=m;
  $('note').hidden=true;$('env').hidden=false;$('hint').hidden=false;
  
  $('intro').hidden=true;$('poster').hidden=false;$('letter').hidden=false;
  $('poster').classList.remove('fade');void $('poster').offsetWidth;$('poster').classList.add('fade');
  $('pickTxt').textContent='Yeniden';
}
function roll(){const m=$('pick');m.classList.remove('spin');void m.offsetWidth;m.classList.add('spin');show()}
$('pick').addEventListener('click',roll);
$('again').addEventListener('click',()=>{roll();$('poster').scrollIntoView({behavior:'smooth',block:'start'})});
$('env').addEventListener('click',()=>{$('env').hidden=true;$('hint').hidden=true;$('note').hidden=false});
$('seen').addEventListener('click',()=>{if(current==null)return;seen.has(current)?seen.delete(current):seen.add(current);store.set('cz_seen',[...seen]);$('seen').classList.toggle('on',seen.has(current));$('seen').textContent=seen.has(current)?'İzlendi ✓':'İzledik ✓';updCount()});
$('reset').addEventListener('click',()=>{if($('reset').dataset.sure){seen=new Set();store.set('cz_seen',[]);$('reset').textContent='İzlenenleri sıfırla';delete $('reset').dataset.sure;updCount();$('seen').classList.remove('on');$('seen').textContent='İzledik ✓'}else{$('reset').dataset.sure='1';$('reset').textContent='Emin misin? Tekrar dokun.'}});
updCount();
</script>
