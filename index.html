<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciné Zeynep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Marcellus+SC&display=swap">
<style>
/* Layout: one centred column like a Mucha panel. Metro-arch header, a halo medallion button, a poster-frame film card, then a sealed envelope holding the note. */
:root{
  --paper:#eee7d3; --paper-2:#e4dac0; --ink:#2b2a22; --ink-soft:#5a5646;
  --verdigris:#35513f; --gold:#a8803a; --gold-hi:#d7b56a; --rose:#b3706a; --sage:#8fa086;
  --card:#f6f0df; --seal:#8e3b36;
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-label:"Marcellus SC","Marcellus","Trajan Pro",Georgia,serif;
  --f-body:"Cormorant Garamond",Garamond,Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15201a; --paper-2:#1c2a22; --ink:#efe6cf; --ink-soft:#bdb59c;
  --verdigris:#8fb49a; --gold:#d2ad5e; --gold-hi:#ecd08e; --rose:#d99a90; --sage:#9fb495;
  --card:#1d2b23; --seal:#b0514a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15201a; --paper-2:#1c2a22; --ink:#efe6cf; --ink-soft:#bdb59c;
  --verdigris:#8fb49a; --gold:#d2ad5e; --gold-hi:#ecd08e; --rose:#d99a90; --sage:#9fb495;
  --card:#1d2b23; --seal:#b0514a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.5;
  padding-inline:16px;padding-block:24px 56px;
  background-image:radial-gradient(ellipse at 50% -10%, color-mix(in srgb,var(--gold) 16%,transparent), transparent 60%),
  radial-gradient(ellipse at 50% 110%, color-mix(in srgb,var(--sage) 18%,transparent), transparent 55%);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px}
svg{display:block}

/* header */
header{width:100%;text-align:center;position:relative}
.arch{width:100%;max-width:520px;height:auto;margin:0 auto;color:var(--verdigris)}
.brand{margin-top:-8px}
.eyebrow{font-family:var(--f-label);letter-spacing:.22em;font-size:13px;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(48px,13vw,76px);line-height:.95;margin:.08em 0 .1em;color:var(--verdigris);text-wrap:balance}
h1 .amp{color:var(--rose)}
.sub{font-style:italic;color:var(--ink-soft);font-size:18px;margin:0}

/* medallion button */
.medal{position:relative;width:208px;height:208px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);-webkit-tap-highlight-color:transparent}
.medal svg{position:absolute;inset:0;width:100%;height:100%}
.medal .ring{transition:transform 1.2s cubic-bezier(.2,.7,.2,1);transform-origin:50% 50%}
.medal:hover .ring{transform:rotate(18deg)}
.medal.spin .ring{transform:rotate(360deg)}
.medal .label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.medal .big{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:34px;line-height:1;color:var(--verdigris)}
.medal .small{font-family:var(--f-label);font-size:12px;letter-spacing:.2em;color:var(--gold)}
.medal:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:50%}
.medal:active .label{transform:scale(.97)}

/* poster card */
.poster{position:relative;width:100%;background:var(--card);padding:34px 26px 26px;
  border-radius:180px 180px 6px 6px / 120px 120px 6px 6px;
  box-shadow:0 1px 0 var(--gold-hi) inset,0 18px 40px -24px color-mix(in srgb,var(--ink) 55%,transparent)}
.poster::before{content:"";position:absolute;inset:9px;border:1px solid var(--gold);
  border-radius:172px 172px 3px 3px / 114px 114px 3px 3px;pointer-events:none}
.poster::after{content:"";position:absolute;inset:14px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
  border-radius:166px 166px 2px 2px / 110px 110px 2px 2px;pointer-events:none}
.poster > *{position:relative;z-index:1}
.lily{width:92px;margin:0 auto 4px;color:var(--gold)}
.no{font-family:var(--f-label);letter-spacing:.2em;font-size:12px;color:var(--rose);text-align:center}
.title{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,8.5vw,46px);line-height:1.02;text-align:center;margin:.2em 0 .25em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-family:var(--f-label);font-size:13px;letter-spacing:.08em;color:var(--verdigris)}
.meta span+span::before{content:"❧";margin-right:14px;color:var(--gold);font-family:var(--f-body)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 4px}
.chip{font-family:var(--f-label);font-size:11.5px;letter-spacing:.12em;padding:3px 10px 2px;border:1px solid var(--sage);color:var(--ink-soft);border-radius:999px}
.desc{margin:16px auto 6px;max-width:34em;text-align:center;font-size:20px;line-height:1.5}
.cast{text-align:center;font-style:italic;color:var(--ink-soft);font-size:17px;margin:0}
.rule{width:70%;margin:18px auto 10px;color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{font-family:var(--f-label);font-size:13px;letter-spacing:.14em;padding:10px 16px 9px;border-radius:999px;border:1px solid var(--verdigris);background:transparent;color:var(--verdigris);cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--verdigris) 10%,transparent)}
.btn.on{background:var(--verdigris);color:var(--card)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* envelope + note */
.letter{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.envelope{position:relative;width:min(100%,360px);aspect-ratio:1.6;max-width:100%;border:0;padding:0;background:none;cursor:pointer}
.envelope svg{width:100%;height:100%}
.envelope .seal-txt{font-family:var(--f-display);font-style:italic}
.envelope:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
.envelope .flap{transition:transform .6s ease;transform-origin:50% 0}
.hint{font-style:italic;color:var(--ink-soft);font-size:17px;margin:0}
.note{width:100%;background:var(--card);border:1px solid var(--gold);padding:26px 24px 20px;text-align:center;position:relative;
  box-shadow:0 14px 30px -22px color-mix(in srgb,var(--ink) 60%,transparent);animation:rise .6s ease both}
.note .kind{font-family:var(--f-label);letter-spacing:.22em;font-size:12px;color:var(--rose)}
.note .msg{font-family:var(--f-display);font-style:italic;font-size:clamp(24px,6vw,30px);line-height:1.25;margin:.35em 0 .5em;text-wrap:balance}
.note .sig{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--verdigris);margin:0}

.note.gold{background:linear-gradient(160deg,color-mix(in srgb,var(--gold-hi) 55%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--gold-hi) 40%,var(--card)));border:2px solid var(--gold)}
.note.gold .kind{color:var(--gold)}
@keyframes rise{from{transform:translateY(14px);opacity:.3}to{transform:none;opacity:1}}

footer{text-align:center;color:var(--ink-soft);font-size:16px;font-style:italic;display:flex;flex-direction:column;gap:6px;align-items:center}
footer .count{font-family:var(--f-label);font-style:normal;letter-spacing:.14em;font-size:12px;color:var(--gold)}
.linkish{background:none;border:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer;font-size:15px}

.intro{text-align:center;max-width:26em;font-style:italic;color:var(--ink-soft);margin:0}
.fade{animation:rise .5s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="arch" viewBox="0 0 520 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M20 118 C20 60 60 22 130 16 C190 10 225 34 260 12 C295 34 330 10 390 16 C460 22 500 60 500 118"/>
    <path d="M40 118 C44 74 78 42 136 36 C186 32 222 50 260 30 C298 50 334 32 384 36 C442 42 476 74 480 118" stroke-width="1" opacity=".6"/>
    <path d="M260 12 C250 0 238 4 240 14 C242 22 254 22 256 14" stroke-width="1.5"/>
    <path d="M260 12 C270 0 282 4 280 14 C278 22 266 22 264 14" stroke-width="1.5"/>
    <circle cx="260" cy="44" r="4" fill="currentColor" stroke="none"/>
    <path d="M20 118 C8 100 2 84 12 72 C20 62 34 70 28 80" stroke-width="1.5"/>
    <path d="M500 118 C512 100 518 84 508 72 C500 62 486 70 492 80" stroke-width="1.5"/>
    <path d="M70 110 C90 80 60 70 74 58 C84 50 98 60 90 70" stroke-width="1" opacity=".7"/>
    <path d="M450 110 C430 80 460 70 446 58 C436 50 422 60 430 70" stroke-width="1" opacity=".7"/>
  </svg>
  <div class="brand">
    <div class="eyebrow">1001 film · bir kitap · bir yaz</div>
    <h1>Ciné <span class="amp">Zeynep</span></h1>
    <p class="sub">Bu akşam ne izliyoruz? Kitap karar versin.</p>
  </div>
</header>

<button class="medal" id="pick" type="button" aria-label="Rastgele film seç">
  <svg viewBox="0 0 208 208" aria-hidden="true">
    <circle cx="104" cy="104" r="100" fill="var(--card)" stroke="var(--gold)" stroke-width="2"/>
    <g class="ring" fill="none" stroke="var(--gold)" stroke-width="1.2">
      <circle cx="104" cy="104" r="90" stroke-dasharray="2 6"/>
      <g id="petals"></g>
    </g>
    <circle cx="104" cy="104" r="66" fill="none" stroke="var(--verdigris)" stroke-width="1.5"/>
    <circle cx="104" cy="104" r="61" fill="none" stroke="var(--verdigris)" stroke-width=".6"/>
  </svg>
  <span class="label"><span class="small">BİR FİLM</span><span class="big" id="pickTxt">Seç</span><span class="small">❦</span></span>
</button>

<p class="intro" id="intro">Düğmeye bas, kitaptan bir film çıksın. Altında da senin için küçük bir not olacak.</p>

<article class="poster" id="poster" hidden aria-live="polite">
  <svg class="lily" viewBox="0 0 92 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
    <path d="M46 38 C46 26 46 16 46 4"/><path d="M46 20 C38 10 28 10 22 16 C28 18 36 20 46 26"/><path d="M46 20 C54 10 64 10 70 16 C64 18 56 20 46 26"/>
    <path d="M46 8 C42 2 40 0 46 -2 C52 0 50 2 46 8" fill="currentColor"/><path d="M4 30 C20 24 30 34 46 30 C62 34 72 24 88 30"/>
  </svg>
  <div class="no" id="fNo"></div>
  <h2 class="title" id="fTitle"></h2>
  <div class="meta" id="fMeta"></div>
  <div class="chips" id="fChips"></div>
  <p class="desc" id="fDesc"></p>
  <p class="cast" id="fCast"></p>
  <svg class="rule" viewBox="0 0 300 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 8 H120 M180 8 H300"/><path d="M150 2 C140 8 140 8 150 14 C160 8 160 8 150 2Z" fill="currentColor"/><path d="M120 8 C130 2 136 4 140 8 M180 8 C170 2 164 4 160 8"/></svg>
  <div class="actions">
    <button class="btn" id="again" type="button">Başka film</button>
    <button class="btn" id="seen" type="button">İzledik ✓</button>
  </div>
</article>

<section class="letter" id="letter" hidden>
  <button class="envelope" id="env" type="button" aria-label="Notu aç">
    <svg viewBox="0 0 320 200" aria-hidden="true">
      <rect x="4" y="4" width="312" height="192" rx="4" fill="var(--card)" stroke="var(--gold)" stroke-width="1.5"/>
      <path d="M4 196 L130 104 M316 196 L190 104" stroke="var(--gold)" stroke-width="1" opacity=".6" fill="none"/>
      <path class="flap" d="M4 4 L160 118 L316 4" fill="var(--paper-2)" stroke="var(--gold)" stroke-width="1.5"/>
      <circle cx="160" cy="116" r="24" fill="var(--seal)"/>
      <circle cx="160" cy="116" r="18" fill="none" stroke="var(--card)" stroke-width="1" opacity=".55"/>
      <text x="160" y="124" text-anchor="middle" font-size="22" fill="var(--card)" class="seal-txt">M</text>
    </svg>
  </button>
  <p class="hint" id="hint">Mete'den bir not var. Aç bakalım.</p>
  <div class="note" id="note" hidden>
        <p class="msg" id="nMsg"></p>
    <p class="sig">Mete</p>
  </div>
</section>

<footer>
  <span class="count" id="count"></span>
  <span>Bu yaz birlikte izlediğimiz her film için.</span>
  <button class="linkish" id="reset" type="button" hidden>İzlenenleri sıfırla</button>
</footer>
</div>

<script>
const FILMS = [{"t":"Le Voyage dans la Lune","y":1902,"d":"Georges Méliès","r":null,"g":["Adventure"],"c":[],"s":"Bir grup gökbilimci, dev bir topla fırlatılan bir mermi-roketle Ay'a gider ve orada tuhaf yaratıklarla karşılaşır. Georges Méliès'in 1902 yapımı bu büyülü filmi, renkli restorasyonuyla sinemanın hayal gücünün doğuşunu görmek için eşsiz bir fırsat."},{"t":"The Great Train Robbery","y":1903,"d":"Edwin S. Porter","r":110,"g":["Adventure","Crime","Drama"],"c":[],"s":"Bir grup haydut bir treni soyar, ardından peşlerine düşen kasabalılarla kovalamaca başlar. Sinemanın ilk western'i sayılan bu kısa film, paralel kurgu ve seyirciye doğrultulan o meşhur tabanca sahnesiyle bir türün doğuşuna tanıklık ettiriyor."},{"t":"The Birth of a Nation","y":1915,"d":"D.W. Griffith","r":195,"g":["Drama","War"],"c":[],"s":"İç Savaş ve sonrasında iki Amerikan ailesinin kaderini izleyen destansı bir anlatı. Irkçı içeriği nedeniyle bugün derin biçimde tartışmalı olsa da, sinema dilini kökten değiştiren teknikleri yüzünden film tarihini anlamak isteyenler için önemli bir belge."},{"t":"Intolerance","y":1916,"d":"D.W. Griffith","r":210,"g":["Drama","History"],"c":[],"s":"Babil'den Rönesans Fransa'sına, İsa'nın zamanından modern Amerika'ya uzanan dört hikaye, hoşgörüsüzlüğün çağlar boyu süren izini sürer. Devasa dekorları ve dönemler arasında akan cesur kurgusuyla sessiz sinemanın en iddialı yapımlarından biri."},{"t":"Les Vampires","y":1916,"d":"Louis Feuillade","r":421,"g":["Action","Adventure","Crime"],"c":[],"s":"Genç bir gazeteci, Paris'i korkutan Vampirler adlı gizemli suç örgütünün peşine düşer. Feuillade'ın bölümlerden oluşan bu dizisi, büyüleyici Irma Vep'i ve rüya gibi atmosferiyle gerilim sinemasının masalsı bir atası."},{"t":"Broken Blossoms","y":1919,"d":"D.W. Griffith","r":90,"g":["Drama","Romance"],"c":[],"s":"Londra'nın yoksul mahallelerinde, zalim babasından kaçan genç bir kız ile ona şefkat gösteren Çinli bir göçmen arasında kırılgan bir bağ kurulur. Lillian Gish'in unutulmaz performansı ve şiirsel ışığıyla hüzünlü, zarif bir melodram."},{"t":"The Cabinet of Dr. Caligari","y":1920,"d":"Robert Wiene","r":67,"g":["Horror","Mystery","Thriller"],"c":[],"s":"Bir panayıra gelen gizemli Dr. Caligari ve uyurgezer Cesare'nin ortaya çıkışıyla kasabada tuhaf cinayetler başlar. Eğri büğrü dekorları ve kabus gibi görselliğiyle Alman Dışavurumculuğunun simgesi, korku sinemasının temel taşlarından."},{"t":"Way Down East","y":1920,"d":"D.W. Griffith","r":145,"g":["Drama","Romance"],"c":[],"s":"Kandırılıp terk edilen saf bir genç kız, geçmişini saklayarak bir çiftlikte yeni bir hayat kurmaya çalışır. Lillian Gish'in buz kütleleri üzerindeki nefes kesen sahnesiyle hatırlanan, duygusu yoğun bir sessiz dönem klasiği."},{"t":"Within Our Gates","y":1920,"d":"Oscar Micheaux","r":79,"g":["Drama","Romance"],"c":[],"s":"Siyahi bir öğretmen, Güney'deki yoksul çocuklar için okul açmak üzere kuzeyde bağış toplamaya çalışırken geçmişinin karanlık gerçekleriyle yüzleşir. Oscar Micheaux'nun bu cesur filmi, ırkçılığa sert bir cevap olarak Afro-Amerikan sinemasının kurucu eserlerinden."},{"t":"Orphans of the Storm","y":1921,"d":"D.W. Griffith","r":150,"g":["Drama","History","Romance"],"c":[],"s":"Devrim öncesi Fransa'da, biri kör iki üvey kız kardeş Paris'in kargaşasında birbirinden koparılır. Gish kardeşlerin dokunaklı oyunları ve Griffith'in büyük ölçekli sahneleriyle heyecanı hiç düşmeyen bir tarih melodramı."},{"t":"The Phantom Carriage","y":1921,"d":"Victor Sjöström","r":107,"g":["Drama","Fantasy","Horror"],"c":[],"s":"Efsaneye göre yılbaşı gecesi ölen son günahkar, bir yıl boyunca ölümün arabasını sürmek zorundadır. Sjöström'ün çift pozlamalı hayalet görüntüleri hâlâ büyüleyici, Bergman'ı derinden etkileyen bu film vicdan ve kefaret üzerine unutulmaz bir masal."},{"t":"Dr. Mabuse, the Gambler","y":1922,"d":"Fritz Lang","r":155,"g":["Crime","Mystery","Thriller"],"c":[],"s":"Kılık değiştirme ustası Dr. Mabuse, hipnoz ve manipülasyonla Berlin'in kumar masalarını ve borsasını avucunda tutar. Fritz Lang'ın bu uzun ve karanlık gerilimi, savaş sonrası Almanya'nın çürümüşlüğünü süper kötü karakter kalıbının ilk örneklerinden biriyle anlatıyor."},{"t":"Foolish Wives","y":1922,"d":"Erich von Stroheim","r":117,"g":["Drama","Thriller"],"c":[],"s":"Monte Carlo'da sahte bir kont, zengin kadınları ve saf turistleri dolandırarak lüks içinde yaşar. Von Stroheim'ın takıntılı detaycılığı ve kendi oynadığı sinsi karakteriyle, dönemin en pahalı ve en cüretkar filmlerinden biri."},{"t":"Hä","y":1922,"d":"Evann Chantrel","r":null,"g":["Comedy"],"c":[],"s":"Hakkında pek az bilgi kalmış, 1922 yapımı bir sessiz dönem filmi. Sinemanın ilk yıllarının keşfedilmeyi bekleyen köşelerini merak edenler için, dönemin ruhunu yakalamak adına küçük bir zaman yolculuğu."},{"t":"Nanook of the North","y":1922,"d":"Robert Flaherty","r":78,"g":["Documentary"],"c":[],"s":"Kuzey Kanada'nın buz çöllerinde bir Inuit avcısı ve ailesinin gündelik hayatta kalma mücadelesi izlenir. Bazı sahneleri kurgulanmış olsa da, belgesel sinemanın doğduğu film olarak hem sıcak hem de etkileyici bir tarih parçası."},{"t":"Nosferatu","y":1922,"d":"F. W. Murnau","r":95,"g":["Fantasy","Horror"],"c":[],"s":"Genç bir emlakçı, Transilvanya'daki ürkütücü Kont Orlok'u ziyaret eder ve farkında olmadan veba ile ölümü memleketine taşır. Max Schreck'in tüyler ürperten gölgesi ve Murnau'nun şiirsel karanlığıyla vampir sinemasının ölümsüz başyapıtı."},{"t":"La Roue","y":1923,"d":"Abel Gance","r":417,"g":["Drama"],"c":[],"s":"Bir demiryolu makinisti, kazadan kurtardığı kızı büyütür ve yıllar sonra ona duyduğu yasak duygularla boğuşur. Abel Gance'ın hızlı kurgu denemeleri ve devasa süresiyle, sessiz sinemanın en cesur görsel deneylerinden biri."},{"t":"Our Hospitality","y":1923,"d":"Buster Keaton","r":65,"g":["Comedy","Romance","Thriller"],"c":[],"s":"Genç bir adam miras için güneye döner ve ailesiyle kan davalı bir klanın evine konuk olur, üstelik kızlarına âşıktır. Buster Keaton'ın ifadesiz yüzü ve inanılmaz şelale sahnesiyle zarif, güldüren bir komedi."},{"t":"The Smiling Madame Beudet","y":1923,"d":"Germaine Dulac","r":null,"g":["Drama"],"c":[],"s":"Taşrada sıkıcı bir evliliğe hapsolmuş bir kadın, kocasının kaba şakalarından kaçmak için hayallere sığınır. Germaine Dulac'ın bu kısa filmi, iç dünyayı görselleştirme biçimiyle ilk feminist ve izlenimci sinema örneklerinden sayılıyor."},{"t":"Greed","y":1924,"d":"Erich von Stroheim","r":140,"g":["Drama","Thriller","Western"],"c":[],"s":"San Francisco'lu bir diş hekimi ile karısının hayatı, beklenmedik bir piyango ikramiyesiyle yavaş yavaş zehirlenir. Kesilip kısaltılmış haliyle bile von Stroheim'ın açgözlülük üzerine kurduğu bu sert gerçekçi dram, sinemanın efsanevi başyapıtlarından."},{"t":"Sherlock, Jr.","y":1924,"d":"Buster Keaton","r":45,"g":["Action","Comedy","Romance"],"c":[],"s":"Dedektif olmayı hayal eden bir sinema makinisti, uykuya dalınca kendini perdedeki filmin içinde bulur. Keaton'ın gerçekle sinema arasındaki sınırı oynayan akıl almaz numaraları, bir asır sonra bile büyü gibi görünüyor."},{"t":"The Great White Silence","y":1924,"d":"Herbert G. Ponting","r":80,"g":["Documentary"],"c":[],"s":"Kaptan Scott'un Güney Kutbu seferinin, ekibin fotoğrafçısı tarafından çekilmiş gerçek görüntüleri. Buzulların ürkütücü güzelliği ve insan cesaretine dair sade anlatımıyla hem tarihi bir belge hem de dokunaklı bir yolculuk."},{"t":"The Last Laugh","y":1924,"d":"F. W. Murnau","r":90,"g":["Drama"],"c":[],"s":"Lüks bir otelin gururlu kapıcısı, yaşı nedeniyle tuvalet görevliliğine indirilince bütün dünyası altüst olur. Neredeyse hiç ara yazı kullanmadan anlatılan bu Murnau filmi, özgür kamerasıyla sinema dilini ileriye taşıdı."},{"t":"The Thief of Bagdad","y":1924,"d":"Raoul Walsh","r":155,"g":["Adventure","Family","Fantasy"],"c":[],"s":"Bağdat'ın çevik hırsızı, prensese âşık olunca onu kazanmak için büyülü nesnelerin peşinde destansı bir yolculuğa çıkar. Douglas Fairbanks'in akrobatik enerjisi ve masalsı dekorlarıyla, sessiz dönemin en eğlenceli fantastik maceralarından."},{"t":"Battleship Potemkin","y":1925,"d":"Sergei Eisenstein","r":66,"g":["Drama","History","Thriller"],"c":[],"s":"1905'te çürük etle beslenen denizciler, zalim subaylarına karşı ayaklanır ve olaylar Odessa'ya sıçrar. Eisenstein'ın montaj kuramının vitrini olan bu film, ünlü merdiven sahnesiyle sinema tarihinin en çok alıntılanan anlarından birine sahip."},{"t":"Seven Chances","y":1925,"d":"Buster Keaton","r":56,"g":["Comedy","Romance"],"c":[],"s":"Batmak üzere olan bir genç, büyük bir mirası alabilmesi için o gün akşama kadar evlenmesi gerektiğini öğrenir. Keaton'ın gelin adaylarından ve yuvarlanan kayalardan kaçtığı final kovalamacası, saf fiziksel komedinin şahane bir örneği."},{"t":"Strike","y":1925,"d":"Sergei Eisenstein","r":82,"g":["Drama"],"c":[],"s":"Çarlık Rusya'sında bir fabrikada işçiler grev başlatır, yönetim ve polis ise buna acımasız yöntemlerle karşılık verir. Eisenstein'ın ilk uzun filmi, cesur imgeleri ve dinamik kurgusuyla sonraki başyapıtlarının habercisi."},{"t":"The Big Parade","y":1925,"d":"King Vidor","r":151,"g":["Drama","Romance","War"],"c":[],"s":"Varlıklı ailesinden gelen genç bir Amerikalı, Birinci Dünya Savaşı'nda Fransa'ya gider, orada hem aşkı hem de savaşın dehşetini tanır. King Vidor'un savaş karşıtı dokunuşu ve insani sıcaklığıyla döneminin en sevilen filmlerinden biri."},{"t":"The Gold Rush","y":1925,"d":"Charlie Chaplin","r":95,"g":["Adventure","Comedy","Drama"],"c":[],"s":"Şarlo, Klondike'ın donmuş dağlarına altın aramaya gider ve açlık, fırtına ve aşkla sınanır. Ayakkabı yeme ve ekmek dansı sahneleriyle Chaplin'in komediyle hüznü en zarif biçimde harmanladığı eserlerinden."},{"t":"The Phantom of the Opera","y":1925,"d":"Rupert Julian","r":93,"g":["Horror","Music"],"c":[],"s":"Paris Operası'nın altındaki mahzenlerde yaşayan maskeli bir dahi, genç bir şarkıcıya takıntıyla bağlanır. Lon Chaney'nin kendi tasarladığı unutulmaz makyajıyla, korku sinemasının en ikonik yüzlerinden birini sunan klasik."},{"t":"The Adventures of Prince Achmed","y":1926,"d":"Lotte Reiniger","r":66,"g":["Adventure","Animation","Drama"],"c":[],"s":"Genç bir prens, büyülü bir uçan atla Binbir Gece Masalları'ndan fırlamış serüvenlere sürüklenir. Lotte Reiniger'in elle kesilmiş siluetlerle yaptığı bu film, günümüze ulaşan en eski uzun metraj animasyon ve gerçek bir el işi mücevheri."},{"t":"The General","y":1926,"d":"Buster Keaton","r":78,"g":["Action","Adventure","Comedy"],"c":[],"s":"İç Savaş sırasında bir makinist, çok sevdiği lokomotifi ve sevgilisini düşman askerlerinden kurtarmak için peşlerine düşer. Keaton'ın gerçek trenlerle çektiği baş döndürücü sahneler, onu tüm zamanların en iyi komedilerinden biri yapıyor."},{"t":"Metropolis","y":1927,"d":"Fritz Lang","r":150,"g":["Drama","Sci-Fi"],"c":[],"s":"Gelecekte, zenginlerin göğe uzanan kulelerde yaşadığı, işçilerin ise yerin altında ezildiği bir şehirde bir genç iki dünya arasında köprü olmaya çalışır. Robot Maria ve görkemli dekorlarıyla bilimkurgunun görsel dilini belirleyen bir başyapıt."},{"t":"Napoleon","y":1927,"d":"Abel Gance","r":330,"g":["Biography","Drama","History"],"c":[],"s":"Napolyon'un çocukluğundan İtalya seferinin eşiğine kadar yükselişini anlatan görkemli bir destan. Abel Gance'ın üç perdeye yayılan panoramik finali ve yenilikçi kamera hareketleriyle sessiz sinemanın en iddialı gösterilerinden."},{"t":"Sunrise: A Song of Two Humans","y":1927,"d":"F. W. Murnau","r":94,"g":["Drama","Romance"],"c":[],"s":"Şehirli bir kadının cazibesine kapılan köylü bir adam, karısına karşı karanlık bir plana sürüklenir. Murnau'nun ilk Amerikan filmi, akışkan kamerası ve şiirsel duygusuyla sessiz dönemin belki de en güzel aşk hikayesi."},{"t":"The Jazz Singer","y":1927,"d":"Alan Crosland","r":88,"g":["Drama","Music","Musical"],"c":[],"s":"Kantor bir babanın oğlu, ailesinin geleneğine rağmen caz şarkıcısı olma hayalinin peşinden gider. Senkron konuşma ve şarkı içeren ilk uzun film olarak sesli sinemanın başlangıcını işaretleyen tarihi bir dönüm noktası."},{"t":"The Kid Brother","y":1927,"d":"Ted Wilde","r":82,"g":["Comedy","Drama","Family"],"c":[],"s":"Güçlü babası ve abilerinin gölgesinde kalan çelimsiz bir genç, kasabaya gelen bir kıza âşık olunca kendini kanıtlamaya karar verir. Harold Lloyd'un en sıcak ve en tatlı komedilerinden, taşra güzellemesiyle insanın içini ısıtıyor."},{"t":"The Unknown","y":1927,"d":"Tod Browning","r":68,"g":["Drama","Horror","Romance"],"c":[],"s":"Kolsuz bir bıçak atıcı olarak sirkte çalışan bir adam, dokunulmaktan korkan güzel bir kadına tutkuyla bağlıdır. Lon Chaney ve genç Joan Crawford'lu bu tuhaf, karanlık melodram, Tod Browning'in en rahatsız edici ve unutulmaz işlerinden."},{"t":"October: Ten Days That Shook the World","y":1928,"d":"Sergei Eisenstein","r":95,"g":["Drama","History"],"c":[],"s":"1917'de Şubat Devrimi'nden Kışlık Saray'ın basılmasına kadar uzanan günler, devrimin onuncu yılı için yeniden canlandırılır. Eisenstein'ın entelektüel montaj denemeleri ve görkemli kalabalık sahneleriyle hem tarih hem sanat dersi."},{"t":"Steamboat Bill, Jr.","y":1928,"d":"Charles Reisner","r":70,"g":["Action","Comedy","Drama"],"c":[],"s":"Kaba bir nehir gemisi kaptanının şehirde okumuş züppe oğlu, babasını memnun etmeye çalışırken rakip ailenin kızına gönül verir. Keaton'ın üzerine yıkılan cephe sahnesi, sinemanın en cesur ve en ünlü gösterilerinden biri."},{"t":"Storm Over Asia","y":1928,"d":"Vsevolod Pudovkin","r":74,"g":["Drama","War"],"c":[],"s":"Moğol bir çoban, Cengiz Han'ın soyundan geldiğine inanılınca İngiliz işgalcilerin kukla hükümdarı yapılmak istenir. Pudovkin'in bozkır manzaraları ve destansı finaliyle Sovyet sinemasının güçlü, görsel olarak nefes kesen örneklerinden."},{"t":"The Crowd","y":1928,"d":"King Vidor","r":98,"g":["Drama","Romance"],"c":[],"s":"Büyük hayallerle New York'a gelen sıradan bir adam, kalabalığın içinde kaybolmamak için mücadele ederken evlenir, çalışır, düşer ve kalkar. King Vidor'un gündelik hayatın dramını bu denli içten anlattığı film, zamansız bir başyapıt."},{"t":"The Docks of New York","y":1928,"d":"Josef von Sternberg","r":76,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Bir gecelik izinle karaya çıkan kaba bir kömürcü, kendini denize atan genç bir kadını kurtarır ve beklenmedik bir yakınlık başlar. Von Sternberg'in sisli ve dumanlı atmosferi, sessiz dönemin en romantik ve en görsel filmlerinden birini yaratıyor."},{"t":"The Passion of Joan of Arc","y":1928,"d":"Carl Theodor Dreyer","r":114,"g":["Biography","Drama","History"],"c":[],"s":"Jeanne d'Arc'ın kilise mahkemesindeki sorgusu ve son günleri, neredeyse tamamen yakın çekimlerle anlatılır. Renée Falconetti'nin sarsıcı yüzü, sinemada kaydedilmiş en güçlü oyunculuklardan biri olarak kabul ediliyor."},{"t":"Blackmail","y":1929,"d":"Alfred Hitchcock","r":85,"g":["Crime","Drama","Mystery"],"c":[],"s":"Genç bir kadın, kendini savunurken bir adamı öldürür ve dedektif sevgilisiyle birlikte bir şantajcının hedefi olur. Hitchcock'un ilk sesli filmi, sesi gerilim aracı olarak kullanan ustaca fikirleriyle ustanın imzasını şimdiden taşıyor."},{"t":"Man With a Movie Camera","y":1929,"d":"Dziga Vertov","r":68,"g":["Documentary"],"c":[],"s":"Bir kameraman, sabahtan akşama bir Sovyet şehrinin hayatını, sokakları, fabrikaları ve insanlarıyla kaydeder. Hiç ara yazı kullanmayan bu enerjik deneysel belgesel, sinemanın kendi olanaklarına yazılmış coşkulu bir aşk mektubu."},{"t":"Pandora's Box","y":1929,"d":"G.W. Pabst","r":109,"g":["Crime","Drama","Romance"],"c":[],"s":"Karşı konulmaz cazibesiyle çevresindeki erkekleri ve kadınları büyüleyen Lulu, farkında olmadan onları felakete sürükler. Louise Brooks'un modern ve doğal ışıltısı, bu Pabst filmini dönemin en baştan çıkarıcı yapımlarından biri yapıyor."},{"t":"Un Chien Andalou","y":1929,"d":"Luis Buñuel","r":null,"g":["Horror"],"c":[],"s":"Bir rüyanın mantığıyla ilerleyen bu kısa filmde, bir adam ile bir kadın arasındaki tuhaf ilişki şok edici imgelerle anlatılır. Buñuel ve Dalí'nin gerçeküstücü manifestosu, bugün bile seyirciyi sarsmayı başarıyor."},{"t":"A Throw of Dice","y":1930,"d":"Franz Osten","r":null,"g":["#Movie"],"c":[],"s":"Mahabharata'dan esinlenen bu hikayede, iki kral aynı kadına gönül verir ve rekabet bir zar oyununda doruğa ulaşır. Hindistan'da gerçek saraylarda çekilen bu sessiz film, görkemli görüntüleri ve masalsı havasıyla gerçek bir keşif."},{"t":"All Quiet on the Western Front","y":1930,"d":"Lewis Milestone","r":152,"g":["Drama","War"],"c":[],"s":"Vatansever nutuklarla savaşa gönüllü yazılan bir grup Alman öğrenci, siperlerin gerçeğiyle yüzleşir. Remarque'ın romanından uyarlanan bu film, savaş karşıtı sinemanın en dürüst ve en dokunaklı örneklerinden biri olmayı sürdürüyor."},{"t":"Earth (Zemlya)","y":1930,"d":"Aleksandr Dovzhenko","r":75,"g":["Drama"],"c":[],"s":"Ukrayna'da bir köyde kolektifleşme dönemi, genç bir köylünün traktörle gelen yeniliğe öncülük etmesi üzerinden anlatılır. Dovzhenko'nun doğa, yaşam ve ölüm üzerine şiirsel imgeleri, bu filmi sinemanın en lirik eserlerinden biri yapıyor."},{"t":"L'âge D'Or","y":1930,"d":"Luis Buñuel","r":63,"g":["Comedy","Drama"],"c":[],"s":"İki âşık, onları ayırmaya çalışan toplumun, kilisenin ve burjuva ahlakının engelleriyle sürekli çatışır. Buñuel'in yasaklanmış bu gerçeküstücü hicvi, cüretkar mizahı ve kışkırtıcı imgeleriyle hâlâ taptaze."},{"t":"The Blue Angel","y":1930,"d":"Josef von Sternberg","r":104,"g":["Drama","Music","Romance"],"c":[],"s":"Saygın ve katı bir öğretmen, bir kabare şarkıcısına âşık olunca itibarını ve hayatını yavaş yavaş kaybeder. Marlene Dietrich'i dünyaya tanıtan bu film, onun efsanevi şarkılarıyla sesli sinemanın ilk büyük dramlarından."},{"t":"City Lights","y":1931,"d":"Charlie Chaplin","r":87,"g":["Comedy","Drama","Romance"],"c":[],"s":"Şarlo, kör bir çiçekçi kıza âşık olur ve ona yardım etmek için elinden geleni yapar, bu sırada sarhoşken dostu olan bir milyonerle yolları kesişir. Sesli döneme meydan okuyan bu sessiz başyapıt, sinemanın en dokunaklı finallerinden birine sahip."},{"t":"Dracula","y":1931,"d":"Karl Freund","r":74,"g":["Drama","Fantasy","Horror"],"c":[],"s":"Transilvanya'dan Londra'ya gelen gizemli Kont Drakula, yeni kurbanlarını seçmeye başlar. Bela Lugosi'nin büyüleyici aksanı ve bakışlarıyla vampir imgesini sonsuza dek şekillendiren Universal korku klasiği."},{"t":"Frankenstein","y":1931,"d":"James Whale","r":70,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Hırslı bir bilim insanı, ölü bedenlerden bir yaratık yaratır, ama ona hayat vermek kontrolü de kaybetmek demektir. Boris Karloff'un hem ürkütücü hem acınası yaratığı, korku tarihinin en insani canavarlarından birini doğurdu."},{"t":"La Chienne","y":1931,"d":"Jean Renoir","r":95,"g":["Crime","Drama","Romance"],"c":[],"s":"Mutsuz evli, çekingen bir kasiyer ve amatör ressam, bir fahişeye âşık olur, onun sevgilisi ise bu tutkudan faydalanmaya karar verir. Renoir'ın ilk sesli filmlerinden biri, keskin ironisi ve doğal gerçekçiliğiyle ustanın erken bir mücevheri."},{"t":"Le Million","y":1931,"d":"René Clair","r":91,"g":["Comedy","Musical"],"c":[],"s":"Borç içindeki bir ressam, piyangoyu kazandığını öğrenir, ama bilet bir ceketin cebinde kaybolmuştur. René Clair'in müzikle akan bu neşeli komedisi, sesli sinemanın ilk yıllarında türün ne kadar zarif olabileceğini gösteriyor."},{"t":"Limite","y":1931,"d":"Mário Peixoto","r":114,"g":["Drama","Romance"],"c":[],"s":"Okyanusun ortasında bir teknede mahsur kalan bir adam ve iki kadın, onları buraya getiren hayatlarını hatırlar. Brezilyalı Mário Peixoto'nun tek filmi, hipnotik görüntüleriyle yıllarca efsane olarak anılmış şiirsel bir deneyim."},{"t":"Little Caesar","y":1931,"d":"Mervyn LeRoy","r":79,"g":["Action","Crime","Drama"],"c":[],"s":"Küçük çaplı bir haydut olan Rico, acımasız hırsıyla Chicago yeraltı dünyasında hızla yükselir. Edward G. Robinson'ın patlayıcı performansı, Hollywood gangster filmlerinin kalıbını belirleyen bu klasiği hâlâ canlı tutuyor."},{"t":"M","y":1931,"d":"Fritz Lang","r":99,"g":["Crime","Mystery","Thriller"],"c":[],"s":"Bir şehir, çocukları hedef alan bir katille sarsılırken hem polis hem de yeraltı dünyası onu yakalamak için harekete geçer. Fritz Lang'ın bu ilk sesli filmi ve Peter Lorre'nin unutulmaz oyunu, gerilim sinemasının temel taşlarından."},{"t":"Tabu","y":1931,"d":"F. W. Murnau","r":118,"g":["Drama","Romance"],"c":[],"s":"Güney Denizleri'nde genç bir inci avcısı, tanrılara adanmış ve dokunulması yasak bir kıza âşık olur. Murnau'nun son filmi, Bora Bora'nın ışığında çekilmiş büyüleyici görüntüleriyle hem rüya gibi hem hüzünlü."},{"t":"The Public Enemy","y":1931,"d":"William A. Wellman","r":83,"g":["Crime","Drama"],"c":[],"s":"Chicago'nun yoksul sokaklarında büyüyen iki arkadaş, İçki Yasağı yıllarında suç dünyasında yükselir. James Cagney'nin enerjik ve tehditkar performansıyla gangster türünün en sert ve etkili klasiklerinden biri."},{"t":"À Nous La Liberté","y":1931,"d":"René Clair","r":83,"g":["Comedy","Musical"],"c":[],"s":"Hapisten kaçan iki arkadaştan biri plak fabrikası patronu olur, diğeri ise ona işçi olarak rastlar. René Clair'in makineleşmeyi tatlı bir mizahla eleştiren bu müzikal komedisi, Modern Zamanlar'a ilham verecek kadar etkiliydi."},{"t":"Boudu Saved From Drowning","y":1932,"d":"Jean Renoir","r":85,"g":["Comedy"],"c":[],"s":"Seine nehrine atlayan bir serseri, iyi niyetli bir kitapçı tarafından kurtarılıp evine alınır, ancak konuk hiç de uslu durmaz. Michel Simon'un anarşik oyunu ve Renoir'ın burjuva hicviyle keyifli, özgür ruhlu bir komedi."},{"t":"Freaks","y":1932,"d":"Tod Browning","r":64,"g":["Drama","Horror"],"c":[],"s":"Bir sirkte güzel bir trapez sanatçısı, miras için ufak tefek bir sanatçıyı kandırmaya kalkar, ama topluluğun kendi kuralları vardır. Gerçek sirk sanatçılarıyla çekilen bu film, hem rahatsız edici hem de şaşırtıcı derecede şefkatli bir kült klasik."},{"t":"I Am a Fugitive From a Chain Gang","y":1932,"d":"Mervyn LeRoy","r":92,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Savaştan dönen bir asker, işlemediği bir suç yüzünden acımasız bir zincirli mahkum çalışma kampına düşer. Paul Muni'nin güçlü oyunu ve toplumsal öfkesiyle, gerçek bir hikayeye dayanan bu film ceza sistemini sarsmıştı."},{"t":"Love Me Tonight","y":1932,"d":"Rouben Mamoulian","r":104,"g":["Comedy","Musical","Romance"],"c":[],"s":"Parisli bir terzi, borcunu tahsil etmek için gittiği şatoda kendini bir prensese âşık olmuş halde bulur. Rouben Mamoulian'ın şarkılarla ve kurguyla oynadığı bu müzikal, türün en yaratıcı ve zarif örneklerinden."},{"t":"Me and My Gal","y":1932,"d":"Raoul Walsh","r":79,"g":["Comedy","Drama","Romance"],"c":[],"s":"Neşeli bir genç polis, liman kafesinde çalışan hazırcevap bir garsona âşık olur ve yolları küçük bir suç hikayesiyle kesişir. Spencer Tracy ve Joan Bennett'in tatlı atışmaları, bu Raoul Walsh filmini hafif ve keyifli kılıyor."},{"t":"Scarface","y":1932,"d":"Howard Hawks","r":93,"g":["Action","Crime","Drama"],"c":[],"s":"Tony Camonte, acımasızlığı ve sınırsız hırsıyla Chicago'nun yeraltı dünyasının tepesine tırmanır. Howard Hawks'ın sert temposu ve Paul Muni'nin ürkütücü enerjisiyle, sansürle boğuşmuş bu gangster filmi türün temel eserlerinden."},{"t":"Shanghai Express","y":1932,"d":"Josef von Sternberg","r":82,"g":["Adventure","Drama","Film-Noir"],"c":[],"s":"Çin'de iç savaş sırasında Pekin'den Şanghay'a giden bir trende, ünlü bir kadın maceraperest eski sevgilisiyle karşılaşır. Marlene Dietrich'in ışık ve gölgeyle yontulmuş yüzü, von Sternberg'in en göz alıcı görsel şölenlerinden birini yaratıyor."},{"t":"Trouble in Paradise","y":1932,"d":"Ernst Lubitsch","r":83,"g":["Comedy","Crime","Romance"],"c":[],"s":"İki şık dolandırıcı, zengin bir parfüm şirketi sahibini soymak için yola çıkar, ama işler aşk üçgenine dönüşür. Lubitsch dokunuşunun en saf hali, zekice diyalogları ve zarafetiyle romantik komedinin incisi."},{"t":"Vampyr","y":1932,"d":"Carl Theodor Dreyer","r":75,"g":["Fantasy","Horror"],"c":[],"s":"Doğaüstüne meraklı genç bir adam, bir köyde tuhaf bir vampir laneti altındaki bir aileye yardım etmeye çalışır. Dreyer'in sisli, rüya gibi görüntüleriyle korkudan çok huzursuz bir büyü bırakan benzersiz bir film."},{"t":"42nd Street","y":1933,"d":"Lloyd Bacon","r":89,"g":["Comedy","Drama","Musical"],"c":[],"s":"Büyük bir Broadway gösterisi hazırlanırken, başrol oyuncusu sakatlanınca koro kızlarından biri sahneye çıkmak zorunda kalır. Busby Berkeley'nin kaleydoskopik dans sahneleriyle sahne arkası müzikallerinin kalıbını oluşturan neşeli bir klasik."},{"t":"Duck Soup","y":1933,"d":"Leo McCarey","r":69,"g":["Comedy","Musical"],"c":[],"s":"Marx Kardeşler, küçük ve iflas etmek üzere olan Freedonia ülkesini savaşa sürükleyen absürt bir yönetimin başına geçer. Ayna sahnesi gibi efsanevi anlarıyla, siyasi hicvi saf deliliğe dönüştüren tüm zamanların en komik filmlerinden."},{"t":"Footlight Parade","y":1933,"d":"Lloyd Bacon","r":104,"g":["Comedy","Musical","Romance"],"c":[],"s":"Sesli sinemanın yükselişiyle işsiz kalan bir sahne yapımcısı, sinema salonları için canlı müzikal gösteriler hazırlamaya başlar. James Cagney'nin hızlı enerjisi ve Busby Berkeley'nin su balesiyle göz kamaştıran bir müzikal."},{"t":"Gold Diggers of 1933","y":1933,"d":"Mervyn LeRoy","r":null,"g":["Comedy"],"c":[],"s":"Büyük Buhran'da işsiz kalan üç şarkıcı kız, zengin bir besteci sayesinde yeni bir gösteride yer alır, ama onun soylu ailesi buna karşıdır. Busby Berkeley'nin görkemli koreografisi ve dönemin yaralarına dokunan finaliyle hem neşeli hem anlamlı."},{"t":"King Kong","y":1933,"d":"Merian C. Cooper","r":100,"g":["Adventure","Horror"],"c":[],"s":"Bir film ekibi, keşfedilmemiş bir adada devasa bir gorille karşılaşır ve onu New York'a getirmeye karar verir. Stop-motion efektlerinin öncüsü olan bu macera, Empire State Binası'ndaki ikonik görüntüsüyle sinemanın ölümsüz mitlerinden."},{"t":"Land Without Bread","y":1933,"d":"Luis Buñuel","r":null,"g":["Documentary"],"c":[],"s":"İspanya'nın en yoksul bölgelerinden Las Hurdes'te yaşam koşullarını gösteren kısa bir belgesel. Buñuel'in soğuk anlatıcısı ve ironik bakışı, filmi hem sarsıcı bir tanıklık hem de belgesel türü üzerine cesur bir sorgulama yapıyor."},{"t":"Queen Christina","y":1933,"d":"Rouben Mamoulian","r":99,"g":["Biography","Drama","History"],"c":[],"s":"İsveç Kraliçesi Christina, taht görevleri ile özgürlük ve aşk arasında kalır ve bir İspanyol elçiye gönlünü kaptırır. Greta Garbo'nun ışıltılı oyunu ve unutulmaz son yakın çekimiyle romantik tarih filmlerinin en zariflerinden."},{"t":"She Done Him Wrong","y":1933,"d":"Lowell Sherman","r":66,"g":["Comedy","Drama","History"],"c":[],"s":"1890'ların New York'unda bir salon şarkıcısı, hayranları ve suç ortakları arasında ustaca gezinir, bu sırada gizemli bir misyoner dikkatini çeker. Mae West'in cüretkar espri anlayışı ve genç Cary Grant'le, kısa ama tadı damakta kalan bir komedi."},{"t":"Sons of the Desert","y":1933,"d":"William A. Seiter","r":68,"g":["Comedy","Family"],"c":[],"s":"Laurel ve Hardy, eşlerinden izin alamadıkları bir kardeşlik toplantısına gizlice gitmek için komik bir yalan uydurur. İkilinin en sevilen uzun filmi, zamansız saflığı ve kusursuz zamanlamasıyla hep güldürüyor."},{"t":"The Bitter Tea of General Yen","y":1933,"d":"Frank Capra","r":88,"g":["Drama","Romance","War"],"c":[],"s":"İç savaş içindeki Çin'de genç bir Amerikalı misyoner, güçlü bir savaş lordunun sarayında mahsur kalır ve aralarında gergin bir çekim doğar. Capra'nın beklenmedik derecede şehvetli ve görsel olarak büyüleyici bu filmi, döneminin cesur işlerinden."},{"t":"Zero for Conduct","y":1933,"d":"Jean Vigo","r":null,"g":["Comedy"],"c":[],"s":"Katı bir yatılı okulda öğrenciler, baskıcı öğretmenlerine karşı neşeli bir isyan planlar. Jean Vigo'nun uzun süre yasaklanan bu kısa filmi, çocukluğun anarşik ruhunu şiirsel bir özgürlükle yakalıyor."},{"t":"It Happened One Night","y":1934,"d":"Frank Capra","r":105,"g":["Comedy","Romance"],"c":["Clark Gable","Claudette Colbert"],"s":"Babasından kaçan şımarık bir mirasyedi, işsiz bir gazeteciyle New York'a uzanan otobüs yolculuğunda yol arkadaşı olur. Clark Gable ile Claudette Colbert'in kıvılcımlı uyumuyla romantik komedinin atası, beş büyük Oscar'ı toplayan bir klasik."},{"t":"It's a Gift","y":1934,"d":"Norman Z. McLeod","r":68,"g":["Comedy"],"c":[],"s":"Huysuz bir bakkal, ailesinin ve müşterilerinin bitmek bilmeyen dertleri arasında Kaliforniya'da bir portakal bahçesi hayal eder. W.C. Fields'ın gündelik aksiliklerden yarattığı mizah, bugün de şaşırtıcı derecede taze."},{"t":"Judge Priest","y":1934,"d":"John Ford","r":80,"g":["Comedy","Drama","Romance"],"c":[],"s":"Kentucky'de bir kasabada, eski bir Konfederasyon askeri olan yargıç, adaleti sağduyusu ve mizahıyla dağıtır. Will Rogers'ın sıcak oyunu ve John Ford'un taşra portresiyle, dönemin bakış açısını da yansıtan nostaljik bir film."},{"t":"L'atalante","y":1934,"d":"Jean Vigo","r":89,"g":["Adventure","Drama","Romance"],"c":[],"s":"Yeni evli bir çift, bir mavna üzerinde nehir boyunca yolculuğa çıkar, ama kasaba kızı Juliette Paris'in cazibesine kapılır. Jean Vigo'nun tek uzun filmi, şiirsel gerçekçiliği ve su altı sahnesiyle sinemanın en sevilen aşk hikayelerinden."},{"t":"The Black Cat","y":1934,"d":"Edgar G. Ulmer","r":65,"g":["Crime","Horror","Romance"],"c":[],"s":"Balayındaki bir çift, Avusturya dağlarında modernist bir evde iki eski düşmanın karanlık hesaplaşmasının ortasında kalır. Karloff ve Lugosi'yi ilk kez buluşturan bu tuhaf ve şık korku filmi, gizli bir kült hazine."},{"t":"The Goddess","y":1934,"d":"Yonggang Wu","r":85,"g":["Drama"],"c":[],"s":"Şanghay'da bir kadın, küçük oğluna iyi bir gelecek sağlamak için sokaklarda çalışırken hem zorba bir pezevenkle hem de toplumun önyargılarıyla boğuşur. Ruan Lingyu'nun yürek burkan oyunu, Çin sessiz sinemasının en parlak incisi."},{"t":"The Thin Man","y":1934,"d":"W.S. Van Dyke","r":91,"g":["Comedy","Crime","Mystery"],"c":[],"s":"Emekli dedektif Nick Charles ve zeki eşi Nora, bir mucidin kaybolmasıyla başlayan cinayet gizemini kokteyller arasında çözer. William Powell ve Myrna Loy'un pırıl pırıl atışmaları, polisiyeyi evlilik komedisiyle harika buluşturuyor."},{"t":"A Night at the Opera","y":1935,"d":"Edmund Goulding","r":96,"g":["Comedy","Music","Musical"],"c":[],"s":"Marx Kardeşler, iki genç şarkıcının kariyerini kurtarmak için New York operasına uzanan kaotik bir yolculuğa çıkar. Kalabalık kamara sahnesiyle efsaneleşen bu komedi, kardeşlerin en sevilen ve en ritmik filmlerinden."},{"t":"Bride of Frankenstein","y":1935,"d":"James Whale","r":75,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Frankenstein, eski hocası Dr. Pretorius tarafından yaratığa bir eş yapması için zorlanır. James Whale'in karanlık mizahı ve Elsa Lanchester'ın ikonik saçlarıyla, orijinali bile aşan nadir devam filmlerinden."},{"t":"Captain Blood","y":1935,"d":"Michael Curtiz","r":119,"g":["Action","Adventure","History"],"c":[],"s":"Haksız yere köle olarak satılan İrlandalı bir doktor, kaçıp Karayipler'in en ünlü korsanı olur. Errol Flynn ve Olivia de Havilland'ı yıldızlığa taşıyan bu macera, kılıç düelloları ve deniz savaşlarıyla keyfine doyulmaz."},{"t":"Mutiny on the Bounty","y":1935,"d":"Frank Lloyd","r":132,"g":["Adventure","Biography","Drama"],"c":[],"s":"Bounty gemisinde zalim Kaptan Bligh'in sertliği, mürettebatı ve yardımcısı Fletcher Christian'ı isyanın eşiğine getirir. Charles Laughton ile Clark Gable'ın güçlü çatışmasıyla, en iyi film Oscar'ını kazanmış görkemli bir deniz macerası."},{"t":"Peter Ibbetson","y":1935,"d":"Henry Hathaway","r":85,"g":["Drama","Fantasy","Romance"],"c":[],"s":"Çocukluk aşkından koparılan bir mimar, yıllar sonra onu bir düşes olarak yeniden bulur ve bağları rüyaların ötesine uzanır. Gary Cooper'lı bu romantik fantezi, gerçeküstücülerin bile hayran kaldığı büyülü bir aşk masalı."},{"t":"The 39 Steps","y":1935,"d":"Alfred Hitchcock","r":86,"g":["Crime","Mystery","Thriller"],"c":[],"s":"Londra'da sıradan bir adam, bir casusluk komplosunun içine düşer ve cinayet şüphelisi olarak İskoçya'ya kaçar. Hitchcock'un haksız yere suçlanan adam temasını mükemmelleştirdiği bu gerilim, esprili ve hızlı bir keyif."},{"t":"Top Hat","y":1935,"d":"Mark Sandrich","r":101,"g":["Comedy","Musical","Romance"],"c":[],"s":"Amerikalı bir dansçı, Londra'da tanıştığı bir kadına âşık olur, ama bir yanlış anlaşılma işleri iyice karıştırır. Fred Astaire ile Ginger Rogers'ın Cheek to Cheek dansı, Hollywood müzikalinin en zarif anlarından biri."},{"t":"Triumph of the Will","y":1935,"d":"Leni Riefenstahl","r":110,"g":["Documentary","History"],"c":[],"s":"1934 Nürnberg Nazi Partisi Kongresi'ni kayda alan bir propaganda belgeseli. Tüyler ürpertici içeriğine rağmen görsel dilinin gücü nedeniyle, propagandanın nasıl işlediğini anlamak isteyenler için eleştirel gözle izlenmesi gereken bir belge."},{"t":"Camille","y":1936,"d":"George Cukor","r":109,"g":["Drama","Romance"],"c":[],"s":"Paris'in ünlü bir kurtizanı, genç ve saf bir soyluya âşık olur, ama geçmişi ve sağlığı aşklarına gölge düşürür. Greta Garbo'nun en duygulu performanslarından biriyle, Dumas'nın klasik hikayesinin en zarif uyarlaması."},{"t":"Dodsworth","y":1936,"d":"William Wyler","r":101,"g":["Drama","Romance"],"c":[],"s":"Emekli bir otomobil sanayicisi, genç kalmaya çalışan karısıyla Avrupa'ya gider ve evliliklerinin çatlakları görünür hale gelir. William Wyler'ın olgun ve incelikli anlatımıyla, orta yaş üzerine şaşırtıcı derecede modern bir dram."},{"t":"Modern Times","y":1936,"d":"Charlie Chaplin","r":87,"g":["Comedy","Drama","Romance"],"c":["Charles Chaplin","Paulette Goddard"],"s":"Bir fabrika işçisi, makinelerin hızına yetişemeyince bir dizi talihsizliğe sürüklenir ve yolda yetim bir kızla tanışır. Chaplin'in sanayi çağını tatlı bir mizahla eleştirdiği bu film, Şarlo'nun son büyük macerası."},{"t":"Mr. Deeds Goes to Town","y":1936,"d":"Frank Capra","r":115,"g":["Comedy","Drama","Romance"],"c":[],"s":"Küçük kasabalı saf bir şair, büyük bir mirasa konunca New York'un açgözlü çevreleri tarafından kuşatılır. Gary Cooper'ın sıcak oyunu ve Capra'nın iyimser insancıllığıyla içi ısıtan bir komedi."},{"t":"My Man Godfrey","y":1936,"d":"Gregory La Cava","r":94,"g":["Comedy","Drama","Romance"],"c":[],"s":"Şımarık bir sosyete kızı, bir hazine avı oyunu için bulduğu evsiz adamı ailesine uşak olarak işe alır. William Powell ve Carole Lombard'la, Buhran dönemi zenginlerini neşeyle yeren parıl parıl bir çılgın komedi."},{"t":"Partie de campagne","y":1936,"d":"Jean Renoir","r":null,"g":["#Movie"],"c":[],"s":"Parisli bir ailenin kırsaldaki bir nehir kenarında geçirdiği pikniğin ortasında, genç kızın kalbinde unutulmaz bir yaz esintisi başlar. Renoir'ın kısa ve izlenimci bir tablo gibi akan bu filmi, doğanın ve özlemin en zarif şiirlerinden."},{"t":"Sabotage","y":1936,"d":"Alfred Hitchcock","r":76,"g":["Crime","Thriller"],"c":[],"s":"Londra'da bir sinema işleten sessiz bir adamın aslında sabotajcı olduğu ortaya çıkar, karısı ise hiçbir şeyin farkında değildir. Hitchcock'un en gergin sahnelerinden birini barındıran bu film, gerilimin nasıl kurulduğuna dair bir ders."},{"t":"Swing Time","y":1936,"d":"George Stevens","r":103,"g":["Comedy","Musical","Romance"],"c":[],"s":"Kumarbaz bir dansçı, düğününe yetişemeyince New York'a gider ve orada bir dans öğretmenine âşık olur. Astaire ve Rogers'ın en olgun dans numaraları, Jerome Kern'in şarkılarıyla birleşince müzikal zevki doruğa çıkıyor."},{"t":"The Story of a Cheat","y":1936,"d":"Sacha Guitry","r":81,"g":["Comedy"],"c":[],"s":"Çocukken hırsızlık yüzünden cezalandırılınca aileyi zehirleyen yemekten kurtulan bir adam, dürüstlüğün işe yaramadığı sonucuna varır. Sacha Guitry'nin anlatıcılığıyla ilerleyen bu zekice komedi, döneminin çok ötesinde oyunbaz bir anlatım."},{"t":"Things to Come","y":1936,"d":"William Cameron Menzies","r":100,"g":["Drama","Sci-Fi","War"],"c":[],"s":"Uzun bir savaş medeniyeti yıktıktan sonra, bilim insanları insanlığı teknolojiyle yeni bir çağa taşımaya çalışır. H.G. Wells'in senaryosu ve görkemli fütüristik tasarımlarıyla, bilimkurgunun iddialı bir vizyon filmi."},{"t":"Captains Courageous","y":1937,"d":"Victor Fleming","r":117,"g":["Adventure","Drama","Family"],"c":["Spencer Tracy"],"s":"Denize düşen şımarık bir zengin çocuğu, bir balıkçı teknesi tarafından kurtarılır ve yaz boyunca mürettebatla çalışarak olgunlaşır. Spencer Tracy'nin Oscar'lı oyunuyla, Kipling'den uyarlanan dokunaklı bir büyüme hikayesi."},{"t":"Grand Illusion","y":1937,"d":"Jean Renoir","r":113,"g":["Drama","War"],"c":[],"s":"Birinci Dünya Savaşı'nda bir Alman esir kampında farklı sınıflardan Fransız subaylar, kaçmanın yollarını ararken insanlık ortak paydasında buluşur. Renoir'ın bu şefkatli başyapıtı, sınıflar ve sınırlar üzerine zamansız bir tefekkür."},{"t":"Make Way for Tomorrow","y":1937,"d":"Leo McCarey","r":91,"g":["Drama","Romance"],"c":[],"s":"Evlerini kaybeden yaşlı bir çift, çocuklarının yanına yerleşmek zorunda kalınca birbirinden ayrı düşer. Leo McCarey'nin bu yalın ve içten dramı, Tokyo Hikayesi'ne ilham veren, yürek sızlatan bir hazine."},{"t":"Pépé Le Moko","y":1937,"d":"Julien Duvivier","r":94,"g":["Crime","Drama","Romance"],"c":[],"s":"Paris'ten kaçan ünlü bir soyguncu, Cezayir'in kasbahında güvendedir, ama Parisli güzel bir kadın onu nostaljiyle dışarı çağırır. Jean Gabin'in karizmasıyla, şiirsel gerçekçiliğin ve kara filmin öncü eserlerinden."},{"t":"Snow White and the Seven Dwarfs","y":1937,"d":"David Hand","r":83,"g":["Adventure","Animation","Family"],"c":[],"s":"Kıskanç üvey annesinden kaçan Pamuk Prenses, ormanda yedi cüceyle sıcak bir yuva bulur. Hollywood'un ilk uzun metraj çizgi filmi, el çizimi güzelliği ve şarkılarıyla animasyon tarihinin başlangıç noktası."},{"t":"Song at Midnight","y":1937,"d":"Weibang Ma-Xu","r":124,"g":["Horror","Romance"],"c":[],"s":"Yeniden açılan eski bir tiyatroda genç bir oyuncu, geceleri yankılanan gizemli bir şarkının peşine düşer. Operadaki Hayalet'ten esinlenen bu film, dışavurumcu gölgeleriyle Çin sinemasının ilk korku klasiği sayılıyor."},{"t":"Stella Dallas","y":1937,"d":"King Vidor","r":106,"g":["Drama","Romance"],"c":[],"s":"İşçi sınıfından gelen bir kadın, kızının daha iyi bir hayata sahip olması için her şeyini ortaya koyar. Barbara Stanwyck'in yürek parçalayan oyunu, bu anne melodramını türün en unutulmaz örneklerinden biri yapıyor."},{"t":"The Awful Truth","y":1937,"d":"Leo McCarey","r":90,"g":["Comedy","Romance"],"c":[],"s":"Birbirinden şüphelenen bir çift boşanmaya karar verir, sonra da birbirlerinin yeni ilişkilerini sabote etmeye başlar. Cary Grant ve Irene Dunne'ın doğaçlama havası taşıyan zekası, bu çılgın komediyi türün doruklarından biri yapıyor."},{"t":"The Life of Emile Zola","y":1937,"d":"William Dieterle","r":116,"g":["Biography","Drama"],"c":["Joseph Schildkraut"],"s":"Fransız yazar Emile Zola'nın hayatı, Dreyfus davasında haksızlığa karşı verdiği cesur mücadeleyle doruğa ulaşır. Paul Muni'nin güçlü oyunuyla en iyi film Oscar'ını kazanan bu biyografi, adalet üzerine etkileyici bir tablo."},{"t":"Angels With Dirty Faces","y":1938,"d":"Michael Curtiz","r":97,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Aynı mahallede büyüyen iki arkadaştan biri gangster, diğeri papaz olur ve mahallenin gençleri ikisi arasında kalır. James Cagney'nin karizmatik oyunu ve unutulmaz son dakikalarıyla gangster türünün en duygulu filmlerinden."},{"t":"Jezebel","y":1938,"d":"William Wyler","r":104,"g":["Drama","Romance"],"c":["Bette Davis","Fay Bainter"],"s":"İç Savaş öncesi New Orleans'ta inatçı ve kural tanımaz bir Güneyli güzel, gururu yüzünden nişanlısını kaybetme riskine girer. Bette Davis'in Oscar'lı performansı ve kırmızı elbiseli balo sahnesiyle, ihtişamlı bir dönem dramı."},{"t":"Olympia Part One: Festival of the Nations","y":1938,"d":"Leni Riefenstahl","r":111,"g":["Documentary","Sport"],"c":[],"s":"1936 Berlin Olimpiyatları'nın atletizm yarışmalarını kaydeden bu belgesel, spor filmlerinin görsel dilini yeniden yazdı. Nazi rejiminin gölgesinde çekildiği unutulmadan, çekim teknikleri ve hareketi yakalayış biçimi açısından ilgiyle izlenebilir."},{"t":"The Adventures of Robin Hood","y":1938,"d":"Michael Curtiz","r":102,"g":["Action","Adventure","Romance"],"c":[],"s":"Aslan Yürekli Richard'ın yokluğunda Prens John'un zulmüne karşı Robin Hood ve neşeli adamları Sherwood Ormanı'ndan direniş başlatır. Errol Flynn'in göz kamaştıran Technicolor macerası, türün hâlâ aşılamamış en eğlenceli örneği."},{"t":"The Baker's Wife","y":1938,"d":"Marcel Pagnol","r":133,"g":["Comedy","Drama"],"c":[],"s":"Provence'ta bir köye yeni gelen fırıncının genç karısı bir çobanla kaçınca, fırıncı ekmek yapmayı bırakır ve bütün köy harekete geçer. Marcel Pagnol'ün sıcak mizahı ve Raimu'nun şahane oyunuyla insanı hem güldüren hem hüzünlendiren bir film."},{"t":"The Lady Vanishes","y":1938,"d":"Alfred Hitchcock","r":96,"g":["Crime","Drama","Mystery"],"c":[],"s":"Avrupa'da bir trende genç bir kadın, yol arkadaşı yaşlı hanımın ortadan kaybolduğunu fark eder, ama kimse onu gördüğünü hatırlamaz. Hitchcock'un İngiltere dönemi başyapıtı, mizahla gerilimi harika dengeleyen bir tren gizemi."},{"t":"Babes in Arms","y":1939,"d":"Busby Berkeley","r":94,"g":["Comedy","Musical"],"c":[],"s":"Vodvil sanatçılarının çocukları, işsiz kalan ailelerine yardım etmek için kendi gösterilerini sahnelemeye karar verir. Mickey Rooney ve Judy Garland'ın enerjisi, hadi bir gösteri yapalım ruhunu en neşeli haliyle taşıyor."},{"t":"Destry Rides Again","y":1939,"d":"George Marshall","r":95,"g":["Comedy","Western"],"c":[],"s":"Vahşi bir batı kasabasına şerif yardımcısı olarak gelen barışçıl Destry, silah taşımadan düzeni sağlamaya çalışır. James Stewart ve salon şarkıcısı Marlene Dietrich'le, western'i mizah ve müzikle buluşturan keyifli bir klasik."},{"t":"Gone With the Wind","y":1939,"d":"Victor Fleming","r":238,"g":["Drama","Romance","War"],"c":["Clark Gable","Vivien Leigh","Hattie McDaniel"],"s":"İç Savaş ve Yeniden Yapılanma döneminde güçlü iradeli Scarlett O'Hara, sevdiği adam ile aşkı arasında kalırken hayatta kalmak için savaşır. Görkemli Technicolor'u ve efsanevi oyunculuklarıyla dev bir Hollywood destanı, ancak dönemin ırk bakışını eleştirel gözle izlemek gerekir."},{"t":"Gunga Din","y":1939,"d":"George Stevens","r":117,"g":["Adventure","Comedy","War"],"c":[],"s":"Sömürge Hindistanı'nda üç İngiliz çavuş ve sadık su taşıyıcısı Gunga Din, gizli bir tarikata karşı mücadele eder. Cary Grant'li bu macera, arkadaşlık ve aksiyon dolu enerjisiyle sonraki birçok maceraya ilham verdi."},{"t":"Le Jour Se Leve","y":1939,"d":"Marcel Carné","r":93,"g":["Crime","Drama","Romance"],"c":[],"s":"Bir cinayet işlemiş bir işçi, polisle kuşatıldığı odasında bu noktaya nasıl geldiğini geriye dönüşlerle hatırlar. Jean Gabin'in başrolde olduğu Carné filmi, Fransız şiirsel gerçekçiliğinin en kasvetli ve güzel örneklerinden."},{"t":"Mr. Smith Goes to Washington","y":1939,"d":"Frank Capra","r":129,"g":["Comedy","Drama"],"c":[],"s":"Saf ve idealist bir genç, beklenmedik şekilde senatör atanır ve Washington'daki yolsuzluk çarkıyla karşı karşıya gelir. James Stewart'ın unutulmaz filibuster sahnesiyle, demokrasiye inancı tazeleyen Capra klasiği."},{"t":"Ninotchka","y":1939,"d":"Ernst Lubitsch","r":110,"g":["Comedy","Romance"],"c":[],"s":"Soğuk ve disiplinli bir Sovyet görevlisi, Paris'te bir görev için bulunurken çapkın bir kontun cazibesine yenik düşer. Garbo gülüyor sloganıyla hatırlanan bu Lubitsch komedisi, zarif, zekice ve çok eğlenceli."},{"t":"Only Angels Have Wings","y":1939,"d":"Howard Hawks","r":121,"g":["Adventure","Drama","Romance"],"c":[],"s":"Güney Amerika'da tehlikeli rotalarda posta taşıyan pilotların kaldığı küçük bir limanda, gelip geçen bir kadın hayatlarına karışır. Cary Grant'li bu Hawks filmi, dostluk ve meslek onuru üzerine sert ama romantik bir macera."},{"t":"Stagecoach","y":1939,"d":"John Ford","r":96,"g":["Adventure","Drama","Western"],"c":["Thomas Mitchell"],"s":"Tehlikeli bir bölgeden geçen bir posta arabasında, birbirinden farklı yolcular hem Apaçi tehdidi hem de kendi önyargılarıyla sınanır. John Wayne'i yıldız yapan bu Ford filmi, western türünü yetişkin bir sanata dönüştürdü."},{"t":"The Story of the Last Chrysanthemum","y":1939,"d":"Kenji Mizoguchi","r":148,"g":["Drama","Romance"],"c":[],"s":"Ünlü bir kabuki ailesinin mirasçısı, gerçek yeteneğini bulmak için evden ayrılır ve ona inanan tek kişi sadık bir hizmetçi kızdır. Mizoguchi'nin uzun ve akışkan çekimleriyle, fedakarlık üzerine incelikli ve dokunaklı bir başyapıt."},{"t":"The Wizard of Oz","y":1939,"d":"Victor Fleming","r":102,"g":["Adventure","Family","Fantasy"],"c":["Judy Garland","Frank Morgan"],"s":"Kansaslı Dorothy, bir kasırgayla büyülü Oz diyarına savrulur ve eve dönebilmek için yeni dostlarıyla yola çıkar. Siyah beyazdan renkliye geçişi ve Over the Rainbow şarkısıyla, her yaşta insanı büyüleyen zamansız bir masal."},{"t":"Wuthering Heights","y":1939,"d":"William Wyler","r":104,"g":["Drama","Romance"],"c":[],"s":"Yorkshire kırlarında, sokakta büyümüş Heathcliff ile asil Cathy arasındaki tutkulu aşk, sınıf farkları ve gururla sınanır. Laurence Olivier ve Merle Oberon'un rüzgarlı romantizmiyle, Brontë'nin ruhunu yakalayan büyüleyici bir uyarlama."},{"t":"Dance, Girl, Dance","y":1940,"d":"Dorothy Arzner","r":90,"g":["Comedy","Drama","Music"],"c":[],"s":"Bale yapmayı hayal eden genç bir dansçı, geçimini sağlamak için bir burlesk gösterisinde seyircinin alay konusu olur. Dorothy Arzner'in bu filmi, kadın bakışını sorgulayan cesur bir sahnesiyle zamanının çok ötesinde."},{"t":"Fantasia","y":1940,"d":"David Hand","r":124,"g":["Animation","Family","Fantasy"],"c":[],"s":"Bach'tan Stravinsky'ye klasik müzik eserleri, soyut desenlerden dinozorlara uzanan animasyon sahneleriyle görselleştirilir. Mickey'nin büyücü çırağı olduğu bölümüyle Disney'in en deneysel ve en iddialı sanat eseri."},{"t":"His Girl Friday","y":1940,"d":"Howard Hawks","r":92,"g":["Comedy","Drama","Romance"],"c":[],"s":"Hırslı bir gazete editörü, evlenmek üzere olan eski karısı ve en iyi muhabirini son bir büyük haber için geri kazanmaya çalışır. Cary Grant ve Rosalind Russell'ın makineli tüfek hızındaki diyalogları, bu komediyi eşsiz kılıyor."},{"t":"Pinocchio","y":1940,"d":"Ben Sharpsteen","r":88,"g":["Adventure","Animation","Comedy"],"c":[],"s":"Tahtadan oyulmuş bir kukla, gerçek bir çocuk olabilmek için cesaret, dürüstlük ve fedakarlığını kanıtlamak zorundadır. Göz alıcı animasyonu ve When You Wish Upon a Star şarkısıyla Disney'in en zengin ve derin masallarından."},{"t":"Rebecca","y":1940,"d":"Alfred Hitchcock","r":130,"g":["Drama","Mystery","Romance"],"c":[],"s":"Genç bir kadın, zengin bir dulla evlenip Manderley'e taşınır, ama evin her köşesi ilk eş Rebecca'nın gölgesiyle doludur. Hitchcock'un Oscar'lı ilk Amerikan filmi, gotik atmosferi ve ürkütücü Bayan Danvers'la büyüleyici."},{"t":"The Bank Dick","y":1940,"d":"Edward F. Cline","r":72,"g":["Comedy"],"c":[],"s":"Başarısız bir aile babası, yanlışlıkla bir banka soyguncusunu yakalayınca banka bekçiliğine terfi eder ve kaos başlar. W.C. Fields'ın aksi ve absürt mizahı, bu küçük kasaba komedisini gerçek bir kült sevinç yapıyor."},{"t":"The Grapes of Wrath","y":1940,"d":"John Ford","r":129,"g":["Drama"],"c":["Jane Darwell"],"s":"Buhran yıllarında toprağını kaybeden Joad ailesi, iş ve umut bulmak için Kaliforniya'ya doğru zorlu bir yolculuğa çıkar. Henry Fonda'nın unutulmaz oyunu ve John Ford'un insancıl bakışıyla, Steinbeck'in romanının güçlü bir uyarlaması."},{"t":"The Mortal Storm","y":1940,"d":"Frank Borzage","r":100,"g":["Drama"],"c":[],"s":"Nazi iktidarının yükselişiyle birlikte Alman bir aile, siyasi görüşleri yüzünden bölünmeye başlar. James Stewart ve Margaret Sullavan'ın başrolde olduğu bu film, Hollywood'un Nazizme karşı erkenden aldığı cesur bir tavır."},{"t":"The Philadelphia Story","y":1940,"d":"George Cukor","r":112,"g":["Comedy","Romance"],"c":["James Stewart"],"s":"Sosyeteden bir kadın, yeni düğünü öncesinde eski kocası ve meraklı bir gazetecinin ortaya çıkmasıyla duygularını gözden geçirir. Katharine Hepburn, Cary Grant ve James Stewart'ın parıltılı üçlüsüyle, zekice bir yeniden evlenme komedisi."},{"t":"Citizen Kane","y":1941,"d":"Orson Welles","r":119,"g":["Drama","Mystery"],"c":["Orson Welles","Joseph Cotten"],"s":"Bir gazeteci, basın baronu Charles Foster Kane'in son sözü Rosebud'un anlamını çözmek için hayatını yakından tanıyanları dinler. Orson Welles'in derin odaklı görüntüleri ve cesur anlatısıyla, uzun süre tüm zamanların en iyi filmi sayılan başyapıt."},{"t":"Dumbo","y":1941,"d":"Samuel Armstrong","r":64,"g":["Adventure","Animation","Drama"],"c":[],"s":"Kocaman kulakları yüzünden alay edilen bir yavru fil, sirkte kendine yer bulmaya çalışırken beklenmedik bir yeteneği keşfeder. Kısa ve sade ama duygusu yoğun bu Disney filmi, farklılığı kutlayan en tatlı masallardan."},{"t":"High Sierra","y":1941,"d":"Raoul Walsh","r":100,"g":["Action","Adventure","Drama"],"c":[],"s":"Hapisten çıkan yaşlanan bir gangster, son bir büyük soygun için dağlara gider, ama hayat ona farklı bir yol gösterir. Humphrey Bogart'ı yıldızlığa taşıyan bu film, gangster türünü kara filme bağlayan hüzünlü bir köprü."},{"t":"How Green Was My Valley","y":1941,"d":"John Ford","r":118,"g":["Drama","Family"],"c":["Donald Crisp"],"s":"Galler'de bir madenci ailesinin hayatı, en küçük oğlun gözünden sıcak ve nostaljik biçimde anlatılır. John Ford'un Oscar'lı bu filmi, aile, topluluk ve kaybolan bir dünya üzerine şiirsel bir ağıt."},{"t":"Sergeant York","y":1941,"d":"Howard Hawks","r":134,"g":["Biography","Drama","History"],"c":["Gary Cooper"],"s":"Tennessee'li dindar bir çiftçi, Birinci Dünya Savaşı'nda vicdanıyla hesaplaşarak ülkesinin en ünlü kahramanlarından biri olur. Gary Cooper'ın Oscar kazandıran sıcak oyunuyla, gerçek bir hikayeye dayanan içten bir biyografi."},{"t":"Sullivan's Travels","y":1941,"d":"Preston Sturges","r":90,"g":["Adventure","Comedy","Drama"],"c":[],"s":"Başarılı bir komedi yönetmeni, ciddi bir toplumsal film çekmek için yoksulluğu tanımak üzere serseri kılığında yola çıkar. Preston Sturges'ün kahkaha ile toplumsal gözlemi ustaca harmanladığı bu film, sinemanın kendisine yazılmış bir güzelleme."},{"t":"The Lady Eve","y":1941,"d":"Preston Sturges","r":94,"g":["Comedy","Romance"],"c":[],"s":"Usta bir kadın dolandırıcı, bir gemide saf ve zengin bir yılan bilimciye tuzak kurar, ama işler duygulara karışınca değişir. Barbara Stanwyck ve Henry Fonda'yla Sturges'ün en zarif ve en eğlenceli komedilerinden."},{"t":"The Maltese Falcon","y":1941,"d":"John Huston","r":100,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Özel dedektif Sam Spade, ortağının ölümünün ardından değerli bir şahin heykelciği peşindeki tehlikeli kişilerle karşı karşıya gelir. Humphrey Bogart'ın soğukkanlı karizmasıyla John Huston'ın ilk filmi, kara filmin temel taşlarından."},{"t":"The Wolf Man","y":1941,"d":"George Waggner","r":70,"g":["Horror","Mystery","Romance"],"c":[],"s":"Babasının Galler'deki şatosuna dönen bir adam, bir kurt tarafından ısırılınca dolunaylı gecelerde kendini kontrol edemez hale gelir. Lon Chaney Jr.'ın trajik kahramanıyla, kurt adam mitini modern sinemaya taşıyan Universal klasiği."},{"t":"Casablanca","y":1942,"d":"Michael Curtiz","r":102,"g":["Drama","Romance","War"],"c":["Humphrey Bogart","Ingrid Bergman"],"s":"İkinci Dünya Savaşı'nda Kazablanka'da bir gece kulübü işleten Rick, eski aşkı Ilsa'nın kocasıyla kapısından girmesiyle zor bir seçimle yüzleşir. Bogart ve Bergman'ın unutulmaz uyumu ve efsanevi replikleriyle sinemanın en sevilen aşk filmlerinden."},{"t":"Cat People","y":1942,"d":"Jacques Tourneur","r":73,"g":["Fantasy","Horror","Thriller"],"c":[],"s":"Genç bir Sırp kadın, öfkelendiğinde bir pantere dönüşeceğine inandığı eski bir lanetten korkar. Jacques Tourneur'un gölgelerle ve gösterilmeyenle korku yarattığı bu düşük bütçeli klasik, türün en zarif örneklerinden."},{"t":"Mrs. Miniver","y":1942,"d":"William Wyler","r":134,"g":["Drama","Romance","War"],"c":["Greer Garson","Teresa Wright"],"s":"İngiliz bir banliyöde yaşayan bir aile, İkinci Dünya Savaşı'nın bombardımanları ve kayıpları karşısında dayanışmayla ayakta kalır. Greer Garson'un sıcak oyunuyla, savaş zamanı moraline katkısıyla hatırlanan dokunaklı bir aile dramı."},{"t":"Now, Voyager","y":1942,"d":"Irving Rapper","r":117,"g":["Drama","Romance"],"c":[],"s":"Baskıcı annesinin gölgesinde ezilen çekingen bir kadın, terapi ve bir gemi yolculuğuyla kendini yeniden keşfeder. Bette Davis'in dönüşümü ve iki sigara sahnesiyle, melodramın en incelikli ve romantik örneklerinden."},{"t":"The Magnificent Ambersons","y":1942,"d":"Orson Welles","r":88,"g":["Drama","Romance"],"c":[],"s":"Varlıklı Amberson ailesinin gururlu mirasçısı, otomobil çağının gelişiyle ailesinin ihtişamının solduğunu görmezden gelir. Stüdyo tarafından kesilmiş olsa da Welles'in bu hüzünlü dönem dramı, kayıp zaman üzerine derin bir ağıt."},{"t":"The Palm Beach Story","y":1942,"d":"Preston Sturges","r":88,"g":["Comedy","Romance"],"c":[],"s":"Parasız bir mucidin karısı, kocasına yardım etmek için boşanmaya karar verir ve zengin bir koca bulmak üzere Palm Beach'e yola çıkar. Preston Sturges'ün çılgın, hızlı ve zekice komedisi, sürprizlerle dolu bir yolculuk."},{"t":"To Be or Not to Be","y":1942,"d":"Ernst Lubitsch","r":99,"g":["Comedy","Romance","War"],"c":[],"s":"Nazi işgali altındaki Varşova'da bir tiyatro topluluğu, oyunculuk yeteneklerini kullanarak bir Gestapo casusunu alt etmeye çalışır. Lubitsch'in cüretkar ve keskin mizahı, bu komediyi hem kahkaha dolu hem de cesur bir direniş eseri yapıyor."},{"t":"Yankee Doodle Dandy","y":1942,"d":"Michael Curtiz","r":126,"g":["Biography","Drama","Family"],"c":["James Cagney"],"s":"Broadway'in efsane şarkıcı, dansçı ve bestecisi George M. Cohan'ın hayatı, vatansever şarkıları eşliğinde anlatılır. James Cagney'nin Oscar'lı ve enerji dolu performansıyla coşkulu bir müzikal biyografi."},{"t":"Fires Were Started","y":1943,"d":"Humphrey Jennings","r":63,"g":["Drama","War"],"c":[],"s":"Londra'daki Blitz döneminde bir itfaiye ekibinin bir gün ve bir gecesi, gerçek itfaiyecilerle canlandırılır. Humphrey Jennings'in şiirsel ve sade anlatımı, bu filmi savaş belgeselinin en insani örneklerinden biri yapıyor."},{"t":"I Walked With a Zombie","y":1943,"d":"Jacques Tourneur","r":69,"g":["Drama","Fantasy","Horror"],"c":[],"s":"Bir Karayip adasına bir plantasyon sahibinin tuhaf biçimde hasta karısına bakmak için giden genç bir hemşire, vudu gizemleriyle karşılaşır. Tourneur'un gölgeler ve davul sesleriyle örülen bu rüya gibi korku filmi, beklenmedik bir şiir taşıyor."},{"t":"Meshes of the Afternoon","y":1943,"d":"Maya Deren","r":null,"g":["Mystery"],"c":[],"s":"Bir kadının bir öğleden sonra uykuya dalmasıyla, tekrar eden imgeler ve nesneler rüya gibi bir döngü oluşturur. Maya Deren'in bu kısa deneysel filmi, Amerikan avangard sinemasının kurucu eserlerinden ve hâlâ büyüleyici."},{"t":"Ossessione","y":1943,"d":"Luchino Visconti","r":140,"g":["Crime","Drama","Romance"],"c":[],"s":"Başıboş bir serseri, İtalya'nın taşrasında bir yol kenarı lokantasının genç ve mutsuz karısıyla tutkulu bir ilişkiye girer. Visconti'nin ilk filmi, Yeni Gerçekçiliğin habercisi olan tozlu ve sert bir kara film."},{"t":"Shadow of a Doubt","y":1943,"d":"Alfred Hitchcock","r":108,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Küçük bir kasabada yaşayan genç Charlie, çok sevdiği dayısının ziyarete gelmesiyle sevinir, ama zamanla ondan şüphelenmeye başlar. Hitchcock'un kendi favorisi olan bu film, sıradan hayatın altındaki karanlığı ustaca açığa çıkarıyor."},{"t":"The Life and Death of Colonel Blimp","y":1943,"d":"Emeric Pressburger","r":163,"g":["Drama","Romance","War"],"c":[],"s":"Bir İngiliz subayının kırk yıllık hayatı, bir Alman dostla olan ilginç arkadaşlığı ve farklı kadınlara duyduğu aşkla anlatılır. Powell ve Pressburger'in Technicolor şaheseri, sıcak, esprili ve derin bir insan portresi."},{"t":"The Man in Grey","y":1943,"d":"Leslie Arliss","r":90,"g":["Drama","History","Romance"],"c":[],"s":"Statü için soğuk bir lordla evlenen genç bir kadın bir tiyatro oyuncusuna âşık olur, okul arkadaşı ise kocasıyla ilişkiye girer. James Mason'lı bu Gainsborough melodramı, gotik tutkuları ve kostümlü ihtişamıyla keyifli bir kaçış."},{"t":"The Ox-Bow Incident","y":1943,"d":"William A. Wellman","r":75,"g":["Drama","Western"],"c":[],"s":"Batıda bir kasabada öfkeli bir kalabalık, bir çiftçinin öldürüldüğü haberiyle yakaladığı üç yabancıyı kendi eliyle yargılamak ister. Henry Fonda'lı bu cesur western, linç kültürüne ve adalete dair sarsıcı bir vicdan filmi."},{"t":"The Seventh Victim","y":1943,"d":"Mark Robson","r":71,"g":["Drama","Horror","Mystery"],"c":[],"s":"Genç bir kadın, New York'ta kaybolan ablasını ararken gizemli bir şeytan tarikatının izine düşer. Val Lewton yapımı bu karanlık ve melankolik film, korkunun ötesinde varoluşsal bir huzursuzluk bırakıyor."},{"t":"Double Indemnity","y":1944,"d":"Billy Wilder","r":107,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Bir sigorta satıcısı, çekici bir ev kadınıyla birlikte kocasını öldürüp sigorta parasını almak için bir plan yapar. Billy Wilder'ın keskin diyalogları ve Barbara Stanwyck'in ölümcül cazibesiyle kara filmin en saf örneği."},{"t":"Gaslight","y":1944,"d":"George Cukor","r":114,"g":["Crime","Drama","Mystery"],"c":["Ingrid Bergman"],"s":"Genç bir kadın, yeni kocasıyla eski evine yerleştikten sonra aklını kaçırdığını düşünmeye başlar. Ingrid Bergman'ın Oscar'lı oyunuyla bu gerilim, psikolojik manipülasyona adını verecek kadar etkili bir klasik."},{"t":"Henry V","y":1944,"d":"Laurence Olivier","r":137,"g":["Biography","Drama","History"],"c":[],"s":"Genç Kral Henry, İngiliz ordusunu Fransa'ya götürür ve Agincourt'ta tarihi bir savaşa hazırlanır. Laurence Olivier'nin tiyatro sahnesinden görkemli savaş alanına açılan bu Technicolor Shakespeare uyarlaması, görsel olarak büyüleyici."},{"t":"Laura","y":1944,"d":"Otto Preminger","r":88,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Bir dedektif, cinayete kurban gittiği düşünülen güzel Laura'nın vakasını çözerken portresine ve hayatına takıntılı bir biçimde bağlanır. Otto Preminger'in şık kara filmi, unutulmaz müzik teması ve zekice kurgusuyla büyülü."},{"t":"Meet Me in St. Louis","y":1944,"d":"Vincente Minnelli","r":113,"g":["Comedy","Drama","Family"],"c":[],"s":"1904 Dünya Fuarı öncesinde St. Louis'de yaşayan bir ailenin bir yılı, aşklar, şarkılar ve mevsimlerle anlatılır. Judy Garland'ın Have Yourself a Merry Little Christmas yorumuyla, sıcacık bir Technicolor müzikal."},{"t":"Murder, My Sweet","y":1944,"d":"Edward Dmytryk","r":95,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Özel dedektif Philip Marlowe, eski sevgilisini arayan iri yarı bir adamın isteğiyle karanlık bir cinayet ağına sürüklenir. Chandler'ın dünyasını beyaz perdeye taşıyan bu film, halüsinasyonlu sahneleriyle kara filmin öncü eserlerinden."},{"t":"To Have and Have Not","y":1944,"d":"Howard Hawks","r":100,"g":["Adventure","Comedy","Drama"],"c":[],"s":"Vichy yönetimindeki Martinik'te bir tekne kaptanı, direniş üyelerine yardım etmek ile tarafsız kalmak arasında kalır. Bogart ile genç Lauren Bacall'un ekranı tutuşturan ilk buluşması, bu filmi zamansız bir romantik macera yapıyor."},{"t":"Brief Encounter","y":1945,"d":"David Lean","r":86,"g":["Drama","Romance"],"c":[],"s":"Evli bir kadın ile evli bir doktor, bir tren istasyonunda tanışır ve haftalık buluşmaları sessiz bir aşka dönüşür. David Lean'in Rahmaninov eşliğindeki bu zarif filmi, söylenmeyen duyguların en dokunaklı portrelerinden."},{"t":"Children of Paradise","y":1945,"d":"Marcel Carné","r":189,"g":["Drama","Romance"],"c":[],"s":"19. yüzyıl Paris'inin tiyatro dünyasında büyüleyici Garance, bir pandomim sanatçısı, bir aktör, bir suçlu ve bir kont tarafından sevilir. İşgal altında çekilen Carné başyapıtı, tiyatro ve aşk üzerine destansı ve şiirsel bir ziyafet."},{"t":"Detour","y":1945,"d":"Edgar G. Ulmer","r":66,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Kaliforniya'ya otostop çeken bir piyanist, yol boyunca bir dizi kötü şansla kaçınılmaz görünen bir kaderin içine düşer. Çok düşük bütçesine rağmen Ulmer'in bu karamsar filmi, kara filmin en ham ve etkileyici eserlerinden."},{"t":"I Know Where I'm Going!","y":1945,"d":"Emeric Pressburger","r":87,"g":["Drama","Romance"],"c":[],"s":"Zengin bir iş adamıyla evlenmek için İskoç adalarına giden kararlı bir genç kadın, fırtına yüzünden yolda mahsur kalır ve planları değişmeye başlar. Powell ve Pressburger'in büyülü manzaralarla dolu romantik komedisi, içi ısıtan bir mücevher."},{"t":"Ivan the Terrible, Part I","y":1945,"d":"Sergei Eisenstein","r":95,"g":["Biography","Drama","History"],"c":[],"s":"Genç Ivan, Rusya'nın ilk çarı olarak taç giyer ve ülkesini birleştirmek için soylularla ve dış düşmanlarla mücadele eder. Eisenstein'ın dev gölgeleri ve operavari görselliğiyle, tarih ve iktidar üzerine görkemli bir tablo."},{"t":"Mildred Pierce","y":1945,"d":"Michael Curtiz","r":111,"g":["Crime","Drama","Film-Noir"],"c":["Joan Crawford"],"s":"Boşanmış bir anne, şımarık kızının isteklerini karşılamak için garsonluktan başlayarak bir restoran zinciri kurar. Joan Crawford'un Oscar'lı oyunuyla bu film, melodramı kara filmle buluşturan güçlü bir klasik."},{"t":"Rome, Open City","y":1945,"d":"Roberto Rossellini","r":103,"g":["Drama","Thriller","War"],"c":[],"s":"Nazi işgalinin son günlerinde Roma'da bir direniş lideri, bir rahip ve bir kadın, işgalcilere karşı hayatlarını riske atar. Rossellini'nin savaşın hemen ardından çektiği bu film, İtalyan Yeni Gerçekçiliğinin başlangıcı ve hâlâ sarsıcı."},{"t":"San Pietro","y":1945,"d":"John Huston","r":null,"g":["War"],"c":[],"s":"İtalya'da San Pietro köyünü almak için verilen kanlı çatışma, ön cephede çekilmiş görüntülerle anlatılır. John Huston'ın bu savaş belgeseli, zafer propagandası yerine savaşın ağır bedelini göstermesiyle hâlâ çok etkili."},{"t":"Spellbound","y":1945,"d":"Alfred Hitchcock","r":111,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Bir psikiyatri kliniğinin yeni müdürünün aslında hafızasını kaybetmiş biri olduğu anlaşılır, genç bir doktor ise onu korumaya çalışır. Ingrid Bergman ve Gregory Peck'li bu Hitchcock gerilimi, Dalí'nin tasarladığı rüya sahnesiyle unutulmaz."},{"t":"The Lost Weekend","y":1945,"d":"Billy Wilder","r":101,"g":["Drama","Film-Noir"],"c":["Ray Milland"],"s":"Başarısız bir yazar, New York'ta alkol bağımlılığının yıkıcı bir hafta sonuna teslim olur. Billy Wilder'ın bağımlılığı cesurca ele aldığı bu film, Ray Milland'in sarsıcı oyunu ve dört büyük Oscar'ıyla bir dönüm noktası."},{"t":"A Matter of Life and Death","y":1946,"d":"Emeric Pressburger","r":104,"g":["Drama","Fantasy","Romance"],"c":[],"s":"İkinci Dünya Savaşı'nda uçağı düşen bir İngiliz pilot mucizevi şekilde hayatta kalır, ama ahiret onu geri istemektedir. Powell ve Pressburger'in renkli dünya ile siyah beyaz cenneti buluşturduğu bu romantik fantezi, sinemanın en büyüleyici eserlerinden."},{"t":"Beauty and the Beast","y":1946,"d":"Jean Cocteau","r":93,"g":["Drama","Fantasy","Romance"],"c":[],"s":"Babasının hayatını kurtarmak için kendini bir canavarın şatosuna teslim eden Güzel, zamanla onun yumuşak kalbini keşfeder. Jean Cocteau'nun canlanan şamdanları ve rüya gibi büyüsüyle, masalın en şiirsel sinema uyarlaması."},{"t":"Gilda","y":1946,"d":"Charles Vidor","r":110,"g":["Drama","Film-Noir","Romance"],"c":[],"s":"Buenos Aires'te bir kumarhane sahibinin sağ kolu, patronunun yeni karısının geçmişteki sevgilisi olduğunu anlayınca tehlikeli bir oyuna girer. Rita Hayworth'ün Put the Blame on Mame sahnesiyle, kara filmin en baştan çıkarıcı yıldızını parlatan bir klasik."},{"t":"Great Expectations","y":1946,"d":"David Lean","r":118,"g":["Adventure","Drama","Mystery"],"c":[],"s":"Yoksul bir yetim olan Pip, gizemli bir hayırseverin desteğiyle Londra'da bir beyefendi olmak için yola çıkar. David Lean'in Dickens uyarlaması, atmosferik açılışı ve zengin karakterleriyle edebiyat uyarlamalarının en güzellerinden."},{"t":"It's a Wonderful Life","y":1946,"d":"Frank Capra","r":130,"g":["Drama","Family","Fantasy"],"c":["James Stewart","Donna Reed"],"s":"Hayatının umutsuz bir anında George Bailey'ye bir melek, onun hiç doğmamış olsaydı dünyanın nasıl olacağını gösterir. James Stewart'ın en içten oyunuyla bu Capra filmi, her yılbaşı yeniden izlenen sıcacık bir umut hikayesi."},{"t":"My Darling Clementine","y":1946,"d":"John Ford","r":97,"g":["Drama","Romance","Western"],"c":[],"s":"Wyatt Earp ve kardeşleri, Tombstone kasabasında düzen sağlamaya çalışırken Clanton ailesiyle meşhur hesaplaşmaya doğru ilerler. John Ford'un şiirsel ve sakin western'i, türün en güzel görüntülere sahip ve en insani örneklerinden."},{"t":"Notorious","y":1946,"d":"Alfred Hitchcock","r":102,"g":["Drama","Film-Noir","Mystery"],"c":[],"s":"Babası hain ilan edilmiş genç bir kadın, Rio'da saklanan Nazi ağına sızmak için bir Amerikan ajanıyla çalışmaya başlar ve görev ile aşk birbirine dolanır. Hitchcock'un en zarif gerilimlerinden biri; Cary Grant ile Ingrid Bergman arasındaki elektrik hâlâ nefes kesiyor."},{"t":"Paisan","y":1946,"d":"Roberto Rossellini","r":120,"g":["Drama","War"],"c":[],"s":"Müttefiklerin İtalya'yı kurtarışı Sicilya'dan Po deltasına uzanan altı ayrı hikâyede, askerlerle sivillerin kırılgan karşılaşmaları üzerinden anlatılır. Yeni Gerçekçiliğin kurucu eserlerinden; amatör oyuncularla çekilen sahneleri bir belgesel kadar sahici ve dokunaklı."},{"t":"The Best Years of Our Lives","y":1946,"d":"William Wyler","r":170,"g":["Drama","Romance","War"],"c":["Fredric March","Harold Russell"],"s":"Savaştan dönen üç asker aynı küçük kasabada ailelerine, işlerine ve değişmiş bir hayata yeniden uyum sağlamaya çalışır. Duygusallığa kaçmadan derin bir şefkatle anlatılmış, savaş sonrası Amerika'nın en dürüst ve insani portrelerinden biri."},{"t":"The Big Sleep","y":1946,"d":"Howard Hawks","r":114,"g":["Crime","Drama","Film-Noir"],"c":[],"s":"Özel dedektif Philip Marlowe, zengin bir generalin şımarık kızlarıyla ilgili bir şantaj işini üstlenir ve kendini cinayetlerle dolu bir labirentte bulur. Olay örgüsünü takip etmek zor ama umurunuzda olmayacak;
