":"Halloween","y":1978,"d":"John Carpenter","r":91,"g":["Horror","Thriller"],"c":["Donald Pleasence","Jamie Lee Curtis"],"s":"Çocukken işlediği bir cinayet yüzünden kapatılan Michael Myers, on beş yıl sonra kaçarak Cadılar Bayramı gecesi memleketine döner. John Carpenter'ın minimalist müziği ve ustaca kurduğu gerilimle, slasher türünü tanımlayan bir başyapıt."},{"t":"Killer of Sheep","y":1978,"d":"Charles Burnett","r":80,"g":["Drama"],"c":[],"s":"Los Angeles'ın Watts mahallesinde mezbahada çalışan Stan, yorgunluk ve yoksulluk içinde ailesiyle günlerini geçirmeye çalışır. Charles Burnett'in şiirsel, belgesel tadındaki filmi, siyahi Amerikan yaşamını büyük bir şefkat ve güzellikle anlatıyor."},{"t":"The 36th Chamber of Shaolin","y":1978,"d":"Lau Kar-leung","r":116,"g":["Action","Adventure","Drama"],"c":[],"s":"Mançu baskısından kaçan genç bir öğrenci, Shaolin tapınağına sığınır ve otuz beş zorlu odadan geçerek dövüş sanatlarında ustalaşır. Gordon Liu'nun efsaneleştiği bu film, antrenman sahneleriyle kung fu sinemasının en sevilen klasiklerinden."},{"t":"The Chant of Jimmie Blacksmith","y":1978,"d":"Fred Schepisi","r":108,"g":["Biography","Crime","Drama"],"c":[],"s":"Yüzyıl dönümü Avustralya'sında melez bir genç, beyaz toplumun kurallarına uyarak saygınlık kazanmaya çalışır ama gördüğü aşağılanmalar onu bir kırılma noktasına iter. Fred Schepisi'nin güçlü ve rahatsız edici filmi, sömürgeci ırkçılığa cesurca bakıyor."},{"t":"The Deer Hunter","y":1978,"d":"Michael Cimino","r":183,"g":["Drama","War"],"c":["Robert De Niro","Christopher Walken"],"s":"Pennsylvania'da çelik fabrikasında çalışan üç yakın arkadaş, Vietnam Savaşı'na gider ve hayatları geri dönüşü olmayan biçimde değişir. De Niro, Christopher Walken ve Meryl Streep'li bu destansı dram, savaşın insan ruhuna bıraktığı izleri derinden hissettiriyor."},{"t":"The Five Venoms","y":1978,"d":"Chang Cheh","r":null,"g":["Action"],"c":[],"s":"Ölmek üzere olan bir usta, son öğrencisini her biri farklı bir hayvan stilinde eğitilmiş beş eski öğrencisinin izini sürmesi için gönderir. Shaw Brothers stüdyosunun kült dövüş filmi, renkli karakterleri ve yaratıcı koreografisiyle çok keyifli."},{"t":"The Tree of Wooden Clogs","y":1978,"d":"Ermanno Olmi","r":186,"g":["Drama","History"],"c":[],"s":"19. yüzyılın sonunda Lombardiya'da bir çiftlikte yaşayan dört köylü ailenin mevsimlerle akan gündelik hayatı anlatılır. Amatör oyuncularla çekilen Olmi'nin bu sade ve derin filmi, Cannes'da Altın Palmiye kazanmış, huzur veren bir başyapıt."},{"t":"Up in Smoke","y":1978,"d":"Lou Adler","r":86,"g":["Comedy","Music"],"c":[],"s":"Tesadüfen tanışan iki uyuşturucu meraklısı, Meksika'dan Los Angeles'a uzanan kaotik ve tamamen saçma bir yolculuğa çıkar. Cheech ve Chong ikilisinin ilk filmi, rahat mizahı ve absürt durumlarıyla 'stoner' komedisinin kurucusu."},{"t":"Alien","y":1979,"d":"Ridley Scott","r":117,"g":["Horror","Sci-Fi"],"c":["Sigourney Weaver","Tom Skerritt"],"s":"Uzaydan dönen bir yük gemisinin mürettebatı, sinyal alınan ıssız bir gezegende gemiye alınan ölümcül bir yaratıkla karşı karşıya kalır. Ridley Scott'ın boğucu gerilimi, H.R. Giger'in tasarımları ve Sigourney Weaver'ın Ripley'siyle bilimkurgu korkusunun zirvesi."},{"t":"All That Jazz","y":1979,"d":"Bob Fosse","r":123,"g":["Drama","Music","Musical"],"c":[],"s":"İşkolik bir Broadway yönetmeni, yeni bir müzikali hazırlarken sağlığı, ilişkileri ve kendi sonu üzerine düşünmeye başlar. Bob Fosse'nin yarı otobiyografik filmi, göz kamaştırıcı dans sahneleri ve cüretkâr üslubuyla eşsiz bir müzikal deneyim."},{"t":"Apocalypse Now","y":1979,"d":"Francis Ford Coppola","r":147,"g":["Drama","Mystery","War"],"c":["Martin Sheen","Marlon Brando"],"s":"Vietnam Savaşı'nda bir ABD yüzbaşısı, ormanın derinliklerinde kendi krallığını kurmuş bir albayı bulmak için gizli bir göreve gönderilir. Coppola'nın Conrad'dan esinlenen destansı filmi, savaşın deliliğini sinemanın en unutulmaz görüntüleriyle anlatıyor."},{"t":"Being There","y":1979,"d":"Hal Ashby","r":130,"g":["Comedy","Drama"],"c":["Melvyn Douglas"],"s":"Hayatı boyunca yalnızca bir malikânenin bahçesinde ve televizyon karşısında yaşamış saf bahçıvan Chance, dış dünyaya çıktığında sözleri derin bilgelik sanılır. Peter Sellers'ın ince performansıyla Hal Ashby'nin bu zarif hicvi, siyaset ve medyaya hâlâ gülümseten bir ayna tutuyor."},{"t":"Breaking Away","y":1979,"d":"Peter Yates","r":101,"g":["Comedy","Drama","Sport"],"c":[],"s":"Indiana'da liseyi bitirmiş dört arkadaş, üniversite öğrencileriyle arasındaki sınıf farkını bir bisiklet yarışında kapatmaya çalışır. İtalyan bisikletçilere hayran Dave'in sevimli hikâyesi, sıcaklığı ve mizahıyla tam bir iyi hissettiren film."},{"t":"Christ Stopped at Eboli","y":1979,"d":"Francesco Rosi","r":150,"g":["Drama"],"c":[],"s":"1930'larda faşist rejim tarafından İtalya'nın güneyindeki yoksul bir köye sürgün edilen doktor ve ressam Carlo Levi, köylülerin unutulmuş dünyasını tanır. Francesco Rosi'nin sakin ve insancıl filmi, edebiyattan gelen derinliğiyle çok etkileyici."},{"t":"Kramer vs. Kramer","y":1979,"d":"Robert Benton","r":105,"g":["Drama"],"c":["Dustin Hoffman","Meryl Streep"],"s":"Eşi evi terk edince, kariyerine gömülü bir baba küçük oğluyla baş başa kalır ve ona gerçek bir ebeveyn olmayı öğrenir. Dustin Hoffman ve Meryl Streep'in samimi performanslarıyla boşanmanın her iki tarafına şefkatle bakan dokunaklı bir aile dramı."},{"t":"Life of Brian","y":1979,"d":"Terry Jones","r":null,"g":["Comedy"],"c":[],"s":"İsa ile aynı gün doğan Brian, bir dizi yanlış anlama sonucu kendini istemeden mesih ilan edilmiş bulur. Monty Python'ın en cesur filmi, dinî fanatizme ve siyasi gruplara takılan hicviyle hem kahkaha dolu hem de şaşırtıcı derecede zekice."},{"t":"Mad Max","y":1979,"d":"George Miller","r":88,"g":["Action","Adventure","Sci-Fi"],"c":[],"s":"Yakın gelecekte, çöküşün eşiğindeki Avustralya'da bir otoyol polisi, vahşi bir motosiklet çetesiyle giderek kişiselleşen bir çatışmaya girer. George Miller'ın düşük bütçeli ama inanılmaz enerjik filmi, bir efsane serisinin ve aksiyon sinemasının yeni dilinin başlangıcı."},{"t":"Manhattan","y":1979,"d":"Woody Allen","r":96,"g":["Comedy","Drama","Romance"],"c":[],"s":"Kırk yaşındaki bir New Yorklu yazar, genç sevgilisi ile en yakın arkadaşının metresi arasında karmaşık bir aşk ilişkisine sürüklenir. Gershwin müzikleri eşliğinde siyah beyaz çekilen film, Woody Allen'ın şehrine yazdığı en romantik aşk mektubu."},{"t":"My Brilliant Career","y":1979,"d":"Gillian Armstrong","r":100,"g":["Biography","Drama","Romance"],"c":[],"s":"19. yüzyıl sonunda Avustralya taşrasında yaşayan hırslı genç Sybylla, evlilik beklentilerine karşı yazar olma hayalinin peşinden gider. Judy Davis'in canlı performansıyla Gillian Armstrong'un filmi, bağımsızlık üzerine hâlâ ilham veren zarif bir dönem draması."},{"t":"Nosferatu the Vampyre","y":1979,"d":"Werner Herzog","r":96,"g":["Drama","Horror"],"c":[],"s":"Genç emlakçı Jonathan Harker, Transilvanya'daki gizemli Kont Drakula'ya ev satmak için yola çıkar ve farkında olmadan büyük bir karanlığı kendi kasabasına taşır. Herzog'un Murnau klasiğine saygı duruşu, Klaus Kinski'nin hüzünlü vampiriyle ürkütücü ve şiirsel."},{"t":"Real Life","y":1979,"d":"Albert Brooks","r":99,"g":["Comedy"],"c":[],"s":"Kendini beğenmiş bir film yapımcısı, sıradan bir Phoenix ailesinin gündelik yaşamını bir yıl boyunca kameraya almaya ikna eder ve işler hızla çığırından çıkar. Albert Brooks'un bu keskin hicvi, realite televizyonunu yıllar öncesinden öngören bir kehanet gibi."},{"t":"Stalker","y":1979,"d":"Andrei Tarkovsky","r":162,"g":["Drama","Sci-Fi"],"c":[],"s":"Bir rehber, bir yazar ile bir bilim insanını en derin arzuların gerçekleştiği söylenen yasak 'Bölge'ye götürür. Tarkovski'nin hipnotik ve felsefi başyapıtı, sabırla izleyene inanç, umut ve insan ruhu üzerine unutulmaz bir yolculuk sunuyor."},{"t":"The Jerk","y":1979,"d":"Carl Reiner","r":94,"g":["Comedy"],"c":[],"s":"Siyahi bir ailenin yanında büyüdüğünü sanan saf Navin Johnson, dünyaya açılır ve tesadüfi bir icatla zengin olur. Steve Martin'in ilk başrolü, absürt ve sevimli mizahıyla bugün hâlâ kahkaha attıran bir komedi klasiği."},{"t":"The Marriage of Maria Braun","y":1979,"d":"Rainer Werner Fassbinder","r":120,"g":["Drama","Romance"],"c":[],"s":"Savaşın son günlerinde evlenen Maria, kocası kayıp düşünülünce yıkılmış Almanya'da ayakta kalmak için zekâsını ve cazibesini kullanır. Hanna Schygulla'nın güçlü oyunuyla Fassbinder'in bu filmi, savaş sonrası 'ekonomik mucizeye' akıllıca bir alegori."},{"t":"The Muppet Movie","y":1979,"d":"James Frawley","r":95,"g":["Adventure","Comedy","Family"],"c":[],"s":"Bataklıkta banjo çalan Kurbağa Kermit, Hollywood'da şöhret peşinde yola çıkar ve yolda Miss Piggy, Fozzie ve diğer dostlarını bulur. Konuk yıldızları, ince esprileri ve 'Rainbow Connection' şarkısıyla her yaşa hitap eden içten bir macera."},{"t":"The Tin Drum","y":1979,"d":"Volker Schlöndorff","r":142,"g":["Drama","War"],"c":[],"s":"Danzig'de üç yaşında büyümeyi reddeden Oskar, teneke davulunu çalarak Nazizmin yükselişini kendi tuhaf bakış açısından izler. Günter Grass romanından uyarlanan, Altın Palmiye ve Oscar kazanan bu cesur film, gerçeküstü ve unutulmaz bir tarih alegorisi."},{"t":"Airplane!","y":1980,"d":"Jerry Zucker","r":88,"g":["Comedy"],"c":["Robert Hays","Julie Hagerty"],"s":"Uçuş korkusu olan eski bir savaş pilotu, yolcuların ve mürettebatın zehirlendiği bir uçağı indirmek zorunda kalır. Saniyede bir espri yağdıran bu parodi, ciddi yüzlü oyunculuğu ve absürt mizahıyla gelmiş geçmiş en komik filmler listesinin değişmez adı."},{"t":"Atlantic City","y":1980,"d":"Louis Malle","r":104,"g":["Crime","Drama","Romance"],"c":[],"s":"Kumarhanelerle yeniden doğan Atlantic City'de yaşlanan küçük bir gangster, istiridye barında çalışan genç bir kadınla beklenmedik bir bağ kurar. Burt Lancaster ile Susan Sarandon'ın başrolde olduğu Louis Malle filmi, kaybolan bir dünyaya zarif ve hüzünlü bir bakış."},{"t":"Loulou","y":1980,"d":"Maurice Pialat","r":101,"g":["Drama","Romance"],"c":[],"s":"Burjuva bir evlilikte sıkılan Nelly, işsiz ve asi Loulou ile tanışınca her şeyi bırakıp tutkulu bir ilişkiye atılır. Isabelle Huppert ve Gérard Depardieu'lü bu Pialat filmi, aşka ve sınıfa dair çiğ ve son derece gerçekçi bir bakış sunuyor."},{"t":"Ordinary People","y":1980,"d":"Robert Redford","r":124,"g":["Drama"],"c":["Timothy Hutton"],"s":"Bir kazada ağabeyini kaybeden genç Conrad ve ailesi, varlıklı banliyö hayatlarının sessizliği içinde yasla başa çıkmaya çalışır. Robert Redford'un yönetmenlik ilk filmi, duyarlı ve incelikli anlatımıyla aile dramlarının en etkileyicilerinden."},{"t":"Raging Bull","y":1980,"d":"Martin Scorsese","r":129,"g":["Biography","Drama","Sport"],"c":["Robert De Niro","Cathy Moriarty"],"s":"Orta sıklet boksör Jake LaMotta'nın ringdeki zaferleri ile ring dışındaki kıskançlık ve öfkesi, hayatını yavaş yavaş yıkıma sürükler. Siyah beyaz görüntüleri ve De Niro'nun kendini adadığı performansıyla Scorsese'nin en güçlü filmlerinden biri."},{"t":"The Big Red One","y":1980,"d":"Samuel Fuller","r":113,"g":["Drama","War"],"c":[],"s":"Bir çavuş ve dört genç piyade, İkinci Dünya Savaşı boyunca Kuzey Afrika'dan Avrupa'ya uzanan cephelerde hayatta kalmaya çalışır. Savaşa bizzat katılmış Samuel Fuller'ın kişisel deneyimlerine dayanan film, gösterişsiz ve dürüst bir savaş anlatısı."},{"t":"The Elephant Man","y":1980,"d":"David Lynch","r":124,"g":["Biography","Drama"],"c":["Anthony Hopkins","John Hurt"],"s":"19. yüzyıl Londra'sında ağır bir deformiteyle yaşayan John Merrick, bir cerrahın yardımıyla ucube gösterilerinden kurtulup insanlığını gösterme fırsatı bulur. David Lynch'in siyah beyaz ve şefkat dolu filmi, izleyeni derinden sarsan bir onur hikâyesi."},{"t":"The Empire Strikes Back","y":1980,"d":"Irvin Kershner","r":null,"g":["Adventure"],"c":[],"s":"İmparatorluğun saldırısıyla dağılan asiler, farklı yollara düşerken Luke, Jedi olmak için gizemli bir ustanın peşine gider. Serinin en karanlık ve en olgun halkası sayılan bu devam filmi, sinema tarihinin en ünlü sürprizlerinden birine ev sahipliği yapıyor."},{"t":"The Last Metro","y":1980,"d":"François Truffaut","r":132,"g":["Drama","Romance","War"],"c":[],"s":"Nazi işgali altındaki Paris'te bir tiyatro oyuncusu, Yahudi kocası bodrumda saklanırken tiyatroyu ayakta tutmaya çalışır. Catherine Deneuve ve Gérard Depardieu'lü bu Truffaut filmi, sanat, aşk ve direniş üzerine zarif bir dönem draması."},{"t":"The Shining","y":1980,"d":"Stanley Kubrick","r":146,"g":["Drama","Horror"],"c":["Jack Nicholson","Shelley Duvall"],"s":"Bir yazar, karısı ve küçük oğluyla birlikte kış boyunca ıssız bir dağ otelinde bekçilik yapmayı kabul eder ve otelin karanlık geçmişi onları sarmaya başlar. Kubrick'in simetrik kareleri ve Jack Nicholson'ın çılgın performansıyla korku sinemasının zirvelerinden."},{"t":"An American Werewolf in London","y":1981,"d":"John Landis","r":97,"g":["Comedy","Horror"],"c":[],"s":"İngiltere'nin kırsalında yürüyüş yapan iki Amerikalı genç, gizemli bir yaratığın saldırısına uğrar ve biri tuhaf değişimler yaşamaya başlar. John Landis'in komedi ile korkuyu kusursuz dengelediği film, Oscar kazanan dönüşüm sahnesiyle efsane."},{"t":"Body Heat","y":1981,"d":"Lawrence Kasdan","r":113,"g":["Crime","Drama","Romance"],"c":[],"s":"Florida'nın boğucu sıcağında vasat bir avukat, zengin bir adamın cazibeli karısına kapılır ve tehlikeli bir plana sürüklenir. Kathleen Turner'ın göz kamaştırıcı ilk rolüyle Lawrence Kasdan'ın filmi, klasik kara filme şık ve ateşli bir selam."},{"t":"Chariots of Fire","y":1981,"d":"Hugh Hudson","r":125,"g":["Biography","Drama","Sport"],"c":[],"s":"1924 Paris Olimpiyatları'na hazırlanan iki İngiliz koşucu, biri inancı, diğeri önyargılara karşı kendini kanıtlama isteğiyle yarışır. Vangelis'in efsanevi müziğiyle bu Oscar'lı film, azim ve onur üzerine ilham veren zarif bir hikâye."},{"t":"Das Boot","y":1981,"d":"Wolfgang Petersen","r":149,"g":["Drama","War"],"c":["Jürgen Prochnow","Herbert Grönemeyer"],"s":"İkinci Dünya Savaşı'nda bir Alman denizaltısının mürettebatı, Atlantik'in derinliklerinde düşman gemileri ve bitmek bilmeyen gerilimle karşı karşıyadır. Klostrofobik atmosferi ve insani bakışıyla, gelmiş geçmiş en gerçekçi ve sürükleyici savaş filmlerinden biri."},{"t":"Diva","y":1981,"d":"Jean-Jacques Beineix","r":117,"g":["Crime","Drama","Music"],"c":[],"s":"Opera tutkunu genç bir postacı, hayran olduğu sopranonun gizli kaydını yaparken kendini polis ve suçluların peşine düştüğü bir entrikanın içinde bulur. Beineix'in şık ve renkli gerilimi, 80'lerin Fransız 'cinéma du look' akımının parlak bir başlangıcı."},{"t":"Gallipoli","y":1981,"d":"Peter Weir","r":110,"g":["Adventure","Drama","History"],"c":[],"s":"Birinci Dünya Savaşı'nda iki genç Avustralyalı koşucu, orduya katılarak kendilerini Çanakkale cephesinde bulur. Mel Gibson'lı bu Peter Weir filmi, dostluğu ve savaşın anlamsızlığını dokunaklı biçimde anlatırken bizim topraklarımıza da farklı bir pencere açıyor."},{"t":"Man of Iron","y":1981,"d":"Andrzej Wajda","r":156,"g":["Drama","History"],"c":[],"s":"Bir gazeteci, Gdańsk tersanelerindeki grevler sırasında bir işçi liderini karalamak üzere görevlendirilir ama gerçeklerle yüzleştikçe fikirleri değişir. Wajda'nın Dayanışma hareketinin tam ortasında çektiği, Altın Palmiye kazanmış tarihî ve cesur bir film."},{"t":"Raiders of the Lost Ark","y":1981,"d":"Steven Spielberg","r":115,"g":["Adventure"],"c":["Harrison Ford","Karen Allen"],"s":"Arkeolog ve maceraperest Indiana Jones, efsanevi Ahit Sandığı'nı Nazilerden önce bulmak için dünyayı dolaşan bir yarışa girer. Spielberg ile Lucas'ın eski macera dizilerine saygı duruşu, Harrison Ford'un karizmasıyla tüm zamanların en eğlenceli filmlerinden."},{"t":"Reds","y":1981,"d":"Warren Beatty","r":195,"g":["Biography","Drama","History"],"c":["Maureen Stapleton"],"s":"Amerikalı gazeteci John Reed, yazar Louise Bryant ile tutkulu bir ilişki yaşarken kendini Rus Devrimi'nin tam ortasında bulur. Warren Beatty'nin destansı yapımı, gerçek tanıklarla yapılan röportajları ve romantik gücüyle eşsiz bir tarihi dram."},{"t":"The Evil Dead","y":1981,"d":"Sam Raimi","r":85,"g":["Horror"],"c":[],"s":"Beş genç, ormandaki ıssız bir kulübede bulduğu eski bir kitap ve kayıt yüzünden karanlık güçleri uyandırır. Sam Raimi'nin çılgın kamera hareketleri ve kendine özgü mizahıyla, düşük bütçeli korkunun ne kadar yaratıcı olabileceğini kanıtlayan kült bir klasik."},{"t":"Three Brothers","y":1981,"d":"Francesco Rosi","r":113,"g":["Drama"],"c":[],"s":"Güney İtalya'da annelerinin ölümüyle baba evinde bir araya gelen üç kardeş, farklı hayatları ve ülkenin sorunları üzerine düşünür. Francesco Rosi'nin sıcak ve düşündürücü filmi, aile, hafıza ve siyaset üzerine zarif bir meditasyon."},{"t":"Too Early/Too Late","y":1981,"d":"Jean-Marie Straub","r":null,"g":["Documentary"],"c":[],"s":"Mısır ve Fransa'nın kırsal manzaraları, Engels ve Mısırlı yazarlardan okunan metinlerle birleşerek köylü mücadelelerinin tarihini düşündürür. Straub ve Huillet'nin sade, meditatif belgeseli, izleyiciyi sabırla bakmaya ve tarihin toprakta bıraktığı izi hissetmeye davet ediyor."},{"t":"A Question of Silence","y":1982,"d":"Marleen Gorris","r":92,"g":["Drama"],"c":[],"s":"Birbirini tanımayan üç kadın, bir butikte aniden bir erkek tezgâhtara saldırır ve bir psikiyatr nedenini anlamaya çalışır. Marleen Gorris'in kışkırtıcı ve düşündürücü filmi, erkek egemen dünyaya yöneltilmiş keskin bir feminist sorgulama."},{"t":"Blade Runner","y":1982,"d":"Ridley Scott","r":117,"g":["Action","Drama","Sci-Fi"],"c":["Harrison Ford","Rutger Hauer"],"s":"2019'un yağmurlu Los Angeles'ında bir dedektif, Dünya'ya kaçan insana benzer androidleri bulmakla görevlendirilir. Ridley Scott'ın neon ışıklı, melankolik dünyası ve Vangelis'in müziğiyle bilimkurgu sinemasının en etkili ve en güzel filmlerinden biri."},{"t":"Diner","y":1982,"d":"Barry Levinson","r":110,"g":["Comedy","Drama"],"c":[],"s":"1959 Baltimore'unda bir grup yakın arkadaş, düğün öncesinde sabahlara kadar bir lokantada sohbet ederek yetişkinliğin eşiğinde kararsızlıklarını paylaşır. Barry Levinson'ın doğal diyalogları ve genç yıldız kadrosuyla nostaljik ve samimi bir film."},{"t":"E.T. the Extra-Terrestrial","y":1982,"d":"Steven Spielberg","r":115,"g":["Adventure","Family","Sci-Fi"],"c":["Henry Thomas","Drew Barrymore"],"s":"Dünya'da unutulan sevimli bir uzaylı, yalnız bir çocuk olan Elliott ile dostluk kurar ve Elliott onu evine döndürmenin yolunu arar. Spielberg'in çocukluğun büyüsünü yakalayan bu masalı, her yaştan izleyiciyi hâlâ gözyaşlarına boğan sıcacık bir klasik."},{"t":"Fanny and Alexander","y":1982,"d":"Ingmar Bergman","r":null,"g":["Fantasy"],"c":[],"s":"20. yüzyılın başında İsveç'te tiyatrocu Ekdahl ailesinin iki çocuğu, babalarının ölümünden sonra annelerinin sert bir piskoposla evlenmesiyle bambaşka bir dünyaya adım atar. Bergman'ın büyülü ve sıcak veda filmi, aile, hayal gücü ve tiyatro üzerine zengin bir başyapıt."},{"t":"Fast Times at Ridgemont High","y":1982,"d":"Amy Heckerling","r":90,"g":["Comedy","Drama"],"c":[],"s":"Güney Kaliforniya'da bir grup lise öğrencisi, alışveriş merkezindeki işler, ilk aşklar ve okul arasında bir yılı geçirir. Amy Heckerling'in dürüst ve eğlenceli filmi, Sean Penn'in unutulmaz sörfçü karakteriyle gençlik komedilerinin en sevilenlerinden."},{"t":"Fitzcarraldo","y":1982,"d":"Werner Herzog","r":158,"g":["Adventure","Drama","Music"],"c":[],"s":"Amazon'da bir opera binası kurmayı hayal eden tutkulu bir adam, bunu finanse etmek için koca bir buharlı gemiyi bir dağın üzerinden aşırmaya kalkışır. Herzog'un gerçekten yapılmış bu çılgın girişimi, Klaus Kinski'nin ateşli oyunuyla hayallere adanmış bir destan."},{"t":"Gandhi","y":1982,"d":"Richard Attenborough","r":191,"g":["Biography","Drama","History"],"c":["Ben Kingsley"],"s":"Güney Afrika'da genç bir avukat olarak uğradığı haksızlıktan, Hindistan'ın bağımsızlık mücadelesine kadar Mahatma Gandi'nin hayatı anlatılır. Ben Kingsley'nin olağanüstü performansıyla, şiddetsizliğin gücünü anlatan görkemli ve ilham veren bir biyografi."},{"t":"Koyaanisqatsi","y":1982,"d":"Godfrey Reggio","r":86,"g":["Documentary","Music"],"c":[],"s":"Diyalog ya da anlatıcı olmadan, doğanın ve modern şehir hayatının görüntüleri hızlandırılmış ve ağır çekim karelerle yan yana gelir. Philip Glass'ın hipnotik müziğiyle bu deneysel belgesel, izleyiciyi insan ile çevresi üzerine derin bir düşünceye çağırıyor."},{"t":"Poltergeist","y":1982,"d":"Tobe Hooper","r":114,"g":["Horror","Thriller"],"c":[],"s":"Banliyödeki yeni evlerinde görünmez varlıkların televizyon aracılığıyla küçük kızlarını alıp götürdüğü bir aile, onu geri getirmek için mücadele eder. Spielberg'in yapımcılığındaki bu film, aile sıcaklığı ile ürpertici korkuyu eğlenceli biçimde harmanlıyor."},{"t":"The Draughtsman's Contract","y":1982,"d":"Peter Greenaway","r":108,"g":["Comedy","Drama","Mystery"],"c":[],"s":"1694 İngiltere'sinde genç bir ressam, bir malikânenin çizimlerini yapmak için soylu bir kadınla ilginç bir anlaşma yapar ve bir entrikanın içine çekilir. Peter Greenaway'in esprili, zekâ dolu ve görsel olarak kusursuz dönem gizemi, Michael Nyman'ın müziğiyle parlıyor."},{"t":"The King of Comedy","y":1982,"d":"Martin Scorsese","r":109,"g":["Comedy","Crime","Drama"],"c":[],"s":"Ünlü olmak için yanıp tutuşan beceriksiz bir komedyen adayı, hayran olduğu televizyon sunucusuna ulaşmak için her yolu dener. De Niro ile Jerry Lewis'in buluştuğu bu Scorsese filmi, şöhret takıntısı üzerine rahatsız edici derecede komik ve kehanet dolu bir hiciv."},{"t":"The Night of the Shooting Star","y":1982,"d":"Paolo Taviani","r":null,"g":["War"],"c":[],"s":"1944 yazında Toskana'da bir köyün halkı, Alman askerlerinden kaçarak Amerikalıların geldiği söylenen yere doğru yola çıkar. Bir çocuğun anılarından anlatılan Taviani kardeşlerin filmi, savaşı büyülü, şiirsel ve derinden insani bir bakışla işliyor."},{"t":"The Thing","y":1982,"d":"John Carpenter","r":109,"g":["Horror","Mystery","Sci-Fi"],"c":["Kurt Russell","Wilford Brimley"],"s":"Antarktika'daki bir araştırma istasyonunda ekip, istediği canlının kılığına girebilen bir yaratıkla karşılaşır ve kimseye güvenemez hâle gelir. John Carpenter'ın paranoya dolu korku başyapıtı, pratik efektleri ve buz gibi gerilimiyle bugün hâlâ çığır açıcı."},{"t":"Tootsie","y":1982,"d":"Sydney Pollack","r":116,"g":["Comedy","Drama","Romance"],"c":["Jessica Lange"],"s":"Zor bir karaktere sahip olduğu için iş bulamayan bir oyuncu, kadın kılığına girerek bir pembe dizide rol kapar ve büyük bir başarıya ulaşır. Dustin Hoffman'ın parlak performansıyla bu komedi, cinsiyet rolleri üzerine hem kahkahalı hem düşündürücü."},{"t":"Yol","y":1982,"d":"Yılmaz Güney","r":107,"g":["Drama"],"c":[],"s":"Beş mahkûm, bir haftalık izinle cezaevinden çıkar ve her biri Türkiye'nin farklı köşelerinde ailesiyle, geçmişiyle ve darbe sonrası toplumun baskısıyla yüzleşir. Yılmaz Güney'in cezaevinden yönettiği, Altın Palmiye kazanan bu film, Türk sinemasının en güçlü ve yürek burkan eserlerinden."},{"t":"A Christmas Story","y":1983,"d":"Bob Clark","r":93,"g":["Comedy","Family"],"c":[],"s":"1940'larda Indiana'da küçük Ralphie, Noel için tek bir hediye ister, ama herkes ona bir oyuncak tüfeğin tehlikeli olduğunu söyler. Nostaljik anlatımı ve sevimli aile kaosuyla bu film, pek çok evde Noel'in vazgeçilmez geleneğine dönüşmüş bir klasik."},{"t":"El Norte","y":1983,"d":"Gregory Nava","r":141,"g":["Adventure","Drama"],"c":[],"s":"Guatemala'da ailelerini kaybeden iki kardeş, daha iyi bir hayat umuduyla Meksika üzerinden Amerika'ya zorlu bir yolculuğa çıkar. Gregory Nava'nın hem epik hem de insani filmi, göç hikâyesini şiirsel ve etkileyici bir dille anlatıyor."},{"t":"L'argent","y":1983,"d":"Robert Bresson","r":85,"g":["Crime","Drama"],"c":[],"s":"Sahte bir banknot, el değiştirdikçe masum bir işçinin hayatını yıkıma sürükleyen bir kötülük zinciri başlatır. Robert Bresson'ın son filmi, sade ve kesin üslubuyla ahlak ve para üzerine yapılmış en güçlü sinema meditasyonlarından."},{"t":"Local Hero","y":1983,"d":"Bill Forsyth","r":111,"g":["Comedy","Drama"],"c":[],"s":"Amerikalı bir petrol şirketi çalışanı, rafineri kurmak için bir İskoç sahil köyünü satın almaya gönderilir ve köyün büyüsüne kapılır. Bill Forsyth'in nazik mizahı ve Mark Knopfler'ın müziğiyle bu film, içi ısıtan ve huzur veren bir keşif."},{"t":"Return of the Jedi","y":1983,"d":"Richard Marquand","r":null,"g":["Adventure"],"c":[],"s":"Luke Skywalker, dostlarını kurtardıktan sonra İmparatorluğun yeni ölüm yıldızına karşı son büyük savaşa hazırlanırken babasıyla yüzleşmek zorundadır. Orijinal Yıldız Savaşları üçlemesini duygusal ve görkemli bir finalle tamamlayan eğlenceli bir macera."},{"t":"Sans Soleil","y":1983,"d":"Chris Marker","r":100,"g":["Documentary","Drama"],"c":[],"s":"Hayali bir kameramanın mektupları eşliğinde Japonya, Gine-Bissau ve İzlanda görüntüleri, hafıza ve zaman üzerine bir yolculuğa dönüşür. Chris Marker'ın film deneme türünün başyapıtı sayılan bu eseri, her izleyişte yeni anlamlar sunan büyüleyici bir düşünce akışı."},{"t":"Scarface","y":1983,"d":"Brian De Palma","r":170,"g":["Crime","Drama"],"c":["Al Pacino","Michelle Pfeiffer"],"s":"Küba'dan Miami'ye gelen iddialı bir göçmen olan Tony Montana, kokain ticaretinde acımasızca yükselerek bir suç imparatorluğu kurar. Al Pacino'nun gözü kara performansıyla De Palma'nın aşırı ve stilize filmi, popüler kültürün en ikonik suç hikâyelerinden."},{"t":"Terms of Endearment","y":1983,"d":"James L. Brooks","r":132,"g":["Comedy","Drama"],"c":["Jack Nicholson","Shirley MacLaine"],"s":"Güçlü karakterli bir anne ile özgür ruhlu kızının otuz yılı aşan inişli çıkışlı ilişkisi, kahkaha ve gözyaşları arasında anlatılır. Shirley MacLaine, Debra Winger ve Jack Nicholson'lı bu Oscar'lı film, aile bağlarına sıcacık bir bakış."},{"t":"The Ballad of Narayama","y":1983,"d":"Shōhei Imamura","r":130,"g":["Drama","Family","Mystery"],"c":[],"s":"Bir dağ köyünde, gelenek gereği yetmiş yaşına gelen yaşlılar dağa bırakılır ve yaşlı Orin bu yolculuğa hazırlanırken ailesinin işlerini yoluna koymaya çalışır. Shōhei Imamura'nın Altın Palmiye kazanan filmi, doğa ve insan üzerine çiğ ama şefkatli bir bakış."},{"t":"The Big Chill","y":1983,"d":"Lawrence Kasdan","r":105,"g":["Comedy","Drama"],"c":[],"s":"Üniversite yıllarından eski bir arkadaşlarının cenazesi için bir araya gelen bir grup dost, bir hafta sonu boyunca kaybolan idealleri ve dostluklarını sorgular. Muhteşem Motown şarkılarıyla bu Kasdan filmi, kuşak dramalarının sıcak ve nostaljik klasiği."},{"t":"The Fourth Man","y":1983,"d":"Paul Verhoeven","r":107,"g":["Action","Adventure","Mystery"],"c":[],"s":"Alkolik ve hayal gücü geniş bir yazar, bir sahil kasabasında tanıştığı gizemli bir kadının geçmişindeki ölümlerden şüphelenmeye başlar. Verhoeven'in erotik, gerilim dolu ve sembollerle örülü filmi, Hollanda döneminin en kışkırtıcı eserlerinden."},{"t":"The Last Battle","y":1983,"d":"Luc Besson","r":92,"g":["Sci-Fi"],"c":[],"s":"Gizemli bir felaket sonrası insanların konuşamadığı harabe bir dünyada, bir adam hayatta kalmak ve bir sığınak bulmak için yolculuk eder. Luc Besson'ın siyah beyaz ve diyalogsuz ilk filmi, genç Jean Reno'yla dikkat çeken yaratıcı bir kıyamet sonrası deneyimi."},{"t":"The Right Stuff","y":1983,"d":"Philip Kaufman","r":193,"g":["Adventure","Biography","Drama"],"c":[],"s":"Ses hızının aşılmasından Mercury programına uzanan yıllarda, Amerika'nın ilk astronotlarının cesur ve bazen komik hikâyesi anlatılır. Philip Kaufman'ın geniş ölçekli, esprili filmi, havacılık tutkusu ve kahramanlığın gerçek yüzü üzerine keyifli bir destan."},{"t":"Videodrome","y":1983,"d":"David Cronenberg","r":87,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Kablolu yayın yapan bir televizyon kanalının patronu, gizemli ve şiddet içerikli bir yayın keşfeder ve gerçeklik algısı çözülmeye başlar. David Cronenberg'in beden korkusu ve medya üzerine vizyoner filmi, dijital çağı önceden gören tuhaf bir kehanet."},{"t":"A Nightmare on Elm Street","y":1984,"d":"Wes Craven","r":91,"g":["Horror"],"c":["Heather Langenkamp","Johnny Depp"],"s":"Elm Sokağı'ndaki gençler, rüyalarında onları avlayan yanık yüzlü bir adam tarafından tehdit edilir ve uyanık kalmaya çalışır. Wes Craven'ın yaratıcı kurgusu ve Freddy Krueger karakteriyle korku sinemasına yeni bir kâbus kazandıran kült bir klasik."},{"t":"A Passage to India","y":1984,"d":"David Lean","r":164,"g":["Adventure","Drama","History"],"c":["Peggy Ashcroft"],"s":"İngiliz sömürge Hindistan'ında genç bir İngiliz kadın ve yaşlı bir hanım, Hintli bir doktorun rehberliğinde gezdikleri gizemli mağaralarda yaşananlar sonrası büyük bir krizin içinde kalır. David Lean'in son filmi, görkemli görüntüleri ve kültürlerarası gerilimiyle etkileyici."},{"t":"Amadeus","y":1984,"d":"Miloš Forman","r":160,"g":["Biography","Drama","Music"],"c":["F. Murray Abraham","Tom Hulce"],"s":"Viyana sarayının kıdemli bestecisi Salieri, dâhi ama kaba genç Mozart'ın yeteneği karşısında kıskançlıkla dolu bir takıntıya kapılır. Muhteşem müzikleri, kostümleri ve F. Murray Abraham'ın performansıyla, sekiz Oscar'lı bu film tam bir şölen."},{"t":"Beverly Hills Cop","y":1984,"d":"Martin Brest","r":105,"g":["Action","Comedy","Crime"],"c":[],"s":"Detroitli pervasız polis Axel Foley, arkadaşının cinayetini çözmek için Beverly Hills'in şık ve kuralcı dünyasına gelir. Eddie Murphy'nin enerjik ve komik performansıyla bu film, aksiyon komedisinin en keyifli örneklerinden."},{"t":"Ghostbusters","y":1984,"d":"Ivan Reitman","r":105,"g":["Action","Comedy","Fantasy"],"c":["Bill Murray","Dan Aykroyd"],"s":"Üniversiteden kovulan üç parapsikolog, New York'ta hayalet avcılığı işine girer ve şehri bekleyen doğaüstü bir tehditle karşılaşır. Bill Murray'nin kuru mizahı ve unutulmaz tema şarkısıyla her yaştan izleyiciye hitap eden bir komedi klasiği."},{"t":"Once Upon a Time in America","y":1984,"d":"Sergio Leone","r":229,"g":["Crime","Drama"],"c":["Robert De Niro","James Woods"],"s":"New York'un Yahudi mahallesinde büyüyen bir grup çocuğun gangsterliğe uzanan hikâyesi, onlarca yılı kapsayan anılar arasında anlatılır. Sergio Leone'nin son filmi, Ennio Morricone'nin müziği ve melankolik gücüyle hafıza üzerine görkemli bir başyapıt."},{"t":"Paris, Texas","y":1984,"d":"Wim Wenders","r":145,"g":["Drama"],"c":[],"s":"Dört yıl boyunca kayıp olan bir adam, Teksas çölünde ortaya çıkar ve küçük oğluyla birlikte kaybettiği karısını aramaya koyulur. Wim Wenders'in Ry Cooder'ın gitarıyla süslenen bu hüzünlü yol filmi, Amerikan manzaralarını ve kırgın kalpleri unutulmaz biçimde anlatıyor."},{"t":"Stranger Than Paradise","y":1984,"d":"Jim Jarmusch","r":89,"g":["Comedy","Drama"],"c":[],"s":"New York'ta yaşayan kayıtsız bir genç, Macaristan'dan gelen kuzeni ve bir arkadaşıyla Cleveland'dan Florida'ya uzanan amaçsız bir yolculuğa çıkar. Jim Jarmusch'un minimalist, siyah beyaz ve kuru mizahlı filmi, Amerikan bağımsız sinemasının dönüm noktalarından."},{"t":"The Killing Fields","y":1984,"d":"Roland Joffé","r":141,"g":["Biography","Drama","History"],"c":["Haing S. Ngor"],"s":"Kamboçya'da savaşı izleyen bir Amerikalı gazeteci ile Kamboçyalı tercümanının dostluğu, Kızıl Kmerlerin iktidarı almasıyla ağır bir sınava girer. Gerçek bir hikâyeye dayanan bu film, hem sarsıcı bir tarih tanıklığı hem de derin bir dostluk anlatısı."},{"t":"The Natural","y":1984,"d":"Barry Levinson","r":138,"g":["Drama","Sport"],"c":[],"s":"Gençliğinde parlak bir kariyerin eşiğindeyken gizemli bir olayla yolu kesilen beyzbolcu Roy Hobbs, yıllar sonra kendine ikinci bir şans yaratır. Robert Redford'lu bu film, altın ışıklı görüntüleri ve masalsı tonuyla spor filmlerinin en romantiklerinden."},{"t":"The Terminator","y":1984,"d":"James Cameron","r":107,"g":["Action","Adventure","Sci-Fi"],"c":["Arnold Schwarzenegger","Linda Hamilton"],"s":"Gelecekten gönderilen durdurulamaz bir robot suikastçı, Los Angeles'ta genç bir garson kadını öldürmek ister, ama zamanda geri gelen bir asker onu korumaya çalışır. James Cameron'ın gergin ve zekice kurgulanmış bilimkurgusu, Schwarzenegger'i bir ikona dönüştürdü."},{"t":"This Is Spinal Tap","y":1984,"d":"Rob Reiner","r":82,"g":["Comedy","Music"],"c":[],"s":"Bir belgesel yapımcısı, kariyeri düşüşte olan ve kendini fazla ciddiye alan İngiliz heavy metal grubu Spinal Tap'i Amerika turnesinde takip eder. Doğaçlama havası ve unutulmaz sahneleriyle 'mockumentary' türünü tanımlayan tartışmasız bir komedi klasiği."},{"t":"Utu","y":1984,"d":"Geoff Murphy","r":104,"g":["Adventure","Drama","History"],"c":[],"s":"1860'ların Yeni Zelanda'sında İngilizlere hizmet eden bir Maori savaşçı, köyüne yapılan saldırıdan sonra intikam için silaha sarılır. Geoff Murphy'nin western tadındaki enerjik filmi, sömürgecilik ve adalet üzerine hem heyecan verici hem düşündürücü."},{"t":"A Room With a View","y":1985,"d":"James Ivory","r":117,"g":["Drama","Romance"],"c":[],"s":"Genç bir İngiliz kadın, Floransa gezisinde tanıştığı özgür ruhlu bir gençle yaşadığı karşılaşmadan sonra, evde kendisini bekleyen katı hayat ile kalbi arasında seçim yapmak zorunda kalır. Merchant Ivory'nin zarif E. M. Forster uyarlaması, İtalya'nın ışığında büyüleyici bir romantizm sunuyor."},{"t":"Back to the Future","y":1985,"d":"Robert Zemeckis","r":116,"g":["Adventure","Comedy","Sci-Fi"],"c":["Michael J. Fox","Christopher Lloyd"],"s":"Genç Marty McFly, çılgın bilim insanı dostunun yaptığı zaman makinesiyle yanlışlıkla 1955'e gider ve annesiyle babasının tanışmasını tehlikeye atar. Zekice senaryosu ve bitmeyen enerjisiyle, tüm ailenin keyifle izleyebileceği en mükemmel popüler filmlerden biri."},{"t":"Brazil","y":1985,"d":"Terry Gilliam","r":132,"g":["Drama","Sci-Fi","Thriller"],"c":[],"s":"Distopik ve bürokratik bir gelecekte sıradan bir memur, bir yazım hatasıyla başlayan olaylar zincirinde düşlerindeki kadının peşine düşer. Terry Gilliam'ın kara mizah dolu, görsel olarak taşkın filmi, Orwell'e çılgın ve eşsiz bir yanıt."},{"t":"Come and See","y":1985,"d":"Elem Klimov","r":142,"g":["Drama","Thriller","War"],"c":[],"s":"İkinci Dünya Savaşı'nda Belarus'ta partizanlara katılan genç bir çocuk, Nazi işgalinin dehşetine birinci elden tanık olur. Elem Klimov'un sarsıcı başyapıtı, izlemesi ağır ama savaşın gerçek yüzünü gösteren sinemanın en güçlü savaş karşıtı filmlerinden."},{"t":"Kiss of the Spider Woman","y":1985,"d":"Héctor Babenco","r":120,"g":["Drama"],"c":["William Hurt"],"s":"Latin Amerika'da bir hapishane hücresini paylaşan siyasi bir tutuklu ile romantik bir eşcinsel, eski filmlerin anlatıldığı gecelerde beklenmedik bir bağ kurar. William Hurt'ün Oscar kazanan performansıyla, hayal gücü ve dayanışmanın dokunaklı bir hikâyesi."},{"t":"Mishima: A Life in Four Chapters","y":1985,"d":"Paul Schrader","r":120,"g":["Biography","Drama"],"c":[],"s":"Japon yazar Yukio Mişima'nın hayatı, romanlarından stilize sahneler ve son gününün anlatımıyla dört bölümde iç içe geçer. Paul Schrader'ın Philip Glass müzikleriyle süslenen görsel olarak nefes kesici filmi, sanat ve takıntı üzerine cesur bir portre."},{"t":"Out of Africa","y":1985,"d":"Sydney Pollack","r":161,"g":["Biography","Drama","Romance"],"c":[],"s":"Danimarkalı Karen Blixen, Kenya'da bir kahve çiftliği kurar ve özgür ruhlu bir avcıyla derin bir aşk yaşar. Meryl Streep ve Robert Redford'lu bu Oscar'lı film, Afrika manzaraları ve John Barry'nin müziğiyle görkemli bir romantik destan."},{"t":"Prizzi's Honor","y":1985,"d":"John Huston","r":130,"g":["Comedy","Crime","Drama"],"c":["Anjelica Huston"],"s":"Mafya ailesinin tetikçisi Charley, bir düğünde tanıştığı gizemli kadına âşık olur, ama kadının da aynı meslekte olduğu ortaya çıkar. Jack Nicholson ve Kathleen Turner'lı bu John Huston filmi, kara komedinin en şık ve zekice örneklerinden."},{"t":"Ran","y":1985,"d":"Akira Kurosawa","r":160,"g":["Action","Drama","War"],"c":[],"s":"Yaşlı bir derebeyi, topraklarını üç oğlu arasında paylaştırmaya karar verir ve bu karar ailesini kanlı bir iktidar savaşına sürükler. Kurosawa'nın Kral Lear'i feodal Japonya'ya taşıyan renkli ve görkemli başyapıtı, sinemanın en büyük destanlarından."},{"t":"Sherman's March","y":1985,"d":"Ross McElwee","r":157,"g":["Biography","Comedy","Documentary"],"c":[],"s":"Bir belgeselci, General Sherman'ın İç Savaş'taki yürüyüşünü filme almak üzere Güney'e gider ama kendini aşk hayatını ve kadınlarla ilişkilerini belgelerken bulur. Ross McElwee'nin esprili ve kişisel belgeseli, benzersiz ve şaşırtıcı derecede sevimli bir yolculuk."},{"t":"Shoah","y":1985,"d":"Claude Lanzmann","r":566,"g":["Documentary","History","War"],"c":[],"s":"Holokost'u arşiv görüntüsü kullanmadan, yalnızca hayatta kalanların, tanıkların ve failin tanıklıklarıyla ve bugünün sessiz mekânlarıyla anlatan dokuz saatlik bir belgesel. Claude Lanzmann'ın anıtsal eseri, hafızanın gücüne adanmış, hayatta en az bir kez izlenmesi gereken bir tanıklık."},{"t":"Tampopo","y":1985,"d":"Jūzō Itami","r":114,"g":["Comedy"],"c":[],"s":"Bir kamyon şoförü, yol kenarında küçük bir erişte dükkânı işleten dul Tampopo'ya mükemmel ramen yapmayı öğretmek için kolları sıvar. Jūzō Itami'nin yemek tutkusunu anlatan esprili ve bol lezzetli 'ramen westerni', karnınızı ve kalbinizi aynı anda doyuruyor."},{"t":"The Breakfast Club","y":1985,"d":"John Hughes","r":97,"g":["Comedy","Drama"],"c":["Emilio Estevez","Judd Nelson"],"s":"Birbirinden çok farklı beş lise öğrencisi, bir cumartesi günü okulda ceza için bir araya gelir ve beklenmedik biçimde birbirlerini tanımaya başlar. John Hughes'un gençliği ciddiye alan içten filmi, kuşaklar boyu sevilen bir 80'ler klasiği."},{"t":"The Color Purple","y":1985,"d":"Steven Spielberg","r":154,"g":["Drama"],"c":[],"s":"20. yüzyılın başlarında Amerikan Güneyi'nde zorlu bir hayat süren Celie, yıllar boyunca kız kardeşine olan özlemi ve kendi sesini bulma mücadelesiyle ayakta kalır. Whoopi Goldberg ve Oprah Winfrey'li bu Spielberg filmi, dayanıklılık ve umudun duygusal bir destanı."},{"t":"The Official Story","y":1985,"d":"Luis Puenzo","r":112,"g":["Drama","History"],"c":[],"s":"Buenos Aires'te bir tarih öğretmeni, evlat edindiği kızının askerî diktatörlük döneminde kaybolan insanlarla bağlantılı olabileceğinden şüphelenmeye başlar. Oscar kazanan bu Arjantin filmi, bir ülkenin yüzleşmesini kişisel bir hikâye üzerinden güçlü biçimde anlatıyor."},{"t":"The Purple Rose of Cairo","y":1985,"d":"Woody Allen","r":82,"g":["Comedy","Fantasy","Romance"],"c":[],"s":"Büyük Buhran yıllarında mutsuz bir garson kadın, sığındığı sinema salonunda sevdiği filmin kahramanının beyaz perdeden inip ona âşık olmasıyla şaşkına döner. Woody Allen'ın sinemaya yazılmış en tatlı aşk mektubu, Mia Farrow'un zarafetiyle büyüleyici."},{"t":"The Quiet Earth","y":1985,"d":"Geoff Murphy","r":91,"g":["Drama","Mystery","Sci-Fi"],"c":[],"s":"Gizli bir bilimsel deneyin ardından bir bilim insanı, uyandığında dünyada hayatta kalan tek kişi olduğunu düşünür. Geoff Murphy'nin Yeni Zelanda yapımı gizemli bilimkurgusu, yalnızlık ve sorumluluk üzerine düşündüren sürükleyici bir kült film."},{"t":"The Time to Live and the Time to Die","y":1985,"d":"Hou Hsiao-hsien","r":null,"g":["Drama"],"c":[],"s":"1940'ların sonunda anakaradan Tayvan'a göç eden bir ailede büyüyen bir çocuğun gençlik yılları, kayıplar ve değişimlerle örülür. Hou Hsiao-hsien'in yarı otobiyografik, sakin ve derinden hüzünlü filmi, hafıza ve aidiyet üzerine şiirsel bir başyapıt."},{"t":"Vagabond","y":1985,"d":"Agnès Varda","r":105,"g":["Drama"],"c":[],"s":"Güney Fransa'da kışın donarak ölü bulunan genç bir kadının son haftaları, yolda karşılaştığı insanların tanıklıklarıyla geriye doğru anlatılır. Agnès Varda'nın sert ve dürüst filmi, özgürlüğün bedelini ve toplumun kayıtsızlığını unutulmaz biçimde gösteriyor."},{"t":"Aliens","y":1986,"d":"James Cameron","r":137,"g":["Action","Adventure","Horror"],"c":["Sigourney Weaver","Michael Biehn"],"s":"Tek hayatta kalan Ripley, onlarca yıl sonra uyandırılır ve kolonistlerin iletişiminin kesildiği gezegene bir grup deniz piyadesiyle geri döner. James Cameron, korku klasiğini nefes kesen bir aksiyon filmine çevirerek türün en iyi devam filmlerinden birini yarattı."},{"t":"Blue Velvet","y":1986,"d":"David Lynch","r":120,"g":["Crime","Drama","Mystery"],"c":[],"s":"Memleketine dönen genç bir üniversite öğrencisi, çayırda bulduğu kesik bir kulak yüzünden sakin kasabanın altındaki karanlık bir dünyaya adım atar. David Lynch'in rüya ile kâbus arasında gidip gelen filmi, Dennis Hopper'ın ürkütücü performansıyla kült bir başyapıt."},{"t":"Caravaggio","y":1986,"d":"Derek Jarman","r":93,"g":["Biography","Drama","History"],"c":[],"s":"Ünlü Barok ressam Caravaggio'nun tutkulu ve çalkantılı hayatı, ölüm döşeğindeki anılar aracılığıyla anlatılır. Derek Jarman'ın resimlerini canlandırırcasına çekilen bu şiirsel film, sanat ve arzu üzerine görsel olarak eşsiz bir deneme."},{"t":"Children of a Lesser God","y":1986,"d":"Randa Haines","r":119,"g":["Drama","Romance"],"c":["Marlee Matlin"],"s":"Sağırlar okulunda çalışmaya başlayan idealist bir öğretmen, okulun temizlik görevlisi olan zeki ve inatçı bir kadınla tutkulu bir ilişkiye başlar. Marlee Matlin'in Oscar'lı performansıyla bu romantik dram, iletişim ve saygı üzerine dokunaklı bir hikâye."},{"t":"Down by Law","y":1986,"d":"Jim Jarmusch","r":107,"g":["Comedy","Crime","Drama"],"c":[],"s":"Hiç ortak yanları olmayan iki zavallı adam ve neşeli bir İtalyan turist, New Orleans'ta aynı hücreye düşer. Jim Jarmusch'un siyah beyaz çekilen, Tom Waits ve Roberto Benigni'nin parladığı bu esprili film, dostluğun tuhaf ve şiirsel bir portresi."},{"t":"Ferris Bueller's Day Off","y":1986,"d":"John Hughes","r":103,"g":["Comedy"],"c":["Matthew Broderick","Alan Ruck"],"s":"Karizmatik lise öğrencisi Ferris, hasta taklidi yapıp en iyi arkadaşı ve kız arkadaşıyla birlikte Chicago'da unutulmaz bir gün geçirir. John Hughes'un neşeli ve dördüncü duvarı yıkan komedisi, hayatın tadını çıkarmaya çağıran ölümsüz bir klasik."},{"t":"Hannah and Her Sisters","y":1986,"d":"Woody Allen","r":107,"g":["Comedy","Drama"],"c":["Michael Caine","Dianne Wiest"],"s":"Üç kız kardeşin ve çevrelerindeki insanların aşk, sadakatsizlik ve aile ilişkileri, iki Şükran Günü arasında geçen bir yılda iç içe geçer. Woody Allen'ın en olgun ve en sıcak filmlerinden biri, New York'un şefkatli bir portresini çiziyor."},{"t":"Henry: Portrait of a Serial Killer","y":1986,"d":"John McNaughton","r":83,"g":["Biography","Crime","Drama"],"c":[],"s":"Chicago'da sıradan bir hayat süren Henry, oda arkadaşını da peşine takarak şiddet dolu bir yola sürüklenir. John McNaughton'ın belgesel gerçekliğindeki bu soğuk ve rahatsız edici filmi, korku sinemasının en sarsıcı karakter çalışmalarından, sadece sert filmlere hazır olanlar için."},{"t":"Manhunter","y":1986,"d":"Michael Mann","r":120,"g":["Crime","Mystery","Thriller"],"c":[],"s":"Emekli bir FBI ajanı, seri katilleri anlamadaki olağanüstü yeteneği yüzünden yeniden bir davaya çağrılır ve tutuklu Dr. Lecter'dan yardım ister. Michael Mann'in neon renkli, şık gerilimi, Hannibal Lecter'ı beyaz perdeye taşıyan ilk film olarak ayrı bir önem taşıyor."},{"t":"Peking Opera Blues","y":1986,"d":"Tsui Hark","r":104,"g":["Action","Comedy","History"],"c":[],"s":"1910'ların Çin'inde birbirinden farklı üç kadın, bir opera topluluğunun çevresinde siyasi bir komplo ve maceranın içine çekilir. Tsui Hark'ın komedi, aksiyon ve dramayı çılgınca harmanladığı film, Hong Kong sinemasının en enerjik eserlerinden."},{"t":"Platoon","y":1986,"d":"Oliver Stone","r":120,"g":["Drama","War"],"c":["Charlie Sheen","Tom Berenger"],"s":"Genç bir asker, Vietnam'da bir müfrezeye katılır ve iki komutan arasındaki ahlaki çatışmanın ortasında kalır. Oliver Stone'un kendi deneyimlerinden beslenen sarsıcı filmi, savaşın insan üzerindeki etkisini en gerçekçi biçimde gösteren yapımlardan biri."},{"t":"Salvador","y":1986,"d":"Oliver Stone","r":122,"g":["Drama","History","Thriller"],"c":[],"s":"Parası tükenmiş Amerikalı bir foto muhabiri, iç savaşın pençesindeki El Salvador'a gider ve orada şiddet ve siyasi baskının tanığı olur. James Woods'un enerjik performansıyla Oliver Stone'un öfkeli ve cesur filmi, gazetecilik ve vicdan üzerine etkileyici bir dram."},{"t":"She's Gotta Have It","y":1986,"d":"Spike Lee","r":84,"g":["Comedy","Romance"],"c":[],"s":"Brooklyn'de yaşayan özgür ruhlu genç sanatçı Nola Darling, üç farklı erkekle aynı anda ilişki sürdürür ve hiçbirine ait olmayı kabul etmez. Spike Lee'nin taze, esprili ve cesur bakışıyla bağımsızlık ve kadın özgürlüğü üzerine çekilmiş kült bir hikâye."},{"t":"Stand by Me","y":1986,"d":"Rob Reiner","r":89,"g":["Adventure","Drama"],"c":["Wil Wheaton","River Phoenix"],"s":"1959 yazında dört küçük kasaba çocuğu, ormanda kaybolan bir çocuğun cesedini bulmak için demiryolu boyunca yürüyüşe çıkar. Stephen King'in öyküsünden uyarlanan bu film, çocukluk dostluğunun ve büyümenin tatlı acı hüznünü nostaljiyle harmanlayan unutulmaz bir klasik."},{"t":"The Decline of the American Empire","y":1986,"d":"Denys Arcand","r":101,"g":["Comedy","Drama"],"c":[],"s":"Montreal'de bir grup üniversite hocası, kırsaldaki bir evde akşam yemeği hazırlarken seks, aşk ve sadakat üzerine açık yürekli sohbetlere dalar. Denys Arcand'ın zekâ dolu diyalogları, entelektüel kibri ve orta yaş kaygılarını hem komik hem acı bir aynada gösteriyor."},{"t":"The Fly","y":1986,"d":"David Cronenberg","r":96,"g":["Drama","Horror","Sci-Fi"],"c":[],"s":"Parlak ama yalnız bir bilim insanı, geliştirdiği ışınlanma makinesini kendi üzerinde denediğinde bedeni yavaş yavaş tanınmaz bir şeye dönüşmeye başlar. Cronenberg'in beden korkusunu dokunaklı bir aşk hikâyesiyle birleştirdiği film, türün en insani ve etkileyici örneklerinden biri."},{"t":"The Horse Thief","y":1986,"d":"Tian Zhuangzhuang","r":88,"g":["Drama"],"c":[],"s":"Tibet yaylalarında at hırsızlığıyla geçinen bir adam, tapınaktan çaldığı için ailesiyle birlikte kabilesinden sürülür ve hayatta kalma mücadelesine girişir. Neredeyse sessiz anlatımı, nefes kesen manzaraları ve ritüel sahneleriyle Çin sinemasının Beşinci Kuşak döneminin şiirsel bir başyapıtı."},{"t":"Top Gun","y":1986,"d":"Tony Scott","r":109,"g":["Action","Drama"],"c":["Tom Cruise","Tim Robbins"],"s":"Asi ve yetenekli pilot Maverick, ABD Donanması'nın seçkin savaş pilotu okuluna kabul edilir ve hem göklerde hem kalbinde sınanır. Tom Cruise'u yıldız yapan, hava sahneleri ve efsanevi müzikleriyle seksenlerin ruhunu yansıtan keyifli bir aksiyon klasiği."},{"t":"A Chinese Ghost Story","y":1987,"d":"Tony Ching Siu-Tung","r":98,"g":["Action","Fantasy","Horror"],"c":[],"s":"Saf bir vergi tahsildarı, geceyi perili bir tapınakta geçirirken güzel bir hayalet kıza âşık olur ve onu kötü bir ağaç ruhunun elinden kurtarmaya çalışır. Uçan kılıç ustaları, romantizm ve korkuyu masalsı bir enerjiyle karıştıran Hong Kong fantastik sinemasının neşeli bir incisi."},{"t":"Au Revoir Les Enfants","y":1987,"d":"Louis Malle","r":104,"g":["Drama","War"],"c":[],"s":"İşgal altındaki Fransa'da bir Katolik yatılı okulunda, zengin bir çocuk ile gizemli yeni sınıf arkadaşı arasında yavaş yavaş bir dostluk filizlenir. Louis Malle'in kendi çocukluğundan beslenen bu zarif ve sade film, insanın içine işleyen, uzun süre akıldan çıkmayan bir hikâye."},{"t":"Babette's Feast","y":1987,"d":"Gabriel Axel","r":103,"g":["Drama"],"c":[],"s":"On dokuzuncu yüzyıl Danimarka'sında, dindar iki kız kardeşin yanına sığınan Fransız bir kadın, yıllar sonra köyün sofu sakinleri için unutulmaz bir akşam yemeği hazırlamaya karar verir. Sanatın, cömertliğin ve yemeğin ruhu nasıl dönüştürdüğünü anlatan, sıcacık ve incelikli bir başyapıt."},{"t":"Broadcast News","y":1987,"d":"James L. Brooks","r":133,"g":["Comedy","Drama","Romance"],"c":[],"s":"Washington'da bir televizyon haber merkezinde, idealist bir yapımcı, parlak ama sığ bir spiker ile zeki ama sönük bir muhabir arasında kalır. Keskin mizahı ve gerçekçi karakterleriyle hem romantik komedi hem de medya dünyasına şaşırtıcı derecede güncel bir eleştiri."},{"t":"Fatal Attraction","y":1987,"d":"Adrian Lyne","r":119,"g":["Drama","Thriller"],"c":[],"s":"Mutlu evli bir New York avukatı, hafta sonu yaşadığı kaçamağın ardından ilişkiyi bitirmek ister, ancak kadın bunu kabul etmeye hiç niyetli değildir. Glenn Close ve Michael Douglas'ın güçlü performanslarıyla gerilimi giderek tırmanan, dönemine damga vurmuş bir psikolojik gerilim."},{"t":"Full Metal Jacket","y":1987,"d":"Stanley Kubrick","r":116,"g":["Drama","War"],"c":["Matthew Modine","R. Lee Ermey"],"s":"Genç deniz piyadeleri acımasız bir eğitim çavuşunun elinde savaş makinelerine dönüştürülür, ardından Vietnam'ın kaosuna gönderilir. Kubrick'in soğuk ve keskin bakışıyla, ilk yarısı sinema tarihine geçmiş, savaşın insanı nasıl şekillendirdiğine dair çarpıcı bir film."},{"t":"Good Morning, Vietnam","y":1987,"d":"Barry Levinson","r":121,"g":["Biography","Comedy","Drama"],"c":[],"s":"1965'te Saygon'a gelen asi bir radyo DJ'i, askerlere yayın yaptığı programı çılgın esprileri ve rock'n'roll şarkılarıyla altüst eder. Robin Williams'ın doğaçlama dehasıyla parladığı film, kahkahayı savaşın hüznüyle ustalıkla dengeliyor."},{"t":"Housekeeping","y":1987,"d":"Bill Forsyth","r":116,"g":["Comedy","Drama"],"c":[],"s":"1950'lerde kuzeybatı Amerika'da iki öksüz kız kardeş, alışılmışın dışında yaşayan tuhaf ve hayalperest teyzeleri Sylvie'nin yanında büyür. Bill Forsyth'in şefkatli ve hafif esrarlı anlatımı, ailenin, aidiyetin ve özgürlüğün kıymetini sessizce sorgulayan nadir bir mücevher."},{"t":"Moonstruck","y":1987,"d":"Norman Jewison","r":102,"g":["Comedy","Drama","Romance"],"c":["Cher","Olympia Dukakis"],"s":"Brooklyn'de talihsiz dul bir kadın, sıkıcı bir adamla nişanlanır ama onun ateşli ve dengesiz kardeşine tutulur. Cher'in parladığı, İtalyan-Amerikan aile hayatını dolunay ışığında sıcacık bir mizahla anlatan, operalık tutkusuyla eşsiz bir romantik komedi."},{"t":"Project a Part 2","y":1987,"d":"Jackie Chan","r":null,"g":["Action"],"c":[],"s":"Dürüst polis Dragon, yolsuzlukla dolu bir bölgenin başına atanır ve kendini gangsterler, devrimciler ve çürümüş meslektaşlarıyla aynı anda uğraşırken bulur. Jackie Chan'in akrobatik dövüşleri ve Buster Keaton'a selam veren komik gösterileriyle enerji dolu bir eğlence."},{"t":"Raising Arizona","y":1987,"d":"Joel Coen","r":94,"g":["Comedy","Crime"],"c":[],"s":"Eski bir hükümlü ile polis karısı, çocuk sahibi olamayınca beşiz sahibi zengin bir aileden bebeklerden birini kaçırmaya karar verir. Coen kardeşlerin çılgın temposu, çizgi film tadındaki karakterleri ve absürt mizahıyla kahkahayı hiç eksik etmeyen bir kült komedi."},{"t":"Red Sorghum","y":1987,"d":"Zhang Yimou","r":91,"g":["Drama","History","Romance"],"c":[],"s":"Yaşlı bir şarap üreticisine satılan genç bir gelin, kocasının ölümünün ardından darı tarlalarının ortasında hem aşkı hem özgürlüğü keşfeder. Zhang Yimou'nun ilk filmi, göz alıcı kırmızılarıyla ve destansı anlatımıyla Çin sinemasını dünyaya tanıtan bir başyapıt."},{"t":"Robocop","y":1987,"d":"Paul Verhoeven","r":102,"g":["Action","Crime","Sci-Fi"],"c":["Peter Weller","Nancy Allen"],"s":"Suçun kol gezdiği bir gelecek Detroit'inde, ağır yaralanan bir polis dev bir şirket tarafından sibernetik bir kanun uygulayıcısına dönüştürülür. Verhoeven'ın kanlı aksiyonu kara mizah ve keskin bir kapitalizm eleştirisiyle harmanladığı, zamanının çok ötesinde bir bilimkurgu."},{"t":"The Dead","y":1987,"d":"John Huston","r":83,"g":["Drama"],"c":[],"s":"1904'te Dublin'de, iki yaşlı kız kardeşin evinde verilen bir yeni yıl yemeğinde sohbetler, şarkılar ve anılar akşam boyunca iç içe geçer. John Huston'ın son filmi olan bu James Joyce uyarlaması, hüzün ve zarafetle dolu, insanın kalbine kar gibi yağan bir veda."},{"t":"The Princess Bride","y":1987,"d":"Rob Reiner","r":98,"g":["Adventure","Comedy","Family"],"c":["Cary Elwes","Mandy Patinkin"],"s":"Hasta torununa masal okuyan bir büyükbaba, güzel Buttercup ile sadık Westley'nin korsanlar, devler ve kötü prenslerle dolu aşk macerasını anlatır. Esprili, romantik ve sonsuz alıntılanabilir replikleriyle her yaştan izleyiciyi büyüleyen bir masal klasiği."},{"t":"The Untouchables","y":1987,"d":"Brian De Palma","r":119,"g":["Crime","Drama","Thriller"],"c":["Kevin Costner","Sean Connery"],"s":"Yasak döneminde Chicago'da genç federal ajan Eliot Ness, Al Capone'u yakalamak için küçük ama yozlaşmaz bir ekip kurar. De Palma'nın şık görselliği, Ennio Morricone'nin müziği ve Sean Connery'nin unutulmaz performansıyla tam bir Hollywood şöleni."},{"t":"Wall Street","y":1987,"d":"Oliver Stone","r":126,"g":["Crime","Drama"],"c":["Michael Douglas"],"s":"Hırslı genç bir borsacı, efsanevi yatırımcı Gordon Gekko'nun gözüne girmek için etik sınırları birer birer aşmaya başlar. Seksenlerin açgözlülük ruhunu yakalayan film, Michael Douglas'ın ikonik performansıyla bugün hâlâ keskin ve güncel."},{"t":"Wings of Desire","y":1987,"d":"Wim Wenders","r":128,"g":["Drama","Fantasy","Romance"],"c":[],"s":"Bölünmüş Berlin'in üzerinde dolaşan iki melek, insanların iç seslerini dinler; biri yalnız bir trapez sanatçısına âşık olunca ölümlü olmayı düşlemeye başlar. Wenders'in siyah beyaz ile renk arasında gezinen şiirsel görüntüleri, sinemanın en büyüleyici ve derin deneyimlerinden birini sunuyor."},{"t":"Withnail & I","y":1987,"d":"Bruce Robinson","r":107,"g":["Comedy","Drama"],"c":[],"s":"1969 Londra'sında işsiz iki genç oyuncu, sefil dairelerinden kaçıp kırsalda bir kulübede tatile çıkar ama işler hiç planladıkları gibi gitmez. Birbirinden keskin replikleri ve hüzünlü mizahıyla İngiltere'nin en sevilen kült komedilerinden biri."},{"t":"Yeelen (Brightness)","y":1987,"d":"Souleymane Cissé","r":null,"g":["#Movie"],"c":[],"s":"Bambara efsanelerinden beslenen bu hikâyede genç bir adam, gizli bilgilerini onu yok etmek için kullanmak isteyen büyücü babasıyla yüzleşmek üzere Mali'nin topraklarında yola çıkar. Souleymane Cissé'nin büyüleyici görüntüleriyle Afrika sinemasının en önemli ve mistik eserlerinden biri kabul edilir."},{"t":"A Fish Called Wanda","y":1988,"d":"Charles Crichton","r":108,"g":["Comedy","Crime"],"c":["Kevin Kline"],"s":"Bir mücevher soygununun ardından çalınan elmasları ele geçirmeye çalışan dolandırıcılar birbirini kandırırken, işin içine saf bir İngiliz avukat da karışır. John Cleese ve Kevin Kline'ın parladığı, İngiliz ve Amerikan mizahını harika bir uyumla birleştiren kahkaha dolu bir komedi."},{"t":"A Tale of the Wind","y":1988,"d":"Joris Ivens","r":80,"g":["Drama","Fantasy"],"c":[],"s":"Ömrünü rüzgârı filme almaya adamış yaşlı bir belgeselci, Çin'e giderek bu hayalini son kez gerçekleştirmeye çalışır. Joris Ivens'in sinemaya veda niteliğindeki bu şiirsel ve otobiyografik yapıtı, gerçek ile düşü zarif bir biçimde birbirine karıştırıyor."},{"t":"Akira","y":1988,"d":"Katsuhiro Otomo","r":124,"g":["Action","Animation","Drama"],"c":[],"s":"Kıyamet sonrası Neo Tokyo'da genç bir motosiklet çetesi üyesi, gizli bir askeri deney sonucu kontrol edilemez güçler kazanır. Nefes kesen el çizimi animasyonu ve cesur vizyonuyla anime'yi dünyaya tanıtan, bilimkurgunun tartışmasız dönüm noktalarından biri."},{"t":"Alice","y":1988,"d":"Jan Švankmajer","r":86,"g":["Adventure","Animation","Family"],"c":[],"s":"Küçük Alice, odasındaki doldurulmuş bir tavşanın peşine düşerek canlanan eşyalar ve tuhaf yaratıklarla dolu karanlık bir harikalar diyarına girer. Jan Švankmajer'in stop motion ustalığıyla yeniden yorumlanan bu masal, hem ürkütücü hem büyüleyici eşsiz bir sinema deneyimi."},{"t":"Ariel","y":1988,"d":"Aki Kaurismäki","r":72,"g":["Comedy","Crime","Drama"],"c":[],"s":"Çalıştığı maden kapanan Finli bir işçi, beyaz üstü açık arabasıyla güneye doğru yola çıkar ve yeni bir hayat kurmaya çalışırken talihsizlikler birbirini izler. Aki Kaurismäki'nin kuru mizahı ve kaybedenlere duyduğu şefkatle, kısa ama çok etkileyici bir film."},{"t":"Big","y":1988,"d":"Penny Marshall","r":104,"g":["Comedy","Drama","Fantasy"],"c":[],"s":"On iki yaşında bir çocuk, lunaparktaki bir fal makinesine büyük olmayı diler ve ertesi sabah otuzlu yaşlarda bir adamın bedeninde uyanır. Tom Hanks'in içten performansıyla, çocukluğun masumiyetini ve yetişkinliğin tuhaflığını sevimli bir dille anlatan unutulmaz bir aile filmi."},{"t":"Bull Durham","y":1988,"d":"Ron Shelton","r":108,"g":["Comedy","Romance","Sport"],"c":[],"s":"Tecrübeli bir yakalayıcı, yetenekli ama dağınık genç bir atıcıyı yetiştirmek için alt lig takımına gönderilir; beyzbol tutkunu bir kadın da ikisinin arasına girer. Esprili diyalogları ve olgun romantizmiyle spor filmlerinin en zeki ve seksi örneklerinden biri."},{"t":"Cinema Paradiso","y":1988,"d":"Giuseppe Tornatore","r":174,"g":["Drama","Romance"],"c":["Philippe Noiret","Enzo Cannavale"],"s":"Ünlü bir yönetmen, yıllar sonra çocukluğunu geçirdiği Sicilya kasabasına döner ve köyün sinema salonunda makinistle kurduğu dostluğu hatırlar. Sinema aşkına yazılmış duygusal bir mektup, Ennio Morricone'nin müziğiyle gözleri nemlendiren bir klasik."},{"t":"Dangerous Liaisons","y":1988,"d":"Stephen Frears","r":119,"g":["Drama","Romance"],"c":[],"s":"On sekizinci yüzyıl Fransız aristokrasisinde, iki eski sevgili çevrelerindeki masumları baştan çıkarmak ve mahvetmek üzerine zalim bir oyun kurar. Glenn Close ve John Malkovich'in büyüleyici düellosu, kostüm dramasını zekâ dolu bir gerilime dönüştürüyor."},{"t":"Dead Ringers","y":1988,"d":"David Cronenberg","r":116,"g":["Drama","Horror","Thriller"],"c":[],"s":"Birbirine tıpatıp benzeyen ikiz jinekologlar, hem işlerini hem de kadınlarını paylaşırken aralarına bir kadın girince dengeleri sarsılmaya başlar. Jeremy Irons'ın çift rolde döktürdüğü, Cronenberg'in en soğukkanlı ve rahatsız edici psikolojik dramlarından biri."},{"t":"Die Hard","y":1988,"d":"John McTiernan","r":132,"g":["Action","Thriller"],"c":["Bruce Willis","Alan Rickman"],"s":"New York'lu polis John McClane, Noel partisi için karısının Los Angeles'taki şirketine geldiğinde bina bir grup soyguncu tarafından ele geçirilir. Bruce Willis'in esprili kahramanı ve kusursuz temposuyla aksiyon sinemasının kurallarını yeniden yazan bir klasik."},{"t":"Distant Voices, Still Lives","y":1988,"d":"Terence Davies","r":84,"g":["Drama","Music"],"c":[],"s":"Savaş sonrası Liverpool'da işçi sınıfından bir aile, zalim bir babanın gölgesinde büyümenin acılarını ve birlikte söylenen şarkıların tesellisini hatırlar. Terence Davies'in anılardan örülmüş, tablo gibi kadrajları ve müzikleriyle son derece şiirsel ve etkileyici bir film."},{"t":"Drowning by Numbers","y":1988,"d":"Peter Greenaway","r":118,"g":["Comedy","Drama"],"c":[],"s":"Aynı adı taşıyan üç kuşak kadın, kocalarından kurtulmak için suda boğmayı seçer ve işin içine işbirliği yapan bir adli tabip girer. Peter Greenaway'in sayılar, oyunlar ve resimsel kadrajlarla dolu bu kara komedisi, zekâ dolu bir bulmaca gibi izleniyor."},{"t":"Grave of the Fireflies","y":1988,"d":"Isao Takahata","r":88,"g":["Animation","Drama","War"],"c":["Tsutomu Tatsumi","Ayano Shiraishi"],"s":"İkinci Dünya Savaşı'nın son aylarında Japonya'da iki kardeş, bombardımanlar arasında hayatta kalmaya çalışır. Studio Ghibli'nin en yürek burkan eseri, savaşın çocuklar üzerindeki etkisini unutulmaz bir incelik ve şefkatle anlatıyor."},{"t":"Hotel Terminus: The Life and Times of Klaus Barbie","y":1988,"d":"Marcel Ophüls","r":null,"g":["War"],"c":[],"s":"Lyon Kasabı olarak bilinen Gestapo şefi Klaus Barbie'nin savaş sonrası yıllarda nasıl korunduğunu ve saklandığını adım adım izleyen kapsamlı bir belgesel. Marcel Ophüls'ün sabırlı röportajlarıyla örülmüş bu film, suç ortaklığı ve adalet üzerine sarsıcı bir sorgulama."},{"t":"Landscape in the Mist","y":1988,"d":"Theo Angelopoulos","r":127,"g":["Drama"],"c":[],"s":"İki küçük Yunan kardeş, Almanya'da yaşadığına inandıkları babalarını bulmak için gizlice bir trene binerek uzun bir yolculuğa çıkar. Theo Angelopoulos'un sisli, uzun planlarla örülmüş bu şiirsel filmi, masumiyet ve umut üzerine hüzünlü ama büyüleyici bir yolculuk."},{"t":"Rain Man","y":1988,"d":"Barry Levinson","r":133,"g":["Drama"],"c":["Dustin Hoffman","Tom Cruise"],"s":"Bencil bir araba satıcısı, babasının mirasının otistik ağabeyine kaldığını öğrenince onu kurumdan alıp ülke çapında bir yolculuğa çıkarır. Dustin Hoffman ve Tom Cruise'un içten performansları, iki kardeşin birbirini keşfedişini sıcak ve dokunaklı kılıyor."},{"t":"The Accidental Tourist","y":1988,"d":"Lawrence Kasdan","r":121,"g":["Comedy","Drama","Romance"],"c":["Geena Davis"],"s":"Oğlunu kaybettikten sonra duygularını kapatmış bir seyahat yazarı, ne kadar eksantrik olduğunu anlamadığı bir köpek eğitmeniyle tanışır. William Hurt ve Geena Davis'in incelikli oyunlarıyla, yasın ve yeniden sevmenin sessiz ve zarif bir portresi."},{"t":"The Naked Gun: From the Files of Police Squad!","y":1988,"d":"David Zucker","r":85,"g":["Comedy","Crime"],"c":[],"s":"Beceriksiz ama kendinden emin polis Frank Drebin, Kraliçe Elizabeth'in ziyareti sırasında düzenlenecek bir suikastı engellemeye çalışır. Leslie Nielsen'in ciddi yüzle yaptığı saçmalıklar ve saniyede bir gelen espriler, bu parodiyi komedinin zirvelerinden biri yapıyor."},{"t":"The Thin Blue Line","y":1988,"d":"Errol Morris","r":101,"g":["Crime","Documentary"],"c":[],"s":"Dallas'ta bir polis memurunun öldürülmesi nedeniyle idama mahkûm edilen bir adamın davasını yeniden inceleyen çarpıcı bir belgesel. Errol Morris'in canlandırma sahneleri ve Philip Glass'ın müziğiyle belgesel sinemayı kökten değiştiren, gerçek hayatta bile iz bırakan bir film."},{"t":"The Vanishing","y":1988,"d":"George Sluizer","r":107,"g":["Mystery","Thriller"],"c":[],"s":"Bir benzin istasyonunda sevgilisi iz bırakmadan kaybolan genç bir adam, yıllarca onu aramaktan ve ne olduğunu öğrenme saplantısından vazgeçemez. Soğukkanlı anlatımı ve ürpertici sadeliğiyle gerilim türünün en rahatsız edici ve unutulmaz örneklerinden biri."},{"t":"Who Framed Roger Rabbit","y":1988,"d":"Robert Zemeckis","r":104,"g":["Adventure","Animation","Comedy"],"c":[],"s":"1947 Hollywood'unda, çizgi film karakterleriyle insanların birlikte yaşadığı bir dünyada, huysuz bir dedektif cinayetle suçlanan Roger Rabbit'e yardım etmek zorunda kalır. Canlı çekim ile animasyonu olağanüstü biçimde birleştiren film, hem çocuklar hem büyükler için bir şölen."},{"t":"Women on the Verge of a Nervous Breakdown","y":1988,"d":"Pedro Almodóvar","r":88,"g":["Comedy","Drama"],"c":[],"s":"Sevgilisi tarafından terk edilen bir seslendirme sanatçısı, onu bulmaya çalışırken Madrid'deki dairesi giderek tuhaf misafirlerle dolmaya başlar. Almodóvar'ı dünyaya tanıtan bu renkli, çılgın ve sıcacık komedi, kadın dayanışmasına ve melodrama yazılmış bir aşk mektubu."},{"t":"A City of Sadness","y":1989,"d":"Hou Hsiao-hsien","r":157,"g":["Drama","History"],"c":[],"s":"Japon yönetiminin sona erdiği 1945 sonrasında bir Tayvanlı aile, yeni gelen hükümetin baskı ve şiddet dalgası içinde dağılmaya başlar. Hou Hsiao-hsien'in sabırlı, uzun planlı anlatımıyla Tayvan tarihinin yasaklı bir dönemine ışık tutan görkemli bir yapıt."},{"t":"Batman","y":1989,"d":"Tim Burton","r":126,"g":["Crime"],"c":["Michael Keaton","Jack Nicholson"],"s":"Gotham'ın karanlık sokaklarında maskeli bir kanun koruyucusu, şehri kaosa sürüklemeye çalışan psikopat Joker ile karşı karşıya gelir. Tim Burton'ın gotik görselliği ve Jack Nicholson'ın unutulmaz performansıyla modern süper kahraman sinemasının temellerini atan bir film."},{"t":"Crimes and Misdemeanors","y":1989,"d":"Woody Allen","r":104,"g":["Comedy","Drama"],"c":[],"s":"Saygın bir göz doktoru, metresinin tehditleri karşısında korkunç bir karar vermenin eşiğine gelirken, başarısız bir belgeselci kendi ahlaki sınavlarıyla uğraşır. Woody Allen'ın komediyi derin felsefi sorgulamalarla harmanladığı en olgun ve düşündürücü filmlerinden biri."},{"t":"Do the Right Thing","y":1989,"d":"Spike Lee","r":120,"g":["Comedy","Drama"],"c":[],"s":"Brooklyn'de yılın en sıcak gününde, bir İtalyan pizzacısı ve mahallenin siyah sakinleri arasındaki gerilim yavaş yavaş kaynamaya başlar. Spike Lee'nin canlı renkleri, enerjik kurgusu ve cesur sorularıyla bugün hâlâ yakıcı ve önemli bir başyapıt."},{"t":"Drugstore Cowboy","y":1989,"d":"Gus Van Sant","r":102,"g":["Crime","Drama"],"c":[],"s":"1971 Portland'ında karizmatik bir bağımlı ve küçük çetesi, ihtiyaçlarını karşılamak için eczaneleri soyarak yaşar. Gus Van Sant'ın bağımlılığı ne yüceltip ne yargılayan, esprili ve melankolik bakışı Matt Dillon'ın en iyi performansıyla buluşuyor."},{"t":"Field of Dreams","y":1989,"d":"Phil Alden Robinson","r":107,"g":["Drama","Family","Fantasy"],"c":[],"s":"Iowa'lı bir çiftçi, mısır tarlasında duyduğu gizemli bir sesin peşinden giderek tarlasını bir beyzbol sahasına çevirmeye karar verir. Hayaller, kaçırılmış fırsatlar ve babalarla oğullar üzerine yazılmış, gözleri dolduran sıcacık ve umut dolu bir masal."},{"t":"Glory","y":1989,"d":"Edward Zwick","r":122,"g":["Biography","Drama","History"],"c":["Denzel Washington"],"s":"Amerikan İç Savaşı sırasında genç bir subay, tamamen siyahi gönüllülerden oluşan ilk alaylardan birinin komutasını üstlenir. Denzel Washington ve Morgan Freeman'ın güçlü performanslarıyla, cesaret ve onur üzerine etkileyici ve derinden dokunaklı bir savaş filmi."},{"t":"My Left Foot: The Story of Christy Brown","y":1989,"d":"Jim Sheridan","r":103,"g":["Biography","Drama"],"c":[],"s":"Serebral palsi ile doğan İrlandalı Christy Brown, yalnızca sol ayağını kontrol edebilmesine rağmen ressam ve yazar olmayı başarır. Daniel Day-Lewis'in nefes kesici performansı, bu gerçek hikâyeyi hem ilham verici hem de son derece dürüst kılıyor."},{"t":"Roger & Me","y":1989,"d":"Michael Moore","r":91,"g":["Documentary"],"c":[],"s":"Michael Moore, General Motors'un Flint'teki fabrikalarını kapatarak memleketini yıkıma sürüklemesinin ardından şirketin başkanı Roger Smith ile görüşmeye çalışır. Acı mizahı ve öfkesiyle belgesel sinemanın havasını değiştiren, ekonomik adaletsizliğe dair keskin bir film."},{"t":"Say Anything...","y":1989,"d":"Cameron Crowe","r":100,"g":["Comedy","Drama","Romance"],"c":[],"s":"Liseyi yeni bitiren, iyimser ve kendine has Lloyd, okulun en parlak öğrencisi Diane'in kalbini kazanmaya çalışır. John Cusack'in radyoyu havaya kaldırdığı ikonik sahneyle hatırlanan, gençlik aşkını samimi ve zeki bir dille anlatan romantik bir klasik."},{"t":"Sex, Lies, and Videotape","y":1989,"d":"Steven Soderbergh","r":100,"g":["Drama"],"c":[],"s":"Mutsuz evli bir kadının hayatı, kocasının eski okul arkadaşı kadınlarla yaptığı samimi video röportajlarla kasabaya gelince sarsılır. Steven Soderbergh'in ilk filmi, sessiz ama keskin diyaloglarıyla bağımsız Amerikan sinemasının yeni dönemini başlatan bir yapıt."},{"t":"Story of Women","y":1989,"d":"Claude Chabrol","r":108,"g":["Drama","History","Romance"],"c":[],"s":"İşgal altındaki Fransa'da geçimini sağlamaya çalışan bir kadın, gizlice kürtaj yaparak para kazanmaya başlar ve hayatı giderek değişir. Isabelle Huppert'in soğukkanlı ve karmaşık performansıyla Chabrol'un toplumsal ikiyüzlülüğü sorgulayan güçlü bir dramı."},{"t":"Tetsuo: The Iron Man","y":1989,"d":"Shinya Tsukamoto","r":67,"g":["Horror","Sci-Fi"],"c":[],"s":"Bir kaza sonrası sıradan bir işçinin bedeni, yavaş yavaş metale ve makineye dönüşmeye başlar. Shinya Tsukamoto'nun siyah beyaz, çılgın enerjili ve endüstriyel kâbusu, cyberpunk sinemasının deneysel ve unutulmaz bir kült klasiği."},{"t":"The Cook, the Thief, His Wife & Her Lover","y":1989,"d":"Peter Greenaway","r":124,"g":["Crime","Drama"],"c":[],"s":"Lüks bir restoranda, zalim bir gangsterin karısı her akşam sessiz bir kitap kurduyla gizli bir aşk yaşamaya başlar. Peter Greenaway'in göz alıcı renkleri, barok dekorları ve Michael Nyman'ın müziğiyle cesur, provokatif ve unutulmaz bir görsel şölen."},{"t":"The Killer","y":1989,"d":"John Woo","r":111,"g":["Action","Crime","Drama"],"c":[],"s":"Son işinde kazayla genç bir şarkıcıyı kör eden kiralık katil, ona yardım etmek için son bir iş kabul eder ve inatçı bir polisle yolları kesişir. John Woo'nun balesi andıran silahlı çatışmaları ve melodramatik tutkusu, aksiyon sinemasını yeniden tanımladı."},{"t":"The Unbelievable Truth","y":1989,"d":"Hal Hartley","r":90,"g":["Comedy","Drama","Romance"],"c":[],"s":"Hapisten çıkıp kasabasına dönen gizemli bir adam, dünyanın sonunu bekleyen karamsar ve zeki bir liseli kızla tanışır. Hal Hartley'nin kuru esprileri ve stilize diyaloglarıyla bağımsız Amerikan sinemasının sevimli ve özgün bir ilk filmi."},{"t":"Tongues Untied","y":1989,"d":"Marlon Riggs","r":55,"g":["Documentary"],"c":[],"s":"Marlon Riggs, şiir, müzik, dans ve kişisel anlatılarla siyah ve gey erkeklerin deneyimlerini cesur ve kışkırtıcı bir dille anlatır. Döneminde büyük tartışmalar yaratan bu deneysel belgesel, kimlik ve görünürlük üzerine hâlâ güçlü ve etkileyici bir ses."},{"t":"When Harry Met Sally...","y":1989,"d":"Rob Reiner","r":95,"g":["Comedy","Drama","Romance"],"c":["Billy Crystal","Meg Ryan"],"s":"Harry ile Sally, kadınla erkeğin gerçekten arkadaş olup olamayacağını tartışarak yıllar boyunca birbirlerinin hayatına girip çıkar. Nora Ephron'un parlak diyalogları ve New York'un sonbahar havasıyla romantik komedilerin kusursuz ölçütü sayılan bir klasik."},{"t":"Archangel","y":1990,"d":"Guy Maddin","r":78,"g":["Comedy","Drama","Romance"],"c":[],"s":"1919'da Rusya'nın kuzeyinde, tek bacaklı bir Kanadalı asker kaybettiği sevgilisini yerel bir kadında gördüğünü sanarak bir tür rüya aleminde kaybolur. Guy Maddin'in erken dönem sessiz filmlerini taklit eden tuhaf ve büyüleyici üslubu, benzersiz bir sinema deneyimi sunuyor."},{"t":"Close-Up","y":1990,"d":"Abbas Kiarostami","r":98,"g":["Biography","Crime","Drama"],"c":[],"s":"Ünlü yönetmen Mohsen Makhmalbaf kılığına girerek bir aileyi kandıran bir adamın gerçek davası, hem gerçek kişiler hem canlandırmalarla yeniden anlatılır. Kiarostami'nin gerçek ile kurgu arasındaki sınırı sorgulayan bu eseri, sinemanın en insani ve dokunaklı filmlerinden biri."},{"t":"Dances With Wolves","y":1990,"d":"Kevin Costner","r":181,"g":["Adventure","Drama","Western"],"c":["Kevin Costner","Mary McDonnell"],"s":"İç Savaş sonrası uzak bir sınır karakoluna gönderilen bir Birlik subayı, zamanla komşu Sioux kabilesiyle dostluk kurar ve onların yaşamını benimsemeye başlar. Geniş ovaların görkemli manzaralarıyla kovboy türüne yeni ve daha anlayışlı bir bakış getiren destansı bir film."},{"t":"Edward Scissorhands","y":1990,"d":"Tim Burton","r":105,"g":["Drama","Fantasy","Romance"],"c":["Johnny Depp","Winona Ryder"],"s":"Eller yerine makaslarla dolu, tamamlanmamış yapay bir genç, renkli bir banliyö kasabasına getirilir ve oranın tuhaf sakinleri arasında yer bulmaya çalışır. Tim Burton ile Johnny Depp'in ilk iş birliği, farklılığa ve aşka dair hüzünlü ve büyülü bir modern masal."},{"t":"Europa Europa","y":1990,"d":"Agnieszka Holland","r":112,"g":["Drama","History","War"],"c":[],"s":"İkinci Dünya Savaşı'nda ailesinden ayrılan Yahudi bir genç, hayatta kalmak için kimliğini saklayarak kendini Nazi gençlik okullarında bulur. İnanılmaz ama gerçek bir hikâyeye dayanan film, kimlik ve hayatta kalmanın absürt ve acı yönlerini ustalıkla işliyor."},{"t":"Goodfellas","y":1990,"d":"Martin Scorsese","r":145,"g":["Biography","Crime","Drama"],"c":["Robert De Niro","Ray Liotta","Joe Pesci"],"s":"Çocukluğundan beri gangster olmayı hayal eden Henry Hill, New York mafyasının içinde otuz yıla yayılan bir yükseliş ve çöküş yaşar. Scorsese'nin enerjik kamerası, harika müzik seçimleri ve efsanevi oyuncularıyla suç sinemasının kusursuz bir örneği."},{"t":"Jacob's Ladder","y":1990,"d":"Adrian Lyne","r":113,"g":["Drama","Horror","Mystery"],"c":[],"s":"Vietnam'dan dönen bir gazi, New York'ta gerçeklik ile kâbus arasında gidip gelen korkunç görüntülerle boğuşmaya başlar. Tim Robbins'in etkileyici oyunuyla, gizem ve psikolojik korkuyu derin bir hüzünle birleştiren, pek çok filme ilham vermiş bir yapıt."},{"t":"King of New York","y":1990,"d":"Abel Ferrara","r":103,"g":["Crime","Thriller"],"c":[],"s":"Hapisten çıkan bir uyuşturucu baronu, New York'un suç dünyasını ele geçirip kazandığını yoksullar için bir hastaneye harcamaya ant içer. Christopher Walken'ın hipnotik performansı ve Abel Ferrara'nın karanlık, neon ışıklı üslubuyla şık bir suç filmi."},{"t":"No Fear, No Die","y":1990,"d":"Claire Denis","r":90,"g":["Drama"],"c":[],"s":"Benin'den ve Martinik'ten gelen iki adam, Paris banliyösündeki bir restoranın bodrumunda yasadışı horoz dövüşleri için horoz eğitmeye başlar. Claire Denis'in sade ama gergin anlatımıyla göç, sömürü ve yabancılık üzerine içe işleyen bir film."},{"t":"Pretty Woman","y":1990,"d":"Garry Marshall","r":119,"g":["Comedy","Romance"],"c":["Richard Gere","Julia Roberts"],"s":"Zengin bir iş adamı, Los Angeles'ta tanıştığı neşeli bir kadını bir haftalığına yanında kalması için tutar ve ikisinin dünyası beklenmedik biçimde yakınlaşır. Julia Roberts'ın ışıl ışıl gülüşüyle modern bir Külkedisi masalı olan bu romantik komedi, doksanların en sevilenlerinden."},{"t":"Reversal of Fortune","y":1990,"d":"Barbet Schroeder","r":111,"g":["Biography","Drama","Mystery"],"c":["Jeremy Irons"],"s":"Varlıklı bir aristokrat, zengin karısını öldürmeye teşebbüsle suçlanınca ünlü bir hukuk profesörü davasını üstlenir. Jeremy Irons'ın buz gibi zarafeti ve kara mizah dolu anlatımıyla gerçek bir davadan esinlenen zeki ve şaşırtıcı bir dram."},{"t":"The Asthenic Syndrome","y":1990,"d":"Kira Muratova","r":153,"g":["Drama"],"c":[],"s":"Kocasının cenazesinin ardından yasa boğulan bir kadının hikâyesi, uykuya dalıp duran bir öğretmenin hikâyesine bağlanır ve Sovyet toplumunun yorgunluğu gözler önüne serilir. Kira Muratova'nın cesur, kaotik ve karanlık mizah dolu bu yapıtı, Sovyet sinemasının son dönem çarpıcı eserlerinden."},{"t":"Total Recall","y":1990,"d":"Paul Verhoeven","r":113,"g":["Action","Adventure","Sci-Fi"],"c":["Arnold Schwarzenegger","Sharon Stone"],"s":"Sıradan bir inşaat işçisi, Mars'a yolculuk anıları satın almak istediği bir şirkette kimliğinin sandığından çok farklı olduğunu keşfeder. Schwarzenegger ve Verhoeven'ın çılgın aksiyonu ve zihin oyunlarıyla bilimkurgunun eğlenceli ve akıllı klasiklerinden biri."},{"t":"Trust","y":1990,"d":"Hal Hartley","r":107,"g":["Comedy","Crime","Drama"],"c":[],"s":"Evden kovulan hamile bir genç kız, kendi ailesiyle sorunları olan zeki ve huysuz bir elektronik tamircisiyle tanışır ve aralarında alışılmadık bir bağ kurulur. Hal Hartley'nin kuru esprisi ve incelikli diyaloglarıyla doksanların en sevimli bağımsız filmlerinden biri."},{"t":"A Brighter Summer Day","y":1991,"d":"Edward Yang","r":237,"g":["Crime","Drama","Romance"],"c":[],"s":"1960'ların Taipei'sinde bir genç, okul çeteleri, ilk aşk ve ailesinin kaygıları arasında büyümeye çalışır. Edward Yang'ın dört saate yaklaşan bu destansı eseri, bir dönemin ve bir kuşağın ruhunu olağanüstü bir derinlik ve incelikle yakalıyor."},{"t":"Boyz N the Hood","y":1991,"d":"John Singleton","r":112,"g":["Crime","Drama"],"c":[],"s":"Los Angeles'ın güneyinde büyüyen üç genç arkadaş, şiddetin ve umutsuzluğun kol gezdiği sokaklarda farklı yollar seçer. John Singleton'ın dürüst ve etkileyici ilk filmi, Amerikan sinemasında siyahi gençliğin sesi olmuş güçlü bir yapıt."},{"t":"Delicatessen","y":1991,"d":"Jean-Pierre Jeunet","r":99,"g":["Comedy","Crime"],"c":[],"s":"Kıyamet sonrası bir Fransa'da, bir kasap dükkânının üstündeki apartmana iş için gelen eski bir palyaço, kiracıların tuhaf dünyasına karışır. Jeunet ve Caro'nun sarımsı renkleri, mekanik mizahı ve yaratıcı sahneleriyle karanlık ama bir o kadar sevimli bir masal."},{"t":"Hearts of Darkness: A Filmmaker's Apocalypse","y":1991,"d":"Fax Bahr","r":96,"g":["Documentary"],"c":[],"s":"Francis Ford Coppola'nın Apocalypse Now'ı çekerken Filipinler'de yaşadığı fırtınaları, hastalıkları ve krizleri eşi Eleanor'un kamerasıyla anlatan bir belgesel. Sanatın bedelini ve yaratıcı delilik anlarını ortaya koyan, sinemaseverler için kaçırılmaz bir kamera arkası hikâyesi."},{"t":"JFK","y":1991,"d":"Oliver Stone","r":189,"g":["Drama","History","Thriller"],"c":[],"s":"New Orleans'lı bir savcı, Başkan Kennedy suikastının resmi açıklamasından şüphelenerek kendi soruşturmasını başlatır. Oliver Stone'un baş döndürücü kurgusu ve yıldızlarla dolu kadrosuyla, tartışmalı ama bir o kadar sürükleyici bir politik gerilim."},{"t":"La Belle Noiseuse","y":1991,"d":"Jacques Rivette","r":238,"g":["Drama"],"c":[],"s":"Yıllardır resim yapmayı bırakmış yaşlı bir ressam, genç bir kadını model olarak kullanarak yarım kalan başyapıtını yeniden ele alır. Jacques Rivette'in sabırlı ve büyüleyici filmi, yaratma sürecini ve sanatçı ile model arasındaki gerilimi eşsiz bir yakınlıkla gösteriyor."},{"t":"My Own Private Idaho","y":1991,"d":"Gus Van Sant","r":104,"g":["Drama"],"c":[],"s":"Narkolepsi hastası bir sokak çocuğu ile zengin bir belediye başkanının asi oğlu, kayıp annesini aramak için Amerika'yı ve İtalya'yı dolaşır. River Phoenix ve Keanu Reeves'in dokunaklı performanslarıyla Shakespeare'i Oregon yollarına taşıyan şiirsel bir film."},{"t":"Naked Lunch","y":1991,"d":"David Cronenberg","r":115,"g":["Drama","Mystery"],"c":[],"s":"Böcek ilacı bağımlısı bir yazar, garip bir cinayetin ardından kendini ajanlar, konuşan daktilolar ve yaratıklarla dolu Interzone'da bulur. Cronenberg'in William Burroughs'a gönderdiği bu çılgın ve karanlık saygı duruşu, yaratıcılık ve bağımlılık üzerine eşsiz bir kâbus."},{"t":"Once Upon a Time in China","y":1991,"d":"Tsui Hark","r":134,"g":["Action"],"c":[],"s":"On dokuzuncu yüzyıl sonunda Kanton'da efsanevi dövüş ustası Wong Fei-hung, yabancı güçlere ve yerel çetelere karşı halkını korumaya çalışır. Jet Li'nin göz kamaştıran dövüş sahneleri ve Tsui Hark'ın destansı üslubuyla wuxia sinemasının en iyi örneklerinden biri."},{"t":"Raise the Red Lantern","y":1991,"d":"Zhang Yimou","r":125,"g":["Drama","Romance"],"c":[],"s":"1920'lerin Çin'inde genç bir kadın, zengin bir adamın dördüncü karısı olur ve konağın katı kuralları içinde diğer eşlerle sessiz bir güç mücadelesine girer. Zhang Yimou'nun kusursuz simetrik kadrajları ve kırmızı fenerleriyle hem göz alıcı hem de acı bir başyapıt."},{"t":"Slacker","y":1991,"d":"Richard Linklater","r":97,"g":["Comedy","Drama"],"c":[],"s":"Austin'in sokaklarında kamera, bir tuhaf karakterden diğerine geçerek bir günlük hayatın ritmini, felsefi sohbetlerini ve komplo teorilerini takip eder. Richard Linklater'ın yenilikçi yapısı ve rahat mizahıyla bağımsız Amerikan sinemasına ilham veren bir kült klasik."},{"t":"Terminator 2: Judgment Day","y":1991,"d":"James Cameron","r":137,"g":["Action","Adventure","Sci-Fi"],"c":["Arnold Schwarzenegger","Linda Hamilton"],"s":"Gelecekten gönderilen iki makine, genç John Connor'ı biri korumak biri öldürmek için izlerken annesi Sarah da insanlığın kaderini değiştirmek için mücadele eder. Çığır açan görsel efektleri ve duygusal derinliğiyle aksiyon sinemasının zirvelerinden biri."},{"t":"The Double Life of Veronique","y":1991,"d":"Krzysztof Kieślowski","r":98,"g":["Drama","Fantasy","Music"],"c":[],"s":"Biri Polonya'da, diğeri Fransa'da yaşayan ve birbirine tıpatıp benzeyen iki kadın, varlığından haberdar olmadıkları gizemli bir bağla birbirine bağlıdır. Kieślowski'nin altın tonlu görüntüleri ve Irène Jacob'un büyüleyici oyunuyla şiirsel ve sezgisel bir film."},{"t":"The Rapture","y":1991,"d":"Michael Tolkin","r":100,"g":["Drama","Mystery","Thriller"],"c":[],"s":"Los Angeles'ta boş ve hazcı bir hayat yaşayan bir telefon operatörü, kıyametin yaklaştığına inanan bir tarikata katılarak inancını keşfeder. Mimi Rogers'ın cesur performansıyla inanç, günah ve kutsallık üzerine sarsıcı ve beklenmedik derecede cesur bir film."},{"t":"The Silence of the Lambs","y":1991,"d":"Jonathan Demme","r":118,"g":["Crime","Drama","Horror"],"c":["Jodie Foster","Anthony Hopkins"],"s":"Genç bir FBI stajyeri, bir seri katili yakalamak için hapisteki parlak ama tehlikeli psikiyatr Hannibal Lecter'dan yardım ister. Jodie Foster ve Anthony Hopkins'in unutulmaz yüzleşmeleriyle gerilim sinemasının en büyük klasiklerinden biri."},{"t":"Thelma & Louise","y":1991,"d":"Ridley Scott","r":130,"g":["Adventure","Crime","Drama"],"c":[],"s":"İki arkadaşın kısa bir hafta sonu kaçamağı, bir akşam yaşanan olay yüzünden onları polisten kaçan kanun kaçaklarına dönüştürür. Susan Sarandon ve Geena Davis'in sıcak dostluğu ve Amerika'nın geniş yollarıyla özgü
